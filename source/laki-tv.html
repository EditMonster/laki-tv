nuary 2027, and breaching it could lead to a fine or a penalty. This is a proposal.","pvm":"2026-10-01","pvm_selite":"annettu","tekstityyppi":"tiivistelmä","lisatty":"2026-10-01T14:51"},{"id":"he-2026-10-01-peruspankkipalvelut","tunnus":"VM/2026/179","otsikko":"PERUSPANKKIPALVELUT YRITYKSILLE","julkaistu":"2026-10-01T13:35","paino":4,"voimaantulo_pvm":"2027-07-01","elin":"Valtiovarainministeriö","elin_sv":"Finansministeriet","elin_en":"Ministry of Finance","asiasanat":"Peruspankkipalvelut – Mikro- ja pienyritykset – Yhdistykset – Yhdenvertaisuus – Asiakaspalvelu","asiasanat_sv":"Grundläggande banktjänster – Mikroföretag och små företag – Föreningar – Likabehandling – Kundtjänst","asiasanat_en":"Basic banking services – Micro and small enterprises – Associations – Equal treatment – Customer service","teksti":"Oikeus peruspankkipalveluihin laajenisi koskemaan mikro- ja pienyrityksiä, elinkeinonharjoittajia, yhdistyksiä, säätiöitä sekä yhteisetuuksia, kuten tie- ja vesiosuuskuntia. Pankkipalvelujen yhdenvertaista saatavuutta parannettaisiin myös erityisryhmille, kuten vanhuksille ja vammaisille ihmisille. Pankkien olisi vastattava asiakkaiden yhteydenottoihin ilman aiheetonta viivytystä ja viimeistään viiden pankkipäivän kuluessa. Rahanpesusääntelyä ei muutettaisi. Noudattamista valvoisi Finanssivalvonta. Lait on tarkoitettu tulemaan voimaan 1.7.2027.","selko":"Pienet yritykset, yhdistykset ja säätiöt saisivat oikeuden pankkitiliin ja muihin peruspankkipalveluihin samaan tapaan kuin yksityishenkilöt. Pankin olisi vastattava asiakkaalle viimeistään viiden pankkipäivän kuluessa. Kyse on ehdotuksesta; lait tulisivat voimaan 1.7.2027.","lahde":"https://valtioneuvosto.fi/-/10623/peruspankkipalveluihin-ehdotetaan-uudistuksia","aiheet":["finanssi","kuluttaja"],"otsikko_sv":"GRUNDLÄGGANDE BANKTJÄNSTER","teksti_sv":"Rätten till grundläggande banktjänster skulle utvidgas till mikroföretag och små företag, näringsidkare, föreningar, stiftelser och samfälligheter, såsom väg- och vattenandelslag. Den likvärdiga tillgången till banktjänster skulle förbättras även för särskilda grupper, såsom äldre och personer med funktionsnedsättning. Bankerna skulle besvara kundernas kontakter utan ogrundat dröjsmål och senast inom fem bankdagar. Regleringen om penningtvätt skulle inte ändras. Finansinspektionen skulle övervaka efterlevnaden. Lagarna avses träda i kraft den 1 juli 2027.","selko_sv":"Små företag, föreningar och stiftelser skulle få rätt till bankkonto och andra grundläggande banktjänster på samma sätt som privatpersoner. Banken skulle svara kunden senast inom fem bankdagar. Det är ett förslag; lagarna skulle träda i kraft den 1 juli 2027.","otsikko_en":"BASIC BANKING FOR SMALL FIRMS","teksti_en":"The right to basic banking services would be extended to micro and small enterprises, self-employed traders, associations, foundations and jointly owned entities such as road and water cooperatives. Equal access to banking services would also be improved for special groups such as older people and persons with disabilities. Banks would have to respond to customer contacts without undue delay and within five banking days at the latest. Anti-money laundering rules would not change. Compliance would be supervised by the Financial Supervisory Authority (FIN-FSA). The acts are intended to enter into force on 1 July 2027.","selko_en":"Small businesses, associations and foundations would get a right to a bank account and other basic banking services, as private individuals already have. Banks would have to reply to customers within five banking days. This is a proposal; the acts would take effect on 1 July 2027.","pvm":"2026-10-01","pvm_selite":"annettu","tekstityyppi":"tiivistelmä","lisatty":"2026-10-01T14:51"},{"id":"he-2026-10-01-metsalaki","tunnus":"HE 214/2026 vp","otsikko":"METSÄN UUDISTAMISILMOITUS","julkaistu":"2026-10-01T13:34","paino":3,"voimaantulo_pvm":"2027-05-01","elin":"Maa- ja metsätalousministeriö","elin_sv":"Jord- och skogsbruksministeriet","elin_en":"Ministry of Agriculture and Forestry","asiasanat":"Metsälaki – Uudistamisilmoitus – Kasvatushakkuu – Metsärikkomus – Oikaisuvaatimus","asiasanat_sv":"Skogslagen – Anmälan om förnyelse – Gallring – Skogsförseelse – Begäran om omprövning","asiasanat_en":"Forest Act – Regeneration notification – Thinning – Forest offence – Request for review","teksti":"Metsälakiin lisättäisiin maanomistajalle velvoite ilmoittaa Suomen metsäkeskukselle, kun uudistamiseen liittyvät perustamistoimenpiteet on tehty; velvoite koskisi myös eri-ikäisrakenteisen metsän kasvatushakkuuta. Ilmoitus olisi maksuton, ja sen laiminlyönti olisi metsärikkomus. Kasvatushakkuussa jätettävän puuston arvioinnissa siirryttäisiin valtapituudesta keskipituuteen. Metsäkeskuksen päätöksiin säädettäisiin oikaisuvaatimusmenettely, ja lain soveltamista rajattaisiin puolustusvalmiuden turvaamiseen tarvittavilla alueilla. Muutokset on tarkoitettu tulemaan voimaan 1.5.2027, ja ilmoitusvelvollisuus koskisi sen jälkeen tehtäviä hakkuita.","selko":"Metsänomistajan pitäisi jatkossa ilmoittaa metsäkeskukselle, kun uuden metsän perustamistyöt on tehty hakkuun jälkeen. Ilmoitus olisi maksuton, mutta sen laiminlyönti olisi metsärikkomus. Kyse on ehdotuksesta; muutokset tulisivat voimaan 1.5.2027.","lahde":"https://valtioneuvosto.fi/-/1410837/metsien-kasvuun-ja-hiilinielujen-vahvistamiseen-liittyva-metsalain-muutosesitys-etenee-eduskuntaan","aiheet":["ymparisto"],"otsikko_sv":"ANMÄLAN OM SKOGSFÖRNYELSE","teksti_sv":"I skogslagen skulle markägaren åläggas att göra en anmälan till Finlands skogscentral när de anläggningsåtgärder som hör till förnyelsen har vidtagits; skyldigheten skulle även gälla gallring av skog med olikåldrig struktur. Anmälan skulle vara avgiftsfri, och försummelse av den skulle vara en skogsförseelse. Vid bedömningen av det trädbestånd som ska lämnas vid gallring skulle övre höjd ersättas med medelhöjd. Ett förfarande för begäran om omprövning av skogscentralens beslut skulle införas, och lagens tillämpning skulle begränsas på områden som behövs för att trygga försvarsberedskapen. Ändringarna avses träda i kraft den 1 maj 2027, och anmälningsskyldigheten skulle gälla avverkningar därefter.","selko_sv":"Skogsägaren skulle i fortsättningen anmäla till skogscentralen när arbetet med att anlägga ny skog efter avverkning har gjorts. Anmälan skulle vara avgiftsfri, men att försumma den skulle vara en skogsförseelse. Det är ett förslag; ändringarna skulle träda i kraft den 1 maj 2027.","otsikko_en":"FOREST REGENERATION NOTICE","teksti_en":"The Forest Act would oblige landowners to notify the Finnish Forest Centre once the establishment measures for regeneration have been carried out; the obligation would also cover thinning of uneven-aged forest. The notification would be free of charge, and failure to make it would be a forest offence. In assessing the growing stock to be left after thinning, dominant height would be replaced by mean height. A request-for-review procedure would be introduced for Forest Centre decisions, and the Act's application would be limited in areas needed to safeguard defence readiness. The amendments are intended to enter into force on 1 May 2027, and the notification duty would apply to fellings after that.","selko_en":"Forest owners would have to notify the Forest Centre once work to establish new forest after felling has been done. The notification would be free, but failing to make it would be a forest offence. This is a proposal; the changes would take effect on 1 May 2027.","pvm":"2026-10-01","pvm_selite":"annettu","tekstityyppi":"tiivistelmä","lisatty":"2026-10-01T14:51"},{"id":"HE 189/2026 vp","tunnus":"HE 189/2026 vp","elin":"Ulkoministeriö","otsikko":"UKRAINAN VAADEKOMISSIOSOPIMUS","pvm":"2026-09-24","pvm_selite":"annettu","julkaistu":"2026-09-25","asiasanat":"Ukraina – Venäjä – vaadekomissio – vahingonkorvaus – Euroopan neuvosto – valtiosopimus","tekstityyppi":"tiivistelmä","teksti":"Hallitus esittää, että eduskunta hyväksyisi Ukrainan kansainvälisen vaadekomission perustamisesta tehdyn yleissopimuksen ja lain sen lainsäädännön alaan kuuluvien määräysten voimaansaattamisesta. Vaadekomissio käsittelisi yhteistyössä Ukrainan kanssa Venäjän hyökkäyssodan aiheuttamista vahingoista johtuvia korvausvaatimuksia. Sopimus ei ole vielä kansainvälisesti voimassa; voimaantulo edellyttää 25 allekirjoittajan sitoutumista ja rahoitusosuuksia koskevan ehdon täyttymistä. Laki on tarkoitettu tulemaan voimaan valtioneuvoston asetuksella säädettävänä ajankohtana. Samana päivänä annettiin HE 188/2026 vp hyökkäysrikosta käsittelevän erityistuomioistuimen hallintokomiteasta. Molemmat mekanismit perustetaan Euroopan neuvoston yhteyteen, ja niiden toimipaikaksi tulee Haag.","selko":"Suomi on liittymässä sopimukseen, jolla perustetaan kansainvälinen elin käsittelemään Venäjän hyökkäyssodan aiheuttamia vahinkoja koskevia korvausvaatimuksia. Eduskunnan on hyväksyttävä sopimus. Samalla annettiin toinen esitys, joka koskee hyökkäysrikosta käsittelevän erityistuomioistuimen hallintoa ja rahoitusta.","lahde":"https://www.eduskunta.fi/valtiopaivaasiat/HE+189/2026","aiheet":["turvallisuus","ihmisoikeudet"],"paino":3,"otsikko_sv":"AVTAL OM SKADESTÅNDSKOMMISSION","teksti_sv":"Regeringen föreslår att riksdagen godkänner konventionen om inrättande av en internationell skadeståndskommission för Ukraina och en lag om sättande i kraft av de bestämmelser i konventionen som hör till området för lagstiftningen. Kommissionen skulle i samarbete med Ukraina behandla ersättningsanspråk som gäller skador orsakade av Rysslands anfallskrig. Konventionen är ännu inte i kraft internationellt; ikraftträdandet förutsätter att 25 signatärer binder sig och att villkoret om finansieringsandelar uppfylls. Lagen avses träda i kraft vid en tidpunkt som bestäms genom förordning av statsrådet. Samma dag avläts RP 188/2026 rd om förvaltningskommittén för den särskilda domstolen för aggressionsbrottet. Båda mekanismerna inrättas inom Europarådet med säte i Haag.","selko_sv":"Finland ansluter sig till ett avtal om att inrätta ett internationellt organ som ska behandla krav på ersättning för skador orsakade av Rysslands anfallskrig. Riksdagen måste godkänna avtalet. Samtidigt lämnades en annan proposition om förvaltningen och finansieringen av en särskild domstol för aggressionsbrottet.","asiasanat_sv":"Ukraina – Ryssland – skadeståndskommission – skadestånd – Europarådet – internationellt fördrag","elin_sv":"Utrikesministeriet","otsikko_en":"UKRAINE CLAIMS COMMISSION TREATY","teksti_en":"The Government proposes that Parliament approve the Convention establishing the International Claims Commission for Ukraine and an act bringing into force its provisions of a legislative nature. The Claims Commission would, in cooperation with Ukraine, handle claims for compensation for damage caused by Russia's war of aggression. The Convention is not yet in force internationally; entry into force requires 25 signatories to commit and a condition on financial contributions to be met. The act is intended to enter into force on a date set by government decree. On the same day, HE 188/2026 vp on the management committee of the special tribunal for the crime of aggression was submitted. Both mechanisms are established within the Council of Europe and will be seated in The Hague.","selko_en":"Finland is joining a treaty that sets up an international body to handle compensation claims for damage caused by Russia's war of aggression. Parliament must approve the treaty. A second bill was submitted at the same time on the administration and funding of the special tribunal for the crime of aggression.","asiasanat_en":"Ukraine – Russia – claims commission – compensation – Council of Europe – treaty","elin_en":"Ministry for Foreign Affairs"}],"eu":[{"id":"komissio-2026-10-01-seveso","tunnus":"INF/26/1760","elin":"Euroopan komissio","elin_sv":"Europeiska kommissionen","elin_en":"European Commission","otsikko":"SEVESO III: KANNE SUOMEA VASTAAN","otsikko_sv":"SEVESO III: TALAN MOT FINLAND","otsikko_en":"SEVESO III: FINLAND TAKEN TO COURT","pvm":"2026-10-01","pvm_selite":"päätös","julkaistu":"2026-10-01T12:56","paino":4,"vaihe":"Kanne päätetty nostaa","vaihe_sv":"Beslut om att väcka talan","vaihe_en":"Referral decided","teksti":"Euroopan komissio päätti 1.10.2026 nostaa Suomea vastaan kanteen unionin tuomioistuimessa, koska Suomi ei ole saattanut kansallista lainsäädäntöään Seveso III -direktiivin (2012/18/EU) mukaiseksi. Puutteet koskevat erityisesti tarkastuksia, yleisön tiedonsaantia sekä muutoksenhaku- ja vireillepano-oikeutta. Komission mukaan viranomaiset eivät voi asettaa saataville turvallisuusselvitysten ja vaarallisten aineiden luetteloiden muita osia, kun niissä on luottamuksellisia tietoja, eikä tarkastuksia koordinoida muiden EU-oikeuteen perustuvien tarkastusten kanssa. Samassa koosteessa komissio lähetti Suomelle perustellun lausunnon kuudennen vakavaraisuusdirektiivin ((EU) 2024/1619) puutteellisesta saattamisesta osaksi kansallista lainsäädäntöä. Suomella on kaksi kuukautta aikaa vastata.","teksti_sv":"Europeiska kommissionen beslutade den 1 oktober 2026 att väcka talan mot Finland vid EU-domstolen, eftersom Finland inte har anpassat sin nationella lagstiftning till Seveso III-direktivet (2012/18/EU). Bristerna gäller särskilt inspektioner, allmänhetens tillgång till information samt rätten att söka ändring och att inleda förfaranden. Enligt kommissionen kan myndigheterna inte göra andra delar av säkerhetsrapporter och förteckningar över farliga ämnen tillgängliga när de innehåller konfidentiella uppgifter, och inspektionerna samordnas inte med andra inspektioner som grundar sig på EU-rätten. I samma paket skickade kommissionen ett motiverat yttrande till Finland för att det sjätte kapitalkravsdirektivet ((EU) 2024/1619) inte har införlivats fullt ut. Finland har två månader på sig att svara.","teksti_en":"On 1 October 2026 the European Commission decided to refer Finland to the Court of Justice of the EU because Finland has not brought its national legislation into line with the Seveso III Directive (2012/18/EU). The shortcomings concern in particular inspections, public access to information, and the rights of appeal and to initiate proceedings. According to the Commission, authorities cannot make other parts of safety reports and inventories of dangerous substances available when they contain confidential information, and inspections are not coordinated with other inspections based on EU law. In the same package the Commission sent Finland a reasoned opinion for not fully transposing the Sixth Capital Requirements Directive ((EU) 2024/1619). Finland has two months to reply.","tekstityyppi":"tiivistelmä","selko":"EU:n komissio vie Suomen EU:n tuomioistuimeen. Komission mukaan Suomen lait eivät vastaa EU:n sääntöjä, joilla ehkäistään vaarallisten aineiden aiheuttamia suuronnettomuuksia. Puutteet koskevat tarkastuksia ja ihmisten oikeutta saada tietoa ja hakea muutosta. Komissio vaatii Suomea myös panemaan kokonaan täytäntöön pankkeja koskevan direktiivin. Suomella on kaksi kuukautta aikaa vastata.","selko_sv":"EU-kommissionen drar Finland inför EU-domstolen. Enligt kommissionen motsvarar Finlands lagar inte EU:s regler som ska förebygga storolyckor med farliga ämnen. Bristerna gäller inspektioner och människors rätt att få information och att söka ändring. Kommissionen kräver också att Finland genomför ett direktiv om banker fullt ut. Finland har två månader på sig att svara.","selko_en":"The European Commission is taking Finland to the EU Court of Justice. According to the Commission, Finnish law does not match EU rules that aim to prevent major accidents involving dangerous substances. The problems concern inspections and people's right to information and to appeal. The Commission also wants Finland to fully implement a directive on banks. Finland has two months to reply.","huom":"Komissio lähetti Seveso-asiassa virallisen ilmoituksen heinäkuussa 2020 ja perustellun lausunnon joulukuussa 2025. Lähde: komission lokakuun rikkomuskooste ja komission Suomen-edustuston tiedote 1.10.2026.","huom_sv":"I Seveso-ärendet skickade kommissionen en formell underrättelse i juli 2020 och ett motiverat yttrande i december 2025. Källa: kommissionens överträdelsepaket för oktober och pressmeddelande från kommissionens representation i Finland 1.10.2026.","huom_en":"In the Seveso case the Commission sent a letter of formal notice in July 2020 and a reasoned opinion in December 2025. Source: the Commission's October infringements package and a press release by the Commission Representation in Finland, 1 October 2026.","lainvoimainen":false,"lahde":"https://ec.europa.eu/commission/presscorner/detail/fi/inf_26_1760","aiheet":["eu","ymparisto","finanssi"],"lisatty":"2026-10-03T06:50"},{"id":"C-855/24 P","tunnus":"C-855/24 P","elin":"Unionin tuomioistuin","elin_sv":"EU-domstolen","elin_en":"Court of Justice","otsikko":"KARTELLIASIAN SIIRTO KOMISSIOLLE","otsikko_sv":"KARTELLÄRENDE TILL KOMMISSIONEN","otsikko_en":"CARTEL CASE TAKEN OVER BY EC","pvm":"2026-10-01","pvm_selite":"tuomio","julkaistu":"2026-10-01","paino":3,"asiasanat":"Muutoksenhaku – Kilpailu – Kartellit tai muut yhteistoimintajärjestelyt – Asetus (EY) N:o 1/2003 – 11 artiklan 6 kohta – Euroopan komissio aloittaa menettelyn asiassa, jota kansallinen kilpailuviranomainen jo käsittelee – Kansallinen kilpailuviranomainen pyytää komissiota ottamaan asian käsiteltäväkseen – Toissijaisuusperiaate – Euroopan unionin perusoikeuskirjan 41 artikla – Hyvän hallinnon periaate – Asian käsitteleminen kohtuullisessa ajassa – Komission tiedonanto yhteistyöstä kilpailuviranomaisten verkostossa – Kyseinen toimielimen itse toteuttama harkintavaltansa rajoitus – Perusteluvelvollisuus","asiasanat_sv":"Överklagande – Konkurrens – Konkurrensbegränsande samverkan – Förordning (EG) nr 1/2003 – Artikel 11.6 – Europeiska kommissionen inleder ett förfarande i ett ärende som redan handläggs av en nationell konkurrensmyndighet – Den nationella myndighetens begäran att fråntas sin behörighet av kommissionen – Subsidiaritetsprincipen – Artikel 41 i Europeiska unionens stadga om de grundläggande rättigheterna – Principen om god förvaltning – Skälig handläggningstid – Kommissionens tillkännagivande om samarbete inom nätverket av konkurrensmyndigheter – Självbegränsning av institutionens utrymme för skönsmässig bedömning – Motiveringsskyldighet","asiasanat_en":"Appeal – Competition – Agreements, decisions and concerted practices – Regulation (EC) No 1/2003 – Article 11(6) – European Commission initiating proceedings in a case on which a national competition authority is already acting – Request from that national authority for the Commission to relieve it of competence – Principle of subsidiarity – Article 41 of the Charter of Fundamental Rights of the European Union – Principle of good administration – Reasonable time period for dealing with a case – Commission Notice on Cooperation within the Network of Competition Authorities – That institution itself deciding to limit its discretion – Obligation to state reasons","teksti":"Muutoksenhaku – Kilpailu – Kartellit tai muut yhteistoimintajärjestelyt – Asetus (EY) N:o 1/2003 – 11 artiklan 6 kohta – Euroopan komissio aloittaa menettelyn asiassa, jota kansallinen kilpailuviranomainen jo käsittelee – Kansallinen kilpailuviranomainen pyytää komissiota ottamaan asian käsiteltäväkseen – Toissijaisuusperiaate – Euroopan unionin perusoikeuskirjan 41 artikla – Hyvän hallinnon periaate – Asian käsitteleminen kohtuullisessa ajassa – Komission tiedonanto yhteistyöstä kilpailuviranomaisten verkostossa – Kyseinen toimielimen itse toteuttama harkintavaltansa rajoitus – Perusteluvelvollisuus.","teksti_sv":"Överklagande – Konkurrens – Konkurrensbegränsande samverkan – Förordning (EG) nr 1/2003 – Artikel 11.6 – Europeiska kommissionen inleder ett förfarande i ett ärende som redan handläggs av en nationell konkurrensmyndighet – Den nationella myndighetens begäran att fråntas sin behörighet av kommissionen – Subsidiaritetsprincipen – Artikel 41 i Europeiska unionens stadga om de grundläggande rättigheterna – Principen om god förvaltning – Skälig handläggningstid – Kommissionens tillkännagivande om samarbete inom nätverket av konkurrensmyndigheter – Självbegränsning av institutionens utrymme för skönsmässig bedömning – Motiveringsskyldighet.","teksti_en":"Appeal – Competition – Agreements, decisions and concerted practices – Regulation (EC) No 1/2003 – Article 11(6) – European Commission initiating proceedings in a case on which a national competition authority is already acting – Request from that national authority for the Commission to relieve it of competence – Principle of subsidiarity – Article 41 of the Charter of Fundamental Rights of the European Union – Principle of good administration – Reasonable time period for dealing with a case – Commission Notice on Cooperation within the Network of Competition Authorities – That institution itself deciding to limit its discretion – Obligation to state reasons.","tekstityyppi":"asiasanat","selko":"Crown-yhtiöt hakivat muutosta ratkaisuun, joka koski Euroopan komission kartellimenettelyä. Komissio oli aloittanut menettelyn asiassa, jota kansallinen kilpailuviranomainen jo käsitteli, tämän viranomaisen pyynnöstä. Tuomio koskee muun muassa toissijaisuusperiaatetta, hyvää hallintoa ja kohtuullista käsittelyaikaa. Lopputulos on luettava tuomiosta.","selko_sv":"Crownbolagen överklagade ett avgörande om Europeiska kommissionens förfarande i ett kartellärende. Kommissionen hade inlett förfarandet i ett ärende som en nationell konkurrensmyndighet redan handlade, på den myndighetens begäran. Domen gäller bland annat subsidiaritetsprincipen, god förvaltning och skälig handläggningstid. Utgången måste läsas i domen.","selko_en":"The Crown companies appealed against a ruling on the European Commission's proceedings in a cartel case. The Commission had opened proceedings in a case already being handled by a national competition authority, at that authority's request. The judgment concerns, among other things, subsidiarity, good administration and a reasonable time. The outcome must be read from the judgment.","huom":"Asiasanat tuomion virallisesta otsikosta. Samana päivänä annettiin samoin asiasanoin tuomio asiassa C-845/24 P (Silgan Holdings ym. v. komissio). Lue tuomio EU-tuomioistuimen sivuilta.","huom_sv":"Sökorden är hämtade från domens officiella rubrik. Samma dag meddelades en dom med samma sökord i mål C-845/24 P (Silgan Holdings m.fl. mot kommissionen). Läs domen på EU-domstolens webbplats.","huom_en":"Keywords from the official title of the judgment. On the same day the Court gave a judgment with the same keywords in Case C-845/24 P (Silgan Holdings and Others v Commission). Read the judgment on the CJEU website.","lahde":"https://curia.europa.eu/juris/liste.jsf?num=C-855/24&language=fi","aiheet":["kilpailu","eu"],"lisatty":"2026-10-02T06:50"},{"id":"C-459/25","tunnus":"C-459/25","elin":"Unionin tuomioistuin","elin_sv":"EU-domstolen","elin_en":"Court of Justice","otsikko":"VUOKRALAISEN KULUEHTO, EUT","otsikko_sv":"HYRESGÄSTENS KOSTNADSVILLKOR, EU","otsikko_en":"TENANT LEGAL COSTS CLAUSE, CJEU","pvm":"2026-10-01","pvm_selite":"tuomio","julkaistu":"2026-10-01","paino":3,"asiasanat":"Kuluttajansuoja – Direktiivi 93/13/ETY – 6 artiklan 1 kohta ja 7 artiklan 1 kohta – Kuluttajasopimusten kohtuuttomat ehdot – Vuokrasopimus – Ehto, jonka mukaan vuokralainen vastaa kaikista tuomioistuinmenettelystä aiheutuvista kuluista, jos hän ei täytä sopimusvelvoitteitaan – Kyseisen ehdon kohtuuttomaksi toteamisen vaikutukset – Kansallisen oikeuden dispositiivisten säännösten soveltaminen – Oikeudenkäyntikulujen jakaminen ja vahvistaminen tuomioistuinmenettelyssä – Jäsenvaltioiden menettelyllinen autonomia – Tehokkuusperiaate","asiasanat_sv":"Konsumentskydd – Direktiv 93/13/EEG – Artiklarna 6.1 och 7.1 – Oskäliga villkor i konsumentavtal – Hyresavtal – Villkor som föreskriver att hyresgästen ska stå för samtliga kostnader för domstolsförfarandet när denne inte har uppfyllt sina avtalsenliga skyldigheter – Följderna av att nämnda villkor förklaras oskäligt – Tillämpning av dispositiva bestämmelser i nationell rätt – Fördelning och fastställande av rättegångskostnaderna i ett domstolsförfarande – Medlemsstaternas processuella autonomi – Effektivitetsprincipen","asiasanat_en":"Consumer protection – Directive 93/13/EEC – Article 6(1) and Article 7(1) – Unfair terms in consumer contracts – Lease agreement – Clause attributing all the legal costs to the tenant in the event of a failure by that tenant to fulfil his contractual obligations – Effects of a finding that that clause constitutes an unfair term – Application of supplementary provisions of national law – Allocation and taxation of costs in judicial proceedings – Procedural autonomy of the Member States – Principle of effectiveness","teksti":"Kuluttajansuoja – Direktiivi 93/13/ETY – 6 artiklan 1 kohta ja 7 artiklan 1 kohta – Kuluttajasopimusten kohtuuttomat ehdot – Vuokrasopimus – Ehto, jonka mukaan vuokralainen vastaa kaikista tuomioistuinmenettelystä aiheutuvista kuluista, jos hän ei täytä sopimusvelvoitteitaan – Kyseisen ehdon kohtuuttomaksi toteamisen vaikutukset – Kansallisen oikeuden dispositiivisten säännösten soveltaminen – Oikeudenkäyntikulujen jakaminen ja vahvistaminen tuomioistuinmenettelyssä – Jäsenvaltioiden menettelyllinen autonomia – Tehokkuusperiaate.","teksti_sv":"Konsumentskydd – Direktiv 93/13/EEG – Artiklarna 6.1 och 7.1 – Oskäliga villkor i konsumentavtal – Hyresavtal – Villkor som föreskriver att hyresgästen ska stå för samtliga kostnader för domstolsförfarandet när denne inte har uppfyllt sina avtalsenliga skyldigheter – Följderna av att nämnda villkor förklaras oskäligt – Tillämpning av dispositiva bestämmelser i nationell rätt – Fördelning och fastställande av rättegångskostnaderna i ett domstolsförfarande – Medlemsstaternas processuella autonomi – Effektivitetsprincipen.","teksti_en":"Consumer protection – Directive 93/13/EEC – Article 6(1) and Article 7(1) – Unfair terms in consumer contracts – Lease agreement – Clause attributing all the legal costs to the tenant in the event of a failure by that tenant to fulfil his contractual obligations – Effects of a finding that that clause constitutes an unfair term – Application of supplementary provisions of national law – Allocation and taxation of costs in judicial proceedings – Procedural autonomy of the Member States – Principle of effectiveness.","tekstityyppi":"asiasanat","selko":"Tuomio koskee kuluttajan vuokrasopimuksen ehtoa, jonka mukaan vuokralainen maksaa kaikki oikeudenkäynnin kulut, jos hän ei täytä sopimusvelvoitteitaan. Kysymys on siitä, mitä seuraa, kun tällainen ehto todetaan kohtuuttomaksi. Lopputulos on luettava tuomiosta.","selko_sv":"Domen gäller ett villkor i en konsuments hyresavtal enligt vilket hyresgästen betalar alla rättegångskostnader om hen inte fullgör sina skyldigheter enligt avtalet. Frågan är vad som följer när ett sådant villkor förklaras oskäligt. Utgången måste läsas i domen.","selko_en":"The judgment concerns a term in a consumer lease under which the tenant pays all legal costs if the tenant fails to meet contractual obligations. The question is what follows when such a term is found to be unfair. The outcome must be read from the judgment.","huom":"Asiasanat tuomion virallisesta otsikosta. Lue tuomio EU-tuomioistuimen sivuilta.","huom_sv":"Sökorden är hämtade från domens officiella rubrik. Läs domen på EU-domstolens webbplats.","huom_en":"Keywords from the official title of the judgment. Read the judgment on the CJEU website.","lahde":"https://curia.europa.eu/juris/liste.jsf?num=C-459/25&language=fi","aiheet":["kuluttaja","asuminen","eu"],"lisatty":"2026-10-02T06:51"},{"id":"C-249/25","tunnus":"C-249/25","elin":"Unionin tuomioistuin","elin_sv":"EU-domstolen","elin_en":"Court of Justice","otsik s between Member States in receiving such persons and bearing the consequences thereof – Article 17(2) – Directive 2013/32/EU – Common procedures for granting and withdrawing international protection – Granting of international protection to a person enjoying temporary protection under Directive 2001/55 – Article 31 – National administrative practice of suspending, during the temporary protection period, the running of the time limit for taking a decision on an application for international protection","teksti":"Vapauden, turvallisuuden ja oikeuden alue – Turvapaikkapolitiikka – Direktiivi 2001/55/EY – Vähimmäisvaatimukset tilapäisen suojelun antamiseksi siirtymään joutuneiden henkilöiden joukoittaisen maahantulon tilanteissa, ja toimenpiteet näiden henkilöiden vastaanottamisen ja vastaanottamisesta jäsenvaltioille aiheutuvien rasitusten tasapuolisen jakautumisen edistämiseksi – 17 artiklan 2 kohta – Direktiivi 2013/32/EU – Kansainvälisen suojelun myöntämistä tai poistamista koskevat yhteiset menettelyt – Kansainvälisen suojelun myöntäminen henkilölle, joka saa direktiiviin 2001/55 perustuvaa tilapäistä suojelua – 31 artikla – Kansallinen hallintokäytäntö, jonka mukaan sen määräajan kuluminen, joka on säädetty päätöksen tekemiselle kansainvälistä suojelua koskevasta hakemuksesta, lykkääntyy tilapäisen suojelun ajaksi.","teksti_sv":"Område med frihet, säkerhet och rättvisa – Asylpolitik – Direktiv 2001/55/EG – Miniminormer för att ge tillfälligt skydd vid massiv tillströmning av fördrivna personer och om åtgärder för att främja en balans mellan medlemsstaternas insatser för att ta emot dessa personer och bära följderna av detta – Artikel 17.2 – Direktiv 2013/32/EU – Gemensamma förfaranden för att bevilja och återkalla internationellt skydd – Beviljande av internationellt skydd för en person som åtnjuter tillfälligt skydd enligt direktiv 2001/55 – Artikel 31 – Nationell förvaltningspraxis som innebär att tidsfristen för att fatta beslut om en ansökan om internationellt skydd avbryts under det tillfälliga skyddets varaktighet.","teksti_en":"Area of freedom, security and justice – Asylum policy – Directive 2001/55/EC – Minimum standards for giving temporary protection in the event of a mass influx of displaced persons and measures promoting a balance of efforts between Member States in receiving such persons and bearing the consequences thereof – Article 17(2) – Directive 2013/32/EU – Common procedures for granting and withdrawing international protection – Granting of international protection to a person enjoying temporary protection under Directive 2001/55 – Article 31 – National administrative practice of suspending, during the temporary protection period, the running of the time limit for taking a decision on an application for international protection.","tekstityyppi":"asiasanat","selko":"Tuomio koskee tilapäistä suojelua saavan henkilön hakemusta kansainvälisestä suojelusta. Kysymys on kansallisesta käytännöstä, jossa hakemuksen ratkaisemisen määräajan kuluminen lykkääntyy tilapäisen suojelun ajaksi. Lopputulos on luettava tuomiosta.","selko_sv":"Domen gäller en ansökan om internationellt skydd från en person som åtnjuter tillfälligt skydd. Frågan gäller en nationell praxis där tidsfristen för att avgöra ansökan avbryts under det tillfälliga skyddets varaktighet. Utgången måste läsas i domen.","selko_en":"The judgment concerns an application for international protection by a person enjoying temporary protection. The question concerns a national practice of suspending the time limit for deciding the application during the temporary protection period. The outcome must be read from the judgment.","huom":"Asiasanat tuomion virallisesta otsikosta. Lue tuomio EU-tuomioistuimen sivuilta.","huom_sv":"Sökorden är hämtade från domens officiella rubrik. Läs domen på EU-domstolens webbplats.","huom_en":"Keywords from the official title of the judgment. Read the judgment on the CJEU website.","lahde":"https://curia.europa.eu/juris/liste.jsf?num=C-249/25&language=fi","aiheet":["maahanmuutto","eu"],"lisatty":"2026-10-02T06:51"},{"id":"T-138/23","tunnus":"T-138/23","otsikko":"OIKEUSVALTIOEHDOLLISUUS: SEMMELWEIS","pvm":"2026-09-30","pvm_selite":"tuomio","julkaistu":"2026-09-30","paino":4,"elin":"Unionin yleinen tuomioistuin","asiasanat":"EU:n talousarvion toteuttaminen – Asetus (EU, Euratom) 2020/2092 – Yleinen ehdollisuusjärjestelmä unionin talousarvion suojaamiseksi – Neuvoston täytäntöönpanopäätös (EU) 2022/2506 – Toimenpiteet unionin talousarvion suojaamiseksi oikeusvaltion periaatteiden rikkomiselta Unkarissa – Täytäntöönpanopäätöksen 2022/2506 2 artiklan 2 kohta – Komissiolle asetettu kielto tehdä oikeudellisia sitoumuksia yleishyödyllisten säätiöiden ja tällaisten yleishyödyllisten säätiöiden ylläpitämien yhteisöjen kanssa – Perusteluvelvollisuus – Oikeus tulla kuulluksi","teksti":"EU:n talousarvion toteuttaminen – Asetus (EU, Euratom) 2020/2092 – Yleinen ehdollisuusjärjestelmä unionin talousarvion suojaamiseksi – Neuvoston täytäntöönpanopäätös (EU) 2022/2506 – Toimenpiteet unionin talousarvion suojaamiseksi oikeusvaltion periaatteiden rikkomiselta Unkarissa – Täytäntöönpanopäätöksen 2022/2506 2 artiklan 2 kohta – Komissiolle asetettu kielto tehdä oikeudellisia sitoumuksia yleishyödyllisten säätiöiden ja tällaisten yleishyödyllisten säätiöiden ylläpitämien yhteisöjen kanssa – Perusteluvelvollisuus – Oikeus tulla kuulluksi.","tekstityyppi":"asiasanat","selko":"Unkarilainen Semmelweis-yliopisto riitautti EU:n neuvoston päätöksen, jolla komissio kiellettiin tekemästä sitoumuksia Unkarin yleishyödyllisten säätiöiden ja niiden ylläpitämien yhteisöjen kanssa oikeusvaltio-ongelmien vuoksi. Tuomio koskee muun muassa perusteluvelvollisuutta ja oikeutta tulla kuulluksi. Lopputulos on luettava tuomiosta.","huom":"Asiasanat tuomion virallisesta otsikosta. Lue tuomio EU-tuomioistuimen sivuilta.","lahde":"https://curia.europa.eu/juris/liste.jsf?num=T-138/23&language=fi","aiheet":["eu","koulutus"],"otsikko_sv":"RÄTTSSTATSVILLKOR: SEMMELWEIS","asiasanat_sv":"Genomförande av unionens budget – Förordning (EU, Euratom) 2020/2092 – Generell villkorlighetsordning för skydd av unionsbudgeten – Genomförandebeslut (EU) 2022/2506 – Åtgärder för skydd av unionsbudgeten mot överträdelser av rättsstatens principer i Ungern – Artikel 2.2 i genomförandebeslut 2022/2506 – Förbud för kommissionen att ingå rättsliga åtaganden med en allmännyttig trust eller med enheter som förvaltas av en sådan trust – Motiveringsskyldighet – Rätten att yttra sig","teksti_sv":"Genomförande av unionens budget – Förordning (EU, Euratom) 2020/2092 – Generell villkorlighetsordning för skydd av unionsbudgeten – Genomförandebeslut (EU) 2022/2506 – Åtgärder för skydd av unionsbudgeten mot överträdelser av rättsstatens principer i Ungern – Artikel 2.2 i genomförandebeslut 2022/2506 – Förbud för kommissionen att ingå rättsliga åtaganden med en allmännyttig trust eller med enheter som förvaltas av en sådan trust – Motiveringsskyldighet – Rätten att yttra sig.","selko_sv":"Semmelweisuniversitetet i Ungern bestred rådets beslut som förbjöd kommissionen att ingå åtaganden med ungerska allmännyttiga truster och enheter som förvaltas av dem på grund av problem med rättsstaten. Domen gäller bland annat motiveringsskyldigheten och rätten att yttra sig. Utgången måste läsas i domen.","huom_sv":"Sökorden är hämtade från domens officiella rubrik. Läs domen på EU-domstolens webbplats.","elin_sv":"Tribunalen","lisatty":"2026-09-30T17:16","otsikko_en":"RULE OF LAW: SEMMELWEIS UNIVERSITY","teksti_en":"Implementation of the EU budget – Regulation (EU, Euratom) 2020/2092 – General regime of conditionality for the protection of the Union budget – Council Implementing Decision (EU) 2022/2506 – Measures for the protection of the Union budget against breaches of the principles of the rule of law in Hungary – Article 2(2) of Implementing Decision 2022/2506 – Prohibition on the Commission entering into legal commitments with public interest trusts and entities maintained by them – Duty to state reasons – Right to be heard.","selko_en":"Hungary's Semmelweis University challenged the EU Council decision that barred the Commission from entering into commitments with Hungarian public interest trusts and the entities they maintain because of rule-of-law problems. The judgment concerns, among other things, the duty to state reasons and the right to be heard. The outcome must be read from the judgment.","asiasanat_en":"Implementation of the EU budget – Regulation (EU, Euratom) 2020/2092 – General regime of conditionality for the protection of the Union budget – Council Implementing Decision (EU) 2022/2506 – Measures for the protection of the Union budget against breaches of the principles of the rule of law in Hungary – Article 2(2) of Implementing Decision 2022/2506 – Prohibition on the Commission entering into legal commitments with public interest trusts and entities maintained by them – Duty to state reasons – Right to be heard","elin_en":"General Court","huom_en":"Keywords from the official title of the judgment. Read the judgment on the CJEU website."},{"id":"C-900/24","tunnus":"C-900/24","elin":"Unionin tuomioistuin","otsikko":"ENERGIAN HINNANMUUTOSEHDOT, EUT","pvm":"2026-09-24","pvm_selite":"tuomio","asiasanat":"Kuluttajansuoja – Direktiivi 93/13/ETY – Kuluttajasopimusten kohtuuttomat ehdot – Sopimusehdon kohtuuttomaksi toteamisen vaikutukset – Kansallisen tuomioistuimen toimivalta korjata kohtuuttoman ehdon poistamisen seuraukset – Monivuotisessa energiantoimitussopimuksessa olevat kohtuuttomat hinnanmuutosehdot","teksti":"Kuluttajansuoja – Direktiivi 93/13/ETY – Kuluttajasopimusten kohtuuttomat ehdot – Sopimusehdon kohtuuttomaksi toteamisen vaikutukset – Kansallisen tuomioistuimen toimivalta korjata kohtuuttoman ehdon poistamisen seuraukset – Monivuotisessa energiantoimitussopimuksessa olevat kohtuuttomat hinnanmuutosehdot.","tekstityyppi":"asiasanat","huom":"Asiasanat tuomion virallisesta otsikosta. Lue tuomio EU-tuomioistuimen sivuilta.","lahde":"https://curia.europa.eu/juris/liste.jsf?num=C-900/24&language=fi","selko":"EU-tuomioistuin antoi tuomion siitä, milloin energiasopimuksen ehto hinnan muuttamisesta voi olla kuluttajalle kohtuuton. Tarkka sisältö on luettava tuomiosta.","aiheet":["kuluttaja","eu"],"julkaistu":"2026-09-24","paino":3,"otsikko_sv":"PRISÄNDRINGSVILLKOR I ENERGIAVTAL","teksti_sv":"Konsumentskydd – Direktiv 93/13/EEG – Oskäliga villkor i konsumentavtal – Följderna av att ett villkor förklaras oskäligt – Behörighet för den nationella domstolen att avhjälpa följderna av att ett oskäligt villkor har upphävts – Avtal med lång löptid om leverans av energi med oskäliga prisändringsvillkor.","asiasanat_sv":"Konsumentskydd – Direktiv 93/13/EEG – Oskäliga villkor i konsumentavtal – Följderna av att ett villkor förklaras oskäligt – Behörighet för den nationella domstolen att avhjälpa följderna av att ett oskäligt villkor har upphävts – Avtal med lång löptid om leverans av energi med oskäliga prisändringsvillkor","selko_sv":"EU-domstolen har meddelat en dom om när ett villkor i ett energiavtal om att ändra priset kan vara oskäligt, alltså orimligt, för konsumenten. För det exakta innehållet måste man läsa domen.","huom_sv":"Sökorden är hämtade från domens officiella rubrik. Läs domen på EU-domstolens webbplats.","elin_sv":"EU-domstolen","otsikko_en":"ENERGY PRICE-CHANGE TERMS, CJEU","teksti_en":"Consumer protection – Directive 93/13/EEC – Unfair terms in consumer contracts – Effects of a finding that a term is unfair – Power of the national court to remedy the consequences of removing an unfair term – Unfair price-variation terms in a multi-year energy supply contract.","selko_en":"The CJEU ruled on when a price-change term in an energy contract may be unfair to the consumer. The exact content must be read from the judgment.","asiasanat_en":"Consumer protection – Directive 93/13/EEC – Unfair terms in consumer contracts – Effects of a finding that a term is unfair – Power of the national court to remedy the consequences of removing an unfair term – Unfair price-variation terms in a multi-year energy supply contract","elin_en":"Court of Justice","huom_en":"Keywords from the official title of the judgment. Read the judgment on the CJEU website."},{"id":"C-381/25","tunnus":"C-381/25","elin":"Unionin tuomioistuin","otsikko":"KOTIMYYNNIN PERUUTTAMISOIKEUS, EUT","pvm":"2026-09-24","pvm_selite":"tuomio","asiasanat":"Kuluttajansuoja – Direktiivi 2011/83/EU – Peruuttamisoikeus muualla kuin elinkeinonharjoittajan toimitiloissa tehtyjen sopimusten osalta – Elinkeinonharjoittajan kirjallinen tarjous, jonka kuluttaja on hyväksynyt elinkeinonharjoittajan läsnä ollessa muualla kuin tämän toimitiloissa","teksti":"Kuluttajansuoja – Direktiivi 2011/83/EU – Peruuttamisoikeus muualla kuin elinkeinonharjoittajan toimitiloissa tehtyjen sopimusten osalta – Elinkeinonharjoittajan kirjallinen tarjous, jonka kuluttaja on hyväksynyt elinkeinonharjoittajan läsnä ollessa muualla kuin tämän toimitiloissa.","tekstityyppi":"asiasanat","huom":"Asiasanat tuomion virallisesta otsikosta. Lue tuomio EU-tuomioistuimen sivuilta.","lahde":"https://curia.europa.eu/juris/liste.jsf?num=C-381/25&language=fi","selko":"Tuomio koskee kuluttajan oikeutta perua kauppa, joka on tehty muualla kuin myyjän liikkeessä, esimerkiksi kotona. Tarkka sisältö on luettava tuomiosta.","aiheet":["kuluttaja","eu"],"julkaistu":"2026-09-24","paino":3,"otsikko_sv":"ÅNGERRÄTT VID HEMFÖRSÄLJNING","teksti_sv":"Konsumentskydd – Direktiv 2011/83/EU – Ångerrätt vid avtal utanför fasta affärslokaler – Skriftligt anbud från näringsidkaren – Konsumenten accepterar detta anbud i näringsidkarens närvaro utanför dennes fasta affärslokaler.","asiasanat_sv":"Konsumentskydd – Direktiv 2011/83/EU – Ångerrätt vid avtal utanför fasta affärslokaler – Skriftligt anbud från näringsidkaren – Konsumenten accepterar detta anbud i näringsidkarens närvaro utanför dennes fasta affärslokaler","selko_sv":"Domen gäller konsumentens rätt att ångra ett köp som har gjorts någon annanstans än i säljarens affär, till exempel hemma. För det exakta innehållet måste man läsa domen.","huom_sv":"Sökorden är hämtade från domens officiella rubrik. Läs domen på EU-domstolens webbplats.","elin_sv":"EU-domstolen","otsikko_en":"DOORSTEP SALES WITHDRAWAL, CJEU","teksti_en":"Consumer protection – Directive 2011/83/EU – Right of withdrawal for off-premises contracts – Written offer by the trader accepted by the consumer in the trader's presence away from its business premises.","selko_en":"The judgment concerns a consumer's right to withdraw from a purchase made away from the seller's premises, for example at home. The exact content must be read from the judgment.","asiasanat_en":"Consumer protection – Directive 2011/83/EU – Right of withdrawal for off-premises contracts – Written offer by the trader accepted by the consumer in the trader's presence away from its business premises","elin_en":"Court of Justice","huom_en":"Keywords from the official title of the judgment. Read the judgment on the CJEU website."},{"id":"C-369/25","tunnus":"C-369/25","elin":"Unionin tuomioistuin","otsikko":"TYÖSUHTEEN EHTOJEN ILMOITTAMINEN","pvm":"2026-09-24","pvm_selite":"tuomio","asiasanat":"Sosiaalipolitiikka – Direktiivi 91/533/ETY – Työnantajan velvollisuus ilmoittaa työsuhteessa sovellettavista ehdoista – Oikeuksien puolustaminen – Työntekijän oikeus saada asiakirja työsopimuksen tai työsuhteen olennaisista kohdista","teksti":"Sosiaalipolitiikka – Direktiivi 91/533/ETY – Työnantajan velvollisuus ilmoittaa työsuhteessa sovellettavista ehdoista – Oikeuksien puolustaminen – Työntekijän oikeus saada asiakirja työsopimuksen tai työsuhteen olennaisista kohdista.","tekstityyppi":"asiasanat","huom":"Asiasanat tuomion virallisesta otsikosta. Lue tuomio EU-tuomioistuimen sivuilta.","lahde":"https://curia.europa.eu/juris/liste.jsf?num=C-369/25&language=fi","selko":"Tuomio koskee työnantajan velvollisuutta kertoa työntekijälle työsuhteen keskeiset ehdot. Tarkka sisältö on luettava tuomiosta.","aiheet":["tyo","eu"],"julkaistu":"2026-09-24","paino":3,"otsikko_sv":"INFORMATION OM ANSTÄLLNINGSVILLKOR","teksti_sv":"Socialpolitik – Direktiv 91/533/EEG – Skyldighet för arbetsgivaren att informera arbetstagaren om de regler som är tillämpliga på anställningsavtalet eller anställningsförhållandet – Skydd av rättigheter – Rätt för arbetstagaren att få ett dokument med information om anställningsavtalets eller anställningsförhållandets väsentliga drag.","asiasanat_sv":"Socialpolitik – Direktiv 91/533/EEG – Skyldighet för arbetsgivaren att informera arbetstagaren om de regler som är tillämpliga på anställningsavtalet eller anställningsförhållandet – Skydd av rättigheter – Rätt för arbetstagaren att få ett dokument med information om anställningsavtalets eller anställningsförhållandets väsentliga drag","selko_sv":"Domen gäller arbetsgivarens skyldighet att berätta för arbetstagaren om de viktigaste villkoren i anställningen. För det exakta innehållet måste man läsa domen.","huom_sv":"Sökorden är hämtade från domens officiella rubrik. Läs domen på EU-domstolens webbplats.","elin_sv":"EU-domstolen","otsikko_en":"NOTIFYING EMPLOYMENT CONDITIONS","teksti_en":"Social policy – Directive 91/533/EEC – Employer's obligation to inform employees of the conditions applicable to the employment relationship – Defence of rights – Employee's right to receive a document on the essential aspects of the contract or employment relationship.","selko_en":"The judgment concerns an employer's obligation to inform the employee of the essential terms of employment. The exact content must be read from the judgment.","asiasanat_en":"Social policy – Directive 91/533/EEC – Employer's obligation to inform employees of the conditions applicable to the employment relationship – Defence of rights – Employee's right to receive a document on the essential aspects of the contract or employment relationship","elin_en":"Court of Justice","huom_en":"Keywords from the official title of the judgment. Read the judgment on the CJEU website."},{"id":"C-151/25","tunnus":"C-151/25","elin":"Unionin tuomioistuin","otsikko":"TUULIPUISTON LUPA JA OSALLISTUMINEN","pvm":"2026-09-24","pvm_selite":"tuomio","asiasanat":"Ympäristö – Århusin yleissopimus – 6 artikla – Yleisön osallistuminen päätöksentekoon – Tuulivoimapuiston toimintaluvan voimassaoloajan jatkaminen – Velvollisuus järjestää yleisön osallistuminen ennen jatkamista","teksti":"Ympäristö – Århusin yleissopimus – 6 artikla – Yleisön osallistuminen päätöksentekoon – Tuulivoimapuiston toimintaluvan voimassaoloajan jatkaminen – Velvollisuus järjestää yleisön osallistuminen ennen jatkamista.","tekstityyppi":"asiasanat","huom":"Asiasanat tuomion virallisesta otsikosta. Lue tuomio EU-tuomioistuimen sivuilta.","lahde":"https://curia.europa.eu/juris/liste.jsf?num=C-151/25&language=fi","selko":"Tuomio koskee sitä, onko yleisöllä oltava mahdollisuus osallistua, kun tuulipuiston luvan voimassaoloa jatketaan. Tarkka sisältö on luettava tuomiosta.","aiheet":["ymparisto","eu"],"julkaistu":"2026-09-24","paino":2,"otsikko_sv":"VINDPARKSTILLSTÅND OCH DELTAGANDE","teksti_sv":"Miljö – Århuskonventionen – Artikel 6 – Allmänhetens deltagande i beslut om vissa verksamheter – Förlängning av giltighetstiden för ett tillstånd att driva en vindkraftpark – Skyldighet att sörja för allmänhetens deltagande före denna förlängning.","asiasanat_sv":"Miljö – Århuskonventionen – Artikel 6 – Allmänhetens deltagande i beslut om vissa verksamheter – Förlängning av giltighetstiden för ett tillstånd att driva en vindkraftpark – Skyldighet att sörja för allmänhetens deltagande före denna förlängning","selko_sv":"Domen gäller frågan om allmänheten ska få möjlighet att delta när tillståndet för en vindkraftpark förlängs. För det exakta innehållet måste man läsa domen.","huom_sv":"Sökorden är hämtade från domens officiella rubrik. Läs domen på EU-domstolens webbplats.","elin_sv":"EU-domstolen","otsikko_en":"WIND FARM PERMIT AND PARTICIPATION","teksti_en":"Environment – Aarhus Convention – Article 6 – Public participation in decision-making – Extension of the validity of a wind farm's operating permit – Obligation to arrange public participation before the extension.","selko_en":"The judgment concerns whether the public must be able to participate when the validity of a wind farm's permit is extended. The exact content must be read from the judgment.","asiasanat_en":"Environment – Aarhus Convention – Article 6 – Public participation in decision-making – Extension of the validity of a wind farm's operating permit – Obligation to arrange public participation before the extension","elin_en":"Court of Justice","huom_en":"Keywords from the official title of the judgment. Read the judgment on the CJEU website."}],"laillisuus":[{"id":"eoa-8534-2025","tunnus":"EOAK 8534/2025","elin":"Apulaisoikeusasiamies","otsikko":"MUISTUTUSVASTAUS OLI PUUTTEELLINEN","pvm":"2026-09-18","pvm_selite":"ratkaisu","julkaistu":"2026-10-02T13:10","paino":3,"asiasanat":"Muistutus – Perusteluvelvollisuus – Salassapito – Potilaslaki – Sosiaalihuollon asiakaslaki – Hyvinvointialue","teksti":"Omainen teki muistutuksen kuolleen äitinsä hoitoa koskevassa asiassa. Vantaan ja Keravan hyvinvointialue vastasi, että asia oli käsitelty sisäisesti eikä vastausta voitu antaa salassa pidettävien tietojen vuoksi. Apulaisoikeusasiamies Lindroos-Hovinheimo katsoi hyvinvointialueen menetelleen virheellisesti. Pelkkä ilmoitus sisäisestä käsittelystä ei täytä potilaslain ja sosiaalihuollon asiakaslain vaatimusta perustellusta vastauksesta. Tieto siitä, miten asiaa on selvitetty ja mihin toimenpiteisiin on ryhdytty, voitaneen lähtökohtaisesti antaa ilman salassa pidettäviä tietoja. Sisäisillä ohjeilla ei voi poiketa laista. Toimenpide: käsitys.","tekstityyppi":"tiivistelmä","lopputulos":"Käsitys: hyvinvointialue menetteli virheellisesti.","selko":"Omainen teki muistutuksen kuolleen äitinsä hoidosta. Hyvinvointialue vastasi vain, että asia on käsitelty, koska tiedot ovat salaisia. Oikeusasiamiehen mukaan vastaus ei riittänyt. Vastaus pitää perustella, ja yleensä voidaan kertoa ainakin, miten asia selvitettiin ja mitä sen vuoksi tehtiin.","lahde":"https://oikeusasiamies.fi/-/hyvinvointialueen-antama-vastaus-muistutukseen-ei-tayttanyt-lain-velvoitteita","aiheet":["sote","hallinto"],"elin_sv":"Biträdande justitieombudsmannen","elin_en":"Deputy Parliamentary Ombudsman","otsikko_sv":"SVAR PÅ ANMÄRKNING VAR BRISTFÄLLIGT","otsikko_en":"REPLY TO OBJECTION WAS INADEQUATE","asiasanat_sv":"Anmärkning – Motiveringsskyldighet – Sekretess – Patientlagen – Klientlagen inom socialvården – Välfärdsområde","asiasanat_en":"Objection – Duty to state reasons – Confidentiality – Patients' Rights Act – Social Welfare Clients' Rights Act – Wellbeing services county","teksti_sv":"En anhörig lämnade in en anmärkning i ett ärende som gällde vården av hans eller hennes avlidna mor. Välfärdsområdet Vanda och Kervo svarade att ärendet hade behandlats internt och att något svar inte kunde ges på grund av sekretessbelagda uppgifter. Biträdande justitieombudsman Lindroos-Hovinheimo ansåg att välfärdsområdet hade förfarit felaktigt. Ett meddelande om enbart intern behandling uppfyller inte kravet i patientlagen och klientlagen inom socialvården på ett motiverat svar. Uppgifter om hur ärendet har utretts och vilka åtgärder som har vidtagits torde i regel kunna lämnas utan sekretessbelagda uppgifter. Interna anvisningar kan inte avvika från lagen. Åtgärd: uppfattning.","selko_sv":"En anhörig lämnade in en anmärkning om vården av sin avlidna mor. Välfärdsområdet svarade bara att ärendet hade behandlats, eftersom uppgifterna är hemliga. Enligt justitieombudsmannen räckte svaret inte. Svaret ska motiveras, och i regel kan man åtminstone berätta hur ärendet utreddes och vad som gjordes på grund av det.","lopputulos_sv":"Uppfattning: välfärdsområdet förfor felaktigt.","teksti_en":"A relative lodged an objection concerning the care of their late mother. The Vantaa and Kerava wellbeing services county replied that the matter had been dealt with internally and that no reply could be given because of confidential information. Deputy Ombudsman Lindroos-Hovinheimo found that the wellbeing services county had acted wrongly. A mere statement that the matter had been handled internally does not meet the requirement of the Patients' Rights Act and the Social Welfare Clients' Rights Act for a reasoned reply. Information on how the matter was investigated and what action was taken can, as a rule, probably be given without confidential information. Internal guidelines cannot depart from the law. Measure: opinion.","selko_en":"A relative made an objection about the care of their late mother. The wellbeing services county only replied that the matter had been dealt with, because the information is confidential. According to the Ombudsman, this reply was not enough. The reply must give reasons, and it is usually possible at least to say how the matter was looked into and what was done as a result.","lopputulos_en":"Opinion: the wellbeing services county acted wrongly.","lisatty":"2026-10-02T14:48"},{"id":"OKV/1653/10/2026","tunnus":"OKV/1653/10/2026 ym.","elin":"Oikeuskansleri","otsikko":"OKV: STEA-KRITEERIT ONGELMALLISIA","pvm":"2026-09-29","pvm_selite":"ratkaisu","julkaistu":"2026-09-29T10:27","asiasanat":"Valtionavustus – STEA – Avustuskriteerit – Yhdenvertaisuus – Esittelymenettely","teksti":"Oikeuskansleri kiinnitti sosiaali- ja terveysministerin ja ministeriön huomiota vaatimuksiin, jotka valtionavustuslaista ja hallinnon oikeusperiaatteista johtuvat avustuskriteereille ja avustushausta tiedottamiselle. STEA oli kesäkuussa 2026 tiedottanut, ettei jatkoavustusta myönnetä vuonna 2027 muun muassa järjestöille, joiden toiminta keskittyy yhteiskunnalliseen vaikuttamis- tai neuvontatyöhön. Oikeuskanslerin mukaan kriteereistä saattoi saada käsityksen, että tietyt järjestöt suljetaan ulkopuolelle jo ennen hakemusten arviointia. Kaikkia hakemuksia on arvioitava samojen, ennalta ilmoitettujen kriteerien perusteella. Kriteerien suuren merkityksen vuoksi niiden hyväksymisessä olisi ollut perusteltua käyttää esittelymenettelyä ja dokumentoida perusteet.","tekstityyppi":"tiivistelmä","lopputulos":"Käsitys: huomiota kiinnitettiin avustuskriteereihin ja menettelyyn.","selko":"Ministeriö kertoi, ettei tietynlaisille järjestöille myönnetä enää jatkoavustusta. Oikeuskanslerin mukaan tämä saattoi näyttää siltä, että osa järjestöistä suljetaan pois jo etukäteen. Kaikkia hakemuksia on arvioitava samoilla, etukäteen kerrotuilla ehdoilla, ja päätösten perusteet pitää kirjata.","lahde":"https://oikeuskansleri.fi/-/terveyden-ja-sosiaalisen-hyvinvoinnin-edistamiseen-myonnettavien-valtionavustusten-myontamisen-kriteerit","aiheet":["hallinto","sote"],"paino":4,"otsikko_sv":"JK: STEA-KRITERIERNA PROBLEMATISKA","teksti_sv":"Justitiekanslern fäste social- och hälsovårdsministerns och ministeriets uppmärksamhet vid de krav som statsunderstödslagen och rättsprinciperna inom förvaltningen ställer på understödskriterierna och på informationen om ansökan om understöd. STEA hade i juni 2026 meddelat att fortsatt understöd inte beviljas år 2027 bland annat till organisationer vars verksamhet är inriktad på samhällspåverkan eller rådgivning. Enligt justitiekanslern kunde kriterierna ge intrycket att vissa organisationer utesluts redan innan ansökningarna bedöms. Alla ansökningar ska bedömas utifrån samma kriterier som meddelats på förhand. Med tanke på kriteriernas stora betydelse hade det varit motiverat att använda föredragningsförfarande när de godkändes och att dokumentera grunderna.","selko_sv":"Ministeriet meddelade att vissa typer av organisationer inte längre får fortsatt understöd. Enligt justitiekanslern kunde det se ut som om en del organisationer utesluts redan på förhand. Alla ansökningar ska bedömas enligt samma villkor som har meddelats i förväg, och grunderna för besluten ska skrivas ner.","asiasanat_sv":"Statsunderstöd – STEA – Understödskriterier – Likabehandling – Föredragningsförfarande","lopputulos_sv":"Uppfattning: uppmärksamhet fästes vid understödskriterierna och förfarandet.","elin_sv":"Justitiekanslern","otsikko_en":"COJ: STEA CRITERIA PROBLEMATIC","teksti_en":"The Chancellor of Justice drew the attention of the Minister of Social Affairs and Health and the ministry to the requirements that the Act on Discretionary Government Grants and the general principles of administrative law set for grant criteria and for informing about grant calls. In June 2026 STEA had announced that continued grants would not be awarded in 2027 to, among others, organisations focusing on advocacy or advisory work. According to the Chancellor, the criteria could give the impression that certain organisations were being excluded before their applications were even assessed. All applications must be assessed on the same, pre-announced criteria. Given the great significance of the criteria, it would have been justified to adopt them through the presentation procedure and to document the reasons.","selko_en":"The ministry announced that certain kinds of organisations would no longer receive continued grants. According to the Chancellor of Justice this could look as if some organisations were excluded in advance. All applications must be assessed on the same, pre-announced conditions, and the reasons for decisions must be recorded.","asiasanat_en":"Government grant – STEA – Grant criteria – Equality – Presentation procedure","elin_en":"Chancellor of Justice","lopputulos_en":"Opinion: attention was drawn to the grant criteria and the procedure."},{"id":"eoa-tiedote-2026-09-29-kansalaisuus","tunnus":"EOA tiedote 29.9.2026","elin":"Eduskunnan oikeusasiamies","otsikko":"KANSALAISUUSKANTELUITA EI TUTKITA","pvm":"2026-09-29","pvm_selite":"tiedote","julkaistu":"2026-09-29T09:18","asiasanat":"kansalaisuus – käsittelyaika – Maahanmuuttovirasto – kantelu – laillisuusvalvojien työnjako","tekstityyppi":"tiivistelmä","teksti":"Eduskunnan oikeusasiamies ei toistaiseksi ryhdy tutkimaan kanteluita, jotka koskevat kansalaisuushakemusten käsittelyaikoja Maahanmuuttovirastossa. Käsittelyajat ovat jo valtioneuvoston apulaisoikeuskanslerin seurannassa kesäkuun 2027 loppuun asti, ja apulaisoikeuskansleri antaa asiasta myöhemmin erillisen ratkaisun. Oikeusasiamiehellä on lain mukaan harkintavaltaa sen suhteen, mitä kanteluita hän ottaa tutkittavaksi ja mihin toimenpiteisiin kantelu antaa aihetta. Kantelijoille annetaan tämän mukainen vastaus.","selko":"Oikeusasiamies ei toistaiseksi tutki kanteluita siitä, että kansalaisuushakemusten käsittely kestää Maahanmuuttovirastossa kauan. Syynä on se, että apulaisoikeuskansleri seuraa samaa asiaa jo kesäkuuhun 2027 asti ja antaa siitä myöhemmin oman ratkaisunsa.","lahde":"https://oikeusasiamies.fi/-/eduskunnan-oikeusasiamies-ei-toistaiseksi-tutki-kansalaisuushakemusten-kasittelyaikoihin-liittyvia-kanteluita","aiheet":["maahanmuutto","hallinto"],"paino":3,"otsikko_sv":"MEDBORGARSKAPSKLAGOMÅL UTREDS INTE","teksti_sv":"Riksdagens justitieombudsman kommer tills vidare inte att utreda klagomål som gäller handläggningstiderna för medborgarskapsansökningar vid Migrationsverket. Handläggningstiderna följs redan upp av biträdande justitiekanslern i statsrådet fram till slutet av juni 2027, och biträdande justitiekanslern meddelar senare ett separat avgörande i saken. Enligt lag har justitieombudsmannen prövningsrätt när det gäller vilka klagomål som tas upp till utredning och vilka åtgärder ett klagomål ger anledning till. Klagandena får ett svar i enlighet med detta.","selko_sv":"Justitieombudsmannen utreder tills vidare inte klagomål över att det tar lång tid för Migrationsverket att behandla ansökningar om medborgarskap. Orsaken är att biträdande justitiekanslern redan följer samma fråga fram till juni 2027 och senare meddelar ett eget avgörande om den.","asiasanat_sv":"medborgarskap – handläggningstid – Migrationsverket – klagomål – arbetsfördelningen mellan laglighetsövervakarna","elin_sv":"Riksdagens justitieombudsman","otsikko_en":"CITIZENSHIP COMPLAINTS NOT EXAMINED","teksti_en":"The Parliamentary Ombudsman will for the time being not examine complaints about the processing times of citizenship applications at the Finnish Immigration Service. The processing times are already being monitored by the Deputy Chancellor of Justice until the end of June 2027, and the Deputy Chancellor will later issue a separate decision on the matter. By law the Ombudsman has discretion as to which complaints to examine and what action a complaint warrants. Complainants will receive a reply to this effect.","selko_en":"The Ombudsman will for now not examine complaints about long processing times for citizenship applications at the Immigration Service. The reason is that the Deputy Chancellor of Justice is already monitoring the same issue until June 2027 and will issue a decision on it later.","asiasanat_en":"citizenship – processing time – Finnish Immigration Service – complaint – division of work between oversight bodies","elin_en":"Parliamentary Ombudsman"},{"id":"eoa-tiedote-2026-09-28-tekoaly","tunnus":"EOA tiedote 28.9.2026","elin":"Eduskunnan oikeusasiamies","otsikko":"KUNNAN TEKOÄLYN KÄYTTÖ SELVITETÄÄN","pvm":"2026-09-28","pvm_selite":"tiedote","julkaistu":"2026-09-28T08:45","asiasanat":"tekoäly – kunnallinen viranomaistoiminta – hyvä hallinto – virkavastuu – perusoikeudet – oma aloite","tekstityyppi":"tiivistelmä","teksti":"Apulaisoikeusasiamies on ottanut omasta aloitteestaan tutkittavaksi tekoälyn käytön kunnallisessa viranomaistoiminnassa. Taustalla on tiedotusvälineissä kerrottu tapaus, jossa tekoälyn käytöllä korvattiin kunnassa kahden johtajan tehtävät. Selvityksessä tarkastellaan muun muassa, millaisia tehtäviä tekoälylle on annettu, miten päätöksenteon lainmukaisuus ja asianmukainen käsittely turvataan ja miten tekoälyn käyttö vaikuttaa viranomaisen vastuisiin. Oikeusasiamies seuraa myös yleisemmin tekoälyjärjestelmien käyttöönottoa ja niiden vaikutuksia perusoikeuksiin ja hyvään hallintoon.","selko":"Apulaisoikeusasiamies tutkii omasta aloitteestaan, miten tekoälyä käytetään kunnan viranomaistyössä. Syynä on uutisoitu tapaus, jossa tekoäly korvasi kunnassa kahden johtajan tehtävät. Selvityksessä katsotaan esimerkiksi, pysyykö päätöksenteko lainmukaisena ja miten viranomaisen vastuu toteutuu.","lahde":"https://oikeusasiamies.fi/-/apulaisoikeusasiamies-selvittaa-tekoalyn-kayttoa-viranomaistehtavissa","aiheet":["digi","hallinto"],"paino":3,"otsikko_sv":"KOMMUNENS ANVÄNDNING AV AI UTREDS","teksti_sv":"Biträdande justitieombudsmannen har på eget initiativ tagit upp användningen av artificiell intelligens (AI) i kommunal myndighetsverksamhet till undersökning. Bakgrunden är ett fall som rapporterats i medierna, där två chefers uppgifter i en kommun ersattes med AI. I utredningen granskas bland annat vilka uppgifter som har getts till AI, hur beslutsfattandets lagenlighet och en korrekt behandling tryggas och hur användningen av AI påverkar myndighetens ansvar. Justitieombudsmannen följer också mer allmänt införandet av AI-system och deras konsekvenser för de grundläggande fri- och rättigheterna och god förvaltning.","selko_sv":"Biträdande justitieombudsmannen undersöker på eget initiativ hur artificiell intelligens (AI) används i kommunens myndighetsarbete. Orsaken är ett fall i nyheterna där AI ersatte två chefers uppgifter i en kommun. I utredningen granskas till exempel om besluten fattas enligt lag och hur myndighetens ansvar förverkligas.","asiasanat_sv":"artificiell intelligens – kommunal myndighetsverksamhet – god förvaltning – tjänsteansvar – grundläggande fri- och rättigheter – eget initiativ","elin_sv":"Riksdagens justitieombudsman","otsikko_en":"MUNICIPAL AI USE UNDER REVIEW","teksti_en":"The Deputy Parliamentary Ombudsman has on her own initiative taken up the use of artificial intelligence in municipal administration. The background is a case reported in the media in which the use of AI replaced the duties of two managers in a municipality. The review examines, among other things, what tasks have been assigned to AI, how the lawfulness of decision-making and proper handling are ensured, and how the use of AI affects the authority's responsibilities. The Ombudsman is also monitoring more generally the deployment of AI systems and their effects on fundamental rights and good administration.","selko_en":"The Deputy Ombudsman is investigating on her own initiative how AI is used in a municipality's administration. The reason is a reported case in which AI replaced the duties of two managers. The review looks, for example, at whether decision-making remains lawful and how the authority's responsibility is ensured.","asiasanat_en":"artificial intelligence – municipal administration – good administration – official liability – fundamental rights – own initiative","elin_en":"Parliamentary Ombudsman"},{"id":"OKV/678/10/2026","tunnus":"OKV/678/10/2026 ym.","elin":"Oikeuskansleri","otsikko":"AVUSTUSPÄÄTÖKSET OLI PERUSTELTAVA","pvm":"2026-09-24","pvm_selite":"ratkaisu","asiasanat":"Valtionavustus – Nuorisojärjestöt – Päätöksen perusteleminen – Hallintolaki","teksti":"Oikeuskansleri Janne Salminen katsoi, että ministerin päätökset myöntää valtionavustusta valtakunnallisille nuorisojärjestöille oli perusteltu puutteellisesti hallintolain vaatimuksiin nähden. Päätöksissä kuvattiin lähinnä yleisesti lain edellytyksiä, mutta ei sitä, miten järjestöjen toiminta täytti nuorisolain vaatimukset. Perustelujen merkitys korostui, koska päätökset poikkesivat avustuksia arvioivan toimielimen esityksistä ja aiemmasta käytännöstä.","tekstityyppi":"tiivistelmä","lahde":"https://oikeuskansleri.fi/-/nuorisojarjestoille-myonnetyt-valtionavustukset","selko":"Ministeri myönsi rahaa nuorisojärjestöille, mutta ei kertonut riittävästi, miksi järjestöt täyttivät lain ehdot. Oikeuskanslerin mukaan päätökset piti perustella paremmin, varsinkin koska ne poikkesivat aiemmasta tavasta.","aiheet":["hallinto"],"julkaistu":"2026-09-24T10:50","paino":3,"otsikko_sv":"UNDERSTÖDSBESLUTEN SKULLE MOTIVERAS","teksti_sv":"Justitiekansler Janne Salminen ansåg att ministerns beslut att bevilja statsunderstöd till riksomfattande ungdomsorganisationer hade motiverats bristfälligt med hänsyn till kraven i förvaltningslagen. I besluten beskrevs främst lagens förutsättningar i allmänna ordalag, men inte hur organisationernas verksamhet uppfyllde kraven i ungdomslagen. Motiveringens betydelse var särskilt stor eftersom besluten avvek från förslagen från det organ som bedömer understöden och från tidigare praxis.","selko_sv":"Ministern beviljade pengar till ungdomsorganisationer men förklarade inte tillräckligt varför organisationerna uppfyllde lagens villkor. Enligt justitiekanslern borde skälen till besluten ha förklarats bättre, särskilt eftersom besluten avvek från hur man hade gjort tidigare.","asiasanat_sv":"Statsunderstöd – Ungdomsorganisationer – Motivering av beslut – Förvaltningslagen","elin_sv":"Justitiekanslern","otsikko_en":"GRANT DECISIONS NEEDED REASONS","teksti_en":"Chancellor of Justice Janne Salminen held that the minister's decisions to award government grants to national youth organisations were inadequately reasoned in view of the requirements of the Administrative Procedure Act. The decisions mainly described the statutory conditions in general terms, but not how the organisations' activities met the requirements of the Youth Act. Reasons were especially important because the decisions departed from the proposals of the body assessing the grants and from earlier practice.","selko_en":"The minister awarded money to youth organisations but did not explain sufficiently why they met the legal conditions. According to the Chancellor of Justice the decisions needed better reasons, especially because they departed from earlier practice.","asiasanat_en":"Government grant – Youth organisations – Reasoning of decisions – Administrative Procedure Act","elin_en":"Chancellor of Justice"},{"id":"eoa-2921-2025","tunnus":"EOAK 2921/2025","elin":"Apulaisoikeusasiamies","otsikko":"KOMPOSTITARKASTUKSET JA YKSITYISYYS","pvm":"2026-09-18","pvm_selite":"ratkaisu","asiasanat":"Ympäristöasiat – Toimivalta – Tarkastukset – Yksityisyyden suoja","teksti":"Apulaisoikeusasiamies Lindroos-Hovinheimo arvioi viranomaisten toimivaltaa tehdä kompostitarkastuksia sekä yksityisyyden suojaa tarkastusten yhteydessä. Toimenpide: esitys.","tekstityyppi":"tiedotteen mukaan","lahde":"https://oikeusasiamies.fi/-/toimivalta-suorittaa-kompostitarkastuksia-seka-yksityisyyden-suoja-kompostitarkastusten-yhteydessa","selko":"Oikeusasiamies selvitti, saavatko viranomaiset tarkastaa ihmisten kompostoreita ja miten yksityisyys on silloin suojattava. Hän teki asiasta esityksen.","aiheet":["ymparisto","hallinto"],"julkaistu":"2026-09-24","paino":2,"otsikko_sv":"KOMPOSTINSPEKTIONER OCH PRIVATLIV","teksti_sv":"Biträdande justitieombudsman Lindroos-Hovinheimo bedömde myndigheternas behörighet att göra kompostinspektioner och skyddet för privatlivet i samband med inspektionerna. Åtgärd: framställning.","selko_sv":"Justitieombudsmannen utredde om myndigheterna får inspektera människors komposter och hur privatlivet då ska skyddas. Justitieombudsmannen gjorde en framställning, alltså ett förslag, i saken.","asiasanat_sv":"Miljöärenden – Behörighet – Inspektioner – Skydd för privatlivet","elin_sv":"Biträdande justitieombudsmannen","otsikko_en":"COMPOST INSPECTIONS AND PRIVACY","teksti_en":"Deputy Ombudsman Lindroos-Hovinheimo assessed the authorities' powers to inspect composters and the protection of privacy in connection with the inspections. Action: proposal.","selko_en":"The Ombudsman examined whether authorities may inspect people's composters and how privacy must then be protected. She made a proposal on the matter.","asiasanat_en":"Environmental matters – Powers – Inspections – Protection of privacy","elin_en":"Deputy Parliamentary Ombudsman"},{"id":"eoa-7769-2025","tunnus":"EOAK 7769/2025","elin":"Apulaisoikeusasiamies","otsikko":"TYÖVUOROTIEDOT EIVÄT OLE SALAISIA","pvm":"2026-09-03","pvm_selite":"ratkaisu","asiasanat":"Tietopyyntö – Hyvinvointialue – Käsittelyaika – Salassapito – Työvuorot","teksti":"Kantelija pyysi Pirkanmaan hyvinvointialueelta tietoja siitä, keitä hoitajia hänen kotiinsa oli vuosina 2020–2025 merkitty työvuoroihin. Apulaisoikeusasiamies Lindroos-Hovinheimo katsoi, että tietopyynnön käsittely viivästyi lakisääteisistä määräajoista, täydennystä pyydettiin asioista, jotka olivat jo pyynnöstä selvät, ja pyyntöä arvioitiin väärän säännöksen perusteella. Työntekijöiden työvuoroja koskevat tiedot eivät ole lain mukaan salassa pidettäviä. Toimenpide: käsitys.","tekstityyppi":"tiivistelmä","lahde":"https://oikeusasiamies.fi/-/oikeus-saada-henkilotietoja-hyvinvointialueelta","selko":"Asiakas kysyi hyvinvointialueelta, ketkä hoitajat olivat käyneet hänen kotonaan. Pyyntö käsiteltiin liian hitaasti ja väärällä tavalla. Oikeusasiamiehen mukaan hoitajien työvuorot eivät ole salaisia tietoja.","aiheet":["tietosuoja","sote","hallinto"],"julkaistu":"2026-09-23T17:55","paino":2,"otsikko_sv":"ARBETSSKIFTEN ÄR INTE HEMLIGA","teksti_sv":"Klaganden begärde uppgifter av Birkalands välfärdsområde om vilka vårdare som åren 2020–2025 hade förts in i arbetsskiften för besök i klagandens hem. Biträdande justitieombudsman Lindroos-Hovinheimo ansåg att behandlingen av informationsbegäran hade fördröjts i förhållande till de lagstadgade tidsfristerna, att komplettering hade begärts i frågor som redan framgick av begäran och att begäran hade bedömts utifrån fel bestämmelse. Uppgifter om arbetstagarnas arbetsskift är enligt lag inte sekretessbelagda. Åtgärd: uppfattning.","selko_sv":"En klient frågade välfärdsområdet vilka vårdare som hade besökt klientens hem. Begäran behandlades för långsamt och på fel sätt. Enligt justitieombudsmannen är vårdarnas arbetsskift inte hemliga uppgifter.","asiasanat_sv":"Informationsbegäran – Välfärdsområde – Handläggningstid – Sekretess – Arbetsskift","elin_sv":"Biträdande justitieombudsmannen","otsikko_en":"SHIFT DATA IS NOT SECRET","teksti_en":"The complainant asked the Pirkanmaa wellbeing services county which carers had been rostered to visit his home in 2020–2025. Deputy Ombudsman Lindroos-Hovinheimo found that the request was handled beyond the statutory time limits, that clarification was asked on matters already clear from the request, and that the request was assessed under the wrong provision. Under the law, information on employees' work shifts is not secret. Action: opinion.","selko_en":"A client asked the wellbeing services county which carers had visited his home. The request was handled too slowly and in the wrong way. According to the Ombudsman, carers' work shifts are not secret information.","asiasanat_en":"Information request – Wellbeing services county – Processing time – Secrecy – Work shifts","elin_en":"Deputy Parliamentary Ombudsman"},{"id":"eoa-5562-2025","tunnus":"EOAK 5562/2025","elin":"Apulaisoikeusasiamies","otsikko":"VANGIN SITOMINEN OLI VIRHEELLISTÄ","pvm":"2026-09-10","pvm_selite":"ratkaisu","asiasanat":"Vankeinhoito – Sitominen – Käsiraudat – Vankeuslaki – Välttämättömyys","teksti":"Kantelun mukaan vanki oli sidottu käsiraudoilla 14 kertaa heinäkuussa 2025 muun muassa ulkoilun, puhelun ja siivouksen yhteydessä. Apulaisoikeusasiamies Sarja katsoi, ettei sitomisten välttämättömyydelle ollut esitetty vankeuslain edellyttämiä riittäviä konkreettisia tosiasiaperusteita, joten vankia oli sidottu virheellisesti. Päätös saatettiin Riihimäen vankilan tietoon. Toimenpide: käsitys.","tekstityyppi":"tiivistelmä","lahde":"https://oikeusasiamies.fi/-/vankilan-virheellinen-toiminta-vankia-sidottaessa","selko":"Vanki sidottiin käsiraudoilla monta kertaa esimerkiksi ulkoilun ajaksi. Oikeusasiamiehen mukaan vankila ei osoittanut, että sitominen oli välttämätöntä. Siksi vankila toimi väärin.","aiheet":["rikos","ihmisoikeudet"],"julkaistu":"2026-09-23T14:55","paino":3,"otsikko_sv":"HANDFÄNGSEL PÅ FÅNGE VAR FELAKTIGT","teksti_sv":"Enligt klagomålet hade en fånge belagts med handfängsel 14 gånger i juli 2025, bland annat i samband med utevistelse, telefonsamtal och städning. Biträdande justitieombudsman Sarja ansåg att inga sådana tillräckliga konkreta faktiska grunder som fängelselagen förutsätter hade lagts fram för att fängslingen var nödvändig, och fången hade således belagts med fängsel felaktigt. Beslutet delgavs Riihimäki fängelse. Åtgärd: uppfattning.","selko_sv":"En fånge belades med handfängsel många gånger, till exempel under utevistelsen. Enligt justitieombudsmannen visade fängelset inte att det var nödvändigt. Därför handlade fängelset fel.","asiasanat_sv":"Fångvård – Fängsel – Handfängsel – Fängelselagen – Nödvändighet","elin_sv":"Biträdande justitieombudsmannen","otsikko_en":"PRISONER WAS WRONGLY RESTRAINED","teksti_en":"According to the complaint, a prisoner had been handcuffed 14 times in July 2025, including during outdoor exercise, phone calls and cleaning. Deputy Ombudsman Sarja found that no sufficient concrete factual grounds, as required by the Imprisonment Act, had been presented for the necessity of the restraints, so the prisoner had been restrained wrongly. The decision was brought to the attention of Riihimäki Prison. Action: opinion.","selko_en":"A prisoner was handcuffed many times, for example during outdoor exercise. According to the Ombudsman the prison did not show that the restraint was necessary. The prison therefore acted wrongly.","asiasanat_en":"Prison administration – Restraint – Handcuffs – Imprisonment Act – Necessity","elin_en":"Deputy Parliamentary Ombudsman"},{"id":"eoa-3844-2025","tunnus":"EOAK 3844/2025","elin":"Oikeusasiamies","otsikko":"RUOTSINKIELINEN VERKKOSISÄLTÖ, EOA","pvm":"2026-09-15","pvm_selite":"ratkaisu","asiasanat":"Kielelliset oikeudet – Viranomaisen verkkosivut – Tilastokeskus","teksti":"Tilastokeskuksen verkkosivuston ruotsinkielinen sisältö.","tekstityyppi":"nimike","lahde":"https://oikeusasiamies.fi/-/tilastokeskuksen-verkkosivuston-ruotsinkielinen-sisalto","selko":"Ratkaisu koskee sitä, onko Tilastokeskuksen verkkosivuilla riittävästi tietoa ruotsiksi. Lue lopputulos ratkaisusta.","aiheet":["hallinto","ihmisoikeudet"],"julkaistu":"2026-09-15","paino":2,"otsikko_sv":"SVENSKT WEBBINNEHÅLL, JO","teksti_sv":"Det svenskspråkiga innehållet på Statistikcentralens webbplats.","selko_sv":"Avgörandet gäller om det finns tillräckligt med information på svenska på Statistikcentralens webbplats. Läs utgången i avgörandet.","asiasanat_sv":"Språkliga rättigheter – Myndighetens webbplats – Statistikcentralen","elin_sv":"Justitieombudsmannen","otsikko_en":"SWEDISH WEB CONTENT, OMBUDSMAN","teksti_en":"Swedish-language content of the Statistics Finland website.","selko_en":"The decision concerns whether Statistics Finland's website has enough information in Swedish. Read the outcome in the decision.","asiasanat_en":"Linguistic rights – Authority's website – Statistics Finland","elin_en":"Parliamentary Ombudsman"}],"muut":[{"id":"MAO:461/2026","tunnus":"MAO:461/2026","elin":"Markkinaoikeus","otsikko":"TARJOAJAN SULKEMINEN HYVÄKSYTTIIN","pvm":"2026-09-24","pvm_selite":"annettu","julkaistu":"2026-09-29T09:28","asiasanat":"Julkinen hankinta – Tarjoajan sulkeminen tarjouskilpailusta","teksti":"Metsähallitus Metsätalous Oy:n maanmuokkaus-, kunnostusojitus- ja ennallistamispalvelujen hankinnassa yksityinen elinkeinonharjoittaja jätti tarjouksen sähköisessä järjestelmässä kirjautuneena osakeyhtiön tunnuksilla, joten tarjouksen lähettäjäksi merkittiin yhtiö. Hankintayksikkö sulki yhtiön tarjouskilpailusta, koska tarjouksesta puuttui yhtiön ESPD-lomake eikä yhtiö täyttänyt luottoluokitusvaatimusta. Markkinaoikeuden mukaan hankintayksikkö sai luottaa siihen, että tarjoaja oli se taho, jonka tunnuksilla tarjous jätettiin. Tarjoaja vastaa tarjouksensa sisällöstä, eikä järjestelmässä ollut toimintavirhettä. Sulkeminen ei ollut hankintasäännösten vastaista. Valitus hylättiin, ja valittaja velvoitettiin korvaamaan hankintayksikön oikeudenkäyntikulut 1 200 eurolla.","tekstityyppi":"tiivistelmä","selko":"Yrittäjä jätti tarjouksen sähköisessä järjestelmässä toisen yrityksen tunnuksilla, joten hankkija piti tarjoajana tuota yritystä. Yritykseltä puuttui vaadittu lomake, eikä se täyttänyt luottoluokitusvaatimusta, joten tarjous suljettiin pois. Markkinaoikeuden mukaan tämä oli sallittua, koska tarjoaja vastaa tarjouksensa tiedoista. Valitus hylättiin.","lahde":"https://www.markkinaoikeus.fi/ratkaisut/ratkaisujen-arkisto/mao461-2026/","aiheet":["hallinto","kilpailu"],"paino":2,"lopputulos":"Valitus hylättiin.","otsikko_sv":"UTESLUTNING AV ANBUDSGIVARE GODKÄND","teksti_sv":"I Metsähallitus Metsätalous Oy:s upphandling av markberednings-, iståndsättningsdiknings- och restaureringstjänster lämnade en enskild näringsidkare ett anbud i det elektroniska systemet inloggad med ett aktiebolags användarnamn, varför bolaget antecknades som avsändare. Den upphandlande enheten uteslöt bolaget, eftersom bolagets ESPD-formulär saknades och bolaget inte uppfyllde kravet på kreditvärdighet. Enligt marknadsdomstolen fick den upphandlande enheten lita på att anbudsgivaren var den vars användarnamn anbudet lämnats med. Anbudsgivaren ansvarar för anbudets innehåll, och det fanns inget funktionsfel i systemet. Uteslutningen stred inte mot upphandlingsbestämmelserna. Besväret avslogs och klaganden ålades att ersätta den upphandlande enhetens rättegångskostnader med 1 200 euro.","selko_sv":"En företagare lämnade ett anbud i det elektroniska systemet med ett annat företags användarnamn, så upphandlaren betraktade det företaget som anbudsgivare. Företaget saknade en blankett som krävdes och uppfyllde inte kravet på kreditvärdighet, så anbudet uteslöts. Enligt marknadsdomstolen var detta tillåtet, eftersom anbudsgivaren ansvarar för uppgifter

# LAKI-TV: julkaisee sivuston GitHub Pagesiin aina, kun päivitysajo on työntänyt uuden sisällön (source/, data.json)
# tai sivuston rakennus muuttuu. Pages-asetuksissa lähteeksi valitaan "GitHub Actions".
name: pages
on:
  push:
    branches: [main]
    paths: ["source/**", "data.json", "assets/**", "tools/website.py", "tools/assets.py", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - id: pages
        uses: actions/configure-pages@v5
      - name: Rakenna sivusto
        env:
          LAKITV_DOMAIN: ${{ vars.LAKITV_DOMAIN }}
        run: python3 tools/website.py --from-dir source --out site --base "${{ steps.pages.outputs.base_url }}/"
      - name: Päivitä jakokuva (sivu 100 tänään)
        continue-on-error: true
        run: |
          pip install -q playwright==1.47.0
          playwright install --with-deps chromium >/dev/null
          python3 tools/assets.py --page site/index.html --out site --og-only
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

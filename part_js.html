/* Kokoaa meta-rivin osista niin, että se mahtuu leveyteen: osa voi olla [pitkä, lyhyt, …]; mahtumaton jätetään pois. */
function fitMeta(parts, width) {
  let out = "";
  for (const p of parts) {
    const alts = (Array.isArray(p) ? p : [p]).filter(Boolean);
    for (const a of alts) {
      const cand = out ? `${out} · ${a}` : String(a);
      if (chars(cand).length <= width) { out = cand; break; }
    }
  }
  return out;
}

function compose(topFn, body, bottom, ft, label, extra) {
  const topLen = topFn(1, 1).length;
  const avail = 23 - topLen - bottom.length;
  const chunks = [];
  let cur = [];
  for (const r of body) {
    if (r.pageBreak) { if (cur.length) { chunks.push(cur); cur = []; } continue; }
    if (cur.length === 0 && r.blankLine) continue;
    cur.push(r);
    if (cur.length === avail) {
      const carry = [];
      while (cur.length > 1 && cur[cur.length - 1].keepNext) carry.unshift(cur.pop());
      while (cur.length > 1 && cur[cur.length - 1].blankLine) cur.pop();
      chunks.push(cur); cur = carry;
    }
  }
  while (cur.length && cur[cur.length - 1].blankLine) cur.pop();
  if (cur.length || !chunks.length) chunks.push(cur);
  const n = chunks.length;
  const subs = chunks.map((ch, i) => {
    const rows = [...topFn(i + 1, n), ...ch];
    while (rows.length < 23 - bottom.length) rows.push(blank());
    return [...rows, ...bottom];
  });
  return Object.assign({subs, ft, label}, extra || {});
}

function buildChannel(ch, ci) {
  const items = channelItems(ch);

  const vis = items.map((it, i) => ({it, page: ch.page + i + 1})).filter(x => matches(x.it));
  let body;
  if (vis.length) {
    body = listRows(vis.map(x => ({page:x.page, title:tx(x.it, "otsikko"), meta:metaFor(ch, x.it, isFresh(x.it) ? 30 : 34), uusi:isFresh(x.it)})));

  } else if (items.length) {

      `No items in the selected topics (${filterNames()}). Remove the filter with the TOPICS key or see page 110.`), ci);
  } else {
    body = emptyArt(S("Kanavalla ei ole juuri nyt uusia juttuja. LAKI-TV päivittyy aamulla ja iltapäivällä.",
      "Kanalen har inga nya nyheter just nu. LAKI-TV uppdateras på morgonen och eftermiddagen."), ci);
  }
  const bot = blank();
  if (filterOn()) { put(bot, 1, trunc("◆ " + filterNames(), 30), "m"); putR(bot, 38, "110", "y", null, {p:110}); }
  else put(bot, 1, trunc(ch.note, 38), "g");
  const prev = CHANNELS[(ci + CHANNELS.length - 1) % CHANNELS.length];
  const next = CHANNELS[(ci + 1) % CHANNELS.length];
  const ft = [
    {t:`${prev.short} ${prev.page}`, p:prev.page},
    {t:`${next.short} ${next.page}`, p:next.page},
    vis.length ? {t:`${S("Uusin", "Nyast")} ${vis[0].page}`, p:vis[0].page} : {t:S("Lista 190", "Lista 190"), p:190},
    {t:S("Etusivu", "Start"), p:100}
  ];
  pages.set(ch.page, compose(top, body, [bot], ft, `${ch.short} ${ch.name.toLowerCase()}`));
  items.forEach((it, i) => {
    const num = ch.page + i + 1;
    itemPage.set(it.id, num);
    itemIndex.set(num, {ch, it});
  });
}

const KAL = new Map();

const icsEsc = s => String(s || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
function icsText(evs) {

function kalLinks(e) {

function frontHeads(o = {}) {
  const boost = new Map(o.boost === false ? [] : (DATA.etusivu || []).filter(h => h.ref).map(h => [h.ref, h]));
  const c = (o.items || allItems()).filter(x => matches(x.it)).map(x => {

    return {x, f, score, fe: f + (score <= 2 ? 1 : 0), t: pubEpoch(x.it), title: (b && tx(b, "otsikko")) || tx(x.it, "otsikko")};
  }).filter(q => q.f <= 3);
  c.sort((a, b) => a.fe - b.fe || b.score - a.score || b.t - a.t);
  const lead = c.filter(q => q.f === 0).sort((a, b) => b.score - a.score || b.t - a.t)[0] || c[0];
  const rest = c.filter(q => q !== lead);
  const heads = lead ? [{otsikko:lead.title, ...target(lead.x)}] : [];
  const today = todayISO(), end = addDays(today, 14);
  const when = dte => dte === today ? S("TÄNÄÄN", "I DAG") : dte === addDays(today, 1) ? S("HUOMENNA", "I MORGON") : `${wdOf(dte).toUpperCase()} ${fmtDate(dte, true)}`;
  const vt = (o.vt || DATA.voimaantulot || []).filter(v => v.pvm >= today && v.pvm <= end && matches(v)).sort((a, b) => a.pvm.localeCompare(b.pvm));
  if (vt.length) {

    heads.push({otsikko:S(`${when(dte)} VOIMAAN ${n} ${n === 1 ? "LAKI" : "LAKIA"}`, `${when(dte)} ${n} ${n === 1 ? "LAG" : "LAGAR"} I KRAFT`, `${when(dte)} ${n} ${n === 1 ? "ACT ENTERS" : "ACTS ENTER"} INTO FORCE`), p:800});
  }
  const eu = (DATA.eu_voimaantulot || []).filter(v => v.pvm >= today && v.pvm <= end && matches(v)).sort((a, b) => a.pvm.localeCompare(b.pvm));
  rest.slice(0, Math.max(0, 8 - heads.length - (eu.length ? 1 : 0))).forEach(q => heads.push({otsikko:q.title, ...target(q.x)}));
  if (eu.length) {

  }

function applyStatic() {
  document.querySelectorAll("[data-sv]").forEach(el => { if (el.dataset.fi == null) el.dataset.fi = el.textContent; el.textContent = el.dataset[LANG] ?? el.dataset.fi; });
  for (const [attr, K] of [["title", "Title"], ["aria-label", "Aria"], ["placeholder", "Ph"]]) {
    document.querySelectorAll(`[data-sv-${K.toLowerCase()}]`).forEach(el => {
      if (el.dataset["fi" + K] == null) el.dataset["fi" + K] = el.getAttribute(attr) || "";
      el.setAttribute(attr, el.dataset[LANG + K] ?? el.dataset["fi" + K]);
    });
  }
  document.documentElement.lang = LANG;
  for (const [id, l] of [["kFi", "fi"], ["kSv", "sv"], ["kEn", "en"], ["bFi", "fi"], ["bSv", "sv"], ["bEn", "en"]]) { const b = document.getElementById(id); b.classList.toggle("on", LANG === l); b.setAttribute("aria-pressed", String(LANG === l)); }
}
function setLang(l) {
  const nl = LANGS.includes(l) ? l : "fi";
  if (nl === LANG) return;
  LANG = nl; store.set("lang", LANG);
  applyLangData(); applyStatic();
  rebuild();
  if (panel.open) {
    renderPanelList(); renderPanelTopics();
    if (!paneSearch.hidden) runSearch();
    if (!paneKal.hidden) renderKal();
  }
}

const kbd = document.getElementById("kbd"), bKbd = document.getElementById("bKbd");
function setKbd(open, focus = true) {
  kbd.classList.toggle("open", open); kbd.inert = !open;
  document.body.classList.toggle("kbd-open", open);
  bKbd.setAttribute("aria-expanded", String(open));
  store.set("kbd", open ? "1" : "");

}

document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (panel.open) return;
  const tg = e.target;
  if (tg && (tg.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName))) return;
  const k = e.key;
  let handled = true;
  if (/^[0-9]$/.test(k)) typeDigit(k);
  else if (k === "ArrowUp" || k === "PageUp" || k === "+") step(1);
  else if (k === "ArrowDown" || k === "PageDown" || k === "-") step(-1);
  else if (k === "ArrowRight") subStep(1);
  else if (k === "ArrowLeft") subStep(-1);
  else if (k === "Backspace") back();
  else if (k === "r" || k === "R" || k === "F1") fast(0);
  else if (k === "g" || k === "G" || k === "F2") fast(1);
  else if (k === "y" || k === "Y" || k === "F3") fast(2);
  else if (k === "b" || k === "B" || k === "F4") fast(3);
  else if (k === "c" || k === "C") setCaps(!state.caps);
  else if (k === "l" || k === "L") openPanel("list");
  else if (k === "a" || k === "A") openPanel("topics");
  else if (k === "/" || k === "f" || k === "F") openPanel("search");
  else if (k === "?") { blink(); setReveal(!state.reveal); }
  else if (k === "i" || k === "I" || k === "Home") { blink(); go(100); }
  else if (k === "o" || k === "O") { blink(); go(199); }
  else if (k === "k" || k === "K") setKbd(!kbd.classList.contains("open"));
  else if (k === "Escape" && kbd.classList.contains("open")) setKbd(false);
  else handled = false;
  if (handled) e.preventDefault();
});
/* #p201 = sivunumero; #j=KKO%3A2026%3A72 = juttu tunnuksella (myös arkistossa); #d=2026-09-29 = kalenterin päivä */
function pageFromHash(hs) {
  let m = /^#p?(\d{3})$/.exec(hs || "");
  if (m) return +m[1] >= 100 && +m[1] <= 899 ? {n:+m[1]} : null;
  m = /^#d=(\d{4}-\d{2}-\d{2})$/.exec(hs || "");
  if (m) return validDay(m[1]) ? {n:104, day:m[1]} : {n:104};   // olematon päivä: kalenteri tälle päivälle
  m = /^#j=(.+)$/.exec(hs || "");
  if (m) {
    let id; try { id = decodeURIComponent(m[1]); } catch (e) { return null; }
    const p = itemPage.get(id);
    if (p) return {n:p};
    if ((DATA.arkisto || []).some(a => a.id === id)) return {n:105, ai:id};
  }
  return null;
}
window.addEventListener("hashchange", () => {
  const p = pageFromHash(location.hash);
  if (p && !(p.n === state.current && (!p.day || p.day === state.day) && (!p.ai || p.ai === state.arch))) go(p.n, false, p);
});

/* Kosketus: vaakapyyhkäisy = alasivu (tai sivu) */
let touch = null;
screenEl.addEventListener("touchstart", e => {
  const t = e.changedTouches[0]; touch = {x:t.clientX, y:t.clientY, at:Date.now()};
}, {passive:true});
screenEl.addEventListener("touchend", e => {
  if (!touch) return;
  const t = e.changedTouches[0], dx = t.clientX - touch.x, dy = t.clientY - touch.y;
  const quick = Date.now() - touch.at < 700; touch = null;
  if (quick && Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.4) {
    const dir = dx < 0 ? 1 : -1;
    if (!subStep(dir)) step(dir);
  }
}, {passive:true});
/* Kello ja vuorokauden vaihtuminen. Alasivut eivät vaihdu itsestään: lukija selaa niitä ◀ ▶ -näppäimillä. */
let builtDay = todayISO(), builtHour = Math.floor(Date.now() / 36e5);
function tick() {
  const d = todayISO(), hr = Math.floor(Date.now() / 36e5);
  if (d !== builtDay || hr !== builtHour) { builtDay = d; builtHour = hr; buildAll(); page = getPage(state.current) || fillerPage(state.current); state.sub = Math.min(state.sub, page.subs.length - 1); paintPage(); }
  paintHeader();
}
setInterval(() => { if (!document.hidden) tick(); }, 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });

/* ---------------- Mitoitus ---------------- */
const tv = document.getElementById("tv");
function fit() {
  const vw = document.documentElement.clientWidth, vh = window.innerHeight;
  const narrow = vw < 600;
  const sx = narrow ? 1 : 1.2;
  const padX = narrow ? .55 : 1.1, padY = narrow ? .6 : .9;
  document.documentElement.style.setProperty("--sx", sx);
  tv.style.padding = `${padY}em ${padX}em`;
  const side = document.body.classList.contains("kbd-open") && vw >= 960 ? 306 : 0;
  const ctrl = document.getElementById("ctrl"), ch = ctrl ? ctrl.offsetHeight : 120;
  const availW = vw - 32 - 22 - side;
  const availH = Math.max(vh - 36 - 14 - 22 - ch, 260);
  const fs = Math.floor(Math.max(8, Math.min(availW / (24 * sx + 2 * padX), availH / (25 + 2 * padY), 44)));
  tv.style.fontSize = fs + "px";
  /* Mitataan todellinen rivinleveys, jotta 40 merkkiä täyttää ruudun tarkasti */
  const w = rowsEl.offsetWidth;
  document.documentElement.style.setProperty("--kx", w ? (24 * sx * fs / w).toFixed(5) : String(sx));
  document.documentElement.style.setProperty("--tvw", tv.offsetWidth + "px");
  if (ctrl && ctrl.offsetHeight !== ch && !fit.again) { fit.again = true; fit(); fit.again = false; }
}
let fitRaf = 0;
window.addEventListener("resize", () => { cancelAnimationFrame(fitRaf); fitRaf = requestAnimationFrame(fit); });

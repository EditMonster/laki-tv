na i sitt anbud. Besväret avslogs.","asiasanat_sv":"Offentlig upphandling – Uteslutning av anbudsgivare från anbudsförfarandet","lopputulos_sv":"Besväret avslogs.","elin_sv":"Marknadsdomstolen","otsikko_en":"EXCLUSION OF TENDERER UPHELD","teksti_en":"In Metsähallitus Metsätalous Oy's procurement of soil preparation, ditch maintenance and restoration services, a private trader submitted a tender in the electronic system while logged in with a limited company's credentials, so the company was recorded as the sender. The contracting entity excluded the company from the competition because the company's ESPD form was missing and the company did not meet the credit rating requirement. According to the Market Court, the contracting entity was entitled to rely on the tenderer being the party whose credentials were used. A tenderer is responsible for the content of its tender, and there was no malfunction in the system. The exclusion did not breach procurement rules. The appeal was dismissed and the appellant ordered to pay the contracting entity's legal costs of 1 200 euros.","selko_en":"An entrepreneur submitted a tender in the electronic system using another company's credentials, so the buyer treated that company as the tenderer. The company lacked a required form and did not meet the credit rating requirement, so the tender was excluded. According to the Market Court this was allowed, because a tenderer is responsible for its tender's details. The appeal was dismissed.","asiasanat_en":"Public procurement – Exclusion of a tenderer from the competition","elin_en":"Market Court","lopputulos_en":"The appeal was dismissed."},{"id":"TT 2026:33","tunnus":"TT 2026:33","elin":"Työtuomioistuin","otsikko":"KESKITUNTIANSIO LASKETTIIN VÄÄRIN","pvm":"2026-09-28","pvm_selite":"annettu","julkaistu":"2026-09-28T15:35","asiasanat":"Keskituntiansio – Palkkasaatavat – Työehtosopimuksen pakottavuus – Vanhentuminen","teksti":"Rakennusliitto ry vaati LVI-alan työnantajaa maksamaan entiselle työntekijälle palkkasaatavia. Yhtiö oli laskenut keskituntiansion paikallisesti sovitun yksikköhintaisen palkkiomallin tuntimäärillä eikä tehtyjen työtuntien perusteella. Työtuomioistuin katsoi liittojen yhteisen kannan mukaisesti, ettei laskennasta voida sopia työehtosopimuksesta poiketen, joten yhtiö oli rikkonut työehtosopimusta. Koska työnantaja oli laiminlyönyt työaikakirjanpidon, näytöllinen epäselvyys luettiin sen vahingoksi ja liiton laskelmat hyväksyttiin. Saatavat, jotka olivat erääntyneet yli viisi vuotta ennen haasteen tiedoksiantoa, olivat vanhentuneet. Yhtiö velvoitettiin maksamaan muut saatavat ja 4 000 euron hyvityssakko työehtosopimuksen tieten rikkomisesta.","tekstityyppi":"tiivistelmä","selko":"Työnantaja laski työntekijän keskituntiansion väärin. Se käytti yrityksessä sovittua mallia, vaikka työehtosopimuksen mukaan laskennan pitää perustua tehtyihin työtunteihin, eikä tästä voi sopia toisin. Työnantaja maksaa puuttuvan palkan lukuun ottamatta yli viisi vuotta vanhoja eriä. Lisäksi se maksaa liitolle 4 000 euron hyvityssakon, koska rikkoi sopimusta tietoisesti.","lahde":"https://www.tyotuomioistuin.fi/ratkaisut/ratkaisujen-arkisto/tt-202633/","aiheet":["tyo"],"paino":3,"lopputulos":"Kanne hyväksyttiin pääosin. Hyvityssakko 4 000 euroa.","otsikko_sv":"TIMFÖRTJÄNSTEN RÄKNADES FEL","teksti_sv":"Rakennusliitto ry krävde att en arbetsgivare inom VVS-branschen skulle betala lönefordringar till en tidigare arbetstagare. Bolaget hade beräknat den genomsnittliga timförtjänsten enligt timantalet i en lokalt avtalad ackordsmodell och inte enligt de faktiska arbetstimmarna. Arbetsdomstolen ansåg i enlighet med förbundens gemensamma ståndpunkt att man inte kan avtala om beräkningen i avvikelse från kollektivavtalet, och bolaget hade därmed brutit mot avtalet. Eftersom arbetsgivaren hade försummat arbetstidsbokföringen, gick den bevismässiga oklarheten arbetsgivaren emot och förbundets beräkningar godtogs. Fordringar som förfallit mer än fem år före delgivningen av stämningen var preskriberade. Bolaget ålades att betala de övriga fordringarna och en plikt på 4 000 euro för medvetet avtalsbrott.","selko_sv":"Arbetsgivaren räknade ut arbetstagarens genomsnittliga timförtjänst fel. Den använde en modell som avtalats i företaget, fast beräkningen enligt kollektivavtalet ska bygga på de faktiska arbetstimmarna och man inte får avtala annat. Arbetsgivaren betalar den lön som saknas, utom poster som är över fem år gamla. Dessutom betalar den en plikt på 4 000 euro till förbundet, eftersom den bröt mot avtalet medvetet.","asiasanat_sv":"Genomsnittlig timförtjänst – Lönefordringar – Kollektivavtalets tvingande verkan – Preskription","lopputulos_sv":"Talan godtogs till största delen. Plikt på 4 000 euro.","elin_sv":"Arbetsdomstolen","otsikko_en":"AVERAGE HOURLY PAY MISCALCULATED","teksti_en":"The Finnish Construction Trade Union demanded that an HVAC employer pay wage claims to a former employee. The company had calculated the average hourly earnings using the hours of a locally agreed unit-price bonus model rather than the hours actually worked. In line with the unions' joint view, the Labour Court held that the calculation cannot be agreed in deviation from the collective agreement, so the company had breached it. As the employer had neglected working-time records, the evidentiary uncertainty was held against it and the union's calculations were accepted. Claims that fell due more than five years before service of the summons were time-barred. The company was ordered to pay the remaining claims and a compensatory fine of 4 000 euros for knowingly breaching the collective agreement.","selko_en":"An employer calculated an employee's average hourly earnings incorrectly. It used a model agreed at the company, although under the collective agreement the calculation must be based on hours worked, and this cannot be agreed otherwise. The employer pays the missing wages except for instalments over five years old. It also pays the union a 4 000 euro compensatory fine for knowingly breaching the agreement.","asiasanat_en":"Average hourly earnings – Wage claims – Mandatory nature of collective agreement – Limitation","elin_en":"Labour Court","lopputulos_en":"The action was largely upheld. Compensatory fine 4 000 euros."},{"id":"TT 2026:32","tunnus":"TT 2026:32","elin":"Työtuomioistuin","otsikko":"PALKKARYHMÄ AMMATTITAIDON MUKAAN","pvm":"2026-09-16","pvm_selite":"annettu","asiasanat":"Lausuntoasia – Palkkaryhmittely – Työehtosopimuksen tulkinta","teksti":"Kyse oli rakennusalan työehtosopimuksen palkkaryhmiä koskevien määräysten tulkinnasta. Työtuomioistuin katsoi, että työehtosopimusta oli tulkittava sopimukseen osallisten liittojen yksimielisen lausuman mukaisesti. Työntekijä sijoitetaan palkkaryhmään ammattitaitonsa perusteella, eikä ammattinimikkeellä ole merkitystä. Ammattitaitoisen työntekijän on oltava vähintään palkkaryhmässä IV.","tekstityyppi":"tiivistelmä","lahde":"https://www.tyotuomioistuin.fi/ratkaisut/ratkaisujen-arkisto/1413/","selko":"Rakennusalalla palkkaryhmä määräytyy sen mukaan, mitä työntekijä osaa, ei ammattinimikkeen mukaan. Ammattitaitoinen työntekijä kuuluu vähintään palkkaryhmään IV.","aiheet":["tyo"],"julkaistu":"2026-09-16","paino":2,"otsikko_sv":"LÖNEGRUPP ENLIGT YRKESKUNNIGHET","teksti_sv":"Frågan gällde tolkningen av bestämmelserna om lönegrupper i byggbranschens kollektivavtal. Arbetsdomstolen ansåg att kollektivavtalet skulle tolkas i enlighet med det enhälliga utlåtandet från de förbund som är parter i avtalet. En arbetstagare placeras i lönegrupp på grundval av sin yrkeskunnighet, och yrkesbeteckningen har ingen betydelse. En yrkeskunnig arbetstagare ska vara minst i lönegrupp IV.","selko_sv":"I byggbranschen bestäms lönegruppen av vad arbetstagaren kan, inte av yrkesbeteckningen. En yrkeskunnig arbetstagare hör minst till lönegrupp IV.","asiasanat_sv":"Utlåtandeärende – Lönegruppering – Tolkning av kollektivavtal","elin_sv":"Arbetsdomstolen","otsikko_en":"PAY GRADE BY SKILL LEVEL","teksti_en":"The case concerned the interpretation of the pay grade provisions of the construction sector collective agreement. The Labour Court held that the agreement was to be interpreted in accordance with the unanimous statement of the unions party to it. An employee is placed in a pay grade on the basis of their skills, and the job title is irrelevant. A skilled worker must be at least in pay grade IV.","selko_en":"In the construction sector the pay grade is determined by what the employee can do, not by the job title. A skilled worker belongs at least to pay grade IV.","asiasanat_en":"Opinion case – Pay grading – Interpretation of collective agreement","elin_en":"Labour Court"},{"id":"TT 2026:31","tunnus":"TT 2026:31","elin":"Työtuomioistuin","otsikko":"SOSIAALITYÖN VAATIVUUSTASO, TT","pvm":"2026-08-19","pvm_selite":"annettu","asiasanat":"Palkkaus – Tehtäväkohtainen palkka – Vaativuuden arviointi – Virka- ja työehtosopimuksen tulkinta – Välituomio","teksti":"Riita koski sitä, oliko kuntayhtymä menetellyt virka- ja työehtosopimuksen vastaisesti arvioidessaan sosiaalityöntekijöiden tehtävän vaativuuden uudelleen. Työtuomioistuin katsoi välituomiollaan, että sopimuksen vastaisesti oli menetelty ja tehtävä kuului vaativuustasolle 2. Kannevaatimukset hyväksyttiin.","tekstityyppi":"tiivistelmä","lahde":"https://www.tyotuomioistuin.fi/ratkaisut/ratkaisujen-arkisto/tt-202631/","selko":"Kuntayhtymä arvioi sosiaalityöntekijöiden tehtävät uudelleen vähemmän vaativiksi. Työtuomioistuimen mukaan se rikkoi sopimusta, ja tehtävät kuuluvat vaativuustasolle 2.","aiheet":["tyo","sote"],"julkaistu":"2026-08-20","paino":2,"otsikko_sv":"SOCIALT ARBETE: KRAVNIVÅN, AD","teksti_sv":"Tvisten gällde om samkommunen hade förfarit i strid med tjänste- och arbetskollektivavtalet när den gjorde en ny bedömning av kravnivån i socialarbetarnas uppgifter. Arbetsdomstolen ansåg genom en mellandom att man hade förfarit i strid med avtalet och att uppgiften hörde till kravnivå 2. Yrkandena i talan godtogs.","selko_sv":"Samkommunen bedömde på nytt att socialarbetarnas uppgifter var mindre krävande. Enligt arbetsdomstolen bröt den mot avtalet, och uppgifterna hör till kravnivå 2.","asiasanat_sv":"Lönesättning – Uppgiftsrelaterad lön – Bedömning av kravnivå – Tolkning av tjänste- och arbetskollektivavtal – Mellandom","elin_sv":"Arbetsdomstolen","otsikko_en":"SOCIAL WORK DEMAND LEVEL, LABOUR CT","teksti_en":"The dispute concerned whether a joint municipal authority had acted contrary to the collective agreement for civil servants and employees when reassessing the demands of social workers' duties. In an interim judgment the Labour Court held that the agreement had been breached and that the duties belonged to demand level 2. The claims were upheld.","selko_en":"A joint municipal authority reassessed social workers' duties as less demanding. According to the Labour Court it breached the agreement, and the duties belong to demand level 2.","asiasanat_en":"Pay – Job-specific pay – Assessment of demands – Interpretation of collective agreement – Interim judgment","elin_en":"Labour Court"},{"id":"TT 2026:30","tunnus":"TT 2026:30","elin":"Työtuomioistuin","otsikko":"HYVITYSSAKKO PALKANMAKSUSTA, TT","pvm":"2026-06-25","pvm_selite":"annettu","asiasanat":"Hyvityssakko – Palkanmaksu – Työ- ja virkaehtosopimuksen rikkominen","teksti":"Hyvityssakko – Palkanmaksu – Työ- ja virkaehtosopimuksen rikkominen.","tekstityyppi":"asiasanat","lahde":"https://www.tyotuomioistuin.fi/ratkaisut/ratkaisujen-arkisto/tt-202630/","selko":"Asia koskee palkanmaksua ja sitä, rikkoiko työnantaja työehtosopimusta niin, että siitä tulee hyvityssakko. Lue lopputulos ratkaisusta.","aiheet":["tyo"],"julkaistu":"2026-06-26","paino":2,"otsikko_sv":"PLIKT FÖR LÖNEBETALNING, AD","teksti_sv":"Plikt – Lönebetalning – Brott mot arbets- och tjänstekollektivavtal.","selko_sv":"Ärendet gäller lönebetalning och om arbetsgivaren bröt mot kollektivavtalet så att den ska betala plikt. Läs utgången i avgörandet.","asiasanat_sv":"Plikt – Lönebetalning – Brott mot arbets- och tjänstekollektivavtal","elin_sv":"Arbetsdomstolen","otsikko_en":"COMPENSATORY FINE FOR WAGES, TT","teksti_en":"Compensatory fine – Payment of wages – Breach of collective agreement.","selko_en":"The case concerns the payment of wages and whether the employer breached the collective agreement in a way that leads to a compensatory fine. Read the outcome in the ruling.","asiasanat_en":"Compensatory fine – Payment of wages – Breach of collective agreement","elin_en":"Labour Court"},{"id":"TT 2026:28","tunnus":"TT 2026:28","elin":"Työtuomioistuin","otsikko":"IRTISANOMISELLE EI OLLUT PERUSTETTA","pvm":"2026-06-24","pvm_selite":"annettu","asiasanat":"Irtisanomissuoja – Päihtymys – Sopimaton käytös – Työsopimuksen irtisanominen – Varoitus","teksti":"Raitiovaununkuljettaja oli vapaa-ajallaan aamuyöllä matkustanut päihtyneenä raitiovaunussa, tullut työnantajan taukotilaan ja käyttäytynyt asiattomasti puhalluttamisen yhteydessä. Hänet irtisanottiin ilman varoitusta. Työtuomioistuin katsoi, ettei irtisanomiselle ollut asiallista ja painavaa syytä: kyse oli kertaluonteisesta vapaa-ajan tapahtumasta, josta ei aiheutunut vahinkoa tai vaaraa, työntekijä ei ollut saanut aiempia varoituksia ja työnantajan ohjeet olivat jääneet epäselviksi.","tekstityyppi":"tiivistelmä","lahde":"https://www.tyotuomioistuin.fi/ratkaisut/ratkaisujen-arkisto/tt-202628/","selko":"Kuljettaja käyttäytyi vapaa-ajallaan humalassa huonosti työpaikan taukotilassa, ja hänet irtisanottiin heti. Työtuomioistuimen mukaan irtisanominen oli liian ankara, koska kyse oli yksittäisestä tapauksesta eikä hän ollut saanut varoitusta.","aiheet":["tyo"],"julkaistu":"2026-06-25","paino":2,"otsikko_sv":"UPPSÄGNINGEN SAKNADE GRUND","teksti_sv":"En spårvagnsförare hade på sin fritid tidigt på morgonen åkt berusad i en spårvagn, kommit till arbetsgivarens pausutrymme och uppträtt osakligt i samband med ett alkotest. Han sades upp utan varning. Arbetsdomstolen ansåg att det inte fanns sakliga och vägande skäl för uppsägningen: det var fråga om en enstaka händelse på fritiden som inte orsakade skada eller fara, arbetstagaren hade inte fått tidigare varningar och arbetsgivarens anvisningar hade förblivit oklara.","selko_sv":"Föraren uppträdde illa berusad på sin fritid i arbetsplatsens pausutrymme och sades upp direkt. Enligt arbetsdomstolen var uppsägningen för sträng, eftersom det var en enstaka händelse och han inte hade fått någon varning.","asiasanat_sv":"Anställningsskydd – Berusning – Olämpligt uppträdande – Uppsägning av arbetsavtal – Varning","elin_sv":"Arbetsdomstolen","otsikko_en":"NO GROUNDS FOR DISMISSAL","teksti_en":"A tram driver had, in his free time in the early hours, travelled drunk on a tram, entered the employer's break room and behaved inappropriately during a breathalyser test. He was dismissed without a warning. The Labour Court held that there was no proper and weighty reason for dismissal: it was a one-off incident in his free time that caused no damage or danger, the employee had received no earlier warnings, and the employer's instructions had remained unclear.","selko_en":"A driver behaved badly while drunk in the workplace break room in his free time and was dismissed immediately. According to the Labour Court the dismissal was too severe, because it was a single incident and he had not been given a warning.","asiasanat_en":"Protection against dismissal – Intoxication – Inappropriate conduct – Termination of employment – Warning","elin_en":"Labour Court"},{"id":"TT 2026:25","tunnus":"TT 2026:25","elin":"Työtuomioistuin","otsikko":"SAIRAUSAJAN PALKKA OSASAIRAUSAIKANA","pvm":"2026-06-22","pvm_selite":"annettu","asiasanat":"Osasairauspäiväraha – Sairausajan palkka – Syrjintä terveydentilan perusteella – Työehtosopimuksen tulkinta","teksti":"Kysymys oli siitä, onko työntekijällä oikeus sairausajan palkkaan, kun hän sairastuu osasairauspäivärahakauden aikana eri sairauteen. Työtuomioistuin katsoi, että työntekijällä oli oikeus sairausajan palkkaan. Työehtosopimuksen määräyksen sanamuoto ei rajoittanut oikeutta, ja työnantajan tulkinta olisi ollut ristiriidassa yhdenvertaisuuslain kanssa.","tekstityyppi":"tiivistelmä","lahde":"https://www.tyotuomioistuin.fi/ratkaisut/ratkaisujen-arkisto/tt-202625/","selko":"Osa-aikaisesti sairauslomalla ollut työntekijä sairastui toiseen sairauteen. Työtuomioistuimen mukaan hänellä oli oikeus sairausajan palkkaan. Työnantajan tulkinta olisi syrjinyt häntä terveyden perusteella.","aiheet":["tyo"],"julkaistu":"2026-06-23","paino":3,"otsikko_sv":"SJUKLÖN UNDER PARTIELL SJUKLEDIGHET","teksti_sv":"Frågan gällde om en arbetstagare har rätt till lön för sjukdomstiden när han eller hon insjuknar i en annan sjukdom under en period med partiell sjukdagpenning. Arbetsdomstolen ansåg att arbetstagaren hade rätt till lön för sjukdomstiden. Ordalydelsen i kollektivavtalets bestämmelse begränsade inte rätten, och arbetsgivarens tolkning skulle ha stått i strid med diskrimineringslagen.","selko_sv":"En arbetstagare som var partiellt sjukledig insjuknade i en annan sjukdom. Enligt arbetsdomstolen hade han eller hon rätt till lön för sjukdomstiden. Arbetsgivarens tolkning skulle ha diskriminerat på grund av hälsa.","asiasanat_sv":"Partiell sjukdagpenning – Lön för sjukdomstid – Diskriminering på grund av hälsotillstånd – Tolkning av kollektivavtal","elin_sv":"Arbetsdomstolen","otsikko_en":"SICK PAY DURING PARTIAL SICK LEAVE","teksti_en":"The question was whether an employee is entitled to sick pay when falling ill with a different illness during a period of partial sickness allowance. The Labour Court held that the employee was entitled to sick pay. The wording of the collective agreement provision did not limit the right, and the employer's interpretation would have conflicted with the Non-Discrimination Act.","selko_en":"An employee on partial sick leave fell ill with another illness. According to the Labour Court she was entitled to sick pay. The employer's interpretation would have discriminated against her on grounds of health.","asiasanat_en":"Partial sickness allowance – Sick pay – Discrimination on grounds of health – Interpretation of collective agreement","elin_en":"Labour Court"}],"fiva":[{"id":"fiva-2026-09-28-saantely","tunnus":"Finanssivalvonta tiedote 28.9.2026","elin":"Finanssivalvonta","otsikko":"FIVA: SÄÄNTELYN YKSINKERTAISTAMINEN","pvm":"2026-09-28","pvm_selite":"tiedote","julkaistu":"2026-09-28T10:00","asiasanat":"sääntely – yksinkertaistaminen – vakavaraisuus – riskinkestävyys – rahoitusvakaus – kilpailukyky – asuntorahoitus","tekstityyppi":"tiivistelmä","teksti":"Finanssivalvonnan mukaan finanssisektorin sääntelyä on perusteltua selkeyttää ja tarvittaessa yksinkertaistaa kohdissa, joissa se ei vaaranna toimijoiden vakavaraisuutta, riskinkestävyyttä tai rahoitusjärjestelmän vakautta. Muutokset tulisi tehdä huolellisen vaikutusarvioinnin pohjalta. Jos Finanssivalvonnalle annetaan ehdotettu toissijainen tavoite rahoitusmarkkinoiden kilpailun, rahoituksen välittymisen ja kestävän talouskasvun edistämisestä, on määriteltävä selkeästi, miten se suhteutuu lakisääteiseen valvontatehtävään. Asuntorahoituksen sääntelyä on jo kevennetty, ja Finanssivalvonta pitää tärkeänä seurata muutosten vaikutuksia, koska kotitalouksien velkaantuneisuus on eurooppalaisittain verrattain korkea.","selko":"Finanssivalvonnan mielestä pankkeja ja muita finanssialan yrityksiä koskevia sääntöjä voi keventää, kunhan yritykset pysyvät vakavaraisina ja rahoitusjärjestelmä vakaana. Muutosten vaikutukset pitää arvioida huolellisesti. Asuntolainojen sääntöjä on jo tänä vuonna kevennetty.","lahde":"https://www.finanssivalvonta.fi/tiedotteet-ja-julkaisut/lehdistotiedotteet/2026/finanssivalvonta-saantelya-voidaan-yksinkertaistaa-kun-riskinkestavyys-sailyy/","aiheet":["finanssi","eu"],"paino":2,"otsikko_sv":"FI: FÖRENKLING AV REGLERINGEN","teksti_sv":"Enligt Finansinspektionen är det motiverat att förtydliga och vid behov förenkla regleringen av finanssektorn där detta inte äventyrar aktörernas kapitaltäckning, riskbärförmåga eller finanssystemets stabilitet. Ändringarna bör göras utifrån en noggrann konsekvensbedömning. Om Finansinspektionen får det föreslagna sekundära målet att främja konkurrensen på finansmarknaden, förmedlingen av finansiering och en hållbar ekonomisk tillväxt, måste det tydligt anges hur målet förhåller sig till den lagstadgade tillsynsuppgiften. Regleringen av bostadsfinansieringen har redan lättats, och Finansinspektionen anser det viktigt att följa ändringarnas effekter, eftersom hushållens skuldsättning är relativt hög i europeisk jämförelse.","selko_sv":"Enligt Finansinspektionen kan reglerna för banker och andra finansföretag lättas, så länge företagen förblir solida och finanssystemet stabilt. Ändringarnas effekter ska bedömas noggrant. Reglerna för bostadslån har redan lättats i år.","asiasanat_sv":"reglering – förenkling – kapitaltäckning – riskbärförmåga – finansiell stabilitet – konkurrenskraft – bostadsfinansiering","elin_sv":"Finansinspektionen","otsikko_en":"FIN-FSA: SIMPLIFYING REGULATION","teksti_en":"According to the FIN-FSA, it is justified to clarify and where necessary simplify financial sector regulation where this does not endanger firms' solvency, risk resilience or the stability of the financial system. Changes should be based on careful impact assessment. If the FIN-FSA is given the proposed secondary objective of promoting competition in financial markets, financial intermediation and sustainable growth, it must be clearly defined how this relates to its statutory supervisory task. Housing finance regulation has already been eased, and the FIN-FSA considers it important to monitor the effects, as household indebtedness is relatively high by European standards.","selko_en":"The FIN-FSA considers that rules for banks and other financial firms can be lightened, as long as firms remain solvent and the financial system stable. The effects of changes must be assessed carefully. Mortgage rules have already been eased this year.","asiasanat_en":"regulation – simplification – solvency – risk resilience – financial stability – competitiveness – housing finance","elin_en":"Financial Supervisory Authority"},{"id":"fiva-2026-06-17-ermitage","tunnus":"KHO:2026:46","elin":"Korkein hallinto-oikeus","otsikko":"ERMITAGE: KHO KUMOSI FIVAN KIELLON","pvm":"2026-06-17","pvm_selite":"ratkaisu","asiasanat":"Sijoituspalvelulaki – Toimiluvaton toiminta – Kieltopäätös – Vaihtoehtorahastot","teksti":"Korkein hallinto-oikeus kumosi Finanssivalvonnan 6.6.2023 tekemän päätöksen, jolla Ermitage Partners Oy oli kielletty jatkamasta ja uudistamasta sijoituspalvelun tarjoamista lain vastaisesti. Yhtiön toiminta oli käsittänyt vaihtoehtorahastojen markkinointia, ja se oli mahdollistanut suomalaisten sijoittajien sijoitukset tiettyihin ulkomaisiin vaihtoehtorahastoihin. Helsingin hallinto-oikeus oli hylännyt yhtiön valituksen 27.11.2024. KHO myönsi valitusluvan ja kumosi myös hallinto-oikeuden päätöksen. Päätös on lainvoimainen.","tekstityyppi":"tiivistelmä","lainvoimainen":true,"lahde":"https://www.sttinfo.fi/tiedote/72147509/korkein-hallinto-oikeus-antoi-paatoksensa-ermitage-partners-oyn-valitukseen?publisherId=69817444&lang=fi","selko":"Finanssivalvonta oli kieltänyt yritystä tarjoamasta sijoituspalveluja ilman lupaa. Korkein hallinto-oikeus kumosi kiellon. Päätös on lopullinen.","aiheet":["finanssi"],"julkaistu":"2026-06-17T14:30","paino":3,"otsikko_sv":"ERMITAGE: HFD UPPHÄVDE FÖRBUDET","teksti_sv":"Högsta förvaltningsdomstolen upphävde Finansinspektionens beslut av 6.6.2023 genom vilket Ermitage Partners Oy hade förbjudits att fortsätta eller upprepa tillhandahållande av investeringstjänster i strid med lagen. Bolagets verksamhet hade omfattat marknadsföring av alternativa investeringsfonder, och det hade möjliggjort finländska investerares placeringar i vissa utländska alternativa investeringsfonder. Helsingfors förvaltningsdomstol hade avslagit bolagets besvär 27.11.2024. HFD beviljade besvärstillstånd och upphävde också förvaltningsdomstolens beslut. Beslutet har vunnit laga kraft.","selko_sv":"Finansinspektionen hade förbjudit ett företag att erbjuda investeringstjänster utan tillstånd. Högsta förvaltningsdomstolen upphävde förbudet. Beslutet är slutligt.","asiasanat_sv":"Lagen om investeringstjänster – Verksamhet utan tillstånd – Förbudsbeslut – Alternativa investeringsfonder","elin_sv":"Högsta förvaltningsdomstolen","otsikko_en":"ERMITAGE: KHO QUASHED FIN-FSA BAN","teksti_en":"The Supreme Administrative Court overturned the FIN-FSA's decision of 6.6.2023 prohibiting Ermitage Partners Oy from continuing and renewing the unlawful provision of investment services. The company's activities had comprised the marketing of alternative investment funds, enabling Finnish investors to invest in certain foreign alternative funds. The Helsinki Administrative Court had dismissed the company's appeal on 27.11.2024. The Supreme Administrative Court granted leave to appeal and also overturned the Administrative Court's decision. The decision is final.","selko_en":"The FIN-FSA had prohibited a company from providing investment services without authorisation. The Supreme Administrative Court overturned the ban. The decision is final.","asiasanat_en":"Investment Services Act – Unauthorised activity – Prohibition decision – Alternative investment funds","elin_en":"Supreme Administrative Court"},{"id":"fiva-2026-05-13-pareto","tunnus":"Finanssivalvonta","elin":"Finanssivalvonta","otsikko":"PARETOLLE 115 000 EURON MAKSU","pvm":"2026-05-13","pvm_selite":"päätös","asiasanat":"Seuraamusmaksu – Kaupparaportointi – Markkinoiden väärinkäytön valvonta","teksti":"Finanssivalvonta määräsi Pareto Securities AB:lle 115 000 euron seuraamusmaksun kaupparaportoinnin laiminlyönneistä. Raportoinnissa oli kaksi merkittävää katkosta, 71 päivää vuonna 2024 ja 20 päivää vuonna 2025, ja 13 liiketoimea oli raportoitu kukin yli 300 kertaa. Markkinoiden väärinkäytön valvonta edellyttää täydellisiä ja täsmällisiä tietoja. Päätöksestä voi valittaa Helsingin hallinto-oikeuteen.","tekstityyppi":"tiivistelmä","lainvoimainen":false,"lahde":"https://www.sttinfo.fi/tiedote/72041262/pareto-securities-ablle-115-000-euron-seuraamusmaksu-kaupparaportoinnin-laiminlyonnista","selko":"Sijoituspalveluyhtiö ei ilmoittanut kauppojaan valvojalle oikein: välillä ilmoitukset puuttuivat viikkoja, välillä samoja kauppoja ilmoitettiin satoja kertoja. Se sai 115 000 euron maksun. Päätöksestä voi valittaa.","aiheet":["finanssi"],"julkaistu":"2026-05-13","paino":3,"otsikko_sv":"PARETO: AVGIFT PÅ 115 000 EURO","teksti_sv":"Finansinspektionen påförde Pareto Securities AB en påföljdsavgift på 115 000 euro för försummelser i transaktionsrapporteringen. Rapporteringen hade två betydande avbrott, 71 dagar 2024 och 20 dagar 2025, och 13 transaktioner hade rapporterats över 300 gånger vardera. Övervakningen av marknadsmissbruk förutsätter fullständiga och exakta uppgifter. Beslutet kan överklagas hos Helsingfors förvaltningsdomstol.","selko_sv":"Ett värdepappersföretag rapporterade inte sina affärer korrekt till tillsynsmyndigheten: ibland saknades rapporterna i veckor, ibland rapporterades samma affärer hundratals gånger. Det fick en avgift på 115 000 euro. Beslutet kan överklagas.","asiasanat_sv":"Påföljdsavgift – Transaktionsrapportering – Övervakning av marknadsmissbruk","elin_sv":"Finansinspektionen","otsikko_en":"PARETO FINED 115 000 EUROS","teksti_en":"The FIN-FSA imposed a penalty payment of 115 000 euros on Pareto Securities AB for failures in transaction reporting. There were two significant gaps in reporting, 71 days in 2024 and 20 days in 2025, and 13 transactions were each reported more than 300 times. Market abuse supervision requires complete and accurate data. The decision may be appealed to the Helsinki Administrative Court.","selko_en":"An investment firm did not report its trades to the supervisor correctly: at times reports were missing for weeks, at times the same trades were reported hundreds of times. It received a 115 000 euro penalty. The decision may be appealed.","asiasanat_en":"Penalty payment – Transaction reporting – Market abuse supervision","elin_en":"Financial Supervisory Authority"},{"id":"fiva-2026-04-27-nanolaina","tunnus":"Finanssivalvonta","elin":"Finanssivalvonta","otsikko":"NANOLAINALLE JUOKSEVA UHKASAKKO","pvm":"2026-03-11","pvm_selite":"päätös","asiasanat":"Positiivinen luottotietorekisteri – Ilmoitusvelvollisuus – Juokseva uhkasakko","teksti":"Finanssivalvonta velvoitti Nanolaina Oy:n ilmoittamaan myöntämiensä luottojen tiedot positiiviseen luottotietorekisteriin kahden kuukauden kuluessa ja pitämään tiedot ajan tasalla. Velvoitteen tehosteena on juokseva uhkasakko: kiinteä 10 000 euroa ja 5 000 euroa kultakin täydeltä kuukaudelta, jona velvoite on täyttämättä. Päätös julkistettiin 27.4.2026, eikä se ole lainvoimainen.","tekstityyppi":"tiivistelmä","lainvoimainen":false,"lahde":"https://www.sttinfo.fi/tiedote/71994036/finanssivalvonta-velvoittaa-nanolaina-oyn-ilmoittamaan-myontamiensa-luottojen-tiedot-positiiviseen-luottotietorekisteriin-tehosteeksi-juokseva-uhkasakko","selko":"Lainayhtiön on ilmoitettava antamansa lainat positiiviseen luottotietorekisteriin, jotta ihmiset eivät velkaannu liikaa. Jos se ei tee niin, sille voidaan määrätä maksettavaksi 10 000 euroa ja lisäksi 5 000 euroa jokaiselta täydeltä kuukaudelta. Päätöksestä voi valittaa.","aiheet":["finanssi","kuluttaja"],"julkaistu":"2026-04-27","paino":2,"otsikko_sv":"LÖPANDE VITE FÖR NANOLAINA","teksti_sv":"Finansinspektionen ålade Nanolaina Oy att inom två månader anmäla uppgifter om de krediter bolaget beviljat till det positiva kreditupplysningsregistret och att hålla uppgifterna uppdaterade. Förpliktelsen har förenats med löpande vite: ett fast belopp på 10 000 euro och 5 000 euro för varje hel månad som förpliktelsen inte fullgjorts. Beslutet offentliggjordes 27.4.2026 och har inte vunnit laga kraft.","selko_sv":"Låneföretaget måste anmäla de lån det beviljat till det positiva kreditupplysningsregistret, så att människor inte skuldsätter sig för mycket. Gör det inte det kan det åläggas att betala 10 000 euro och dessutom 5 000 euro för varje hel månad. Beslutet kan överklagas.","asiasanat_sv":"Positivt kreditupplysningsregister – Anmälningsskyldighet – Löpande vite","elin_sv":"Finansinspektionen","otsikko_en":"RUNNING FINE FOR NANOLAINA","teksti_en":"The FIN-FSA ordered Nanolaina Oy to report the credits it has granted to the positive credit register within two months and to keep the data up to date. The obligation is enforced by a running conditional fine: a fixed 10 000 euros plus 5 000 euros for each full month the obligation remains unmet. The decision was published on 27.4.2026 and is not final.","selko_en":"The lender must report the loans it grants to the positive credit register so that people do not become over-indebted. If it fails to do so, it can be ordered to pay 10 000 euros plus 5 000 euros for each full month. The decision may be appealed.","asiasanat_en":"Positive credit register – Reporting obligation – Running conditional fine","elin_en":"Financial Supervisory Authority"},{"id":"fiva-2026-03-25-familiam","tunnus":"Finanssivalvonta","elin":"Finanssivalvonta","otsikko":"FAMILIAMILLE 70 000 EURON MAKSU","pvm":"2026-03-25","pvm_selite":"päätös","asiasanat":"Seuraamusmaksu – Kaupparaportointi – Säännöllinen raportointi","teksti":"Finanssivalvonta määräsi Familiam Asset Management Oy:lle 70 000 euron yhteisen seuraamusmaksun. Yhtiö oli jättänyt raportoimatta 2 867 liiketoimea syyskuun 2021 ja elokuun 2023 välillä ja toimittanut vuoden 2024 säännöllisen raportoinnin tietoja myöhässä. Päätöksestä voi valittaa Helsingin hallinto-oikeuteen.","tekstityyppi":"tiivistelmä","lainvoimainen":false,"lahde":"https://www.sttinfo.fi/tiedote/71909141/familiam-asset-management-oylle-70-000-euron-yhteinen-seuraamusmaksu-raportointien-laiminlyonneista","selko":"Varainhoitoyhtiö jätti ilmoittamatta lähes 3 000 kauppaa valvojalle ja toimitti muita tietoja myöhässä. Se sai 70 000 euron maksun. Päätöksestä voi valittaa.","aiheet":["finanssi"],"julkaistu":"2026-03-25","paino":2,"otsikko_sv":"FAMILIAM: AVGIFT PÅ 70 000 EURO","teksti_sv":"Finansinspektionen påförde Familiam Asset Management Oy en gemensam påföljdsavgift på 70 000 euro. Bolaget hade underlåtit att rapportera 2 867 transaktioner mellan september 2021 och augusti 2023 och lämnat uppgifter i den regelbundna rapporteringen för 2024 för sent. Beslutet kan överklagas hos Helsingfors förvaltningsdomstol.","selko_sv":"Ett kapitalförvaltningsbolag lät bli att anmäla nästan 3 000 affärer till tillsynsmyndigheten och lämnade andra uppgifter för sent. Det fick en avgift på 70 000 euro. Beslutet kan överklagas.","asiasanat_sv":"Påföljdsavgift – Transaktionsrapportering – Regelbunden rapportering","elin_sv":"Finansinspektionen","otsikko_en":"FAMILIAM FINED 70 000 EUROS","teksti_en":"The FIN-FSA imposed a joint penalty payment of 70 000 euros on Familiam Asset Management Oy. The company had failed to report 2 867 transactions between September 2021 and August 2023 and had submitted regular reporting data for 2024 late. The decision may be appealed to the Helsinki Administrative Court.","selko_en":"An asset management company failed to report nearly 3 000 trades to the supervisor and submitted other data late. It received a 70 000 euro penalty. The decision may be appealed.","asiasanat_en":"Penalty payment – Transaction reporting – Regular reporting","elin_en":"Financial Supervisory Authority"}],"lausunnot":[{"id":"tem-2026-09-30-metaani","tunnus":"TEM tiedote 30.9.2026","otsikko":"METAANIPÄÄSTÖASETUKSEN VALVONTA","pvm":"2026-09-30","pvm_selite":"tiedote","julkaistu":"2026-09-30T11:13","maaraaika":"2026-10-21","paino":3,"elin":"Työ- ja elinkeinoministeriö","asiasanat":"metaanipäästöt – EU-asetus – valvonta – seuraamusmaksu – lausuntopyyntö","teksti":"Työ- ja elinkeinoministeriö pyytää lausuntoja hallituksen esityksestä, jolla säädettäisiin EU:n metaanipäästöasetuksen valvonnasta ja seuraamuksista. Valvontaviranomaiseksi ehdotetaan Turvallisuus- ja kemikaalivirastoa (Tukes), jolle säädettäisiin tarkastus- ja tiedonsaantioikeudet. Laiminlyönneistä voitaisiin määrätä seuraamusmaksu, julkinen varoitus, lopettamismääräys tai uhkasakko; seuraamusmaksun määräisi markkinaoikeus Tukesin esityksestä. Asetus on ollut suoraan sovellettava elokuusta 2024, mutta sen noudattamista ei ole voitu valvoa ilman kansallista lakia. Velvoitteet koskevat erityisesti maakaasun siirto- ja jakeluverkkojen haltijoita ja fossiilisten polttoaineiden maahantuojia. Lausuntoaika on 30.9.–21.10.2026.","tekstityyppi":"tiedotteen mukaan","selko":"Ministeriö kysyy mielipiteitä lakiehdotuksesta, jonka mukaan Tukes alkaisi valvoa EU:n sääntöjä energia-alan metaanipäästöistä. Sääntöjä rikkovalle yritykselle voitaisiin määrätä esimerkiksi maksu tai varoitus. Lausuntoja voi antaa 21.10.2026 asti.","lahde":"https://valtioneuvosto.fi/-/1410877/eu-n-metaanipaastoasetuksen-valvontaa-ja-seuraamuksia-koskeva-lakiesitys-lausuntokierrokselle","aiheet":["ymparisto","eu"],"otsikko_sv":"TILLSYN ÖVER METANFÖRORDNINGEN","teksti_sv":"Arbets- och näringsministeriet begär utlåtanden om en regeringsproposition om tillsyn över och påföljder enligt EU:s metanförordning. Säkerhets- och kemikalieverket (Tukes) föreslås bli tillsynsmyndighet med rätt att göra inspektioner och få uppgifter. För försummelser kunde påföljdsavgift, offentlig varning, förbud att fortsätta verksamheten eller vite påföras; påföljdsavgiften skulle påföras av marknadsdomstolen på framställning av Tukes. Förordningen har tillämpats direkt sedan augusti 2024, men efterlevnaden har inte kunnat övervakas utan en nationell lag. Skyldigheterna gäller särskilt innehavare av överförings- och distributionsnät för naturgas och importörer av fossila bränslen. Remisstiden är 30.9–21.10.2026.","selko_sv":"Ministeriet ber om synpunkter på ett lagförslag om att Tukes ska övervaka EU:s regler om metanutsläpp inom energisektorn. Ett företag som bryter mot reglerna kunde till exempel få en avgift eller en varning. Utlåtanden kan ges till och med 21.10.2026.","asiasanat_sv":"metanutsläpp – EU-förordning – tillsyn – påföljdsavgift – begäran om utlåtande","elin_sv":"Arbets- och näringsministeriet","lisatty":"2026-09-30T17:16","otsikko_en":"ENFORCING THE METHANE REGULATION","teksti_en":"The Ministry of Economic Affairs and Employment requests comments on a government bill on the supervision and sanctions of the EU Methane Regulation. The Finnish Safety and Chemicals Agency (Tukes) is proposed as the supervisory authority, with inspection and information rights. Breaches could lead to an administrative fine, a public warning, a cessation order or a conditional fine; the fine would be imposed by the Market Court on Tukes's proposal. The regulation has been directly applicable since August 2024, but compliance could not be enforced without national law. The obligations concern in particular natural gas transmission and distribution system operators and importers of fossil fuels. The consultation period is 30.9.–21.10.2026.","selko_en":"The ministry is asking for views on a bill under which Tukes would start enforcing EU rules on methane emissions in the energy sector. A company breaking the rules could face, for example, a fine or a warning. Comments may be submitted until 21.10.2026.","asiasanat_en":"methane emissions – EU regulation – supervision – administrative fine – request for comments","elin_en":"Ministry of Economic Affairs and Employment"},{"id":"VM084:00/2025","tunnus":"VM084:00/2025","elin":"Valtiovarainministeriö","otsikko":"KY-MUOTOISTEN RAHASTOJEN VEROTUS","pvm":"2026-09-25","pvm_selite":"julkaistu","julkaistu":"2026-09-25T14:24","asiasanat":"vaihtoehtorahastot – kommandiittiyhtiö – rahastoyhtymä – yhtymäverotus – tiedonantovelvollisuus – lausuntopyyntö","tekstityyppi":"tiivistelmä","teksti":"Valtiovarainministeriö pyytää lausuntoja luonnoksesta hallituksen esitykseksi, jolla kommandiittiyhtiömuotoisten vaihtoehtorahastojen verotus eriytettäisiin muusta yhtymäverotuksesta. Rahastoja ei enää pidettäisi elinkeinoyhtyminä, vaan ne olisivat rahastoyhtymiä. Rahastoyhtymälle ei vahvistettaisi erillistä verotettavaa tulosta, vaan sen tulot ja kulut kohdistettaisiin vuosittain suoraan sijoittajille alkuperäisen luonteensa säilyttäen. Veroilmoituksen sijaan rahastoyhtymä antaisi Verohallinnolle tiedot tuloistaan ja menoistaan sekä yhtiömiehille erittelyn heidän osuuksistaan. Uusia säännöksiä sovellettaisiin lähtökohtaisesti 1.1.2028 tai sen jälkeen perustettaviin rahastoihin. Lausunnot pyydetään viimeistään 21.10.2026.","selko":"Ministeriö kysyy mielipiteitä ehdotuksesta, joka muuttaisi kommandiittiyhtiön muodossa toimivien pääomarahastojen verotusta. Rahaston tuloja verotettaisiin suoraan sijoittajilla samaan tapaan kuin jos he olisivat sijoittaneet itse. Muutos koskisi pääosin vuoden 2028 alusta perustettavia rahastoja.","lahde":"https://valtioneuvosto.fi/-/10623/hallitus-esittaa-uudistusta-kommandiittiyhtiomuotoisten-rahastojen-verotukseen","aiheet":["vero","finanssi"],"paino":3,"maaraaika":"2026-10-21","otsikko_sv":"BESKATTNING AV KB-FONDER","teksti_sv":"Finansministeriet begär utlåtanden om ett utkast till regeringens proposition genom vilken beskattningen av alternativa investeringsfonder i form av kommanditbolag skulle skiljas från den övriga sammanslutningsbeskattningen. Fonderna skulle inte längre anses som näringssammanslutningar utan som fondsammanslutningar. För en fondsammanslutning skulle inget separat beskattningsbart resultat fastställas, utan dess intäkter och kostnader skulle årligen hänföras direkt till investerarna med bibehållen ursprunglig karaktär. I stället för skattedeklaration skulle fondsammanslutningen lämna Skatteförvaltningen uppgifter om sina inkomster och utgifter och bolagsmännen en specifikation av deras andelar. De nya bestämmelserna skulle i regel tillämpas på fonder som grundas 1.1.2028 eller senare. Utlåtandena ska lämnas senast 21.10.2026.","selko_sv":"Ministeriet ber om synpunkter på ett förslag som skulle ändra beskattningen av kapitalfonder i form av kommanditbolag. Fondens inkomster skulle beskattas direkt hos investerarna, ungefär som om de hade investerat själva. Ändringen skulle främst gälla fonder som grundas från början av 2028.","asiasanat_sv":"alternativa investeringsfonder – kommanditbolag – fondsammanslutning – sammanslutningsbeskattning – uppgiftsskyldighet – begäran om utlåtande","elin_sv":"Finansministeriet","otsikko_en":"TAXATION OF LP-FORM FUNDS","teksti_en":"The Ministry of Finance requests comments on a draft government bill that would separate the taxation of alternative investment funds in limited partnership form from other partnership taxation. The funds would no longer be treated as business partnerships but as fund partnerships. No separate taxable result would be assessed for a fund partnership; its income and expenses would be attributed annually directly to the investors, retaining their original character. Instead of a tax return, the fund partnership would provide the Tax Administration with information on its income and expenses and the partners with a breakdown of their shares. The new provisions would as a rule apply to funds established on or after 1.1.2028. Comments are requested by 21.10.2026.","selko_en":"The ministry is asking for views on a proposal to change the taxation of private equity funds operating as limited partnerships. The fund's income would be taxed directly in the hands of investors, as if they had invested themselves. The change would mainly concern funds set up from the beginning of 2028.","asiasanat_en":"alternative investment funds – limited partnership – fund partnership – partnership taxation – reporting obligation – request for comments","elin_en":"Ministry of Finance"},{"id":"OM070:00/2024-lapsirauha","tunnus":"OM070:00/2024","elin":"Oikeusministeriö","otsikko":"LAPSIRAUHA KOVENTAMISPERUSTEEKSI","pvm":"2026-09-25","pvm_selite":"julkaistu","julkaistu":"2026-09-25T11:16","asiasanat":"rikoslaki – rangaistuksen koventamisperuste – lähisuhdeväkivalta – lapsirauha – NKV-direktiivi","tekstityyppi":"tiivistelmä","teksti":"Oikeusministeriö pyytää lausuntoja ehdotuksesta, jonka mukaan rikoslakiin lisättäisiin uusi rangaistuksen koventamisperuste, niin sanottu lapsirauharikos. Perustetta käytettäisiin, kun henkeen, terveyteen tai vapauteen kohdistuva rikos tehdään lähisuhteessa oman tai rikoksen uhrin lapsen läsnä ollessa taikka lapsen nähden tai kuullen. Sitä sovellettaisiin myös, kun henkirikos tai törkeä pahoinpitely on tapahtunut uhrin lapsen läsnä ollessa tai tämän nähden tai kuullen. Koventamisperuste säädetään naisiin kohdistuvan väkivallan ja lähisuhdeväkivallan torjuntaa koskevan direktiivin täytäntöönpanon yhteydessä. Lausunnot pyydetään 15.10.2026 mennessä.","selko":"Ministeriö kysyy mielipiteitä ehdotuksesta, jonka mukaan väkivallasta voisi saada ankaramman rangaistuksen, jos teko tehdään perheessä tai muussa läheisessä suhteessa lapsen nähden tai kuullen. Lapsirauhalla tarkoitetaan lapsen oikeutta kasvaa turvassa kokematta tai näkemättä väkivaltaa.","lahde":"https://valtioneuvosto.fi/-/1410853/lapsirauharikos-lausuntokierroksella","aiheet":["rikos","perhe","eu"],"paino":3,"maaraaika":"2026-10-15","otsikko_sv":"BARNFRID SOM SKÄRPNINGSGRUND","teksti_sv":"Justitieministeriet begär utlåtanden om ett förslag enligt vilket en ny grund för straffskärpning, ett så kallat barnfridsbrott, skulle tas in i strafflagen. Grunden skulle tillämpas när ett brott mot liv, hälsa eller frihet begås i en nära relation i närvaro av gärningspersonens eller brottsoffrets barn eller så att barnet ser eller hör det. Den skulle också tillämpas när ett brott mot liv eller en grov misshandel har skett i närvaro av offrets barn eller så att barnet ser eller hör det. Skärpningsgrunden införs i samband med genomförandet av direktivet om bekämpning av våld mot kvinnor och våld i nära relationer. Utlåtandena ska lämnas senast 15.10.2026.","selko_sv":"Ministeriet ber om synpunkter på ett förslag om att våld skulle kunna ge strängare straff om gärningen begås i familjen eller i en annan nära relation så att ett barn ser eller hör det. Med barnfrid avses barnets rätt att växa upp i trygghet utan att uppleva eller se våld.","asiasanat_sv":"strafflagen – grund för straffskärpning – våld i nära relationer – barnfrid – direktivet om våld mot kvinnor","elin_sv":"Justitieministeriet","otsikko_en":"CHILD'S PEACE AS AGGRAVATING FACTOR","teksti_en":"The Ministry of Justice requests comments on a proposal to add a new aggravating factor to the Criminal Code, the so-called violation of a child's peace. It would apply when an offence against life, health or liberty is committed in a close relationship in the presence of one's own or the victim's child, or within the child's sight or hearing. It would also apply when a homicide or aggravated assault has occurred in the presence of, or within the sight or hearing of, the victim's child. The aggravating factor is enacted in connection with implementing the directive on combating violence against women and domestic violence. Comments are requested by 15.10.2026.","selko_en":"The ministry is asking for views on a proposal under which violence could be punished more severely if committed in a family or other close relationship within a child's sight or hearing. A child's peace means the child's right to grow up safe without experiencing or witnessing violence.","asiasanat_en":"Criminal Code – aggravating factor – domestic violence – child's peace – directive on violence against women","elin_en":"Ministry of Justice"},{"id":"lausunto-mmm-metsastyslaki-2026","tunnus":"MMM, lausuntopyyntö","elin":"Maa- ja metsätalousministeriö","otsikko":"METSÄSTYSLAKI: JÄRJESTÖJEN VALITUS","pvm":"2026-09-22","pvm_selite":"julkaistu","maaraaika":"2026-10-20","asiasanat":"Metsästyslaki – Riistahallintolaki – Muutoksenhakuoikeus – Luonto- ja ympäristöjärjestöt – Täytäntöönpanokielto","teksti":"Maa- ja metsätalousministeriö pyytää lausuntoja hallituksen esityksen luonnoksesta, jolla täsmennettäisiin luonto- ja ympäristöjärjestöjen valitusoikeutta metsästyslain mukaisiin päätöksiin. Valitusoikeus kohdistuisi nykyistä selvemmin järjestöihin, joilla on vakiintunutta toimintaa päätöksen vaikutusalueella, ja yhteisön pitäisi olla rekisteröitynä vähintään kolme vuotta ennen valitusta. Lisäksi muutettaisiin riistahallintolain täytäntöönpanokieltoa koskevaa sääntelyä. Ministeriön mukaan järjestöjen laaja mahdollisuus hakea muutosta säilyisi perustuslain, Århusin yleissopimuksen ja EU-oikeuden edellyttämällä tavalla. Lausuntoja voi antaa 20.10.2026 saakka.","tekstityyppi":"tiedotteen mukaan","lahde":"https://valtioneuvosto.fi/-/1410837/maa-ja-metsatalousministerio-pyytaa-lausuntoja-metsastyslain-ja-riistahallintolain-muutoksista","selko":"Ministeriö ehdottaa, että luonto- ja ympäristöjärjestö voisi valittaa metsästystä koskevista päätöksistä vain, jos se toimii alueella vakiintuneesti ja on ollut rekisterissä vähintään kolme vuotta. Lausunnon voi antaa 20.10.2026 mennessä. Kyse on vasta ehdotuksesta.","aiheet":["ymparisto","hallinto"],"paino":2,"julkaistu":"2026-09-22T11:01","otsikko_sv":"JAKTLAGEN: ORGANISATIONERS BESVÄR","teksti_sv":"Jord- och skogsbruksministeriet begär utlåtanden om ett utkast till regeringens proposition som skulle precisera natur- och miljöorganisationers besvärsrätt i fråga om beslut enligt jaktlagen. Besvärsrätten skulle tydligare än i dag gälla organisationer med etablerad verksamhet inom beslutets verkningsområde, och sammanslutningen skulle ha varit registrerad i minst tre år innan besvär anförs. Dessutom skulle bestämmelserna om förbud mot verkställighet i lagen om viltförvaltning ändras. Enligt ministeriet skulle organisationernas omfattande möjlighet att söka ändring kvarstå så som grundlagen, Århuskonventionen och EU-rätten förutsätter. Utlåtanden kan lämnas till och med 20.10.2026.","selko_sv":"Ministeriet föreslår att en natur- eller miljöorganisation bara ska få överklaga beslut om jakt om den har en etablerad verksamhet i området och har varit registrerad i minst tre år. Man kan lämna utlåtande senast 20.10.2026. Det är ännu bara ett förslag.","asiasanat_sv":"Jaktlagen – Lagen om viltförvaltning – Rätt att söka ändring – Natur- och miljöorganisationer – Förbud mot verkställighet","elin_sv":"Jord- och skogsbruksministeriet","otsikko_en":"HUNTING ACT: NGO APPEAL RIGHTS","teksti_en":"The Ministry of Agriculture and Forestry requests comments on a draft government bill that would clarify the right of nature and environmental organisations to appeal against decisions under the Hunting Act. The right of appeal would more clearly cover organisations with established activity in the area affected by the decision, and the association would have to have been registered for at least three years before appealing. The rules on suspension of enforcement in the Game Administration Act would also be amended. According to the ministry, organisations' broad access to appeal would be preserved as required by the Constitution, the Aarhus Convention and EU law. Comments may be submitted until 20.10.2026.","selko_en":"The ministry proposes that a nature or environmental organisation could appeal against hunting decisions only if it operates in the area on an established basis and has been registered for at least three years. Comments may be submitted by 20.10.2026. This is only a proposal.","asiasanat_en":"Hunting Act – Game Administration Act – Right of appeal – Nature and environmental organisations – Suspension of enforcement","elin_en":"Ministry of Agriculture and Forestry"},{"id":"lausunto-sm-sailoonotto-2026","tunnus":"Sisäministeriö","elin":"Sisäministeriö","otsikko":"ULKOMAALAISLAKI: SÄILÖÖNOTTO","pvm":"2026-09-18","pvm_selite":"julkaistu","maaraaika":"2026-10-16","asiasanat":"Ulkomaalaislaki – Säilöönotto – Pääsyn epääminen – Muutoksenhaku – EU:n palautusasetus","teksti":"Sisäministeriö pyytää lausuntoja ulkomaalaislain muutoksista, jotka koskevat säilöönoton perusteita ja pääsyn epäämistä koskevaa muutoksenhakua. Säilöönottoa voitaisiin jatkaa, kun henkilö hakee kansainvälistä suojelua vasta palautusmenettelyn aikana. Ulkorajoilla pääsyn epäämistä koskeva muutoksenhaku yhdenmukaistettaisiin Schengenin rajasäännöstön kanssa, ja lakiin otettaisiin EU:n palautusasetuksen säännöksiä pakoriskin arvioimisesta.","tekstityyppi":"tiivistelmä","lahde":"https://valtioneuvosto.fi/-/1410869/sailoonottoon-ja-paasyn-epaamiseen-liittyvia-ulkomaalaislain-muutoksia-lausuntokierrokselle","selko":"Hallitus valmistelee muutoksia siihen, milloin ulkomaalaisen saa pitää säilössä ja miten rajalla käännyttämisestä voi valittaa. Kuka tahansa voi antaa lausunnon 16.10.2026 mennessä.","aiheet":["maahanmuutto","eu"],"julkaistu":"2026-09-18","paino":3,"otsikko_sv":"UTLÄNNINGSLAGEN: TAGANDE I FÖRVAR","teksti_sv":"Inrikesministeriet begär utlåtanden om ändringar i utlänningslagen som gäller grunderna för tagande i förvar och sökande av ändring i beslut om nekad inresa. Hållandet i förvar skulle kunna fortsätta när en person ansöker om internationellt skydd först under återvändandeförfarandet. Sökandet av ändring i beslut om nekad inresa vid de yttre gränserna skulle harmoniseras med kodexen om Schengengränserna, och i lagen skulle det tas in bestämmelser ur EU:s återvändandeförordning om bedömning av risken för avvikande.","selko_sv":"Regeringen bereder ändringar i när en utlänning får hållas i förvar och hur man kan överklaga om man avvisas vid gränsen. Vem som helst kan lämna utlåtande senast 16.10.2026.","asiasanat_sv":"Utlänningslagen – Tagande i förvar – Nekad inresa – Sökande av ändring – EU:s återvändandeförordning","elin_sv":"Inrikesministeriet","otsikko_en":"ALIENS ACT: DETENTION","teksti_en":"The Ministry of the Interior requests comments on amendments to the Aliens Act concerning the grounds for detention and appeals against refusal of entry. Detention could be continued when a person applies for international protection only during the return procedure. Appeals against refusal of entry at external borders would be harmonised with the Schengen Borders Code, and provisions of the EU Return Regulation on assessing the risk of absconding would be incorporated into the act.","selko_en":"The Government is preparing changes to when a foreign national may be detained and how a refusal of entry at the border can be appealed. Anyone may submit comments by 16.10.2026.","asiasanat_en":"Aliens Act – Detention – Refusal of entry – Appeal – EU Return Regulation","elin_en":"Ministry of the Interior"}],"eit":[{"id":"eit-p16-2026-001-ukraina","tunnus":"P16-2026-001","elin":"EIT","otsikko":"VEROSEURAAMUKSEN OIKEASUHTAISUUS","pvm":"2026-09-29","pvm_selite":"lausunto","teksti":"EIT antoi Ukrainan korkeimman oikeuden pyynnöstä neuvoa-antavan lausunnon kiinteämääräisestä veroseuraamuksesta. Taustalla oli yhtiölle rekisteröimättömän kassakoneen käytöstä määrätty 200 prosentin seuraamus myytyjen tavaroiden arvosta, noin 1,64 miljoonaa euroa, lähes kolminkertainen yhtiön varoihin nähden. EIT:n mukaan oikeasuhtaisuutta arvioitaessa huomioidaan keinojen valinta ja soveltuvuus, vaikutus yhtiöön ja yhtiön menettely. Yleissopimus ei edellytä, että kansallisilla tuomioistuimilla on valta alentaa automaattista seuraamusta. Ratkaisevaa on, sisältääkö oikeusjärjestys kokonaisuutena takeet kohtuuttoman rasituksen estämiseksi; keinon valitsee valtio.","tekstityyppi":"tiivistelmä","lahde":"https://hudoc.echr.coe.int/app/conversion/pdf/?library=ECHR&id=003-8648449-12325999","selko":"Ukrainan korkein oikeus kysyi Euroopan ihmisoikeustuomioistuimelta, saako tuomioistuin alentaa laissa kiinteäksi säädettyä verosakkoa. Ihmisoikeustuomioistuimen mukaan tuomioistuimella ei tarvitse olla tällaista valtaa. Lain on kuitenkin kokonaisuutena estettävä kohtuuttoman suuret seuraamukset. Lausunto ei sido.","vaihe":"Ratkaistu","lopputulos":"Neuvoa-antava lausunto annettu.","asiasanat":"Omaisuuden suoja – Veroseuraamus – Oikeasuhtaisuus – Neuvoa-antava lausunto","aiheet":["ihmisoikeudet","vero"],"julkaistu":"2026-09-29","paino":3,"otsikko_sv":"SKATTEPÅFÖLJDENS PROPORTIONALITET","teksti_sv":"Europeiska människorättsdomstolen avgav på begäran av Ukrainas högsta domstol ett rådgivande yttrande om en skattepåföljd med fast belopp. I bakgrunden fanns en påföljd på 200 procent av värdet av sålda varor, cirka 1,64 miljoner euro och nästan tre gånger bolagets tillgångar, som ett bolag ålagts för användning av en oregistrerad kassaapparat. Enligt domstolen beaktas vid proportionalitetsbedömningen valet av medel och deras lämplighet, inverkan på bolaget och bolagets agerande. Konventionen kräver inte att nationella domstolar har befogenhet att sänka en automatisk påföljd. Avgörande är om rättsordningen som helhet innehåller garantier mot oskälig belastning; valet av medel görs av staten.","selko_sv":"Ukrainas högsta domstol frågade Europeiska människorättsdomstolen om en domstol får sänka en skattepåföljd som är fastställd i lag. Enligt människorättsdomstolen behöver domstolen inte ha en sådan befogenhet. Lagen måste ändå som helhet förhindra oskäligt stora påföljder. Yttrandet är inte bindande.","asiasanat_sv":"Egendomsskydd – Skattepåföljd – Proportionalitet – Rådgivande yttrande","lopputulos_sv":"Rådgivande yttrande avgivet.","vaihe_sv":"Avgjort","elin_sv":"Europeiska människorättsdomstolen","otsikko_en":"PROPORTIONALITY OF TAX PENALTY","teksti_en":"At the request of the Supreme Court of Ukraine, the European Court of Human Rights delivered an advisory opinion on a fixed-rate tax penalty. The background was a penalty of 200 per cent of the value of goods sold, about 1.64 million euros and nearly three times the company's assets, imposed on a company for using an unregistered cash register. According to the Court, the proportionality assessment takes into account the choice of means and their appropriateness, the impact on the company and the company's conduct. The Convention does not require national courts to have the power to reduce an automatic penalty. What matters is whether the legal framework as a whole provides safeguards against a disproportionate burden; the choice of mechanism is for the State.","selko_en":"The Supreme Court of Ukraine asked the European Court of Human Rights whether a court may reduce a tax penalty fixed by law. According to the Court, courts do not need to have such a power. However, the law as a whole must prevent excessively large penalties. The opinion is not binding.","asiasanat_en":"Protection of property – Tax penalty – Proportionality – Advisory opinion","lopputulos_en":"Advisory opinion delivered.","vaihe_en":"Decided","elin_en":"ECHR","lisatty":"2026-10-01T06:49"},{"id":"eit-tyojarjestys-lapsen-edustaja","tunnus":"ECHR 235 (2026)","elin":"EIT","otsikko":"LAPSEN EDUSTAJA EIT:N MENETTELYSSÄ","pvm":"2026-09-25","pvm_selite":"tiedote","julkaistu":"2026-09-25","asiasanat":"EIT:n työjärjestys – 36 sääntö – 44 sääntö – lapsen edustus – väliintulo","tekstityyppi":"tiivistelmä","teksti":"Euroopan ihmisoikeustuomioistuin hyväksyi 7.9.2026 muutokset työjärjestyksensä 36 ja 44 sääntöön, ja ne tulevat voimaan 25.3.2027. Muutosten nojalla jaoston puheenjohtaja voi valituksen tiedoksiannon jälkeen erityisissä olosuhteissa pyytää vastaajavaltion tai muun sopimusvaltion hallitusta huolehtimaan siitä, että tuomioistuin, muu toimivaltainen kansallinen viranomainen tai asianajajaliitto nimeää lapsivalittajalle riippumattoman edustajan. Poikkeuksellisesti edustajaa voidaan pyytää myös väliintulijaksi kutsutulle tai hyväksytylle lapselle. Muutokset eivät vaikuta lasten edustusta koskevaan oikeuskäytäntöön. Täytäntöönpanoa koskeva käytännön ohje annetaan ennen voimaantuloa.","selko":"Ihmisoikeustuomioistuin muuttaa menettelysääntöjään. Se voi jatkossa pyytää valtiota järjestämään lapselle riippumattoman edustajan, joka hoitaa lapsen asiaa tuomioistuimessa. Muutos tulee voimaan maaliskuussa 2027.","lahde":"https://hudoc.echr.coe.int/eng-press?i=003-8646661-12322714","aiheet":["ihmisoikeudet","perhe"],"paino":3,"vaihe":"Voimaan 25.3.2027","lopputulos":"Työjärjestyksen 36 ja 44 sääntöä muutettiin.","otsikko_sv":"BARNS FÖRETRÄDARE I EUROPADOMSTOLEN","teksti_sv":"Europeiska människorättsdomstolen godkände 7.9.2026 ändringar i regel 36 och 44 i sin arbetsordning, och de träder i kraft 25.3.2027. Enligt ändringarna kan avdelningens ordförande efter delgivningen av klagomålet under särskilda omständigheter be regeringen i svarandestaten eller i en annan konventionsstat se till att en domstol, en annan behörig nationell myndighet eller advokatsamfundet utser en oberoende företrädare för ett barn som är klagande. Undantagsvis kan en företrädare också begäras för ett barn som har bjudits in eller tillåtits att intervenera. Ändringarna påverkar inte rättspraxis om företrädande av barn. En praktisk anvisning om genomförandet utfärdas före ikraftträdandet.","selko_sv":"Människorättsdomstolen ändrar sina regler för förfarandet. I fortsättningen kan den be en stat att ordna en oberoende företrädare för ett barn. Företrädaren sköter barnets sak i domstolen. Ändringen träder i kraft i mars 2027.","asiasanat_sv":"Europadomstolens arbetsordning – regel 36 – regel 44 – företrädande av barn – intervention","lopputulos_sv":"Regel 36 och 44 i arbetsordningen ändrades.","vaihe_sv":"I kraft 25.3.2027","elin_sv":"Europeiska människorättsdomstolen","otsikko_en":"CHILD'S REPRESENTATIVE AT THE ECHR","teksti_en":"On 7.9.2026 the European Court of Human Rights adopted amendments to Rules 36 and 44 of the Rules of Court, which enter into force on 25.3.2027. Under the amendments, after notice of an application has been given, the President of the Chamber may in special circumstances request the government of the respondent State or another Contracting Party to ensure that a court, another competent national authority or a bar association appoints an independent representative for a child applicant. Exceptionally, a representative may also be requested for a child invited or granted leave to intervene. The amendments do not affect the case-law on the representation of children. A practice direction on implementation will be issued before entry into force.","selko_en":"The Human Rights Court is changing its rules of procedure. It will be able to ask a State to arrange an independent representative for a child to handle the child's case before the Court. The change takes effect in March 2027.","asiasanat_en":"Rules of Court – Rule 36 – Rule 44 – representation of children – intervention","elin_en":"ECHR","vaihe_en":"In force 25.3.2027","lopputulos_en":"Rules 36 and 44 of the Rules of Court were amended."},{"id":"eit-degiorgio-malta","tunnus":"Degiorgio v. Malta, 26602/25 ja 26731/25","elin":"EIT","otsikko":"DEGIORGIO V. MALTA: TUTKIMATTA","pvm":"2026-09-01","pvm_selite":"päätös","teksti":"Toimittaja Daphne Caruana Galizian murhasta syytetyt veljekset valittivat, ettei heillä ollut riittävästi aikaa hankkia valitsemaansa avustajaa eivätkä määrätyt oikeusapuavustajat ehtineet valmistautua puolustukseen (EIS 6 artiklan 3 kohta). Veljekset olivat oikeudenkäynnin alkaessa lokakuussa 2022 tunnustaneet syyllisyytensä syyteneuvottelun jälkeen. EIT katsoi, että oikeusapuavustajien määrääminen oli olosuhteisiin nähden kohtuullista ja että syyllisyyden myöntäminen oli vapaaehtoista. Valitukset jätettiin yksimielisesti tutkimatta. Päätös on lopullinen.","tekstityyppi":"tiivistelmä","lahde":"https://hudoc.echr.coe.int/?i=001-252720","selko":"Maltalaisen toimittajan murhasta syytetyt veljekset valittivat, että heillä oli liian vähän aikaa hankkia oma asianajaja. He olivat itse myöntäneet syyllisyytensä. Euroopan ihmisoikeustuomioistuimen mukaan avustajien määrääminen oli kohtuullista. Valitusta ei otettu käsiteltäväksi, ja päätös on lopullinen.","vaihe":"Ratkaistu","lopputulos":"Jätettiin tutkimatta, yksimielinen.","asiasanat":"Oikeudenmukainen oikeudenkäynti – Puolustuksen valmistautumisaika – Avustajan valinta","aiheet":["ihmisoikeudet","rikos"],"julkaistu":"2026-09-24","paino":3,"otsikko_sv":"DEGIORGIO V. MALTA: AVVISADES","teksti_sv":"Bröderna som åtalats för mordet på journalisten Daphne Caruana Galizia klagade över att de inte hade haft tillräckligt med tid att skaffa ett biträde som de själva valt och att de förordnade rättshjälpsbiträdena inte hade hunnit förbereda försvaret (artikel 6.3 i Europeiska människorättskonventionen). När rättegången inleddes i oktober 2022 hade bröderna erkänt sig skyldiga efter en åtalsuppgörelse. Europeiska människorättsdomstolen ansåg att förordnandet av rättshjälpsbiträden var skäligt med hänsyn till omständigheterna och att erkännandet var frivilligt. Klagomålen avvisades enhälligt. Beslutet är slutligt.","selko_sv":"Bröderna som åtalats för mordet på en maltesisk journalist klagade över att de hade haft för lite tid att skaffa en egen advokat. De hade själva erkänt sig skyldiga. Enligt Europeiska människorättsdomstolen var det skäligt att förordna biträden. Klagomålet togs inte upp till behandling, och beslutet är slutligt.","asiasanat_sv":"Rättvis rättegång – Tid för att förbereda försvaret – Val av biträde","lopputulos_sv":"Avvisades, enhälligt.","vaihe_sv":"Avgjort","elin_sv":"Europeiska människorättsdomstolen","otsikko_en":"DEGIORGIO V. MALTA: INADMISSIBLE","teksti_en":"The brothers charged with the murder of journalist Daphne Caruana Galizia complained that they had not had enough time to engage counsel of their own choosing and that the appointed legal aid lawyers had no time to prepare the defence (Article 6 § 3 of the Convention). At the start of the trial in October 2022 the brothers had pleaded guilty following plea bargaining. The Court found that appointing legal aid lawyers had been reasonable in the circumstances and that the guilty pleas were voluntary. The applications were unanimously declared inadmissible. The decision is final.","selko_en":"The brothers charged with murdering a Maltese journalist complained that they had too little time to find their own lawyer. They had themselves pleaded guilty. According to the European Court of Human Rights, appointing lawyers for them was reasonable. The application was not admitted, and the decision is final.","asiasanat_en":"Fair trial – Time to prepare the defence – Choice of counsel","elin_en":"ECHR","vaihe_en":"Decided","lopputulos_en":"Declared inadmissible, unanimously."},{"id":"eit-19365-19-kuijt","tunnus":"Kuijt v. Alankomaat, 19365/19","elin":"EIT, suuri jaosto","otsikko":"KUIJT V. ALANKOMAAT: TUTKIMATTA","pvm":"2026-09-23","pvm_selite":"päätös","teksti":"Valittaja arvosteli Alankomaiden korkeimman oikeuden käytäntöä, jossa kokoonpanoon kuulumattomat tuomarit osallistuvat asian neuvotteluun äänestämättä. Hänen mukaansa käytäntö loukkasi oikeutta oikeudenmukaiseen oikeudenkäyntiin (EIS 6 artikla). Suuri jaosto jätti valituksen tutkimatta, koska valittaja ei ollut käyttänyt kaikkia kansallisia oikeussuojakeinoja. Kansallisesti olisi ollut käytettävissä keino saattaa kysymys arvioitavaksi.","tekstityyppi":"tiivistelmä","lahde":"https://www.echr.coe.int/w/kuijt-v.-the-netherlands-no.-19365/19-","selko":"Valittaja ei hyväksynyt sitä, että Alankomaiden ylimmän tuomioistuimen neuvotteluun osallistuu myös tuomareita, jotka eivät äänestä. Euroopan ihmisoikeustuomioistuin ei ottanut asiaa käsiteltäväksi, koska valittaja ei ollut ensin käyttänyt kaikkia oman maansa oikeuskeinoja.","vaihe":"Ratkaistu","lopputulos":"Jätettiin tutkimatta: kansalliset oikeussuojakeinot käyttämättä.","asiasanat":"Oikeudenmukainen oikeudenkäynti – Tuomioistuimen neuvottelu – Kansallisten oikeussuojakeinojen käyttäminen","aiheet":["ihmisoikeudet"],"julkaistu":"2026-09-23","paino":3,"otsikko_sv":"KUIJT V. NEDERLÄNDERNA: AVVISADES","teksti_sv":"Klaganden kritiserade praxisen vid Nederländernas högsta domstol, där domare som inte ingår i sammansättningen deltar i överläggningen i målet utan att rösta. Enligt klaganden kränkte praxisen rätten till en rättvis rättegång (artikel 6 i Europeiska människorättskonventionen). Stora avdelningen avvisade klagomålet eftersom klaganden inte hade uttömt alla nationella rättsmedel. Nationellt hade det funnits ett sätt att få frågan prövad.","selko_sv":"Klaganden godtog inte att även domare som inte röstar deltar i överläggningen vid Nederländernas högsta domstol. Europeiska människorättsdomstolen tog inte upp saken till behandling, eftersom klaganden inte först hade använt alla rättsliga möjligheter i sitt eget land.","asiasanat_sv":"Rättvis rättegång – Domstolens överläggning – Uttömmande av nationella rättsmedel","lopputulos_sv":"Avvisades: nationella rättsmedel inte uttömda.","vaihe_sv":"Avgjort","elin_sv":"Europeiska människorättsdomstolen, stora avdelningen","otsikko_en":"KUIJT V. NETHERLANDS: INADMISSIBLE","teksti_en":"The applicant criticised the practice of the Supreme Court of the Netherlands under which judges not on the bench take part in the deliberations without voting. In his view the practice violated the right to a fair trial (Article 6 of the Convention). The Grand Chamber declared the application inadmissible because the applicant had not exhausted domestic remedies. A means of having the question examined had been available at national level.","selko_en":"The applicant objected to judges who do not vote taking part in the deliberations of the Dutch supreme court. The European Court of Human Rights did not take up the case, because the applicant had not first used all the remedies available in his own country.","asiasanat_en":"Fair trial – Deliberations of the court – Exhaustion of domestic remedies","elin_en":"ECHR, Grand Chamber","vaihe_en":"Decided","lopputulos_en":"Declared inadmissible: domestic remedies not exhausted."},{"id":"eit-ukrainan-lapset","tunnus":"Ukrainian Helsinki HR Union v. Venäjä","elin":"EIT, jaosto","otsikko":"KRIMIN LAPSET: EIT KUULI OSAPUOLIA","pvm":"2026-09-22","pvm_selite":"suullinen käsittely","teksti":"Ukrainan Helsingin ihmisoikeusliitto valittaa kymmenen ukrainalaislapsen puolesta. Lapset asuivat Krimin lastenkodeissa, ja heidän olinpaikkansa on ollut tuntematon siitä lähtien, kun Venäjä otti niemimaan hallintaansa vuonna 2014. Valituksen mukaan lapsille pakotettiin Venäjän kansalaisuus ja heidät annettiin adoptioon, eivätkä Ukrainan viranomaiset ole saaneet tietoja heistä. EIT piti asiassa julkisen suullisen käsittelyn 22.9.2026. Arvioitavana ovat väitteet tahdonvastaisista katoamisista ja niihin liittyvistä ihmisoikeusloukkauksista. Ratkaisu annetaan myöhemmin.","tekstityyppi":"tiivistelmä","lahde":"https://www.echr.coe.int/w/ukrainian-helsinki-human-rights-union-on-behalf-of-ten-ukrainian-children-v.-russia","selko":"Järjestö valittaa kymmenen ukrainalaislapsen puolesta. Lapset katosivat Krimin lastenkodeista, kun Venäjä otti alueen hallintaansa, ja heidät on väitetysti annettu adoptioon. Tuomioistuin kuuli asiaa syyskuussa. Päätös tulee myöhemmin.","vaihe":"Vireillä, käsittely pidetty","aiheet":["ihmisoikeudet","perhe"],"julkaistu":"2026-09-22","paino":4,"otsikko_sv":"BARNEN PÅ KRIM: PARTERNA HÖRDES","teksti_sv":"Ukrainska Helsingforsförbundet för mänskliga rättigheter klagar för tio ukrainska barns räkning. Barnen bodde på barnhem på Krim, och deras vistelseort har varit okänd sedan Ryssland tog kontroll över halvön 2014. Enligt klagomålet påtvingades barnen ryskt medborgarskap och adopterades bort, och de ukrainska myndigheterna har inte fått uppgifter om dem. Europeiska människorättsdomstolen höll en offentlig muntlig förhandling i målet 22.9.2026. Det som ska prövas är påståendena om påtvingade försvinnanden och därtill anknutna kränkningar av de mänskliga rättigheterna. Avgörandet meddelas senare.","selko_sv":"En organisation klagar för tio ukrainska barns räkning. Barnen försvann från barnhem på Krim när Ryssland tog kontroll över området, och de har enligt uppgift adopterats bort. Domstolen hade en förhandling i målet i september. Beslutet kommer senare.","vaihe_sv":"Anhängigt, förhandling hållen","elin_sv":"Europeiska människorättsdomstolen, avdelning","otsikko_en":"CRIMEA'S CHILDREN: ECHR HEARING","teksti_en":"The Ukrainian Helsinki Human Rights Union has applied on behalf of ten Ukrainian children. The children lived in children's homes in Crimea, and their whereabouts have been unknown since Russia took control of the peninsula in 2014. According to the application, the children were forced to take Russian citizenship and were given up for adoption, and the Ukrainian authorities have received no information about them. The Court held a public hearing in the case on 22.9.2026. Under examination are allegations of enforced disappearances and related human rights violations. The judgment will be delivered later.","selko_en":"An organisation has applied on behalf of ten Ukrainian children. The children disappeared from children's homes in Crimea when Russia took control of the area and were allegedly given up for adoption. The Court heard the case in September. The decision will come later.","elin_en":"ECHR, Chamber","vaihe_en":"Pending, hearing held"},{"id":"eit-rasanen-valitus","tunnus":"Räsänen v. Suomi (vireillä)","elin":"EIT","otsikko":"RÄSÄSEN VALITUS VIREILLÄ EIT:SSÄ","pvm":"2026-07-24","pvm_selite":"uutisoitu","teksti":"Kansanedustaja Päivi Räsänen on valittanut Euroopan ihmisoikeustuomioistuimeen korkeimman oikeuden 26.3.2026 antamasta tuomiosta, jossa hänet tuomittiin sakkoihin kiihottamisesta kansanryhmää vastaan. Räsänen vetoaa sanan- ja uskonnonvapauteen. EIT ratkaisee ensin, otetaanko valitus tutkittavaksi. Käsittely voi kestää vuosia. Valitus ei muuta KKO:n tuomion lainvoimaisuutta.","tekstityyppi":"tiivistelmä","lahde":"https://yle.fi/a/74-20237861","selko":"Päivi Räsänen sai korkeimmalta oikeudelta sakot kiihottamisesta kansanryhmää vastaan. Hän on valittanut Euroopan ihmisoikeustuomioistuimeen ja vetoaa sanan- ja uskonnonvapauteen. Tuomio on silti voimassa. Käsittely voi kestää vuosia.","vaihe":"Vireillä, valitus jätetty","aiheet":["ihmisoikeudet","rikos"],"julkaistu":"2026-07-24","paino":4,"otsikko_sv":"RÄSÄNENS KLAGOMÅL I EUROPADOMSTOLEN","teksti_sv":"Riksdagsledamoten Päivi Räsänen har lämnat in ett klagomål till Europeiska människorättsdomstolen över den dom som högsta domstolen meddelade 26.3.2026 och genom vilken hon dömdes till böter för hets mot folkgrupp. Räsänen åberopar yttrande- och religionsfriheten. Europeiska människorättsdomstolen avgör först om klagomålet tas upp till prövning. Behandlingen kan ta flera år. Klagomålet ändrar inte det att HD:s dom har vunnit laga kraft.","selko_sv":"Päivi Räsänen dömdes av högsta domstolen till böter för hets mot folkgrupp. Hon har klagat till Europeiska människorättsdomstolen och åberopar yttrande- och religionsfriheten. Domen gäller ändå. Behandlingen kan ta flera år.","vaihe_sv":"Anhängigt, klagomål inlämnat","elin_sv":"Europeiska människorättsdomstolen","otsikko_en":"RÄSÄNEN APPLICATION PENDING AT ECHR","teksti_en":"Member of Parliament Päivi Räsänen has applied to the European Court of Human Rights against the Supreme Court's judgment of 26.3.2026 in which she was fined for ethnic agitation. Räsänen relies on freedom of expression and freedom of religion. The Court will first decide whether the application is admissible. The proceedings may take years. The application does not affect the finality of the Supreme Court's judgment.","selko_en":"Päivi Räsänen was fined by the Supreme Court for ethnic agitation. She has applied to the European Court of Human Rights, relying on freedom of expression and religion. The judgment nevertheless stands. The proceedings may take years.","elin_en":"ECHR","vaihe_en":"Pending, application lodged"},{"id":"eit-jiitee-tyot","tunnus":"Jiitee Työt Oy v. Suomi","elin":"EIT","otsikko":"EI LOUKKAUSTA: VÄLITYSTUOMIO PYSYI","pvm":"2026-06-09","pvm_selite":"tuomio","teksti":"Suomalainen rakennusyhtiö oli sopinut nopeutetusta välimiesmenettelystä ja luopunut oikeudesta saada perusteltu välitystuomio. Välimies velvoitti yhtiön maksamaan noin 330 000 euroa ilman perusteluja. Yhtiö yritti tuloksetta saada tuomion kumotuksi Suomen tuomioistuimissa. EIT katsoi yksimielisesti, ettei oikeutta oikeudenmukaiseen oikeudenkäyntiin loukattu. Oikeudesta perusteltuun ratkaisuun voi luopua vapaaehtoisessa välimiesmenettelyssä, kun luopuminen on pätevä ja osapuolilla on ollut tosiasiallinen mahdollisuus esittää asiansa.","tekstityyppi":"tiivistelmä","lahde":"https://hudoc.echr.coe.int/?i=001-250430","selko":"Yritys sopi riidan ratkaisemisesta välimiehellä ja hyväksyi, ettei päätöstä perustella. Hävittyään se valitti. Euroopan ihmisoikeustuomioistuimen mukaan Suomi ei rikkonut oikeutta reiluun oikeudenkäyntiin, koska yritys oli itse vapaaehtoisesti luopunut perusteluista.","vaihe":"Ratkaistu","lopputulos":"Ei loukkausta (EIS 6 art. 1 kohta), yksimielinen.","asiasanat":"Välimiesmenettely – Perusteltu ratkaisu – Oikeudesta luopuminen – Välitystuomion kumoaminen","aiheet":["ihmisoikeudet","yhtio"],"julkaistu":"2026-06-09","paino":3,"otsikko_sv":"INGEN KRÄNKNING: SKILJEDOMEN BESTÅR","teksti_sv":"Ett finländskt byggföretag hade avtalat om ett påskyndat skiljeförfarande och avstått från rätten till en motiverad skiljedom. Skiljemannen förpliktade bolaget att betala cirka 330 000 euro utan motivering. Bolaget försökte utan framgång få skiljedomen upphävd vid finländska domstolar. Europeiska människorättsdomstolen ansåg enhälligt att rätten till en rättvis rättegång inte hade kränkts. Man kan avstå från rätten till ett motiverat avgörande i ett frivilligt skiljeförfarande, när avståendet är giltigt och parterna har haft en verklig möjlighet att lägga fram sin sak.","selko_sv":"Ett företag avtalade om att en tvist skulle avgöras av en skiljeman och godkände att beslutet inte motiveras. Efter att ha förlorat överklagade det. Enligt Europeiska människorättsdomstolen kränkte Finland inte rätten till en rättvis rättegång, eftersom företaget självt frivilligt hade avstått från motiveringen.","asiasanat_sv":"Skiljeförfarande – Motiverat avgörande – Avstående från rättighet – Upphävande av skiljedom","lopputulos_sv":"Ingen kränkning (artikel 6.1 i Europeiska människorättskonventionen), enhälligt.","vaihe_sv":"Avgjort","elin_sv":"Europeiska människorättsdomstolen","otsikko_en":"NO VIOLATION: ARBITRAL AWARD STANDS","teksti_en":"A Finnish construction company had agreed to expedited arbitration and waived its right to a reasoned arbitral award. The arbitrator ordered the company to pay about 330 000 euros without giving reasons. The company tried unsuccessfully to have the award set aside in the Finnish courts. The Court unanimously found no violation of the right to a fair trial. The right to a reasoned decision can be waived in voluntary arbitration when the waiver is valid and the parties have had a genuine opportunity to present their case.","selko_en":"A company agreed to have a dispute decided by an arbitrator and accepted that the decision would not be reasoned. After losing, it complained. According to the European Court of Human Rights, Finland did not violate the right to a fair trial, because the company had itself voluntarily waived the reasons.","asiasanat_en":"Arbitration – Reasoned decision – Waiver of a right – Setting aside an arbitral award","elin_en":"ECHR","vaihe_en":"Decided","lopputulos_en":"No violation (Article 6 § 1), unanimously."},{"id":"eit-lunastus-vantaa","tunnus":"Lunastusasia v. Suomi","elin":"EIT","otsikko":"KIINTEISTÖN LUNASTUS: EI TUTKITA","pvm":"2026-03-12","pvm_selite":"päätös tiedotettu","teksti":"Kolme kiinteistönosan omistajaa valitti kaupungin toteuttamasta lunastuksesta. Heidän mukaansa lunastus palveli kaupungin taloudellista etua eikä yleistä etua, korvaus oli liian pieni ja kaupunki oli keinotekoisesti alentanut maan arvoa. He vetosivat omaisuudensuojaan ja oikeudenmukaiseen oikeudenkäyntiin. EIT jätti valituksen yksimielisesti tutkimatta ilmeisen perusteettomana: lunastus oli kaupunkikehityksen kannalta yleisen edun mukainen, korvauksessa oli otettu huomioon merkitykselliset seikat ja viranomaiset pysyivät harkintavaltansa rajoissa.","tekstityyppi":"tiivistelmä","lahde":"https://um.fi/ajankohtaista/-/asset_publisher/gc654PySnjTX/content/euroopan-ihmisoikeustuomioistuimen-paatos-kiinteiston-lunastusta-koskevassa-asiassa","selko":"Maanomistajat valittivat, että kaupunki lunasti heidän maansa liian halvalla ja väärästä syystä. Euroopan ihmisoikeustuomioistuimen mukaan lunastus oli yleisen edun mukainen ja korvaus arvioitiin asianmukaisesti. Valitusta ei otettu käsiteltäväksi.","vaihe":"Ratkaistu","lopputulos":"Jätettiin tutkimatta ilmeisen perusteettomana.","asiasanat":"Omaisuudensuoja – Lunastus – Lunastuskorvaus – Yleinen etu","aiheet":["ihmisoikeudet","asuminen","ymparisto"],"julkaistu":"2026-03-12","paino":2,"otsikko_sv":"INLÖSEN AV FASTIGHET: AVVISADES","teksti_sv":"Tre ägare till en fastighetsdel klagade över en inlösen som staden hade genomfört. Enligt dem tjänade inlösningen stadens ekonomiska intresse och inte det allmänna intresset, ersättningen var för låg och staden hade på konstlad väg sänkt markens värde. De åberopade egendomsskyddet och rätten till en rättvis rättegång. Europeiska människorättsdomstolen avvisade enhälligt klagomålet som uppenbart ogrundat: inlösningen låg i det allmänna intresset med tanke på stadsutvecklingen, vid bestämningen av ersättningen hade relevanta omständigheter beaktats och myndigheterna hade hållit sig inom ramen för sin prövningsrätt.","selko_sv":"Markägarna klagade över att staden löste in deras mark för billigt och av fel skäl. Enligt Europeiska människorättsdomstolen låg inlösningen i det allmänna intresset och ersättningen hade bedömts på ett korrekt sätt. Klagomålet togs inte upp till behandling.","asiasanat_sv":"Egendomsskydd – Inlösen – Inlösningsersättning – Allmänt

<script type="application/json" id="laki-tv-data">{"paivitetty":"2026-10-04T14:47:24+03:00","tiedote":"LAUSUNNOT: LAPSIRAUHA 15.10. ASTI","etusivu":[],"kanavat":{"kko":[{"id":"KKO:2026:73","tunnus":"KKO:2026:73","otsikko":"DVV EI KORVAA KULUJA HOVIOIKEUDESSA","pvm":"2026-09-30","pvm_selite":"annettu","julkaistu":"2026-09-30T09:00","paino":3,"elin":"Korkein oikeus","asiasanat":"Oikeudenkäyntikulut; Holhoustoimi – Edunvalvojan vapauttaminen","teksti":"Digi- ja väestötietovirasto vaati hakemuksessaan käräjäoikeudelle muun muassa, että täysi-ikäiselle A:lle määrätty edunvalvoja B vapautetaan tehtävästään ja A:n edunvalvojaksi määrätään yleinen edunvalvoja. Käräjäoikeus hyväksyi hakemuksen. Hovioikeus kumosi käräjäoikeuden päätöksen ja velvoitti Digi- ja väestötietoviraston korvaamaan A:n ja B:n oikeudenkäyntikulut hovioikeudessa. Korkein oikeus katsoi ratkaisustaan ilmenevillä perusteilla, että asiassa ei ollut oikeudenkäymiskaaren 21 luvun 2 §:ssä tarkoitettua erityistä syytä velvoittaa Digi- ja väestötietovirastoa korvaamaan A:n ja B:n oikeudenkäyntikuluja hovioikeudessa.","tekstityyppi":"virallinen tiivistelmä","selko":"Digi- ja väestötietovirasto haki, että aikuisen henkilön äidin tilalle hänen edunvalvojakseen määrätään yleinen edunvalvoja. Hovioikeus kumosi käräjäoikeuden päätöksen, joka oli hyväksynyt hakemuksen, ja määräsi viraston maksamaan vastapuolen kulut. KKO:n mukaan tähän ei ollut erityistä syytä, joten virasto ei korvaa kuluja.","lopputulos":"Digi- ja väestötietovirastoa ei velvoitettu korvaamaan A:n ja B:n oikeudenkäyntikuluja hovioikeudessa.","lahde":"https://www.korkeinoikeus.fi/ennakkopaatokset/ennakkopaatokset-vuosittain/kko202673/","aiheet":["perhe","rikos"],"otsikko_sv":"MDB ERSÄTTER INTE KOSTNADERNA","teksti_sv":"Myndigheten för digitalisering och befolkningsdata yrkade i sin ansökan hos tingsrätten bland annat att den intressebevakare B som förordnats för den myndiga personen A skulle entledigas från sitt uppdrag och att en allmän intressebevakare skulle förordnas till A:s intressebevakare. Tingsrätten biföll ansökan. Hovrätten upphävde tingsrättens beslut och förpliktade myndigheten att ersätta A:s och B:s rättegångskostnader i hovrätten. Högsta domstolen ansåg på de grunder som framgår av avgörandet att det inte fanns något sådant särskilt skäl som avses i 21 kap. 2 § i rättegångsbalken att förplikta myndigheten att ersätta A:s och B:s rättegångskostnader i hovrätten.","selko_sv":"Myndigheten för digitalisering och befolkningsdata ansökte om att en allmän intressebevakare skulle ersätta en vuxen persons mamma som intressebevakare. Hovrätten upphävde tingsrättens beslut som hade godkänt ansökan och ålade myndigheten att betala motpartens kostnader. Enligt HD fanns det inget särskilt skäl för detta, så myndigheten ersätter inte kostnaderna.","asiasanat_sv":"Rättegångskostnader; Förmynderskap – Entledigande av intressebevakare","lopputulos_sv":"Myndigheten för digitalisering och befolkningsdata förpliktades inte att ersätta A:s och B:s rättegångskostnader i hovrätten.","elin_sv":"Högsta domstolen","lisatty":"2026-09-30T17:16","otsikko_en":"DVV NOT LIABLE FOR APPEAL COSTS","teksti_en":"The Digital and Population Data Services Agency (DVV) applied to the District Court, among other things, for the discharge of B, the guardian appointed for the adult A, and for the appointment of a public guardian as A's guardian. The District Court granted the application. The Court of Appeal overturned the District Court's decision and ordered DVV to pay A's and B's legal costs in the Court of Appeal. On the grounds stated in its ruling, the Supreme Court held that there was no special reason within the meaning of Chapter 21, section 2 of the Code of Judicial Procedure to order DVV to pay A's and B's legal costs in the Court of Appeal.","selko_en":"The Digital and Population Data Services Agency asked a court to replace an adult's mother with a public guardian as the adult's guardian. The Court of Appeal overturned the District Court's decision granting the application and ordered the agency to pay the other side's costs. According to the Supreme Court there was no special reason for this, so the agency does not pay the costs.","asiasanat_en":"Legal costs; Guardianship – Discharge of a guardian","elin_en":"Supreme Court","lopputulos_en":"DVV was not ordered to pay A's and B's legal costs in the Court of Appeal."},{"id":"KKO:2026:72","tunnus":"KKO:2026:72","elin":"Korkein oikeus","otsikko":"ASIANTUNTIJAKULUT VALTION VAROISTA","pvm":"2026-09-29","pvm_selite":"annettu","julkaistu":"2026-09-29T09:00","asiasanat":"Oikeusapu – Asiantuntija – Asianosaisen käyttämä asiantuntija – Todistelukustannukset","teksti":"Raiskauksesta syytetty A oli syytteen kiistäessään vedonnut lääketieteen lisensiaatin antamaan asiantuntijalausuntoon, jossa oli arvioitu asianomistajan psyykkisistä oireista esitettyjä potilasasiakirjoja ja asianomistajaa koskevissa lääkärinlausunnoissa tehtyä syy-yhteysarviointia. Käräjäoikeuden tuomittua A:n raiskauksesta hän oli hovioikeudessa vedonnut lisäksi oikeuspsykologian dosentin antamaan asiantuntijalausuntoon, jossa oli arvioitu asianomistajan kertomuksen luotettavuutta. A vaati lausuntojen hankkimisesta aiheutuneiden kustannusten korvaamista valtion varoista, koska hänelle oli määrätty puolustaja. Kysymys siitä, olivatko asiantuntijalausunnot olleet tarpeen asian selvittämiseksi ja tuliko niistä aiheutuneet kustannukset siten korvata valtion varoista. (Ään.)","tekstityyppi":"virallinen tiivistelmä","selko":"Syytetty vetosi raiskausasiassa kahteen asiantuntijalausuntoon. Hänellä oli tuomioistuimen määräämä puolustaja. KKO:n mukaan molemmat lausunnot olivat tarpeen asian selvittämiseksi, joten valtio korvaa niiden kuluja yhteensä 4 430 euroa. Ratkaisusta äänestettiin.","lahde":"https://www.korkeinoikeus.fi/ennakkopaatokset/ennakkopaatokset-vuosittain/kko202672/","aiheet":["rikos","ihmisoikeudet"],"paino":4,"lopputulos":"Valtio korvaa lausuntojen kulut yhteensä 4 430 eurolla (ään.).","otsikko_sv":"SAKKUNNIGKOSTNADER UR STATENS MEDEL","teksti_sv":"A, som åtalats för våldtäkt, hade när han bestred åtalet åberopat ett sakkunnigutlåtande av en medicine licentiat, där de patientjournaler som lagts fram om målsägandens psykiska symtom och bedömningen av orsakssambandet i läkarutlåtandena om målsäganden hade bedömts. Efter att tingsrätten dömt A för våldtäkt hade han i hovrätten dessutom åberopat ett sakkunnigutlåtande av en docent i rättspsykologi om tillförlitligheten i målsägandens berättelse. A yrkade att kostnaderna för utlåtandena skulle ersättas av statens medel, eftersom en försvarare hade förordnats för honom. Frågan var om utlåtandena hade varit nödvändiga för utredningen av saken och om kostnaderna därför skulle ersättas av statens medel. (Omröstn.)","selko_sv":"Den åtalade åberopade två sakkunnigutlåtanden i ett våldtäktsmål. Han hade en försvarare som domstolen förordnat. Enligt HD var båda utlåtandena nödvändiga för att utreda saken, så staten ersätter kostnaderna för dem med sammanlagt 4 430 euro. Om avgörandet röstades det.","asiasanat_sv":"Rättshjälp – Sakkunnig – Sakkunnig som parten anlitat – Bevisningskostnader","lopputulos_sv":"Staten ersätter kostnaderna för utlåtandena med sammanlagt 4 430 euro (omröstn.).","elin_sv":"Högsta domstolen","otsikko_en":"EXPERT COSTS PAID BY THE STATE","teksti_en":"A, charged with rape, had in denying the charge relied on an expert opinion by a licentiate of medicine assessing the medical records on the complainant's psychological symptoms and the causation assessment in the medical statements concerning her. After the District Court convicted A of rape, he had in the Court of Appeal also relied on an expert opinion by a docent of forensic psychology on the reliability of the complainant's account. A demanded that the costs of the opinions be paid from state funds, since a defence counsel had been appointed for him. The question was whether the opinions had been necessary to clarify the case and whether their costs were therefore payable from state funds. (Vote)","selko_en":"The accused relied on two expert opinions in a rape case. He had a court-appointed defence counsel. According to the Supreme Court both opinions were necessary to clarify the case, so the State pays their costs, 4 430 euros in total. The ruling was decided by a vote.","asiasanat_en":"Legal aid – Expert – Expert engaged by a party – Costs of evidence","elin_en":"Supreme Court","lopputulos_en":"The State pays the costs of the opinions, 4 430 euros in total (vote)."},{"id":"KKO:2026:71","tunnus":"KKO:2026:71","otsikko":"SYYTTEEN PERUUTUS: VALITUSOIKEUS ON","pvm":"2026-09-28","pvm_selite":"annettu","asiasanat":"Syyte – Syytteen peruuttaminen; Muutoksenhaku – Muutoksenhakuoikeus; Oikeudenkäyntimenettely – Tyytymättömyyden ilmoittaminen","teksti":"Syyttäjä oli ilmoittanut peruuttavansa käräjäoikeudessa vireillä olleen syytteen ja aikovansa tehdä päätöksen syytetoimien siirtämisestä toiseen Euroopan unionin jäsenvaltioon. Vastaaja oli vastustanut syytteen peruuttamista ja vaatinut käsittelyn jatkamista käräjäoikeudessa tai peruutetun syytteen hylkäämistä tuomiolla. Käräjäoikeus jätti syyteasian käsittelyn sillensä ja ilmoitti, ettei ratkaisuun saanut hakea muutosta valittamalla. Korkein oikeus katsoi, että vastaajalla oli oikeus hakea valittamalla muutosta käräjäoikeuden ratkaisuun jättää syyteasia sillensä. Vastaajan tyytymättömyyden ilmoitus tuli sen vuoksi hyväksyä.","tekstityyppi":"virallinen tiivistelmä","lahde":"https://www.korkeinoikeus.fi/ennakkopaatokset/ennakkopaatokset-vuosittain/kko202671/","selko":"Syyttäjä ilmoitti luopuvansa syytteestä, koska aikoi siirtää asian toiseen EU-maahan. Syytetty vastusti. Käräjäoikeus lopetti käsittelyn ja ilmoitti, ettei ratkaisusta saa valittaa. KKO:n mukaan syytetyllä oli silti oikeus valittaa.","aiheet":["rikos"],"julkaistu":"2026-09-28T09:00","paino":3,"otsikko_sv":"ÅTERKALLAT ÅTAL: BESVÄRSRÄTT FINNS","teksti_sv":"Åklagaren hade meddelat att han återkallade ett åtal som var anhängigt i tingsrätten och att han avsåg att fatta beslut om att överföra lagföringen till en annan medlemsstat i Europeiska unionen. Svaranden hade motsatt sig återkallandet och yrkat att behandlingen skulle fortsätta i tingsrätten eller att det återkallade åtalet skulle ogillas genom dom. Tingsrätten lämnade åtalet därhän och meddelade att ändring i avgörandet inte fick sökas genom besvär. Högsta domstolen ansåg att svaranden hade rätt att genom besvär söka ändring i tingsrättens avgörande att lämna åtalet därhän. Svarandens anmälan om missnöje skulle därför godkännas.","selko_sv":"Åklagaren meddelade att han avstod från åtalet eftersom han tänkte överföra saken till ett annat EU-land. Den åtalade motsatte sig. Tingsrätten avslutade behandlingen och meddelade att avgörandet inte fick överklagas. Enligt HD hade den åtalade ändå rätt att överklaga.","asiasanat_sv":"Åtal – Återkallande av åtal; Ändringssökande – Rätt att söka ändring; Rättegångsförfarande – Anmälan om missnöje","otsikko_en":"WITHDRAWN CHARGE: RIGHT TO APPEAL","teksti_en":"The prosecutor had announced the withdrawal of a charge pending in the District Court and an intention to decide on transferring the prosecution to another EU member state. The defendant had opposed the withdrawal and demanded that the proceedings continue in the District Court or that the withdrawn charge be dismissed by judgment. The District Court discontinued the criminal case and stated that the decision could not be appealed. The Supreme Court held that the defendant had the right to appeal against the District Court's decision to discontinue the case. The defendant's notice of intent to appeal therefore had to be accepted.","selko_en":"The prosecutor announced that he was dropping the charge because he intended to transfer the case to another EU country. The accused objected. The District Court ended the proceedings and stated that the decision could not be appealed. According to the Supreme Court the accused nevertheless had the right to appeal.","asiasanat_en":"Charge – Withdrawal of a charge; Appeal – Right of appeal; Procedure – Notice of intent to appeal"},{"id":"KKO:2026:70","tunnus":"KKO:2026:70","otsikko":"SÄILÖÖNOTON 6 KK:N RAJA TÄYTTYI","pvm":"2026-09-25","pvm_selite":"annettu","asiasanat":"Ulkomaalainen; Turvaamistoimi – Säilöönotto; EU-oikeus – Oikeus tehokkaisiin oikeussuojakeinoihin","teksti":"A oli ulkomaalaislain nojalla säilössä kolmessa jaksossa (10.9.–23.11.2022, 5.12.2022–15.3.2023 ja 11.9.2023 alkaen), ja hänet oli käännytetty Marokkoon. KKO katsoi, että kaksi ensimmäistä jaksoa oli otettava huomioon laskettaessa säilössäpidon lähtökohtaista kuuden kuukauden enimmäisaikaa (UlkL 127.1 §) ja että enimmäisaika oli täyttynyt. KKO arvioi lisäksi, oliko käräjäoikeus voinut 7.12.2023 määrätä A:n edelleen säilöön säilössäpidon jatkamisen edellytysten perusteella.","tekstityyppi":"tiivistelmä","lahde":"https://www.korkeinoikeus.fi/ennakkopaatokset/ennakkopaatokset-vuosittain/kko202670/","selko":"Ulkomaalaista saa pitää säilössä lähtökohtaisesti enintään kuusi kuukautta. KKO:n mukaan myös aiemmat säilöjaksot lasketaan mukaan, vaikka niiden välissä olisi taukoja. Tässä asiassa kuuden kuukauden raja oli täyttynyt.","aiheet":["maahanmuutto","eu","ihmisoikeudet"],"julkaistu":"2026-09-25T09:00","paino":4,"otsikko_sv":"FÖRVAR: SEXMÅNADERSGRÄNSEN NÅDDES","teksti_sv":"A hade hållits i förvar med stöd av utlänningslagen under tre perioder (10.9–23.11.2022, 5.12.2022–15.3.2023 och från 11.9.2023) och hade avvisats till Marocko. HD ansåg att de två första perioderna skulle beaktas vid beräkningen av den maximala tiden i förvar, som utgångsmässigt är sex månader (127 § 1 mom. i utlänningslagen), och att den maximala tiden hade uppnåtts. HD bedömde dessutom om tingsrätten 7.12.2023 hade kunnat besluta att A fortfarande skulle hållas i förvar på grund av förutsättningarna för att fortsätta förvaret.","selko_sv":"En utlänning får i regel hållas i förvar i högst sex månader. Enligt HD räknas också tidigare perioder i förvar in, även om det finns uppehåll mellan dem. I det här fallet hade gränsen på sex månader nåtts.","asiasanat_sv":"Utlänning; Säkringsåtgärd – Tagande i förvar; EU-rätt – Rätt till effektiva rättsmedel","otsikko_en":"DETENTION: 6-MONTH LIMIT REACHED","teksti_en":"A had been detained under the Aliens Act in three periods (10.9–23.11.2022, 5.12.2022–15.3.2023 and from 11.9.2023) and had been refused entry and returned to Morocco. The Supreme Court held that the first two periods had to be taken into account when calculating the basic maximum detention period of six months (section 127(1) of the Aliens Act) and that the maximum period had been reached. The Supreme Court further assessed whether the District Court could on 7.12.2023 have ordered A's continued detention on the basis of the conditions for extending detention.","selko_en":"A foreign national may as a rule be detained for at most six months. According to the Supreme Court earlier detention periods also count, even if there are breaks between them. In this case the six-month limit had been reached.","asiasanat_en":"Alien; Precautionary measure – Detention; EU law – Right to an effective remedy"},{"id":"KKO:2026:69","tunnus":"KKO:2026:69","otsikko":"ERITYISAVUSTAJALLE SAKOT PETOKSESTA","pvm":"2026-09-24","pvm_selite":"annettu","asiasanat":"Petos; Virkarikos – Virkavelvollisuuden rikkominen; Tahallisuus – Korotettu tahallisuusvaatimus","teksti":"Ministerin erityisavustaja A oli tilannut ministerille esiintymisvalmennuksen, joka laskutettiin ja maksettiin ministeriön määrärahoista. Korkein oikeus katsoi, että valmennus liittyi ministerin puoluejohtajan tehtäviin eikä ministerin tehtäviin. A oli erehdyttänyt ministeriön perusteettomaan maksuun ja aiheuttanut sille taloudellista vahinkoa. Helsingin hovioikeus oli hylännyt syytteet. KKO luki A:n syyksi petoksen (RL 36:1.1) ja virkavelvollisuuden rikkomisen (RL 40:9.1) ja tuomitsi hänet 80 päiväsakkoon eli 3 120 euron sakkoon.","tekstityyppi":"tiivistelmä","lahde":"https://www.korkeinoikeus.fi/ennakkopaatokset/ennakkopaatokset-vuosittain/kko202669/","selko":"Ministerin erityisavustaja tilasi ministerille esiintymisvalmennuksen ja maksatti sen ministeriöllä. KKO:n mukaan valmennus liittyi puoluetyöhön, ei ministerin työhön. Avustaja tuomittiin petoksesta ja virkavelvollisuuden rikkomisesta 80 päiväsakkoon.","aiheet":["rikos","hallinto"],"julkaistu":"2026-09-24T09:00","paino":4,"otsikko_sv":"BÖTER TILL SPECIALMEDARBETARE","teksti_sv":"Ministerns specialmedarbetare A hade beställt en utbildning i offentligt uppträdande för ministern, som fakturerades och betalades med ministeriets anslag. Högsta domstolen ansåg att utbildningen hänförde sig till ministerns uppgifter som partiordförande och inte till ministerns uppgifter. A hade vilselett ministeriet till en ogrundad betalning och orsakat det ekonomisk skada. Helsingfors hovrätt hade förkastat åtalen. HD dömde A för bedrägeri (SL 36:1.1) och brott mot tjänsteplikten (SL 40:9.1) till 80 dagsböter, dvs. böter på 3 120 euro.","selko_sv":"Ministerns specialmedarbetare beställde en utbildning i att uppträda för ministern och lät ministeriet betala den. Enligt HD hörde utbildningen till partiarbetet, inte till ministerns arbete. Medarbetaren dömdes för bedrägeri och brott mot tjänsteplikten till 80 dagsböter.","asiasanat_sv":"Bedrägeri; Tjänstebrott – Brott mot tjänsteplikten; Uppsåt – Skärpt krav på uppsåt","otsikko_en":"MINISTER'S AIDE FINED FOR FRAUD","teksti_en":"A, a minister's special adviser, had ordered presentation coaching for the minister, which was invoiced to and paid from the ministry's appropriations. The Supreme Court held that the coaching related to the minister's duties as party leader and not to the minister's official duties. A had misled the ministry into an unfounded payment and caused it financial loss. The Helsinki Court of Appeal had dismissed the charges. The Supreme Court found A guilty of fraud (Criminal Code 36:1.1) and breach of official duty (Criminal Code 40:9.1) and sentenced him to 80 day-fines, a fine of 3 120 euros.","selko_en":"A minister's special adviser ordered presentation coaching for the minister and had the ministry pay for it. According to the Supreme Court the coaching related to party work, not the minister's work. The adviser was sentenced to 80 day-fines for fraud and breach of official duty.","asiasanat_en":"Fraud; Offence in office – Breach of official duty; Intent – Heightened intent requirement"},{"id":"KKO:2026:68","tunnus":"KKO:2026:68","otsikko":"VANHENTUNUT VELKA ENNAKKOPERINNÖKSI","pvm":"2026-09-23","pvm_selite":"annettu","asiasanat":"Perintökaari – Perintö – Ennakkoperintö; Velan vanhentuminen","teksti":"Rintaperillisen velka perittävälle oli vanhentunut perittävän eläessä. Kun muuta ei ollut määrätty tai olosuhteisiin katsoen otaksuttava tarkoitetun, vanhentuneen velan määrä katsottiin rintaperillisen saamaksi ennakkoperinnöksi.","lopputulos":"Hovioikeuden tuomion lopputulosta ei muuteta.","tekstityyppi":"virallinen tiivistelmä","lahde":"https://www.korkeinoikeus.fi/ennakkopaatokset/ennakkopaatokset-vuosittain/kko202668/","selko":"Lapsi oli velkaa vanhemmalleen, mutta velka vanheni vanhemman eläessä. Kun vanhempi kuoli, vanhentuneen velan määrä katsottiin lapsen ennakkoperinnöksi, ellei muuta ollut määrätty. Ennakkoperintö otetaan huomioon perintöä jaettaessa.","aiheet":["perhe"],"julkaistu":"2026-09-23T09:00","paino":3,"otsikko_sv":"PRESKRIBERAD SKULD SOM ARVSFÖRSKOTT","teksti_sv":"En bröstarvinges skuld till arvlåtaren hade preskriberats medan arvlåtaren levde. När inte annat hade förordnats eller med hänsyn till omständigheterna kunde antas ha varit avsett, ansågs beloppet av den preskriberade skulden utgöra förskott på arv som bröstarvingen fått.","selko_sv":"Ett barn var skyldigt sin förälder pengar, men skulden preskriberades medan föräldern levde. När föräldern dog ansågs beloppet av den preskriberade skulden vara förskott på arv för barnet, om inte annat hade bestämts. Förskott på arv beaktas när arvet skiftas.","asiasanat_sv":"Ärvdabalken – Arv – Förskott på arv; Preskription av skuld","lopputulos_sv":"Hovrättens domslut ändras inte.","otsikko_en":"TIME-BARRED DEBT AS ADVANCEMENT","teksti_en":"A direct heir's debt to the deceased had become time-barred during the deceased's lifetime. As nothing else had been prescribed or could, in view of the circumstances, be presumed to have been intended, the amount of the time-barred debt was deemed an advancement received by the direct heir.","selko_en":"A child owed money to a parent, but the debt became time-barred while the parent was alive. When the parent died, the amount of the time-barred debt was deemed an advancement on the child's inheritance, unless otherwise prescribed. An advancement is taken into account when the estate is divided.","asiasanat_en":"Code of Inheritance – Inheritance – Advancement; Limitation of debt","lopputulos_en":"The outcome of the Court of Appeal's judgment is not changed."},{"id":"KKO:2026:67","tunnus":"KKO:2026:67","otsikko":"HUIVI JA POLIISIN VOIMAKEINOT, KKO","pvm":"2026-09-22","pvm_selite":"annettu","asiasanat":"Virkarikos – Virkavelvollisuuden rikkominen; Poliisi – Voimakeinojen käyttö; Pahoinpitely","teksti":"Turvapaikkaa hakeneet X ja Y olivat kieltäytyneet uskontoonsa vedoten riisumasta pään peittävää mutta kasvot paljastavaa huivia turvapaikkahakemuksen rekisteröinnin yhteydessä poliisilaitoksella otettavaa valokuvaa varten. Kysymys siitä, oliko poliisilla ollut lailliset perusteet käyttää voimakeinoja X:n ja Y:n valokuvaamiseksi ilman huiveja. (Ään.)","lopputulos":"Hovioikeuden tuomion lopputulosta ei muuteta.","tekstityyppi":"virallinen tiivistelmä","lahde":"https://www.korkeinoikeus.fi/ennakkopaatokset/ennakkopaatokset-vuosittain/kko202667/","selko":"Turvapaikanhakijat eivät uskontonsa vuoksi suostuneet riisumaan huiviaan poliisin ottamaa valokuvaa varten. KKO arvioi, saiko poliisi käyttää voimakeinoja kuvan ottamiseksi. Hovioikeuden tuomion lopputulos jäi voimaan. Ratkaisusta äänestettiin.","aiheet":["rikos","turvallisuus","ihmisoikeudet"],"julkaistu":"2026-09-22T09:00","paino":4,"otsikko_sv":"HUVUDDUK OCH POLISENS MAKTMEDEL, HD","teksti_sv":"Asylsökandena X och Y hade med hänvisning till sin religion vägrat att ta av sig en huvudduk som täckte huvudet men lämnade ansiktet synligt för det fotografi som togs vid polisinrättningen i samband med registreringen av asylansökan. Frågan gällde om polisen hade haft laglig grund att använda maktmedel för att fotografera X och Y utan huvudduk. (Omröstn.)","selko_sv":"Asylsökande ville av religiösa skäl inte ta av sig huvudduken när polisen skulle fotografera dem. HD bedömde om polisen fick använda maktmedel för att ta fotot. Hovrättens domslut står fast. Om avgörandet röstades det.","asiasanat_sv":"Tjänstebrott – Brott mot tjänsteplikten; Polis – Användning av maktmedel; Misshandel","lopputulos_sv":"Hovrättens domslut ändras inte.","otsikko_en":"HEADSCARF AND POLICE FORCE, KKO","teksti_en":"Asylum seekers X and Y had, citing their religion, refused to remove a scarf covering the head but leaving the face visible for the photograph taken at the police station when their asylum applications were registered. The question was whether the police had had lawful grounds to use force in order to photograph X and Y without the scarves. (Vote)","selko_en":"Asylum seekers refused on religious grounds to remove their headscarves for a police photograph. The Supreme Court assessed whether the police were allowed to use force to take the photo. The outcome of the Court of Appeal's judgment stands. The ruling was decided by a vote.","asiasanat_en":"Offence in office – Breach of official duty; Police – Use of force; Assault","lopputulos_en":"The outcome of the Court of Appeal's judgment is not changed."},{"id":"KKO:2026:66","tunnus":"KKO:2026:66","otsikko":"TIEKUNNAN KÄYTTÖMAKSU OLI PÄTEVÄ","pvm":"2026-09-21","pvm_selite":"annettu","asiasanat":"Yksityistie – Käyttömaksu; Tiekunta – Tiekunnan päätöksen moite; Puhevalta","teksti":"Tieosakas oli käyttänyt yksityistietä tilapäisesti tavalla, joka huomattavasti poikkesi siitä, mikä oli otettu huomioon tieyksikköjä määrättäessä. Yksityistien tiekunta oli tilapäisen tienkäytön perusteella määrännyt tieosakkaalle käyttömaksun. Ratkaisustaan ilmenevin perustein Korkein oikeus katsoi, että käyttömaksun määrääminen ei edellyttänyt maksun perustumista tienkäytöstä aiheutuneiden ylimääräisten tienpitokustannusten kattamiseen. Tiekunnalla oli ollut yksityistielain 39 §:n 4 momentin mukainen peruste käyttömaksun määräämiselle. Kanne tiekunnan päätöksen julistamisesta pätemättömäksi hylättiin.","tekstityyppi":"virallinen tiivistelmä","lahde":"https://www.korkeinoikeus.fi/ennakkopaatokset/ennakkopaatokset-vuosittain/kko202666/","selko":"Tieosakas käytti yksityistietä tilapäisesti tavalla, joka poikkesi paljon tavallisesta. Tiekunta määräsi hänelle käyttömaksun. KKO:n mukaan maksun ei tarvinnut vastata tiehen aiheutuneita lisäkuluja. Maksu oli laillinen.","aiheet":["asuminen"],"julkaistu":"2026-09-21T09:00","paino":2,"otsikko_sv":"VÄGLAGETS BRUKSAVGIFT VAR GILTIG","teksti_sv":"En vägdelägare hade tillfälligt använt en enskild väg på ett sätt som avsevärt avvek från det som hade beaktats när vägenheterna fastställdes. Väglaget för den enskilda vägen hade på grund av den tillfälliga användningen påfört vägdelägaren en bruksavgift. På de grunder som framgår av avgörandet ansåg högsta domstolen att påförandet av bruksavgiften inte förutsatte att avgiften grundade sig på att täcka extra väghållningskostnader som användningen orsakat. Väglaget hade haft grund enligt 39 § 4 mom. i lagen om enskilda vägar att påföra bruksavgiften. Talan om att väglagets beslut skulle förklaras ogiltigt förkastades.","selko_sv":"En vägdelägare använde en enskild väg tillfälligt på ett sätt som skilde sig mycket från det vanliga. Väglaget påförde honom en bruksavgift. Enligt HD behövde avgiften inte motsvara de extra kostnader som vägen fick. Avgiften var laglig.","asiasanat_sv":"Enskild väg – Bruksavgift; Väglag – Klander av väglagets beslut; Talerätt","otsikko_en":"ROAD ASSOCIATION'S FEE WAS VALID","teksti_en":"A road shareholder had temporarily used a private road in a way that differed considerably from what had been taken into account when the road units were determined. The private road association had, on the basis of the temporary use, imposed a usage fee on the shareholder. On the grounds stated in its ruling, the Supreme Court held that imposing the usage fee did not require the fee to be based on covering the additional road maintenance costs caused by the use. The road association had had grounds under section 39(4) of the Private Roads Act to impose the fee. The action to declare the association's decision invalid was dismissed.","selko_en":"A road shareholder temporarily used a private road in a way that differed greatly from normal use. The road association imposed a usage fee on him. According to the Supreme Court the fee did not have to match the extra costs caused to the road. The fee was lawful.","asiasanat_en":"Private road – Usage fee; Road association – Challenge to a road association's decision; Standing"},{"id":"KKO:2026:65","tunnus":"KKO:2026:65","otsikko":"IRTISANOTULLE EI KORVAUSTA, KKO","pvm":"2026-09-21","pvm_selite":"annettu","asiasanat":"Työsopimus – Työsopimuksen päättäminen – Työsopimuksen irtisanominen","teksti":"A toimi B Oy:n aluepäällikkönä koneiden myynnissä ja vuokrauksessa. Konekaupassa A oli ottanut vastaan laitteita, jotka eivät olleet asiakkaan omistuksessa vaan rahoitettua omaisuutta, ja kirjannut niiden tunnistetiedot puutteellisesti ja virheellisesti. A:ta vastaan nostetut syytteet tuottamuksellisesta rahanpesusta oli hylätty lainvoimaisesti. Kysymys oli siitä, oliko B Oy:llä ollut laillinen peruste irtisanoa A:n työsopimus. KKO vapautti B Oy:n velvollisuudesta suorittaa A:lle korvausta työsuhteen perusteettomasta päättämisestä.","tekstityyppi":"tiivistelmä","lahde":"https://www.korkeinoikeus.fi/ennakkopaatokset/ennakkopaatokset-vuosittain/kko202665/","selko":"Aluepäällikkö otti konekaupassa vastaan laitteita, jotka eivät kuuluneet asiakkaalle, ja kirjasi niiden tiedot väärin. Rahanpesusyytteet hylättiin, mutta KKO:n mukaan työnantajan ei tarvinnut maksaa hänelle korvausta irtisanomisesta.","aiheet":["tyo"],"julkaistu":"2026-09-21T09:00","paino":3,"otsikko_sv":"UPPSAGD FÅR INGEN ERSÄTTNING, HD","teksti_sv":"A arbetade som regionchef för B Ab inom försäljning och uthyrning av maskiner. Vid maskinaffärer hade A tagit emot utrustning som inte ägdes av kunden utan var finansierad egendom, och registrerat utrustningens identifikationsuppgifter bristfälligt och felaktigt. Åtalen mot A för penningtvätt av oaktsamhet hade förkastats genom ett avgörande som vunnit laga kraft. Frågan var om B Ab hade haft laglig grund att säga upp A:s arbetsavtal. HD befriade B Ab från skyldigheten att betala A ersättning för ogrundat upphävande av arbetsavtalet.","selko_sv":"En regionchef tog vid maskinaffärer emot utrustning som inte tillhörde kunden och registrerade uppgifterna fel. Åtalen för penningtvätt förkastades, men enligt HD behövde arbetsgivaren inte betala honom ersättning för uppsägningen.","asiasanat_sv":"Arbetsavtal – Upphörande av arbetsavtal – Uppsägning av arbetsavtal","otsikko_en":"DISMISSED EMPLOYEE GETS NO DAMAGES","teksti_en":"A worked as a regional manager of B Oy in the sale and rental of machinery. In machinery deals A had accepted equipment that was not owned by the customer but was financed property, and had recorded its identification data incompletely and incorrectly. The charges against A for negligent money laundering had been dismissed by a final judgment. The question was whether B Oy had had lawful grounds to terminate A's employment contract. The Supreme Court released B Oy from the obligation to pay A compensation for unfounded termination of employment.","selko_en":"A regional manager accepted equipment in machinery deals that did not belong to the customer and recorded its data incorrectly. The money-laundering charges were dismissed, but according to the Supreme Court the employer did not have to pay him compensation for the dismissal.","asiasanat_en":"Employment contract – Termination of employment – Dismissal"}],"kho":[{"id":"KHO:2026:79","tunnus":"KHO:2026:79","otsikko":"PELIPANOKSET VÄHENNYSKELPOISIA","pvm":"2026-10-01","pvm_selite":"annettu","julkaistu":"2026-10-01T09:01","paino":4,"elin":"Korkein hallinto-oikeus","elin_sv":"Högsta förvaltningsdomstolen","elin_en":"Supreme Administrative Court","asiasanat":"Henkilökohtaisen tulon verotus – Luonnolliset vähennykset – Euroopan talousalueen ulkopuolella järjestetty vedonlyönti – Pelipanos","asiasanat_sv":"Beskattning av personlig inkomst – Naturliga avdrag – Vadhållning som anordnas utanför Europeiska ekonomiska samarbetsområdet – Insats","asiasanat_en":"Taxation of personal income – Natural deductions – Betting organised outside the European Economic Area – Stake","teksti":"Henkilö oli vuonna 2020 lyönyt ETA-alueen ulkopuolella toimivien palveluntarjoajien järjestämissä vedonlyönneissä 2 145 vetoa; panoksia oli 365 606 euroa ja voittoja 406 713 euroa. Toiminta perustui tiedonhankintaan ja analyyseihin, ja siihen kului 30–100 tuntia viikossa. KHO katsoi, ettei vedonlyönti ollut elinkeinotoimintaa, mutta sen laajuuden ja suunnitelmallisuuden vuoksi se oli tuloverolaissa tarkoitettua tulonhankkimistoimintaa. Henkilöllä oli siksi oikeus vähentää ansiotulostaan ETA-alueen ulkopuolella maksetut pelipanokset. Verotuksen oikaisu kumottiin, ja asia palautettiin verotuksen oikaisulautakunnalle muiden vähennysten arvioimiseksi.","tekstityyppi":"tiivistelmä","lopputulos":"Valituslupa myönnettiin. Hallinto-oikeuden ja verotuksen oikaisulautakunnan päätökset sekä verotuksen oikaisu kumottiin, ja asia palautettiin oikaisulautakunnalle. Verohallinto velvoitettiin korvaamaan oikeudenkäyntikulut 5 820 eurolla.","lopputulos_sv":"Besvärstillstånd beviljades. Förvaltningsdomstolens och prövningsnämndens beslut samt rättelsen av beskattningen upphävdes, och ärendet återförvisades till prövningsnämnden. Skatteförvaltningen ålades att ersätta rättegångskostnaderna med 5 820 euro.","lopputulos_en":"Leave to appeal was granted. The decisions of the Administrative Court and the Assessment Adjustment Board and the tax reassessment were set aside, and the matter was referred back to the Board. The Tax Administration was ordered to pay legal costs of 5 820 euros.","selko":"Henkilö löi vetoa laajasti ja suunnitelmallisesti ETA-alueen ulkopuolisilla vedonlyöntisivustoilla. KHO:n mukaan vedonlyönti oli tulon hankkimista, joten hän sai vähentää ansiotulostaan myös hävittyjen vetojen panokset. Verotus käsitellään osin uudelleen.","lahde":"https://www.kho.fi/paatokset/kho202679/","aiheet":["vero"],"otsikko_sv":"SPELINSATSER AVDRAGSGILLA","teksti_sv":"En person hade år 2020 slagit 2 145 vad i vadhållning som anordnades av tjänsteleverantörer utanför EES; insatserna uppgick till 365 606 euro och vinsterna till 406 713 euro. Verksamheten byggde på informationsinhämtning och analyser och tog 30–100 timmar i veckan. HFD ansåg att vadhållningen inte var näringsverksamhet, men på grund av dess omfattning och planmässighet var den sådan inkomstförvärvande verksamhet som avses i inkomstskattelagen. Personen hade därför rätt att från sin förvärvsinkomst dra av insatserna i vadhållning utanför EES. Rättelsen av beskattningen upphävdes, och ärendet återförvisades till prövningsnämnden för bedömning av övriga avdrag.","selko_sv":"En person slog vad i stor omfattning och planmässigt på vadhållningssajter utanför EES. Enligt HFD var vadhållningen inkomstförvärv, så personen fick från sin förvärvsinkomst dra av även insatserna för förlorade vad. Beskattningen behandlas delvis på nytt.","otsikko_en":"BETTING STAKES DEDUCTIBLE","teksti_en":"In 2020 a person had placed 2 145 bets with betting providers operating outside the EEA; stakes totalled 365 606 euros and winnings 406 713 euros. The activity was based on gathering information and analysis and took 30–100 hours a week. The Supreme Administrative Court held that the betting was not a business, but given its scale and planned nature it was an income-generating activity within the meaning of the Income Tax Act. The person was therefore entitled to deduct from earned income the stakes paid in betting outside the EEA. The tax reassessment was set aside and the matter was referred back to the Assessment Adjustment Board to assess other deductions.","selko_en":"A person placed bets extensively and systematically on betting sites outside the EEA. According to the Supreme Administrative Court the betting was an income-generating activity, so the person could deduct from earned income the stakes of lost bets as well. The taxation will be partly reconsidered.","lisatty":"2026-10-01T14:51"},{"id":"KHO:2026:78","tunnus":"KHO:2026:78","otsikko":"PÄÄOMASIJOITUSYHTIÖN VEROTUS","pvm":"2026-10-01","pvm_selite":"annettu","julkaistu":"2026-10-01T09:00","paino":3,"elin":"Korkein hallinto-oikeus","elin_sv":"Högsta förvaltningsdomstolen","elin_en":"Supreme Administrative Court","asiasanat":"Elinkeinotulon verotus – Pääomasijoitustoiminta – Kaksiportainen hankintarakenne","asiasanat_sv":"Beskattning av inkomst av näringsverksamhet – Kapitalplaceringsverksamhet – Förvärvsstruktur i två led","asiasanat_en":"Taxation of business income – Private equity activity – Two-tier acquisition structure","teksti":"D Oy:n hallinnoima pääomasijoitusrahasto E Ky omisti 67 prosenttia A Oy:stä, joka omisti kaikki B Oy:n osakkeet. A Oy ja B Oy oli perustettu C-konsernin hankintaa sekä kaupan kohdeyhtiön C Holding Oy:n hallinnointia ja kehittämistä varten. Kaksiportaista yhtiörakennetta oli edellytetty erityisesti osakeostoon tarvittavan ulkopuolisen rahoituksen hankkimiseksi. Korkein hallinto-oikeus otti asiassa huomioon edellä mainitut B Oy:n perustamiseen liittyvät syyt, sen seikan, ettei C Holding Oy:tä ollut purettu välittömästi osakkeiden hankinnan jälkeen, sekä B Oy:n aseman D Oy:n harjoittaman pääomasijoitustoiminnan kokonaisuudessa ja katsoi, että B Oy oli elinkeinotulon verottamisesta annetun lain 6 §:n 1 momentin 1 kohdassa tarkoitettu pääomasijoitustoimintaa harjoittava yhtiö.","tekstityyppi":"virallinen tiivistelmä","lopputulos":"Valitus hyväksyttiin. Hallinto-oikeuden ja Verohallinnon päätökset kumottiin. Ennakkoratkaisu verovuosille 2024 ja 2025; asia palautettiin Verohallinnolle toisen ennakkoratkaisukysymyksen osalta.","lopputulos_sv":"Besväret godkändes. Förvaltningsdomstolens och Skatteförvaltningens beslut upphävdes. Förhandsavgörande för skatteåren 2024 och 2025; ärendet återförvisades till Skatteförvaltningen i fråga om den andra frågan.","lopputulos_en":"The appeal was allowed. The decisions of the Administrative Court and the Tax Administration were set aside. Advance ruling for tax years 2024 and 2025; the matter was referred back to the Tax Administration on the second question.","selko":"Pääomasijoitusrahasto osti yritysryhmän kahden tätä varten perustetun yhtiön kautta. KHO:n mukaan alempaa yhtiötä pidetään verotuksessa pääomasijoitustoimintaa harjoittavana yhtiönä. Kyse on ennakkoratkaisusta verovuosille 2024 ja 2025.","lahde":"https://www.kho.fi/paatokset/kho202678/","aiheet":["vero","yhtio"],"otsikko_sv":"SKATT FÖR KAPITALPLACERINGSBOLAG","teksti_sv":"Kapitalplaceringsfonden E Ky, som förvaltades av D Oy, ägde 67 procent av A Oy, som ägde alla aktier i B Oy. A Oy och B Oy hade grundats för förvärvet av C-koncernen samt för förvaltningen och utvecklingen av målbolaget C Holding Oy. Strukturen i två led hade krävts särskilt för den externa finansiering som behövdes för aktieköpet. HFD beaktade skälen till att B Oy grundats, att C Holding Oy inte hade upplösts omedelbart efter förvärvet samt B Oy:s ställning i helheten av D Oy:s kapitalplaceringsverksamhet och ansåg att B Oy var ett bolag som bedriver kapitalplaceringsverksamhet enligt 6 § 1 mom. 1 punkten i lagen om beskattning av inkomst av näringsverksamhet.","selko_sv":"En kapitalplaceringsfond köpte en företagsgrupp via två bolag som grundats för detta. Enligt HFD ska det lägre bolaget i beskattningen anses bedriva kapitalplaceringsverksamhet. Det gäller ett förhandsavgörande för skatteåren 2024 och 2025.","otsikko_en":"PRIVATE EQUITY COMPANY TAXATION","teksti_en":"The private equity fund E Ky, managed by D Oy, owned 67 per cent of A Oy, which owned all the shares in B Oy. A Oy and B Oy had been set up for the acquisition of the C group and for managing and developing the target company C Holding Oy. The two-tier structure had been required in particular to obtain the external financing needed for the share purchase. The Supreme Administrative Court considered the reasons for setting up B Oy, the fact that C Holding Oy had not been dissolved immediately after the acquisition, and B Oy's position within D Oy's private equity activity, and held that B Oy was a company engaged in private equity activity within the meaning of section 6(1)(1) of the Business Income Tax Act.","selko_en":"A private equity fund bought a group of companies through two companies set up for that purpose. According to the Supreme Administrative Court, the lower company is treated for tax purposes as a company engaged in private equity activity. This is an advance ruling for tax years 2024 and 2025.","lisatty":"2026-10-01T14:51"},{"id":"KHO:2026:77","tunnus":"KHO:2026:77","otsikko":"TOIMEENTULOTUEN TAKAISINPERINTÄ","pvm":"2026-09-30","pvm_selite":"annettu","julkaistu":"2026-09-30T09:00","paino":3,"elin":"Korkein hallinto-oikeus","asiasanat":"Toimeentulotuen takaisinperintä – Elatusvelvollisuus – Elatusvelvollisuuden tahallinen laiminlyönti – Elatuskyky","teksti":"Kela oli myöntänyt vuoroviikoin asuville lapsille perustoimeentulotukea toisen vanhemman hakemuksesta ja vaati hallinto-oikeudessa toiselta vanhemmalta takaisin yhteensä 5 968 euroa. KHO:n mukaan riittävän elatuskyvyn omaavan vanhemman on huolehdittava lapsensa elatuksesta niin, ettei toimeentulotukea tarvita, eikä elatusvelvollisuus riipu lapsen asumisjärjestelystä. Vanhempi oli tiennyt takaisinperinnän mahdollisuudesta, koska Kela oli tiedustellut häneltä osallistumisesta elatukseen. Takaisinperinnälle ei ollut estettä, vaikka häntä ei ollut kuultu myöhemmistä yksittäisistä toimeentulotukipäätöksistä. Vanhempi oli tahallaan laiminlyönyt elatusvelvollisuutensa. Valitus hylättiin.","tekstityyppi":"tiivistelmä","selko":"Lapset asuivat vuoroviikoin molempien vanhempien luona, ja Kela maksoi heille toimeentulotukea toisen vanhemman hakemuksesta. KHO:n mukaan toisen vanhemman, jolla oli varaa elättää lapsensa, on maksettava tuki takaisin. Elatusvelvollisuus ei riipu siitä, missä lapsi asuu.","lopputulos":"Valitus hylättiin. Hallinto-oikeuden päätöksen lopputulosta ei muutettu.","lahde":"https://www.kho.fi/paatokset/kho202677/","aiheet":["sote","perhe"],"otsikko_sv":"UTKOMSTSTÖD ÅTERKRÄVS AV FÖRÄLDER","teksti_sv":"FPA hade beviljat grundläggande utkomststöd för barn som bodde varannan vecka hos vardera föräldern på ansökan av den ena föräldern och yrkade i förvaltningsdomstolen att den andra föräldern skulle betala tillbaka sammanlagt 5 968 euro. Enligt HFD ska en förälder med tillräcklig underhållsförmåga sörja för barnets underhåll så att utkomststöd inte behövs, och underhållsskyldigheten beror inte på hur barnets boende är ordnat. Föräldern hade känt till möjligheten till återkrav, eftersom FPA hade frågat om deltagande i underhållet. Återkravet hindrades inte av att föräldern inte hörts om de senare enskilda besluten om utkomststöd. Föräldern hade uppsåtligen försummat sin underhållsskyldighet. Besväret avslogs.","selko_sv":"Barnen bodde varannan vecka hos båda föräldrarna, och FPA betalade utkomststöd för dem på ansökan av den ena föräldern. Enligt HFD måste den andra föräldern, som hade råd att försörja sina barn, betala tillbaka stödet. Underhållsskyldigheten beror inte på var barnet bor.","asiasanat_sv":"Återkrav av utkomststöd – Underhållsskyldighet – Uppsåtlig försummelse av underhållsskyldigheten – Underhållsförmåga","lopputulos_sv":"Besväret avslogs. Förvaltningsdomstolens beslut ändrades inte till sitt slut.","elin_sv":"Högsta förvaltningsdomstolen","lisatty":"2026-09-30T17:16","otsikko_en":"RECOVERY OF SOCIAL ASSISTANCE","teksti_en":"Kela had granted basic social assistance to children living alternate weeks with each parent on one parent's application and demanded in the Administrative Court that the other parent repay 5 968 euros in total. According to the Supreme Administrative Court, a parent with sufficient means must provide for the child so that social assistance is not needed, and the maintenance obligation does not depend on the child's living arrangement. The parent had known of the possibility of recovery, since Kela had asked about his participation in maintenance. Recovery was not barred even though he had not been heard on later individual assistance decisions. The parent had intentionally neglected his maintenance obligation. The appeal was dismissed.","selko_en":"Children lived alternate weeks with both parents, and Kela paid them social assistance on one parent's application. According to the Supreme Administrative Court the other parent, who could afford to support the children, must repay the assistance. The maintenance obligation does not depend on where the child lives.","asiasanat_en":"Recovery of social assistance – Maintenance obligation – Intentional neglect of maintenance obligation – Ability to pay maintenance","elin_en":"Supreme Administrative Court","lopputulos_en":"The appeal was dismissed. The outcome of the Administrative Court's decision was not changed."},{"id":"KHO:2026:76","tunnus":"KHO:2026:76","elin":"Korkein hallinto-oikeus","otsikko":"TIERA EI OLLUT LOHJAN SIDOSYKSIKKÖ","pvm":"2026-09-29","pvm_selite":"annettu","julkaistu":"2026-09-29T09:00","asiasanat":"Julkinen hankinta – Sidosyksikköasema – Yhteinen määräysvalta – Hankintayksikön edustus – Ratkaiseva päätösvalta sidosyksikön strategisiin tavoitteisiin ja tärkeisiin päätöksiin","teksti":"Lohjan kaupunki oli hankkinut maankäytön tietojärjestelmän kilpailuttamatta Tiera Oy:ltä, jonka satoja osakkeenomistajia ovat muun muassa kunnat ja hyvinvointialueet. Kaupunki omisti yhtiöstä noin 1,5 prosenttia. KHO:n mukaan pieni omistusosuus tai omistajien suuri määrä ei sellaisenaan estänyt yhteistä määräysvaltaa. Kaupungilla ei kuitenkaan ollut edustajaa tai yhteisedustajaa yhtiön hallituksessa, eikä hallituksen jäsenelle annettu valtuutus korvannut sitä. Edustus ohjausryhmässä ei riittänyt, koska viimekätinen päätösvalta jäi hallitukselle. Tiera ei ollut kaupungin sidosyksikkö, ja hankinta olisi pitänyt kilpailuttaa. KHO kumosi markkinaoikeuden päätöksen. Hankintapäätöstä ei voitu kumota, koska sopimus oli jo tehty.","tekstityyppi":"tiivistelmä","selko":"Lohja osti tietojärjestelmän ilman kilpailutusta yhtiöltä, josta se omisti pienen osan. Ilman kilpailutusta saa ostaa yhtiöltä, jota ostaja ohjaa yhdessä muiden omistajien kanssa. KHO:n mukaan Lohja ei ohjannut yhtiötä, koska sillä ei ollut edustajaa yhtiön hallituksessa. Hankinta olisi pitänyt kilpailuttaa. Sopimus oli jo tehty, joten hankintapäätöstä ei kumottu.","lahde":"https://www.kho.fi/paatokset/kho202676/","aiheet":["hallinto","kilpailu","eu"],"paino":5,"lopputulos":"Markkinaoikeuden päätös kumottiin. Hankinta olisi pitänyt kilpailuttaa.","otsikko_sv":"TIERA VAR INTE LOJOS ANKNUTNA ENHET","teksti_sv":"Lojo stad hade utan konkurrensutsättning upphandlat ett informationssystem för markanvändning av Tiera Oy, vars hundratals aktieägare bland annat är kommuner och välfärdsområden. Staden ägde cirka 1,5 procent av bolaget. Enligt HFD hindrade en liten ägarandel eller ett stort antal ägare inte i sig gemensamt bestämmande inflytande. Staden hade dock ingen representant eller gemensam representant i bolagets styrelse, och en fullmakt som getts en styrelseledamot ersatte inte detta. Representation i styrgruppen räckte inte, eftersom den slutliga beslutanderätten låg hos styrelsen. Tiera var inte stadens anknutna enhet, och upphandlingen borde ha konkurrensutsatts. HFD upphävde marknadsdomstolens beslut. Upphandlingsbeslutet kunde inte upphävas, eftersom avtalet redan hade ingåtts.","selko_sv":"Lojo köpte ett informationssystem utan konkurrensutsättning av ett bolag som staden ägde en liten del av. Utan konkurrensutsättning får man köpa av ett bolag som köparen styr tillsammans med andra ägare. Enligt HFD styrde Lojo inte bolaget, eftersom staden inte hade någon representant i styrelsen. Upphandlingen borde ha konkurrensutsatts. Avtalet hade redan ingåtts, så beslutet upphävdes inte.","asiasanat_sv":"Offentlig upphandling – Ställning som anknuten enhet – Gemensamt bestämmande inflytande – Den upphandlande enhetens representation – Avgörande inflytande över den anknutna enhetens strategiska mål och viktiga beslut","lopputulos_sv":"Marknadsdomstolens beslut upphävdes. Upphandlingen borde ha konkurrensutsatts.","elin_sv":"Högsta förvaltningsdomstolen","otsikko_en":"TIERA WAS NOT AN IN-HOUSE ENTITY","teksti_en":"The City of Lohja had procured a land-use information system without tendering from Tiera Oy, whose hundreds of shareholders include municipalities and wellbeing services counties. The city owned about 1.5 per cent of the company. According to the Supreme Administrative Court, a small shareholding or many owners did not as such prevent joint control. However, the city had no representative or joint representative on the company's board, and an authorisation given to a board member did not replace this. A seat on a steering group was not enough, since ultimate decision-making power remained with the board. Tiera was not the city's in-house entity, and the procurement should have been tendered. The Market Court's decision was overturned; the procurement decision could not be annulled because the contract had already been concluded.","selko_en":"Lohja bought an information system without tendering from a company in which it held a small stake. Buying without tendering is allowed from a company the buyer controls together with the other owners. According to the Supreme Administrative Court, Lohja did not control the company because it had no board representative. The procurement should have been tendered. As the contract had already been made, the procurement decision was not annulled.","asiasanat_en":"Public procurement – In-house status – Joint control – Representation of the contracting entity – Decisive influence over the entity's strategic objectives and significant decisions","elin_en":"Supreme Administrative Court","lopputulos_en":"The Market Court's decision was overturned. The procurement should have been tendered."},{"id":"KHO:2026:75","tunnus":"KHO:2026:75","otsikko":"VALMISTEVERO: EI ARVIOVEROTUSTA","pvm":"2026-09-22","pvm_selite":"annettu","asiasanat":"Verotusmenettely – Valmisteverotus – Arvioverotuksen edellytykset – Veronkorotus – Yksityishenkilön tuomiset – Tullilta saatu selvitys","teksti":"Kun Verohallinto oli veroilmoituksen laiminlyömisestä huolimatta kyennyt perustamaan valmisteveron määräämisen Tullilta saatuun tarkkaan tietoon maahantuotujen valmisteveron alaisten tuotteiden määristä ja lajeista, veron määräämisen ei katsottu tapahtuneen arvioimalla. Veronkorotusta ei tällöin ollut voitu määrätä arvioverotukseen sovellettavan säännöksen mukaisesti 25 prosentin suuruisena määrätystä verosta.","tekstityyppi":"virallinen tiivistelmä","lahde":"https://www.kho.fi/paatokset/kho202675/","selko":"Verottaja määräsi valmisteveron Tullin tarkkojen tietojen perusteella, vaikka veroilmoitus puuttui. KHO:n mukaan kyse ei silloin ollut arvioverotuksesta, joten veronkorotus ei voinut olla arvioverotuksen 25 prosenttia.","aiheet":["vero"],"julkaistu":"2026-09-22T09:00","paino":2,"otsikko_sv":"PUNKTSKATT: INGEN SKÖNSBESKATTNING","teksti_sv":"När Skatteförvaltningen trots att skattedeklarationen försummats hade kunnat grunda påförandet av punktskatt på exakta uppgifter från Tullen om mängderna och slagen av importerade punktskattepliktiga produkter, ansågs skatten inte ha påförts genom uppskattning. Skatteförhöjningen hade då inte kunnat påföras enligt den bestämmelse som tillämpas vid skönsbeskattning till 25 procent av den påförda skatten.","selko_sv":"Skatteförvaltningen påförde punktskatt utifrån Tullens exakta uppgifter, fast skattedeklarationen saknades. Enligt HFD var det då inte fråga om skönsbeskattning, så skatteförhöjningen kunde inte vara skönsbeskattningens 25 procent.","asiasanat_sv":"Beskattningsförfarande – Punktbeskattning – Förutsättningar för skönsbeskattning – Skatteförhöjning – Privatpersons införsel – Utredning från Tullen","otsikko_en":"EXCISE DUTY: NO ESTIMATED TAXATION","teksti_en":"When the Tax Administration had, despite the failure to file a tax return, been able to base the excise duty assessment on precise information obtained from Customs on the quantities and types of imported excise goods, the assessment was not deemed to have been made by estimation. A tax increase could therefore not be imposed at 25 per cent of the assessed tax under the provision applicable to estimated taxation.","selko_en":"The tax authority assessed excise duty on the basis of precise Customs data, even though no tax return had been filed. According to the Supreme Administrative Court this was not estimated taxation, so the tax increase could not be the 25 per cent applicable to estimated taxation.","asiasanat_en":"Tax procedure – Excise taxation – Conditions for estimated taxation – Tax increase – Goods brought in by a private individual – Information obtained from Customs"},{"id":"KHO:2026:74","tunnus":"KHO:2026:74","otsikko":"LEASING+LAITETURVA: YKSI SUORITUS","pvm":"2026-09-17","pvm_selite":"annettu","asiasanat":"Arvonlisävero – Palvelun myynti – Leasingvuokraus – Leasingkohteen vakuuttaminen – Liittymisperiaate","teksti":"A Oy tarjosi leasingvuokrauksen yhteydessä laiteturvapalvelua. KHO katsoi, että laiteturvapalvelussa oli kysymys vaaranvastuun jakamisesta vuokralleantajan ja vuokralleottajan välillä eikä erillisestä vakuutus- tai jälleenvakuutustoiminnasta. Leasingpalvelu ja laiteturvapalvelu muodostivat arvonlisäverotuksessa yhden ainoan verollisen suorituksen. A Oy:llä oli arvonlisäverolain 102 §:n mukainen vähennysoikeus vuokra-aikana syntyneistä korjaus- ja korvauskustannuksista.","tekstityyppi":"tiivistelmä","lahde":"https://www.kho.fi/paatokset/kho202674/","selko":"Leasingyhtiö myi vuokrattavan laitteen lisäksi laiteturvaa. KHO:n mukaan laiteturva ei ollut vakuutusta vaan osa samaa vuokrapalvelua. Kokonaisuus on arvonlisäverotuksessa yksi myynti, ja yhtiö saa vähentää korjauskulujen arvonlisäveron.","aiheet":["vero"],"julkaistu":"2026-09-17T09:00","paino":2,"otsikko_sv":"LEASING OCH SKYDD: EN PRESTATION","teksti_sv":"A Ab erbjöd en tjänst för apparatskydd i samband med leasinguthyrning. HFD ansåg att tjänsten gällde fördelningen av risken mellan uthyraren och hyrestagaren och inte separat försäkrings- eller återförsäkringsverksamhet. Leasingtjänsten och apparatskyddet utgjorde vid mervärdesbeskattningen en enda skattepliktig prestation. A Ab hade avdragsrätt enligt 102 § i mervärdesskattelagen för reparations- och ersättningskostnader som uppkommit under hyrestiden.","selko_sv":"Ett leasingbolag sålde förutom den hyrda apparaten också ett apparatskydd. Enligt HFD var skyddet inte en försäkring utan en del av samma uthyrningstjänst. Helheten är en enda försäljning vid mervärdesbeskattningen, och bolaget får dra av mervärdesskatten på reparationskostnaderna.","asiasanat_sv":"Mervärdesskatt – Försäljning av tjänst – Leasinguthyrning – Försäkring av leasingobjektet – Principen om accessoriska prestationer","otsikko_en":"LEASING + DEVICE COVER: ONE SUPPLY","teksti_en":"A Oy offered a device protection service in connection with leasing. The Supreme Administrative Court held that the device protection service concerned the allocation of risk between the lessor and the lessee and was not separate insurance or reinsurance activity. The leasing service and the device protection service formed a single taxable supply for VAT purposes. A Oy had the right under section 102 of the VAT Act to deduct the VAT on repair and replacement costs arising during the lease period.","selko_en":"A leasing company sold device cover alongside the leased equipment. According to the Supreme Administrative Court the device cover was not insurance but part of the same leasing service. For VAT purposes the whole is one supply, and the company may deduct the VAT on repair costs.","asiasanat_en":"Value added tax – Supply of services – Leasing – Insuring the leased object – Principle of accessory supply"},{"id":"KHO:2026:73","tunnus":"KHO:2026:73","otsikko":"VALTUUSTO SAI EROTTAA LAUTAKUNNASTA","pvm":"2026-09-16","pvm_selite":"annettu","asiasanat":"Kunnallisasia – Luottamushenkilöiden erottaminen kesken toimikauden – Puheenjohtajiston erottaminen – Suhteellisuuden periaate","teksti":"Asiassa oli kysymys kuntalain 34 §:n 2 momentin tulkinnasta. Säännöksen nojalla valtuusto voi luottamuspulan perusteella erottaa valitsemansa toimielimen puheenjohtajiston kesken toimikauden. Korkeimman hallinto-oikeuden ratkaistavana oli kysymys siitä, oliko valtuusto voinut erottaa luottamushenkilöt toimielimen puheenjohtajuuden ohella heidän johtamansa toimielimen jäsenyydestä. Korkein hallinto-oikeus katsoi, ettei säännöstä ollut sen tarkoitus huomioon ottaen syytä tulkita valtuuston toimivaltaa kaventavasti. Valtuusto oli voinut erottaa toimielimen puheenjohtajiston toimielimen jäsenyydestä kuntalain 34 §:n 2 momentin nojalla eli ilman, että tämä edellyttäisi koko toimielimen erottamista saman pykälän 1 momentin mukaisesti.","tekstityyppi":"virallinen tiivistelmä","huom":"Ähtärin tarkastuslautakunta. Äänestysratkaisu.","lahde":"https://www.kho.fi/paatokset/kho202673/","selko":"Kunnanvaltuusto saa luottamuspulan vuoksi erottaa lautakunnan puheenjohtajan ja varapuheenjohtajan kesken kauden. KHO:n mukaan heidät saa samalla erottaa myös lautakunnan jäsenyydestä, eikä koko lautakuntaa tarvitse erottaa. Ratkaisusta äänestettiin.","aiheet":["hallinto"],"julkaistu":"2026-09-16T09:00","paino":3,"otsikko_sv":"FULLMÄKTIGE FICK ENTLEDIGA UR NÄMND","teksti_sv":"Ärendet gällde tolkningen av 34 § 2 mom. i kommunallagen. Med stöd av bestämmelsen kan fullmäktige på grund av bristande förtroende entlediga presidiet för ett organ som fullmäktige valt under mandattiden. HFD skulle avgöra om fullmäktige hade kunnat entlediga de förtroendevalda inte bara från ordförandeskapet utan också från medlemskapet i det organ som de ledde. HFD ansåg att det med beaktande av syftet med bestämmelsen inte fanns skäl att tolka fullmäktiges befogenheter snävt. Fullmäktige hade kunnat entlediga organets presidium från medlemskapet med stöd av 34 § 2 mom. i kommunallagen, alltså utan att hela organet måste entledigas enligt 1 mom. i samma paragraf.","selko_sv":"Kommunfullmäktige får på grund av bristande förtroende entlediga en nämnds ordförande och vice ordförande mitt under mandattiden. Enligt HFD får de samtidigt också entledigas från medlemskapet i nämnden, och hela nämnden behöver inte entledigas. Om avgörandet röstades det.","asiasanat_sv":"Kommunala ärenden – Entledigande av förtroendevalda under mandattiden – Entledigande av presidiet – Proportionalitetsprincipen","huom_sv":"Revisionsnämnden i Etseri. Omröstningsavgörande.","otsikko_en":"COUNCIL MAY REMOVE COMMITTEE CHAIRS","teksti_en":"The case concerned the interpretation of section 34(2) of the Local Government Act. Under the provision, a municipal council may, on the basis of a loss of confidence, remove the chairpersons of a body it has elected in mid-term. The question was whether the council could, in addition to the chairmanship, remove the elected officials from membership of the body they chaired. The Supreme Administrative Court held that, in view of its purpose, there was no reason to interpret the provision as narrowing the council's powers. The council had been able to remove the chairpersons from membership of the body under section 34(2), without this requiring the removal of the whole body under subsection 1 of the same section.","selko_en":"A municipal council may, because of a loss of confidence, remove a committee's chair and vice-chair in the middle of their term. According to the Supreme Administrative Court they may at the same time be removed from committee membership, and the whole committee need not be removed. The ruling was decided by a vote.","asiasanat_en":"Municipal matter – Removal of elected officials during their term – Removal of chairpersons – Principle of proportionality","huom_en":"Audit committee of Ähtäri. Decided by a vote."},{"id":"KHO:2026:72","tunnus":"KHO:2026:72","otsikko":"PERINTÖVERO: HUOJENNUS KOKONAAN","pvm":"2026-09-15","pvm_selite":"annettu","asiasanat":"Perintöverotus – Sukupolvenvaihdoshuojennus – Yritysvarallisuus – Taseen avaaminen – Oikeudenkäynnin viivästymisen hyvittäminen","teksti":"A oli saanut perintönä X Oy:n osakkeita. Lainvoimaisesti oli jo ratkaistu, että A:lla oli perintöverotuksessa oikeus sukupolvenvaihdoshuojennukseen. Ratkaistavana korkeimmassa hallinto-oikeudessa oli vielä, tuliko huojennus myöntää osakkeisiin kokonaisuudessaan tilanteessa, jossa X Oy:n harjoittamaa kiinteistö- ja vuokraustoimintaa ei ollut pidettävä yritystoimintana ja tähän liittyvä varallisuus oli muodostanut yli 80 prosenttia yhtiön kokonaisvaroista.","lopputulos":"Asia palautettiin Verohallinnolle huojennuksen myöntämiseksi osakkeisiin kokonaisuudessaan. A:lle määrättiin 1 500 euron hyvitys oikeudenkäynnin viivästymisestä.","tekstityyppi":"virallinen tiivistelmä","lahde":"https://www.kho.fi/paatokset/kho202672/","selko":"Perillinen sai perintönä osakeyhtiön osakkeita ja oikeuden sukupolvenvaihdoshuojennukseen. KHO:n mukaan huojennus koski kaikkia osakkeita, vaikka suurin osa yhtiön varoista liittyi kiinteistö- ja vuokraustoimintaan. Hän sai lisäksi 1 500 euroa oikeudenkäynnin viivästymisestä.","aiheet":["vero","perhe","yhtio"],"julkaistu":"2026-09-15T09:00","paino":3,"otsikko_sv":"ARVSSKATT: LÄTTNADEN GÄLLER ALLT","teksti_sv":"A hade fått aktier i X Ab i arv. Det hade redan avgjorts genom ett lagakraftvunnet beslut att A hade rätt till generationsväxlingslättnad i arvsbeskattningen. I högsta förvaltningsdomstolen återstod att avgöra om lättnaden skulle beviljas för aktierna i sin helhet i en situation där den fastighets- och uthyrningsverksamhet som X Ab bedrev inte skulle anses som företagsverksamhet och den förmögenhet som hörde till den hade utgjort mer än 80 procent av bolagets totala tillgångar.","selko_sv":"En arvinge fick aktier i ett aktiebolag i arv och rätt till generationsväxlingslättnad. Enligt HFD gällde lättnaden alla aktier, trots att största delen av bolagets tillgångar hörde till fastighets- och uthyrningsverksamhet. Arvingen fick dessutom 1 500 euro för att rättegången drog ut på tiden.","asiasanat_sv":"Arvsbeskattning – Generationsväxlingslättnad – Företagsförmögenhet – Öppnande av balansräkningen – Gottgörelse för dröjsmål i rättegång","lopputulos_sv":"Ärendet återförvisades till Skatteförvaltningen för att lättnaden ska beviljas för aktierna i sin helhet. A tillerkändes 1 500 euro i gottgörelse för dröjsmål i rättegången.","otsikko_en":"INHERITANCE TAX: FULL RELIEF","teksti_en":"A had inherited shares in X Oy. It had already been finally decided that A was entitled to generational transfer relief in inheritance taxation. The remaining question before the Supreme Administrative Court was whether the relief was to be granted for the shares in full in a situation where the real estate and rental activity carried on by X Oy was not to be regarded as business activity and the related assets had formed more than 80 per cent of the company's total assets.","selko_en":"An heir inherited shares in a limited company and was entitled to generational transfer relief. According to the Supreme Administrative Court the relief covered all the shares, even though most of the company's assets related to real estate and rental activity. The heir also received 1 500 euros for the delay in the proceedings.","asiasanat_en":"Inheritance taxation – Generational transfer relief – Business assets – Look-through of the balance sheet – Compensation for delayed proceedings","lopputulos_en":"The case was returned to the Tax Administration to grant the relief for the shares in full. A was awarded 1 500 euros in compensation for the delay in the proceedings."},{"id":"KHO:2026:71","tunnus":"KHO:2026:71","otsikko":"MYÖHÄSSÄ LASKUTETUT ASIAKASMAKSUT","pvm":"2026-09-14","pvm_selite":"annettu","asiasanat":"Asiakasmaksu – Alentaminen tai perimättä jättäminen – Toimeentulon vaarantuminen – Laskutusviive – Viranomaisen virhe – Toimeentulotuen viimesijaisuus","teksti":"Muutoksenhakijalta oli Helsingin kaupungista johtuvasta syystä peritty asiakasmaksuja viiveellä. Tämä oli johtanut kerralla laskutettuun maksusaatavien kertymään, joka oli monikymmenkertainen verrattuna maksujen tavanomaiseen laskutukseen. Muutoksenhakijan ei voitu kohtuudella edellyttää varautuneen siihen, miten maksut olivat erääntyneet maksettaviksi. Maksuja viiveelläkin perittäessä laskujen eräpäiviä koskeva päätösvalta oli kaupungilla. Muutoksenhakijan perheen tosiasiallista maksukykyä arvioitaessa asiakasmaksulain 11 §:n mukaisen hakemuksen perusteella olisi tullut asian olosuhteissa ottaa huomioon kaupungin samanaikaisesti maksettavaksi eräännyttämien asiakasmaksujen kokonaismäärä. Kaupunki ei myöskään voinut katsoa, että samanaikaisesti erääntyneet maksut otettaisiin tarvittaessa erikseen huomioon toimeentulotukea myönnettäessä.","lopputulos":"Päätökset kumottiin ja asia palautettiin Helsingin kaupungille uudelleen käsiteltäväksi.","tekstityyppi":"virallinen tiivistelmä","lahde":"https://www.kho.fi/paatokset/kho202671/","selko":"Helsingin kaupunki laskutti asiakasmaksut myöhässä omasta syystään, ja perhe sai kerralla suuren laskun. KHO:n mukaan maksujen alentamista harkittaessa olisi pitänyt katsoa kaikkia samaan aikaan erääntyneitä maksuja yhdessä. Asia palautettiin kaupungille.","aiheet":["sote"],"julkaistu":"2026-09-14T09:00","paino":3,"otsikko_sv":"KLIENTAVGIFTER SOM FAKTURERATS SENT","teksti_sv":"Av orsaker som berodde på Helsingfors stad hade klientavgifter tagits ut av ändringssökanden med dröjsmål. Det ledde till att avgiftsfordringar fakturerades på en gång till ett belopp som var tiotals gånger större än den normala faktureringen. Av ändringssökanden kunde inte skäligen krävas att ha berett sig på hur avgifterna förföll till betalning. Även vid fördröjd uppbörd beslutade staden om fakturornas förfallodagar. Vid bedömningen av familjens faktiska betalningsförmåga på grundval av en ansökan enligt 11 § i klientavgiftslagen borde man ha beaktat det totala beloppet av de avgifter som staden låtit förfalla samtidigt. Staden kunde inte heller hänvisa till att avgifterna vid behov beaktas separat när utkomststöd beviljas.","selko_sv":"Helsingfors stad fakturerade klientavgifterna sent av orsaker som berodde på staden, och familjen fick en stor räkning på en gång. Enligt HFD borde alla avgifter som förföll samtidigt ha bedömts tillsammans när man prövade om avgifterna skulle sänkas. Ärendet återförvisades till staden.","asiasanat_sv":"Klientavgift – Nedsättning eller efterskänkning – Försörjningen äventyras – Fördröjd fakturering – Myndighetens fel – Utkomststödets sekundära karaktär","lopputulos_sv":"Besluten upphävdes och ärendet återförvisades till Helsingfors stad för ny behandling.","otsikko_en":"LATE-BILLED CLIENT FEES","teksti_en":"For a reason attributable to the City of Helsinki, client fees had been collected from the appellant late. This led to fee receivables invoiced at once that were many tens of times larger than normal billing. The appellant could not reasonably have been expected to prepare for the way the fees fell due; even when collecting late, the city decided the due dates. When assessing the family's actual ability to pay under section 11 of the Client Fees Act, the total amount of fees the city had made due at the same time should have been taken into account. Nor could the city assume that fees falling due simultaneously would be taken into account separately when granting social assistance.","selko_en":"The City of Helsinki invoiced client fees late through its own fault, and a family received one large bill. According to the Supreme Administrative Court, when considering a reduction of the fees, all fees that fell due at the same time should have been looked at together. The case was returned to the city.","asiasanat_en":"Client fee – Reduction or waiver – Endangered livelihood – Billing delay – Error by the authority – Social assistance as a last resort","lopputulos_en":"The decisions were overturned and the case returned to the City of Helsinki for reconsideration."}],"hao":[{"id":"hao-pohjois-suomi-1524-2026","tunnus":"Pohjois-Suomen HaO 1524/2026","elin":"Pohjois-Suomen HaO","aihe":"VEROTUS","otsikko":"LAHJAVERON HUOJENNUS, POHJOIS-SUOMI","pvm":"2026-09-23","pvm_selite":"annettu","asiasanat":"Ennakkoratkaisu – Lahjaverotus – Veronhuojennus – Yrityksen luovutus – Huojennetun veron maksuunpano – Pakottavat ja ennakoimattomat syyt – Taloudelliset ongelmat","teksti":"Ennakkoratkaisu – Lahjaverotus – Veronhuojennus – Yrityksen luovutus – Huojennetun veron maksuunpano – Pakottavat ja ennakoimattomat syyt – Taloudelliset ongelmat.","tekstityyppi":"asiasanat","lahde":"https://www.tuomioistuimet.fi/ratkaisut/pohjois-suomen-hao-23-9-2026-1524-2026/","huom":"Julkaistu 24.9.2026.","selko":"Yrityksen lahjaksi saanut voi joutua maksamaan huojennetun lahjaveron, jos hän luopuu yrityksestä liian pian. Ratkaisu koskee sitä, voivatko taloudelliset ongelmat olla pakottava syy välttää tämä. Saatavilla ovat vain asiasanat.","aiheet":["vero","yhtio"],"julkaistu":"2026-09-24","paino":2,"otsikko_sv":"GÅVOSKATTELÄTTNAD, NORRA FINLAND","teksti_sv":"Förhandsavgörande – Gåvobeskattning – Skattelättnad – Överlåtelse av företag – Debitering av den lindrade skatten – Tvingande och oförutsedda skäl – Ekonomiska problem.","selko_sv":"Den som fått ett företag i gåva kan bli tvungen att betala den lindrade gåvoskatten om han eller hon avstår från företaget för tidigt. Avgörandet gäller om ekonomiska problem kan vara ett tvingande skäl som gör att detta kan undvikas. Endast sökorden finns tillgängliga.","asiasanat_sv":"Förhandsavgörande – Gåvobeskattning – Skattelättnad – Överlåtelse av företag – Debitering av den lindrade skatten – Tvingande och oförutsedda skäl – Ekonomiska problem","huom_sv":"Publicerat 24.9.2026.","elin_sv":"Norra Finlands förvaltningsdomstol","otsikko_en":"GIFT TAX RELIEF, NORTHERN FINLAND","teksti_en":"Advance ruling – Gift taxation – Tax relief – Transfer of a business – Assessment of the relieved tax – Compelling and unforeseeable reasons – Financial difficulties.","selko_en":"A person who receives a business as a gift may have to pay the relieved gift tax if they give up the business too soon. The ruling concerns whether financial difficulties can be a compelling reason to avoid this. Only keywords are available.","asiasanat_en":"Advance ruling – Gift taxation – Tax relief – Transfer of a business – Assessment of the relieved tax – Compelling and unforeseeable reasons – Financial difficulties","elin_en":"Northern Finland Administrative Court","huom_en":"Published 24.9.2026."},{"id":"hao-ita-suomi-2167-2026","tunnus":"Itä-Suomen HaO 2167/2026","elin":"Itä-Suomen HaO","aihe":"MUUT","otsikko":"YKSITYISTIEN AVUSTUS: VALITUS NURIN","pvm":"2026-08-28","pvm_selite":"annettu","asiasanat":"Valtionavustus – Yksityistien parantaminen – Hyväksyttävät kustannukset","teksti":"KEHA-keskus oli hylännyt 46 223 euroa yksityistien parantamisen kustannuksista valtionavustusta myönnettäessä. Itä-Suomen hallinto-oikeus hylkäsi valituksen.","tekstityyppi":"tiedotteen mukaan","lahde":"https://www.tuomioistuimet.fi/ajankohtaista/tiedotteet/ita-suomen-hallinto-oikeuden-ratkaisuja-6/","selko":"Viranomainen jätti noin 46 000 euroa yksityistien parannuskuluista valtionavustuksen ulkopuolelle. Hallinto-oikeus hylkäsi valituksen, joten päätös pysyi ennallaan.","aiheet":["hallinto","asuminen"],"julkaistu":"2026-08-28","paino":2,"otsikko_sv":"VÄGUNDERSTÖD: BESVÄRET AVSLOGS","teksti_sv":"KEHA-centret hade vid beviljandet av statsunderstöd avslagit 46 223 euro av kostnaderna för förbättringen av en enskild väg. Östra Finlands förvaltningsdomstol avslog besväret.","selko_sv":"Myndigheten lämnade cirka 46 000 euro av kostnaderna för förbättringen av en enskild väg utanför statsunderstödet. Förvaltningsdomstolen avslog besväret, så beslutet står fast.","asiasanat_sv":"Statsunderstöd – Förbättring av enskild väg – Godtagbara kostnader","elin_sv":"Östra Finlands förvaltningsdomstol","otsikko_en":"PRIVATE ROAD GRANT: APPEAL FAILS","teksti_en":"The KEHA Centre had excluded 46 223 euros of the costs of improving a private road when granting a state grant. The Eastern Finland Administrative Court dismissed the appeal.","selko_en":"The authority left about 46 000 euros of private road improvement costs outside the state grant. The Administrative Court dismissed the appeal, so the decision stands.","asiasanat_en":"State grant – Improvement of a private road – Eligible costs","elin_en":"Eastern Finland Administrative Court"},{"id":"hao-pohjois-suomi-1285-2026","tunnus":"Pohjois-Suomen HaO 1285/2026","elin":"Pohjois-Suomen HaO","aihe":"VIRKAMIEHET","otsikko":"TURVASELVITYS JA IRTISANOMINEN, HAO","pvm":"2026-08-20","pvm_selite":"annettu","asiasanat":"Valtion virkamies – Irtisanominen – Suostumus turvallisuusselvitykseen – Taloudelliset ja tuotannolliset syyt – Yksilöperusteinen irtisanominen","teksti":"Verohallinto irtisanoi veroasiamiehen sillä perusteella, että tehtävät olivat vähentyneet, koska hänellä ei ollut kaikkiin viraston tehtäviin vaadittavaa turvallisuusselvitystä. Hän ei ollut suostunut selvitykseen. Hallinto-oikeuden mukaan virastossa ei ollut toiminnallisia tai organisatorisia muutoksia: yhteistoimintamenettely koski vain häntä ja virkaan otettiin uusi henkilö. Kyse oli tosiasiassa virkamiehen käyttäytymiseen liittyvästä syystä. Koska valtion virkamieslain 27 §:n 1 momentin 2 kohdan edellytykset eivät täyttyneet, irtisanomispäätös kumottiin.","tekstityyppi":"tiivistelmä","lahde":"https://www.tuomioistuimet.fi/ratkaisut/pohjois-suomen-hao-20-8-2026-1285-2026/","selko":"Verohallinto irtisanoi työntekijän, koska tämä ei suostunut turvallisuusselvitykseen, ja vetosi siihen, että työt olivat vähentyneet. Hallinto-oikeuden mukaan töitä ei ollut vähemmän, vaan syy liittyi työntekijän omaan toimintaan. Siksi tätä irtisanomisperustetta ei voinut käyttää, ja päätös kumottiin.","aiheet":["tyo","hallinto","turvallisuus"],"julkaistu":"2026-08-20","paino":2,"otsikko_sv":"SÄKERHETSUTREDNING OCH UPPSÄGNING","teksti_sv":"Skatteförvaltningen sade upp en skatteombudsman med motiveringen att uppgifterna hade minskat, eftersom han inte hade den säkerhetsutredning som krävdes för alla ämbetsverkets uppgifter. Han hade inte samtyckt till utredningen. Enligt förvaltningsdomstolen hade det inte skett några funktionella eller organisatoriska förändringar i ämbetsverket: samarbetsförfarandet gällde endast honom och en ny person anställdes i tjänsten. I själva verket var det fråga om ett skäl som hänförde sig till tjänstemannens beteende. Eftersom förutsättningarna i 27 § 1 mom. 2 punkten i statstjänstemannalagen inte uppfylldes, upphävdes uppsägningsbeslutet.","selko_sv":"Skatteförvaltningen sade upp en anställd som inte gick med på en säkerhetsutredning och hänvisade till att arbetet hade minskat. Enligt förvaltningsdomstolen hade arbetet inte minskat, utan skälet hade att göra med den anställdas eget agerande. Därför kunde denna uppsägningsgrund inte användas, och beslutet upphävdes.","asiasanat_sv":"Statstjänsteman – Uppsägning – Samtycke till säkerhetsutredning – Ekonomiska och produktionsmässiga skäl – Uppsägning på individuella grunder","elin_sv":"Norra Finlands förvaltningsdomstol","otsikko_en":"SECURITY CLEARANCE AND DISMISSAL","teksti_en":"The Tax Administration dismissed a tax representative on the ground that his duties had diminished because he did not have the security clearance required for all of the agency's tasks. He had not consented to the clearance. According to the Administrative Court there were no operational or organisational changes in the agency: the co-operation procedure concerned only him, and a new person was appointed to the post. The reason in fact related to the official's conduct. As the conditions of section 27(1)(2) of the State Civil Servants Act were not met, the dismissal decision was overturned.","selko_en":"The Tax Administration dismissed an employee because he refused a security clearance, citing a reduction in work. According to the Administrative Court there was no less work; the reason related to the employee's own conduct. That ground for dismissal could therefore not be used, and the decision was overturned.","asiasanat_en":"State civil servant – Dismissal – Consent to security clearance – Financial and production-related grounds – Dismissal on individual grounds","elin_en":"Northern Finland Administrative Court"},{"id":"hao-helsinki-4926-2026","tunnus":"Helsingin HaO 4926/2026","elin":"Helsingin HaO","aihe":"RAKENTAMINEN","otsikko":"VÄLIAIKAINEN RAKENNUS, POIKKEAMINEN","pvm":"2026-07-06","pvm_selite":"annettu","asiasanat":"Rakentamislaki – Lupa väliaikaisen rakennuksen rakentamiseen – Poikkeamisluvan tarve – Vähäinen poikkeaminen","teksti":"Rakentamislaki – Lupa väliaikaisen rakennuksen rakentamiseen – Poikkeamisluvan tarve – Vähäinen poikkeaminen.","tekstityyppi":"asiasanat","lahde":"https://www.tuomioistuimet.fi/ratkaisut/helsingin-hao-6-7-2026-4926-2026/","selko":"Asia koskee väliaikaista rakennusta: tarvitaanko erillinen poikkeamislupa, vai riittääkö rakentamislupa, kun poikkeama on vähäinen. Saatavilla ovat vain asiasanat.","aiheet":["ymparisto"],"julkaistu":"2026-07-06","paino":2,"otsikko_sv":"TILLFÄLLIG BYGGNAD, UNDANTAG","teksti_sv":"Bygglagen – Tillstånd att bygga en tillfällig byggnad – Behov av undantagstillstånd – Mindre avvikelse.","selko_sv":"Ärendet gäller en tillfällig byggnad: behövs ett separat undantagstillstånd, eller räcker bygglovet när avvikelsen är liten? Endast sökorden finns tillgängliga.","asiasanat_sv":"Bygglagen – Tillstånd att bygga en tillfällig byggnad – Behov av undantagstillstånd – Mindre avvikelse","elin_sv":"Helsingfors förvaltningsdomstol","otsikko_en":"TEMPORARY BUILDING, DEVIATION","teksti_en":"Building Act – Permit for a temporary building – Need for a deviation permit – Minor deviation.","selko_en":"The case concerns a temporary building: whether a separate deviation permit is needed, or whether a building permit suffices when the deviation is minor. Only keywords are available.","asiasanat_en":"Building Act – Permit for a temporary building – Need for a deviation permit – Minor deviation","elin_en":"Helsinki Administrative Court"},{"id":"hao-ita-suomi-1665-2026","tunnus":"Itä-Suomen HaO 1665/2026","elin":"Itä-Suomen HaO","aihe":"ULKOMAALAISASIAT","otsikko":"SUKUPUOLI VAINON PERUSTEENA, HAO","pvm":"2026-06-22","pvm_selite":"annettu","asiasanat":"Kansainvälinen suojelu – Vainon syyt – Tiettyyn yhteiskuntaryhmään kuuluminen – Sukupuoli – Kotimaan olosuhteet","teksti":"Kansainvälinen suojelu – Vainon syyt – Tiettyyn yhteiskuntaryhmään kuuluminen – Sukupuoli – Kotimaan olosuhteet.","tekstityyppi":"asiasanat","lahde":"https://www.tuomioistuimet.fi/ratkaisut/ita-suomen-hao-22-6-2026-1665-2026/","selko":"Turvapaikka-asia: voiko henkilön sukupuoli kotimaan olojen vuoksi tehdä hänestä vainotun yhteiskuntaryh "sote","ihmisoikeudet"],"julkaistu":"2026-06-02","paino":2,"otsikko_sv":"VÅRD OBEROENDE AV VILJAN, FD","teksti_sv":"Psykiatrisk sjukhusvård oberoende av patientens vilja – Rätt till personlig frihet – Öppenvård – Motivering av beslutet.","selko_sv":"Ärendet gäller psykiatrisk sjukhusvård oberoende av patientens vilja, motiveringen av beslutet och om öppenvård hade räckt. Endast sökorden finns tillgängliga.","asiasanat_sv":"Psykiatrisk sjukhusvård oberoende av patientens vilja – Rätt till personlig frihet – Öppenvård – Motivering av beslutet","elin_sv":"Östra Finlands förvaltningsdomstol","otsikko_en":"INVOLUNTARY PSYCHIATRIC CARE, HAO","teksti_en":"Involuntary psychiatric hospital care – Right to personal liberty – Outpatient care – Reasoning of the decision.","selko_en":"The case concerns involuntary psychiatric hospital care, the reasoning of the decision and whether outpatient care would have been sufficient. Only keywords are available.","asiasanat_en":"Involuntary psychiatric hospital care – Right to personal liberty – Outpatient care – Reasoning of the decision","elin_en":"Eastern Finland Administrative Court"},{"id":"hao-helsinki-yliopiston-apteekki","tunnus":"Helsingin HaO 1.6.2026","elin":"Helsingin HaO","aihe":"TIETOSUOJA","otsikko":"APTEEKIN 1,1 MEUR:N MAKSU KUMOTTIIN","pvm":"2026-06-01","pvm_selite":"annettu","asiasanat":"Tietosuoja – Seuraamusmaksu – Julkisen sektorin toimija – Seurantateknologiat","teksti":"Helsingin hallinto-oikeus kumosi Yliopiston Apteekille yleisen tietosuoja-asetuksen rikkomisesta määrätyn 1,1 miljoonan euron seuraamusmaksun. Maksu oli määrätty kesäkuussa 2025 Googlen ja Metan seurantateknologioiden käytöstä verkkoapteekissa. Hallinto-oikeus piti huomautuksen pääosin voimassa, mutta katsoi olevan epäselvää, voidaanko Helsingin yliopiston omistamalle apteekille ylipäätään määrätä seuraamusmaksu. Nykylain mukaan maksua ei voi määrätä julkisen sektorin toimijalle.","tekstityyppi":"tiivistelmä","lahde":"https://tietosuoja.fi/-/hallint

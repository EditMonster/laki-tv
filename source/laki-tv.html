intresse","lopputulos_sv":"Avvisades som uppenbart ogrundat.","vaihe_sv":"Avgjort","elin_sv":"Europeiska människorättsdomstolen","otsikko_en":"EXPROPRIATION CASE: INADMISSIBLE","teksti_en":"Three co-owners of a property complained about an expropriation carried out by a city. In their view the expropriation served the city's financial interest rather than the public interest, the compensation was too low, and the city had artificially lowered the land's value. They relied on the protection of property and the right to a fair trial. The Court unanimously declared the application inadmissible as manifestly ill-founded: the expropriation was in the public interest for urban development, the relevant factors had been taken into account in the compensation, and the authorities stayed within their margin of appreciation.","selko_en":"Landowners complained that the city expropriated their land too cheaply and for the wrong reason. According to the European Court of Human Rights the expropriation was in the public interest and the compensation was properly assessed. The application was not admitted.","asiasanat_en":"Protection of property – Expropriation – Expropriation compensation – Public interest","elin_en":"ECHR","vaihe_en":"Decided","lopputulos_en":"Declared inadmissible as manifestly ill-founded."}],"icj":[{"id":"icj-192-kolumbia","tunnus":"Etelä-Afrikka v. Israel","elin":"ICJ","otsikko":"KOLUMBIA PERUI VÄLIINTULONSA, ICJ","pvm":"2026-09-22","pvm_selite":"tiedote","teksti":"Kolumbia ilmoitti tuomioistuimelle 18.9.2026 peruvansa väliintulon, jonka se oli tehnyt 5.4.2024 tuomioistuimen perussäännön 63 artiklan nojalla. Pääasiassa Etelä-Afrikka väittää Israelin rikkovan kansanmurhan ehkäisemistä ja rankaisemista koskevaa yleissopimusta Gazan alueella. Pääasian käsittely on kesken.","tekstityyppi":"tiivistelmä","lahde":"https://www.icj-cij.org/sites/default/files/case-related/192/192-20260922-pre-01-00-en.pdf","selko":"Kolumbia oli liittynyt Etelä-Afrikan ja Israelin väliseen oikeusjuttuun, joka koskee kansanmurhasopimusta ja Gazaa. Nyt Kolumbia vetäytyi siitä. Itse oikeusjuttu jatkuu Kansainvälisessä tuomioistuimessa.","vaihe":"Vireillä","aiheet":["ihmisoikeudet"],"julkaistu":"2026-09-22","paino":4,"otsikko_sv":"COLOMBIA ÅTERKALLAR INTERVENTIONEN","teksti_sv":"Colombia meddelade domstolen 18.9.2026 att landet återkallar sin intervention, som det hade gjort 5.4.2024 med stöd av artikel 63 i domstolens stadga. I huvudsaken hävdar Sydafrika att Israel bryter mot konventionen om förebyggande och bestraffning av brottet folkmord i Gazaområdet. Behandlingen av huvudsaken pågår.","selko_sv":"Colombia hade gått med i rättegången mellan Sydafrika och Israel, som gäller folkmordskonventionen och Gaza. Nu drog sig Colombia ur den. Själva rättegången fortsätter i Internationella domstolen.","vaihe_sv":"Anhängigt","elin_sv":"Internationella domstolen","otsikko_en":"COLOMBIA WITHDRAWS FROM CASE, ICJ","teksti_en":"On 18.9.2026 Colombia informed the Court that it was withdrawing the intervention it had filed on 5.4.2024 under Article 63 of the Statute of the Court. In the main case South Africa alleges that Israel is violating the Convention on the Prevention and Punishment of the Crime of Genocide in the Gaza Strip. The main proceedings are ongoing.","selko_en":"Colombia had joined the case between South Africa and Israel concerning the Genocide Convention and Gaza. Colombia has now withdrawn from it. The case itself continues at the International Court of Justice.","elin_en":"ICJ","vaihe_en":"Pending"},{"id":"icj-193-nicaragua-saksa","tunnus":"Nicaragua v. Saksa","elin":"ICJ","otsikko":"NICARAGUA V. SAKSA: KUULEMINEN OHI","pvm":"2026-09-10","pvm_selite":"tiedote","teksti":"Tuomioistuin kuuli 7.–10.9.2026 osapuolia Saksan esittämistä alustavista vastaväitteistä. Saksa kiistää tuomioistuimen toimivallan ja osan vaatimusten tutkittavuuden. Nicaragua väittää Saksan laiminlyövän kansainvälisiä velvoitteitaan miehitetyllä palestiinalaisalueella muun muassa aseviennillään. Nicaragua pani asian vireille 1.3.2024. Seuraavaksi tuomioistuin ratkaisee, voiko se tutkia asian.","tekstityyppi":"tiivistelmä","lahde":"https://www.icj-cij.org/sites/default/files/case-related/193/193-20260910-pre-01-00-en.pdf","selko":"Nicaragua syyttää Saksaa siitä, että se on muun muassa aseviennillään laiminlyönyt velvollisuuksiaan palestiinalaisalueilla. Saksan mukaan tuomioistuin ei voi ratkaista asiaa. Tuomioistuin kuuli molempia ja päättää ensin, voiko se käsitellä asian.","vaihe":"Vireillä, toimivalta auki","aiheet":["ihmisoikeudet","turvallisuus"],"julkaistu":"2026-09-10","paino":3,"otsikko_sv":"NICARAGUA V. TYSKLAND: PARTER HÖRDA","teksti_sv":"Domstolen hörde 7.–10.9.2026 parterna om de preliminära invändningar som Tyskland har framställt. Tyskland bestrider domstolens behörighet och att en del av yrkandena kan tas upp till prövning. Nicaragua hävdar att Tyskland bland annat genom sin vapenexport åsidosätter sina internationella förpliktelser i det ockuperade palestinska området. Nicaragua anhängiggjorde målet 1.3.2024. Härnäst avgör domstolen om den kan pröva saken.","selko_sv":"Nicaragua anklagar Tyskland för att bland annat genom sin vapenexport ha försummat sina skyldigheter i de palestinska områdena. Enligt Tyskland kan domstolen inte avgöra saken. Domstolen hörde båda och avgör först om den kan behandla saken.","vaihe_sv":"Anhängigt, behörighet oavgjord","elin_sv":"Internationella domstolen","otsikko_en":"NICARAGUA V. GERMANY: HEARINGS OVER","teksti_en":"From 7 to 10.9.2026 the Court heard the parties on Germany's preliminary objections. Germany contests the Court's jurisdiction and the admissibility of part of the claims. Nicaragua alleges that Germany is failing its international obligations in the Occupied Palestinian Territory, among other things through its arms exports. Nicaragua instituted proceedings on 1.3.2024. The Court will next decide whether it can examine the case.","selko_en":"Nicaragua accuses Germany of neglecting its obligations in the Palestinian territories, among other things through arms exports. Germany says the Court cannot decide the case. The Court heard both sides and will first decide whether it can hear the case.","elin_en":"ICJ","vaihe_en":"Pending, jurisdiction open"},{"id":"icj-vanuatu-ranska","tunnus":"Vanuatu v. Ranska","elin":"ICJ","otsikko":"VANUATU HAASTOI RANSKAN, SAARIRIITA","pvm":"2026-09-01","pvm_selite":"kanne","teksti":"Vanuatu jätti tuomioistuimelle kanteen Ranskaa vastaan. Se vaatii vahvistamaan suvereniteettinsa asumattomiin Matthew'n ja Hunterin saariin sekä määrittämään merirajan Vanuatun ja Uuden-Kaledonian välille. Saarilla on merkitystä talousvyöhykkeen kalastus- ja merenpohjaoikeuksille. Ranska on luopunut tuomioistuimen pakollisesta toimivallasta vuonna 1974, joten Vanuatu vetoaa työjärjestyksen 38 artiklan 5 kohtaan. Asia etenee vain, jos Ranska antaa suostumuksensa.","tekstityyppi":"tiivistelmä","lahde":"https://www.icj-cij.org/sites/default/files/press-releases/0/000-20260901-pre-01-00-en.pdf","selko":"Vanuatu haluaa, että Kansainvälinen tuomioistuin vahvistaa kaksi pientä saarta sille eikä Ranskalle. Samalla ratkeaisi meriraja. Juttu voi edetä vain, jos Ranska suostuu siihen.","vaihe":"Vireille, odottaa suostumusta","aiheet":["ihmisoikeudet"],"julkaistu":"2026-09-01","paino":3,"otsikko_sv":"VANUATU STÄMDE FRANKRIKE OM ÖAR","teksti_sv":"Vanuatu har väckt talan mot Frankrike vid domstolen. Landet yrkar att domstolen fastställer dess suveränitet över de obebodda öarna Matthew och Hunter samt drar upp sjögränsen mellan Vanuatu och Nya Kaledonien. Öarna har betydelse för fiske- och havsbottenrättigheterna i den ekonomiska zonen. Frankrike avstod 1974 från domstolens obligatoriska behörighet, och därför åberopar Vanuatu artikel 38.5 i domstolens arbetsordning. Målet går vidare endast om Frankrike ger sitt samtycke.","selko_sv":"Vanuatu vill att Internationella domstolen fastställer att två små öar hör till Vanuatu och inte till Frankrike. Samtidigt skulle sjögränsen avgöras. Målet kan gå vidare bara om Frankrike går med på det.","vaihe_sv":"Inlett, väntar på samtycke","elin_sv":"Internationella domstolen","otsikko_en":"VANUATU SUES FRANCE OVER ISLANDS","teksti_en":"Vanuatu filed an application against France with the Court. It asks the Court to confirm its sovereignty over the uninhabited Matthew and Hunter Islands and to determine the maritime boundary between Vanuatu and New Caledonia. The islands matter for fishing and seabed rights in the exclusive economic zone. France withdrew from the Court's compulsory jurisdiction in 1974, so Vanuatu relies on Article 38(5) of the Rules of Court. The case proceeds only if France consents.","selko_en":"Vanuatu wants the International Court of Justice to confirm that two small islands belong to it and not to France. The maritime boundary would be settled at the same time. The case can proceed only if France agrees.","elin_en":"ICJ","vaihe_en":"Filed, awaiting consent"},{"id":"icj-200-liettua","tunnus":"Liettua v. Valko-Venäjä","elin":"ICJ","otsikko":"SALAKULJETUSASIA: VENÄJÄ JA PUOLA","pvm":"2026-07-21","pvm_selite":"tiedote","teksti":"Liettua syyttää Valko-Venäjää siirtolaisten salakuljetuksen edistämisestä ja vetoaa YK:n siirtolaisten salakuljetusta koskevaan pöytäkirjaan. Puola teki asiassa väliintuloilmoituksen 30.6.2026 ja Venäjä 21.7.2026. Euroopan unioni toimitti samana päivänä omat huomautuksensa. Asia on kesken.","tekstityyppi":"tiivistelmä","lahde":"https://www.icj-cij.org/sites/default/files/case-related/200/200-20260721-pre-02-00-en.pdf","selko":"Liettua syyttää Valko-Venäjää siitä, että se on auttanut siirtolaisia pääsemään laittomasti rajan yli. Puola ja Venäjä haluavat esittää kantansa sopimuksen tulkinnasta, ja myös EU antoi näkemyksensä. Juttu on kesken.","vaihe":"Vireillä","aiheet":["ihmisoikeudet","maahanmuutto","eu"],"julkaistu":"2026-07-21","paino":3,"otsikko_sv":"SMUGGLINGSMÅLET: RYSSLAND OCH POLEN","teksti_sv":"Litauen anklagar Belarus för att främja smuggling av migranter och åberopar FN:s protokoll mot smuggling av migranter. Polen lämnade en interventionsförklaring i målet 30.6.2026 och Ryssland 21.7.2026. Europeiska unionen lämnade samma dag in sina egna synpunkter. Målet pågår.","selko_sv":"Litauen anklagar Belarus för att ha hjälpt migranter att ta sig olagligt över gränsen. Polen och Ryssland vill framföra sina ståndpunkter om hur avtalet ska tolkas, och även EU lämnade sin syn. Målet pågår.","vaihe_sv":"Anhängigt","elin_sv":"Internationella domstolen","otsikko_en":"SMUGGLING CASE: RUSSIA AND POLAND","teksti_en":"Lithuania accuses Belarus of facilitating the smuggling of migrants and relies on the UN Protocol against the Smuggling of Migrants. Poland filed a declaration of intervention on 30.6.2026 and Russia on 21.7.2026. The European Union submitted its own observations the same day. The case is pending.","selko_en":"Lithuania accuses Belarus of helping migrants cross the border illegally. Poland and Russia want to present their views on the interpretation of the treaty, and the EU also gave its views. The case is pending.","elin_en":"ICJ","vaihe_en":"Pending"},{"id":"icj-202-kongo-ruanda","tunnus":"Kongon DT v. Ruanda","elin":"ICJ","otsikko":"KONGO NOSTI KANTEEN RUANDAA VASTAAN","pvm":"2026-06-26","pvm_selite":"kanne","teksti":"Kongon demokraattinen tasavalta nosti kanteen Ruandaa vastaan. Se syyttää Ruandaa vastuusta Itä-Kongossa vuodesta 1996 jatkuneisiin julmuuksiin, kuten joukkosurmiin, laittomiin teloituksiin, kidutukseen, seksuaaliseen väkivaltaan, pakkosiirtoihin ja syrjintään, jotka ovat kohdistuneet erityisesti hutuväestöön. Asian käsittely on alussa.","tekstityyppi":"tiivistelmä","lahde":"https://www.icj-cij.org/case/202","selko":"Kongo syyttää Ruandaa vakavista väkivallanteoista Itä-Kongossa vuosikymmenten ajan. Kongo vei asian Kansainväliseen tuomioistuimeen. Käsittely on vasta alussa.","vaihe":"Vireille","aiheet":["ihmisoikeudet"],"julkaistu":"2026-06-26","paino":3,"otsikko_sv":"KONGO VÄCKTE TALAN MOT RWANDA","teksti_sv":"Demokratiska republiken Kongo har väckt talan mot Rwanda. Landet anklagar Rwanda för att bära ansvar för grymheter som pågått i östra Kongo sedan 1996, såsom massmord, olagliga avrättningar, tortyr, sexuellt våld, tvångsförflyttningar och diskriminering, som särskilt har riktats mot hutubefolkningen. Behandlingen av målet är i ett inledande skede.","selko_sv":"Kongo anklagar Rwanda för allvarliga våldsdåd i östra Kongo under flera årtionden. Kongo förde saken till Internationella domstolen. Behandlingen har bara börjat.","vaihe_sv":"Inlett","elin_sv":"Internationella domstolen","otsikko_en":"DR CONGO FILES CASE AGAINST RWANDA","teksti_en":"The Democratic Republic of the Congo instituted proceedings against Rwanda. It accuses Rwanda of responsibility for atrocities in eastern Congo continuing since 1996, such as massacres, unlawful executions, torture, sexual violence, forced displacement and discrimination, directed particularly at the Hutu population. The proceedings are at an early stage.","selko_en":"Congo accuses Rwanda of serious acts of violence in eastern Congo over decades. Congo has taken the matter to the International Court of Justice. The proceedings have only just begun.","elin_en":"ICJ","vaihe_en":"Filed"},{"id":"icj-191-lakko-oikeus","tunnus":"Lakko-oikeus, ILO:n sopimus 87","elin":"ICJ, neuvoa-antava lausunto","otsikko":"LAKKO-OIKEUS SUOJATTU ILO 87:SSÄ","pvm":"2026-05-21","pvm_selite":"lausunto","teksti":"Kansainvälinen tuomioistuin katsoi äänin 10–4, että työntekijöiden ja heidän järjestöjensä lakko-oikeus on suojattu ILO:n yhdistymisvapautta ja järjestäytymisoikeutta koskevassa yleissopimuksessa nro 87. Vaikka sopimus ei mainitse lakkoa, lakko kuuluu järjestöjen suojattuun toimintaan. Tuomioistuin korosti, ettei lausunto määrittele lakko-oikeuden tarkkaa laajuutta, sisältöä tai käyttämisen edellytyksiä. Lausunto on neuvoa-antava eikä sitova.","tekstityyppi":"tiivistelmä","lahde":"https://www.icj-cij.org/sites/default/files/case-related/191/191-20260521-pre-01-00-en.pdf","selko":"Kansainvälisen tuomioistuimen mukaan ILO:n yhdistymisvapautta koskeva yleissopimus suojaa oikeutta lakkoon, vaikka lakkoa ei siinä mainita. Tuomioistuin ei kertonut, kuinka laaja oikeus on. Lausunto ei ole sitova.","vaihe":"Lausunto annettu","lopputulos":"Lakko-oikeus suojattu, äänin 10–4.","aiheet":["tyo","ihmisoikeudet"],"julkaistu":"2026-05-21","paino":4,"otsikko_sv":"STREJKRÄTTEN SKYDDAD I ILO 87","teksti_sv":"Internationella domstolen ansåg med rösterna 10–4 att arbetstagarnas och deras organisationers strejkrätt skyddas i ILO:s konvention nr 87 om föreningsfrihet och skydd för organisationsrätten. Även om konventionen inte nämner strejk hör strejk till organisationernas skyddade verksamhet. Domstolen betonade att yttrandet inte fastställer strejkrättens exakta omfattning, innehåll eller förutsättningarna för att utöva den. Yttrandet är rådgivande och inte bindande.","selko_sv":"Enligt Internationella domstolen skyddar ILO:s konvention om föreningsfrihet rätten att strejka, fast strejk inte nämns i den. Domstolen sade inte hur omfattande rätten är. Yttrandet är inte bindande.","lopputulos_sv":"Strejkrätten skyddad, med rösterna 10–4.","vaihe_sv":"Yttrande avgivet","elin_sv":"Internationella domstolen, rådgivande yttrande","otsikko_en":"RIGHT TO STRIKE PROTECTED BY ILO 87","teksti_en":"The International Court of Justice held by 10 votes to 4 that the right to strike of workers and their organisations is protected under ILO Convention No. 87 on Freedom of Association and Protection of the Right to Organise. Although the Convention does not mention strikes, striking falls within the protected activities of organisations. The Court stressed that the opinion does not define the precise scope, content or conditions for exercising the right to strike. The opinion is advisory and not binding.","selko_en":"According to the International Court of Justice, the ILO convention on freedom of association protects the right to strike, even though strikes are not mentioned in it. The Court did not say how broad the right is. The opinion is not binding.","elin_en":"ICJ, advisory opinion","vaihe_en":"Opinion delivered","lopputulos_en":"Right to strike protected, by 10 votes to 4."},{"id":"icj-171-guyana-venezuela","tunnus":"Guyana v. Venezuela","elin":"ICJ","otsikko":"ESSEQUIBO: SUULLINEN KÄSITTELY OHI","pvm":"2026-05-11","pvm_selite":"tiedote","teksti":"Tuomioistuin päätti 4.–11.5.2026 pidetyn pääasian suullisen käsittelyn asiassa, jossa Guyana pyytää vahvistamaan vuoden 1899 välitystuomion pätevyyden ja sen mukaisen rajan Venezuelan kanssa. Riita koskee Essequibon aluetta. Tuomioistuin harkitsee nyt ratkaisuaan, ja tuomion ajankohta ilmoitetaan myöhemmin.","tekstityyppi":"tiivistelmä","lahde":"https://www.icj-cij.org/sites/default/files/case-related/171/171-20260511-pre-01-00-en.pdf","selko":"Guyana ja Venezuela kiistelevät suuresta Essequibon alueesta. Guyana haluaa vahvistuksen, että vuonna 1899 päätetty raja on voimassa. Tuomioistuin kuuli osapuolia toukokuussa, ja tuomio tulee myöhemmin.","vaihe":"Vireillä, tuomio tulossa","aiheet":["ihmisoikeudet"],"julkaistu":"2026-05-11","paino":3,"otsikko_sv":"ESSEQUIBO: FÖRHANDLINGEN AVSLUTAD","teksti_sv":"Domstolen avslutade den muntliga förhandlingen i huvudsaken, som hölls 4.–11.5.2026, i målet där Guyana yrkar att domstolen fastställer att 1899 års skiljedom är giltig och fastställer den gräns mot Venezuela som följer av skiljedomen. Tvisten gäller Essequiboområdet. Domstolen överväger nu sitt avgörande, och tidpunkten för domen meddelas senare.","selko_sv":"Guyana och Venezuela tvistar om det stora Essequiboområdet. Guyana vill få det fastställt att den gräns som bestämdes 1899 gäller. Domstolen hörde parterna i maj, och domen kommer senare.","vaihe_sv":"Anhängigt, dom väntas","elin_sv":"Internationella domstolen","otsikko_en":"ESSEQUIBO: ORAL HEARINGS CONCLUDED","teksti_en":"The Court concluded the oral hearings on the merits, held from 4 to 11.5.2026, in the case in which Guyana asks the Court to confirm the validity of the 1899 arbitral award and the boundary with Venezuela established under it. The dispute concerns the Essequibo region. The Court is now deliberating, and the date of the judgment will be announced later.","selko_en":"Guyana and Venezuela dispute the large Essequibo region. Guyana wants confirmation that the boundary decided in 1899 is valid. The Court heard the parties in May, and the judgment will come later.","elin_en":"ICJ","vaihe_en":"Pending, judgment to come"}]},"voimaantulot":[{"pvm":"2026-11-20","nimi":"Kuluttajaluotot ja välittäjät","saados":"32/2026","he":"HE 120/2025 vp","lahde":"https://www.finlex.fi/fi/lainsaadanto/saadoskokoelma/2026/32","aiheet":["kuluttaja","finanssi","eu"],"muutos":"Luottosäännöt koskevat myös korottomia ja kuluttomia luottoja.","nimi_sv":"Konsumentkrediter och förmedlare","muutos_sv":"Kreditreglerna gäller också räntefria och avgiftsfria krediter.","nimi_en":"Consumer credit and brokers","muutos_en":"Credit rules also cover interest-free and fee-free credit."},{"pvm":"2027-01-01","nimi":"Kelan kuntoutusetuudet","saados":"620/2026","he":"HE 67/2026 vp","lahde":"https://www.finlex.fi/fi/lainsaadanto/saadoskokoelma/2026/620","aiheet":["sote"],"nimi_sv":"FPA:s rehabiliteringsförmåner","nimi_en":"Kela rehabilitation benefits","lakeja":17},{"pvm":"2027-01-01","nimi":"Uusi ydinenergialaki","saados":"776/2026","he":"HE 24/2026 vp","lahde":"https://www.finlex.fi/fi/lainsaadanto/saadoskokoelma/2026/776","aiheet":["ymparisto"],"nimi_sv":"Ny kärnenergilag","nimi_en":"New Nuclear Energy Act","lakeja":15},{"pvm":"2027-01-01","nimi":"Kotoutumislaki","saados":"706/2026","he":"HE 74/2026 vp","lahde":"https://www.finlex.fi/fi/lainsaadanto/saadoskokoelma/2026/706","aiheet":["maahanmuutto"],"nimi_sv":"Integrationslagen","nimi_en":"Integration Act","lakeja":5},{"pvm":"2027-01-01","nimi":"Kansalaisuuslaki","saados":"552/2026","he":"HE da","2d2c4395","2d6547f5","477023f6","491214ee","56dd0e7e","59a1c9aa","5c666e93","5e4b7184","66fe5f98","681f0a47","698b9201","6e4e0ae7","71458695","72aea032","79ccefbf","7b4c3630","8969d23c","8c6c6a35","8cf6b6df","901d91af","b792334f","c074f9c3","c0ccb2f8","cf0f42ae","ddc78d98","ddffdf2c","e1a70899","ea28cea1","efcfa4d9","f0b2c37f","ff73b339","08857236","09554423","5167d39e","58fe822a","6a3dad50","7ec91785","8d2c38e3","97ae167c","a76c59f1","ab02e62b","bf938306","d2027c22","d3850cfb","dcd6fc8c","e4e18aa0","0304eaa6","03c2fdad","0626bf03","06ea8db1","0f30e01f","162680d4","1bc60186","22de5592","388d0800","41db2736","5096a4cc","55273dfa","5df6edb1","60da741d","7bb28d67","85e43086","929a0c60","93534b83","9ea70d84","a7925aea","a9bce144","ab6260db","c30ff359","cffa404f","d7743200","d9f7c5b2","dd104707","e26a7db2","e2d69f9f","f3c2c3d9","76184f75","f468c9d1","7c14e3a9"],"tiedote_sv":"UTLÅTANDEN: BARNFRID TILL 15.10.","arkisto":[{"id":"HE 201/2026 vp","tunnus":"HE 201/2026 vp","otsikko":"VALTION TUKEMAT VUOKRA-ASUNNOT","otsikko_sv":"STATSSTÖDDA HYRESBOSTÄDER","otsikko_en":"STATE-SUBSIDISED RENTAL HOUSING","pvm":"2026-09-24","pvm_selite":"annettu","julkaistu":"2026-09-24T13:45","paino":4,"aiheet":["asuminen","hallinto"],"teksti":"Hallitus esittää muutoksia korkotukilakiin, aravarajoituslakiin ja kahteen muuhun lakiin. Valtion tukeman vuokra-asunnon vuokraoikeuden siirrossa perheenjäsenelle noudatettaisiin asukasvalintaperusteita, alivuokraus edellyttäisi vuokranantajan lupaa, ja lyhytvuokraus sekä muu asumisesta poikkeava käyttö kiellettäisiin. Alivuokrauksessa ja jälleenvuokrauksessa olisi noudatettava omakustannusvuokraa. Kunnan jäsenen etusija asukasvalinnassa poistettaisiin, ja asuntohakemuksesta säädettäisiin lailla. Asukasvalinnan valvontatavat määriteltäisiin kunnan tai hyvinvointialueen valvontatapapäätöksellä. Pääosa muutoksista on tarkoitettu tulemaan voimaan 1.1.2027, ja asunnon ja vuokraoikeuden siirron hakemista sekä asukasvalinnan valvontaa koskevat muutokset aikaisintaan 1.6.2027.","teksti_sv":"Regeringen föreslår ändringar i räntestödslagen, aravabegränsningslagen och två andra lagar. Vid överlåtelse av hyresrätten till en statligt stödd hyresbostad till en familjemedlem skulle grunderna för val av boende följas, andrahandsuthyrning skulle kräva hyresvärdens tillstånd, och korttidsuthyrning och annan användning än boende skulle förbjudas. Vid andrahandsuthyrning och vidareuthyrning skulle självkostnadshyra tillämpas. Kommunmedlemmars förtur vid val av boende skulle slopas, och bostadsansökan skulle regleras i lag. Tillsynen över valet av boende skulle bestämmas genom kommunens eller välfärdsområdets beslut. Merparten av ändringarna avses träda i kraft 1.1.2027, ändringarna om ansökan om överlåtelse och tillsynen över valet av boende tidigast 1.6.2027.","teksti_en":"The Government proposes amendments to the Interest Subsidy Act, the Arava Restrictions Act and two other acts. When the tenancy of a state-subsidised rental dwelling is transferred to a family member, the tenant selection criteria would apply; subletting would require the landlord's permission, and short-term letting and other use not for residential purposes would be prohibited. Cost-based rent would have to be observed in subletting and re-letting. A municipal resident's priority in tenant selection would be removed, and the housing application would be regulated by law. Methods of supervising tenant selection would be defined in a supervision decision by the municipality or wellbeing services county. Most amendments are intended to enter into force on 1.1.2027, and those on applying for a dwelling or transfer of tenancy and on supervision at the earliest on 1.6.2027.","tekstityyppi":"tiivistelmä","lahde":"https://valtioneuvosto.fi/-/1410903/hallitus-esittaa-muutoksia-valtion-tukemien-vuokra-asuntojen-lainsaadantoon","elin":"Ympäristöministeriö","k":"he"},{"id":"HE 199/2026 vp","tunnus":"HE 199/2026 vp","otsikko":"AUTOMAATIO HOIDON TARPEEN ARVIOSSA","otsikko_sv":"AUTOMATISK BEDÖMNING AV VÅRDBEHOV","otsikko_en":"AUTOMATED ASSESSMENT OF CARE NEEDS","pvm":"2026-09-24","pvm_selite":"annettu","julkaistu":"2026-09-24T13:38","paino":4,"aiheet":["sote","digi","tietosuoja"],"teksti":"Hallitus esittää, että hyvinvointialue voisi tehdä perusterveydenhuollon ja suun terveydenhuollon hoidon tarpeen arvion digitaalisesti automaatiota käyttäen. Arvion tekisi lääkinnällinen laite, jossa voitaisiin käyttää tekoälyä. Digitaalinen arvio olisi potilaalle vapaaehtoinen, ja oikeus terveydenhuollon ammattihenkilön arvioon säilyisi. Hyvinvointialueen olisi ennen käyttöönottoa varmistettava automaation vaatimustenmukaisuus, arvioitava muun muassa potilasturvallisuuteen, tietosuojaan ja yhdenvertaisuuteen liittyvät riskit sekä valvottava käyttöä. Asiakastietolakiin lisättäisiin säännös oikeudesta käyttää potilastietoja ja lääkityslistan tietoja automaatiossa, jos potilas sen sallii. Lait on tarkoitettu tulemaan voimaan keväällä 2027.","teksti_sv":"Regeringen föreslår att välfärdsområdet skulle kunna göra bedömningen av vårdbehovet inom primärvården och munhälsovården digitalt med hjälp av automation. Bedömningen skulle göras av en medicinteknisk produkt där artificiell intelligens kunde användas. Den digitala bedömningen skulle vara frivillig för patienten, och rätten till en bedömning av en yrkesutbildad person inom hälso- och sjukvården skulle kvarstå. Välfärdsområdet skulle före ibruktagandet säkerställa att automationen uppfyller kraven, bedöma bland annat riskerna för patientsäkerheten, dataskyddet och jämlikheten samt övervaka användningen. I klientdatalagen skulle tas in en bestämmelse om rätt att använda patientuppgifter och läkemedelslistan i automationen, om patienten tillåter det. Lagarna avses träda i kraft våren 2027.","teksti_en":"The Government proposes that a wellbeing services county could assess the need for primary health care and oral health care digitally using automation. The assessment would be made by a medical device that could use artificial intelligence. The digital assessment would be voluntary for the patient, and the right to an assessment by a health care professional would remain. Before deployment the county would have to verify the automation's conformity, assess risks relating to patient safety, data protection and equality, among others, and supervise its use. The Client Data Act would be amended to allow patient data and medication list data to be used in the automation if the patient permits it. The acts are intended to enter into force in spring 2027.","tekstityyppi":"tiivistelmä","lahde":"https://valtioneuvosto.fi/-/1271139/digitaalinen-hoidon-tarpeen-arvio-tehostamaan-hoitoon-paasya-ja-ammattilaisten-ajankayttoa","elin":"Sosiaali- ja terveysministeriö","k":"he"},{"id":"HE 194/2026 vp","tunnus":"HE 194/2026 vp","otsikko":"TILAUSOHJELMIEN INVESTOINTIVELVOITE","otsikko_sv":"INVESTERINGSPLIKT FÖR BESTÄLL-TV","otsikko_en":"INVESTMENT DUTY FOR STREAMING","pvm":"2026-09-24","pvm_selite":"annettu","julkaistu":"2026-09-24T13:34","paino":3,"aiheet":["eu","vero","digi"],"teksti":"Hallitus esittää lakia, jolla Suomeen sijoittautuneet sekä muihin EU-maihin sijoittautuneet, palveluaan Suomen yleisölle suuntaavat tilausohjelmapalvelujen tarjoajat velvoitettaisiin osallistumaan eurooppalaisen audiovisuaalisen sisällön tuotannon rahoitukseen Suomessa. Velvoite vastaisi viittä prosenttia edellisellä tilikaudella Suomessa kertyneestä liikevaihdosta. Sen voisi täyttää investoimalla uuteen tuotantoon, suorittamalla valtiolle veronluonteisen maksun tai yhdistämällä nämä. Valvonnasta ja maksun määräämisestä vastaisi Liikenne- ja viestintävirasto. Maksutuotot myönnettäisiin Suomen elokuvasäätiön kautta avustuksina elokuva-, dokumentti- ja draamasarjatuotantoihin. Esityksellä pannaan täytäntöön AVMS-direktiivin tuotannon rahoitusta koskevat säännökset. Laki on tarkoitettu tulemaan voimaan 1.1.2027.","teksti_sv":"Regeringen föreslår en lag som skulle förplikta leverantörer av beställ-tv-tjänster som är etablerade i Finland eller i andra EU-länder och riktar sina tjänster till publiken i Finland att delta i finansieringen av europeiskt audiovisuellt innehåll i Finland. Skyldigheten skulle motsvara fem procent av omsättningen i Finland under föregående räkenskapsperiod. Den kunde fullgöras genom investeringar i ny produktion, genom en skatteliknande avgift till staten eller genom en kombination av dessa. Transport- och kommunikationsverket skulle svara för tillsynen och påförandet av avgiften. Avgiftsintäkterna skulle beviljas via Finlands filmstiftelse som understöd för film-, dokumentär- och dramaserieproduktioner. Propositionen genomför AVMS-direktivets bestämmelser om finansiering av produktion. Lagen avses träda i kraft 1.1.2027.","teksti_en":"The Government proposes an act obliging providers of on-demand programme services established in Finland, and those established in other EU countries that target their service at the Finnish public, to contribute to the financing of European audiovisual content production in Finland. The obligation would equal five per cent of the turnover generated in Finland in the previous financial year. It could be met by investing in new production, by paying a tax-like levy to the State, or by combining these. The Finnish Transport and Communications Agency would supervise and impose the levy. Proceeds would be granted through the Finnish Film Foundation as grants for film, documentary and drama series productions. The bill implements the production financing provisions of the AVMS Directive. The act is intended to enter into force on 1.1.2027.","tekstityyppi":"tiivistelmä","lahde":"https://valtioneuvosto.fi/-/1410845/tilausohjelmapalveluille-esitetaan-investointivelvoitetta-kotimaiseen-audiovisuaaliseen-tuotantoon","elin":"Opetus- ja kulttuuriministeriö","k":"he"},{"id":"C-190/25","tunnus":"C-190/25","otsikko":"KIRKOLLINEN MITÄTTÖMYYSTUOMIO","otsikko_sv":"KYRKLIG DOM OM ANNULLERING","pvm":"2026-09-24","pvm_selite":"tuomio","julkaistu":"2026-09-24","paino":2,"aiheet":["perhe","eu"],"teksti":"Saksassa asuvat puolisot olivat solmineet kirkollisen avioliiton Italiassa. Toinen puoliso haki avioeroa saksalaisessa tuomioistuimessa. Myöhemmin kirkollinen oikeusistuin julisti avioliiton mitättömäksi, ja Italian ylioikeudessa haettiin tuomion yksityisoikeudellisten vaikutusten tunnustamista. Oberlandesgericht Stuttgart kysyi, onko tunnustamismenettely vireilläoloa koskevan säännön tarkoittama kanne. Unionin tuomioistuimen mukaan asetuksen N:o 2201/2003 19 artiklan 1 kohdassa tarkoitetun avioliiton pätemättömäksi julistamista koskevan kanteen käsitteeseen ei kuulu menettely, jossa haetaan Pyhän istuimen ja jäsenvaltion välisen sopimuksen nojalla annetun kirkollisen mitättömyystuomion yksityisoikeudellisten vaikutusten tunnustamista.","teksti_sv":"Makar bosatta i Tyskland hade ingått ett kyrkligt äktenskap i Italien. Den ena maken ansökte om äktenskapsskillnad vid en tysk domstol. Senare annullerade en kyrklig domstol äktenskapet, och vid en italiensk överrätt begärdes erkännande av domens civilrättsliga följder. Oberlandesgericht Stuttgart frågade om erkännandeförfarandet är en talan i den mening som avses i bestämmelsen om litispendens. Enligt EU-domstolen omfattas inte av begreppet talan om annullering av äktenskap i artikel 19.1 i förordning nr 2201/2003 ett förfarande där erkännande begärs av de civilrättsliga följderna av en kyrklig annulleringsdom som meddelats med stöd av ett fördrag mellan Heliga stolen och en medlemsstat.","tekstityyppi":"tiivistelmä","lahde":"https://curia.europa.eu/juris/liste.jsf?num=C-190/25&language=fi","elin":"Unionin tuomioistuin","k":"eu","otsikko_en":"ECCLESIASTICAL ANNULMENT JUDGMENT","teksti_en":"Spouses living in Germany had contracted a religious marriage in Italy. One spouse applied for divorce in a German court. Later an ecclesiastical court declared the marriage null, and recognition of the civil effects of that judgment was sought in an Italian court of appeal. The Oberlandesgericht Stuttgart asked whether the recognition procedure is an action within the meaning of the lis pendens rule. According to the Court of Justice, the concept of an action for annulment of marriage in Article 19(1) of Regulation No 2201/2003 does not cover proceedings seeking recognition of the civil effects of an ecclesiastical annulment judgment delivered under an agreement between the Holy See and a Member State."},{"id":"he-2026-09-24-tuotevastuu","tunnus":"HE 190/2026 vp","otsikko":"TUOTEVASTUU LAAJENEE OHJELMISTOIHIN","otsikko_sv":"PRODUKTANSVAR ÄVEN FÖR PROGRAMVARA","otsikko_en":"PRODUCT LIABILITY TO COVER SOFTWARE","pvm":"2026-09-24","pvm_selite":"annettu","julkaistu":"2026-09-24","paino":4,"aiheet":["kuluttaja","digi","eu","yhtio"],"teksti":"Esityksellä pantaisiin täytäntöön vuonna 2024 annettu EU:n uusi tuotevastuudirektiivi. Tuotevastuu kattaisi nykyistä selvemmin myös ohjelmistot ja digitaaliset valmistustiedostot. Omaisuusvahinkojen 500 euron korvauskynnys poistuisi. Vahinkoa kärsineen asemaa parannettaisiin helpottamalla vahingon ja tuotteen turvallisuuspuutteen osoittamista. Valmistaja voisi vapautua vastuusta tietyissä tilanteissa kehittelyriskipuolustuksen perusteella. Piilevissä henkilövahingoissa oikeus vaatia korvausta voisi säilyä jopa 25 vuotta. Lait on tarkoitettu tulemaan voimaan 9.12.2026.","teksti_sv":"Genom propositionen skulle EU:s nya produktansvarsdirektiv från 2024 genomföras. Produktansvaret skulle tydligare än i dag omfatta även programvara och digitala tillverkningsfiler. Tröskeln på 500 euro för ersättning för egendomsskador skulle slopas. Den skadelidandes ställning skulle förbättras genom att det blir lättare att visa skadan och produktens säkerhetsbrist. Tillverkaren kunde i vissa situationer befrias från ansvar på grund av invändningen om utvecklingsrisk. Vid latenta personskador kunde rätten att kräva ersättning bestå i upp till 25 år. Lagarna avses träda i kraft 9.12.2026.","teksti_en":"The bill would implement the EU's new Product Liability Directive adopted in 2024. Product liability would more clearly cover software and digital manufacturing files. The 500 euro threshold for compensation of property damage would be removed. The position of the injured party would be improved by making it easier to prove the damage and the product's defect. A manufacturer could be released from liability in certain situations on the basis of the development risk defence. For latent personal injuries, the right to claim compensation could last up to 25 years. The acts are intended to enter into force on 9.12.2026.","tekstityyppi":"tiivistelmä","lahde":"https://oikeusministerio.fi/-/tuotevastuulain-uudistus-vahvistaa-kuluttajien-suojaa","elin":"Oikeusministeriö","k":"he"},{"id":"he-2026-09-24-asuntokauppa","tunnus":"HE 191/2026 vp","otsikko":"ASUNTOKAUPPALAKIIN TARKKAILIJAPAKKO","otsikko_sv":"BOSTADSKÖP: ÖVERVAKARE BLIR KRAV","otsikko_en":"MANDATORY CONSTRUCTION OBSERVER","pvm":"2026-09-24","pvm_selite":"annettu","julkaistu":"2026-09-24","paino":4,"aiheet":["asuminen","kuluttaja"],"teksti":"Rakennustyön tarkkailijan käyttö tulisi pakolliseksi, kun uusia asuntoja myydään rakennusvaiheen aikana. Rakentamisvaiheessa myytävien asuntojen vakuusjärjestelmää muutettaisiin. Vuositarkastusta koskevia säännöksiä täsmennettäisiin ja jälkitarkastuksesta säädettäisiin. Ostajan peruutusoikeus säilyisi, mutta myyjä saisi periä peruuttamisesta korvauksena enintään viisi prosenttia asunnon velattomasta hinnasta. Lisäksi säänneltäisiin välimallisopimuksiin liittyviä ongelmia. Lait tulisivat voimaan noin kuuden kuukauden kuluttua niiden hyväksymisestä ja vahvistamisesta.","teksti_sv":"Det skulle bli obligatoriskt att anlita en övervakare av byggnadsarbetet när nya bostäder säljs under byggnadsskedet. Systemet med säkerheter för bostäder som säljs under byggnadsskedet skulle ändras. Bestämmelserna om årsbesiktning skulle preciseras och det skulle föreskrivas om efterbesiktning. Köparens rätt att avbeställa skulle kvarstå, men säljaren skulle få ta ut högst fem procent av bostadens skuldfria pris i ersättning för avbeställningen. Dessutom skulle problem i samband med mellanmodellsavtal regleras. Lagarna skulle träda i kraft cirka sex månader efter att de godkänts och stadfästs.","teksti_en":"Using a construction work observer would become mandatory when new dwellings are sold during the construction phase. The security system for dwellings sold during construction would be changed. Provisions on the annual inspection would be clarified and a follow-up inspection would be regulated. The buyer's right of withdrawal would remain, but the seller could charge as compensation at most five per cent of the debt-free price of the dwelling. Problems relating to intermediate-model contracts would also be regulated. The acts would enter into force about six months after their adoption and confirmation.","tekstityyppi":"tiivistelmä","lahde":"https://oikeusministerio.fi/-/asuntokauppalaki-uudistuu-asunnonostajien-ja-taloyhtioiden-suojaa-vahvistetaan","elin":"Oikeusministeriö","k":"he"},{"id":"he-2026-09-24-etayhteydet","tunnus":"HE 192/2026 vp","otsikko":"HALLINTO-OIKEUKSIIN ETÄISTUNNOT","otsikko_sv":"FÖRVALTNINGSDOMSTOLAR PÅ DISTANS","otsikko_en":"REMOTE HEARINGS IN ADMIN. COURTS","pvm":"2026-09-24","pvm_selite":"annettu","julkaistu":"2026-09-24","paino":2,"aiheet":["hallinto","digi"],"teksti":"Esitys lisäisi etäyhteyksien käyttöä hallintotuomioistuimissa. Tuomioistuin voisi määrätä asianosaisen osallistumaan suulliseen käsittelyyn etäyhteydellä, ja myös tuomari voisi osallistua etänä. Oikeudenkäynti voitaisiin toteuttaa kokonaan etäyhteyksin ilman fyysistä istuntopaikkaa. Lähtökohtaisesti käytettäisiin reaaliaikaista videoyhteyttä. Tavoitteena on nopeuttaa ja sujuvoittaa oikeudenkäyntejä ja vähentää niiden viivästymistä. Lait on tarkoitettu tulemaan voimaan vuoden 2027 alussa.","teksti_sv":"Propositionen skulle öka användningen av distansförbindelser i förvaltningsdomstolarna. Domstolen kunde bestämma att en part ska delta i en muntlig förhandling via distansförbindelse, och även domaren kunde delta på distans. Rättegången kunde genomföras helt via distansförbindelser utan en fysisk sessionsplats. Som utgångspunkt skulle en videoförbindelse i realtid användas. Målet är att påskynda och smidiggöra rättegångarna och minska dröjsmålen. Lagarna avses träda i kraft vid ingången av 2027.","teksti_en":"The bill would increase the use of remote connections in administrative courts. A court could order a party to attend an oral hearing by remote connection, and a judge could also participate remotely. Proceedings could be held entirely by remote connection without a physical hearing venue. As a rule, a real-time video connection would be used. The aim is to speed up and streamline proceedings and reduce delays. The acts are intended to enter into force at the beginning of 2027.","tekstityyppi":"tiivistelmä","lahde":"https://oikeusministerio.fi/-/hallitus-lisaisi-etayhteyksien-kayttoa-hallintotuomioistuimissa","elin":"Oikeusministeriö","k":"he"},{"id":"C-300/25","tunnus":"C-300/25","otsikko":"AVIOVARALLISUUS JA TOIMIVALTA, EUT","otsikko_sv":"MAKARS FÖRMÖGENHET OCH BEHÖRIGHET","otsikko_en":"MATRIMONIAL PROPERTY: JURISDICTION","pvm":"2026-09-24","pvm_selite":"tuomio","julkaistu":"2026-09-24","paino":2,"aiheet":["perhe","eu"],"teksti":"Oikeudellinen yhteistyö – Asetus (EU) 2016/1103 – Tuomioistuimen toimivalta aviovarallisuussuhteita koskevissa asioissa – Aviovarallisuussuhteiden käsite – Puolisoiden yhteisomistukseen hankkima kiinteistö – Yhteisomistuksen purkaminen avioliiton purkamisen jälkeen.","teksti_sv":"Området med frihet, säkerhet och rättvisa – Förordning (EU) 2016/1103 – Domstols behörighet, tillämplig lag samt erkännande och verkställighet av domar i mål om makars förmögenhetsförhållanden – Begreppet makars förmögenhetsförhållanden – Fastighet som makar har förvärvat med samäganderätt inom ett äktenskap där all egendom är enskild – Talan om att samägandet av fastigheten ska upplösas genom delning som den ena maken väckt efter äktenskapets upplösning.","teksti_en":"Judicial cooperation – Regulation (EU) 2016/1103 – Jurisdiction in matters of matrimonial property regimes – Concept of matrimonial property regime – Immovable property acquired in co-ownership by the spouses – Dissolution of co-ownership after dissolution of the marriage.","tekstityyppi":"asiasanat","lahde":"https://curia.europa.eu/juris/liste.jsf?num=C-300/25&language=fi","elin":"Unionin tuomioistuin","k":"eu"},{"id":"C-503/25","tunnus":"C-503/25","otsikko":"VAIKEUKSISSA OLEVAT JA ENERGIATUKI","otsikko_sv":"ENERGISTÖD – FÖRETAG I SVÅRIGHETER","otsikko_en":"FIRMS IN DIFFICULTY AND ENERGY AID","pvm":"2026-09-24","pvm_selite":"tuomio","julkaistu":"2026-09-24","paino":2,"aiheet":["kilpailu","eu"],"teksti":"Valtiontuet – Maakaasu- tai sähköintensiivisiä yrityksiä koskevat tukijärjestelmät – Vaikeuksissa olevien yritysten sulkeminen tukijärjestelmien ulkopuolelle – Vaikeuksissa olevan yrityksen käsite – Erityishallintomenettely.","teksti_sv":"Statligt stöd – Stödordningar till förmån för företag med stor förbrukning av naturgas eller el – Nationella bestämmelser som från dessa stödordningar undantar företag i svårigheter i den mening som avses i riktlinjerna för statligt stöd till undsättning och omstrukturering av icke-finansiella företag i svårigheter – Begreppet ’företag i svårigheter’ – Nationellt system för särskild förvaltning.","teksti_en":"State aid – Aid schemes for gas- or electricity-intensive undertakings – Exclusion of undertakings in difficulty from the aid schemes – Concept of an undertaking in difficulty – Special administration procedure.","tekstityyppi":"asiasanat","lahde":"https://curia.europa.eu/juris/liste.jsf?num=C-503/25&language=fi","elin":"Unionin tuomioistuin","k":"eu"},{"id":"C-176/25","tunnus":"C-176/25","otsikko":"TEKIJÄNOIKEUS JA SOVELLETTAVA LAKI","otsikko_sv":"UPPHOVSRÄTT OCH TILLÄMPLIG LAG","otsikko_en":"COPYRIGHT AND APPLICABLE LAW","pvm":"2026-09-24","pvm_selite":"tuomio","julkaistu":"2026-09-24","paino":2,"aiheet":["yhtio","eu"],"teksti":"Oikeudellinen yhteistyö yksityisoikeudellisissa asioissa – Asetus (EY) N:o 593/2008 (Rooma I) – Asetus (EY) N:o 864/2007 (Rooma II) – Sopimukseen perustumaton velvoite, joka perustuu tekijänoikeudella suojatun teoksen yksinoikeuden väitettyyn loukkaamiseen.","teksti_sv":"Civilrättsligt samarbete – Förordning (EG) nr 593/2008 (Rom I) – Förordning (EG) nr 864/2007 (Rom II) – Utomobligatorisk förpliktelse med anledning av att tredje man gjort intrång i de exklusiva nyttjanderätter som en person påstår sig ha till upphovsrättsligt skyddade verk.","teksti_en":"Judicial cooperation in civil matters – Regulation (EC) No 593/2008 (Rome I) – Regulation (EC) No 864/2007 (Rome II) – Non-contractual obligation arising from an alleged infringement of the exclusive right in a copyright-protected work.","tekstityyppi":"asiasanat","lahde":"https://curia.europa.eu/juris/liste.jsf?num=C-176/25&language=fi","elin":"Unionin tuomioistuin","k":"eu"},{"id":"C-511/25","tunnus":"C-511/25","otsikko":"DUBLIN-ASETUS: KÄSITTELYVASTUU","otsikko_sv":"DUBLINFÖRORDNINGEN: PRÖVNINGSANSVAR","otsikko_en":"DUBLIN REGULATION: RESPONSIBILITY","pvm":"2026-09-24","pvm_selite":"tuomio","julkaistu":"2026-09-24","paino":2,"aiheet":["maahanmuutto","eu"],"teksti":"Turvapaikkapolitiikka – Asetus (EU) N:o 604/2013 – Kansainvälistä suojelua koskevan hakemuksen käsittelystä vastuussa oleva jäsenvaltio – Toisessa jäsenvaltiossa jätetty hakemus – 17 artikla – Harkintavaltalausekkeet.","teksti_sv":"Asylpolitik – Förordning (EU) nr 604/2013 – Medlemsstat som är ansvarig för att pröva en ansökan om internationellt skydd enligt artikel 3.2 första stycket i den förordningen – Ansökan om internationellt skydd har lämnats in i en annan medlemsstat – Artikel 17 – Diskretionär bedömning.","teksti_en":"Asylum policy – Regulation (EU) No 604/2013 – Member State responsible for examining an application for international protection – Application lodged in another Member State – Article 17 – Discretionary clauses.","tekstityyppi":"asiasanat","lahde":"https://curia.europa.eu/juris/liste.jsf?num=C-511/25&language=fi","elin":"Unionin tuomioistuin","k":"eu"},{"id":"HE 174/2026 vp","tunnus":"HE 174/2026 vp","otsikko":"VEROT 2027: TYÖN VEROTUS KEVENEE","otsikko_sv":"SKATTER 2027: LÄGRE SKATT PÅ ARBETE","otsikko_en":"TAXES 2027: LOWER TAX ON WORK","pvm":"2026-09-21","pvm_selite":"annettu","julkaistu":"2026-09-21","paino":4,"aiheet":["vero","tyo"],"teksti":"Ansiotuloverotuksen perusteisiin tehtäisiin 3,2 prosenttiyksikön indeksitarkistus kaikilla tulotasoilla. Pieni- ja keskituloisten työn verotusta kevennettäisiin noin 230 miljoonalla eurolla työtulovähennystä muuttamalla. Työsuhdeoptioista saadusta edusta maksettaisiin ansiotulovero vasta, kun osakkeet myydään. Lahjoitusvähennyksiä laajennettaisiin ja yrittäjävähennys nousisi 5,5 prosenttiin. Esitys liittyy vuoden 2027 talousarvioesitykseen. Lait tulisivat voimaan vuoden 2027 alusta, ja niitä sovellettaisiin ensimmäisen kerran vuodelta 2027 toimitettavassa verotuksessa.","teksti_sv":"Skattegrunderna för förvärvsinkomster skulle indexjusteras med 3,2 procentenheter på alla inkomstnivåer. Beskattningen av arbete för låg- och medelinkomsttagare skulle lättas med cirka 230 miljoner euro genom en ändring av arbetsinkomstavdraget. Förvärvsinkomstskatt på förmåner av anställningsoptioner skulle betalas först när aktierna säljs. Donationsavdragen skulle utvidgas och företagaravdraget skulle höjas till 5,5 procent. Propositionen hänför sig till budgetpropositionen för 2027. Lagarna skulle träda i kraft vid ingången av 2027 och tillämpas första gången vid beskattningen för 2027.","teksti_en":"The bases of earned income taxation would be index-adjusted by 3.2 percentage points at all income levels. Taxation of work for low and middle earners would be eased by about 230 million euros by changing the earned income deduction. Earned income tax on benefits from employee stock options would be paid only when the shares are sold. Donation deductions would be expanded and the entrepreneur deduction would rise to 5.5 per cent. The bill relates to the 2027 budget proposal. The acts would enter into force at the beginning of 2027 and apply for the first time in the taxation for 2027.","tekstityyppi":"tiivistelmä","lahde":"https://valtioneuvosto.fi/-/10623/muutoksia-vuoden-2027-veroperusteisiin-ja-tuloverolakiin","elin":"Valtiovarainministeriö","k":"he"},{"id":"HE 182/2026 vp","tunnus":"HE 182/2026 vp","otsikko":"LASTENSUOJELULAKI UUDISTUU","otsikko_sv":"BARNSKYDDSLAGEN REFORMERAS","otsikko_en":"CHILD WELFARE ACT TO BE REFORMED","pvm":"2026-09-21","pvm_selite":"annettu","julkaistu":"2026-09-21","paino":4,"aiheet":["perhe","sote"],"teksti":"Hallituksen esitys eduskunnalle lastensuojelulaiksi ja siihen liittyviksi laeiksi.","teksti_sv":"Regeringens proposition till riksdagen med förslag till barnskyddslag och till lagar som har samband med den.","teksti_en":"Government bill to Parliament for a Child Welfare Act and related acts.","tekstityyppi":"nimike","lahde":"https://www.eduskunta.fi/valtiopaivaasiat/HE+182/2026","k":"he"},{"id":"KKO:2026:64","tunnus":"KKO:2026:64","otsikko":"KARHU RUOKINTAPAIKALLA: TÖRKEÄ TEKO","otsikko_sv":"UTFODRINGSPLATS: GROVT JAKTBROTT","pvm":"2026-09-18","pvm_selite":"annettu","julkaistu":"2026-09-18T09:00","paino":2,"aiheet":["rikos","ymparisto"],"teksti":"A oli ryhtynyt koiriensa avulla jäljittämään karhua riistan ruokintapaikalta saatuaan ensin riistakamerasta kuvan karhusta mainitulla ruokintapaikalla. Korkein oikeus katsoi, että karhun metsästyksessä oli käytetty pyyntimenetelmänä kiellettyä ihmisen perustamaa ravintoon perustunutta karhun houkutinta. A oli syyllistynyt törkeään metsästysrikokseen.","teksti_sv":"A hade med hjälp av sina hundar börjat spåra en björn från en utfodringsplats för vilt efter att först ha fått en bild av björnen vid utfodringsplatsen från en viltkamera. Högsta domstolen ansåg att man vid björnjakten som fångstmetod hade använt ett förbjudet lockbete för björn som människan anlagt och som grundade sig på föda. A hade gjort sig skyldig till grovt jaktbrott.","tekstityyppi":"virallinen tiivistelmä","lahde":"https://www.korkeinoikeus.fi/ennakkopaatokset/ennakkopaatokset-vuosittain/kko202664/","k":"kko","otsikko_en":"BEAR AT FEEDING SITE: AGGRAVATED","teksti_en":"A had begun tracking a bear with his dogs from a game feeding site after first receiving a trail camera image of the bear at that site. The Supreme Court held that a prohibited man-made, food-based lure for bears had been used as a hunting method. A had committed an aggravated hunting offence."},{"id":"KHO:2026:70","tunnus":"KHO:2026:70","otsikko":"MAANHANKINTALUPA: VALITUS HYLÄTTIIN","otsikko_sv":"BESVÄR OM JORDFÖRVÄRV AVSLOGS","otsikko_en":"ÅLAND LAND PERMIT: APPEAL DISMISSED","pvm":"2026-09-14","pvm_selite":"annettu","julkaistu":"2026-09-14T09:00","paino":2,"aiheet":["hallinto","asuminen"],"teksti":"Korkeimmassa hallinto-oikeudessa oli ratkaistavana, oliko Ahvenanmaan maakunnan hallitus voinut maanhankintaoikeudesta ja maanhankintaluvasta annetun maakuntalain (2024:68) nojalla hylätä muutoksenhakijan maanhankintalupaa koskevan hakemuksen. Korkein hallinto-oikeus katsoi, ettei maakunnan hallitus ollut soveltanut voimassa olevan maakuntalain 14 §:n 2 ja 6 momenttien mukaisia edellytyksiä maanhankintaluvan myöntämisestä virheellisesti. Asiassa ei ilmennyt tukea johtopäätökselle, että voimassa olevan maakuntalain soveltaminen olisi merkinnyt uutta rajoitusta muutoksenhakijan oikeuteen hankkia kiinteää omaisuutta maakunnassa Ahvenanmaan pöytäkirjan stand still -lausekkeen vastaisesti.","teksti_sv":"I högsta förvaltningsdomstolen skulle avgöras om Ålands landskapsregering med stöd av landskapslagen om jordförvärvsrätt och jordförvärvstillstånd (2024:68) hade kunnat avslå ändringssökandens ansökan om jordförvärvstillstånd. HFD ansåg att landskapsregeringen inte felaktigt hade tillämpat förutsättningarna för jordförvärvstillstånd enligt 14 § 2 och 6 mom. i den gällande landskapslagen. I ärendet framkom inget stöd för slutsatsen att tillämpningen av den gällande landskapslagen skulle ha inneburit en ny begränsning av ändringssökandens rätt att förvärva fast egendom i landskapet i strid med stand still-klausulen i Ålandsprotokollet.","teksti_en":"The Supreme Administrative Court had to decide whether the Government of Åland could, under the Provincial Act on the right to acquire land and land acquisition permits (2024:68), reject the appellant's application for a land acquisition permit. The Court held that the Government of Åland had not misapplied the conditions for granting a permit under section 14(2) and (6) of the Provincial Act in force. Nothing in the case supported the conclusion that applying the Provincial Act in force would have meant a new restriction on the appellant's right to acquire real property in the province contrary to the standstill clause of the Åland Protocol.","tekstityyppi":"virallinen tiivistelmä","lahde":"https://www.kho.fi/paatokset/kho202670/","k":"kho"},{"id":"OKV/629/10/2026","tunnus":"OKV/629/10/2026","otsikko":"LIIAN LYHYT LAUSUNTOAIKA, OKV","otsikko_sv":"FÖR KORT REMISSTID, JK","otsikko_en":"CONSULTATION PERIOD TOO SHORT, COJ","pvm":"2026-09-14","pvm_selite":"ratkaisu","julkaistu":"2026-09-14","paino":3,"aiheet":["hallinto","turvallisuus"],"teksti":"Oikeuskansleri katsoi, että neljän viikon lausuntoaika ydinasekiellon kumoamista koskevasta hallituksen esitysluonnoksesta alitti ohjeiden mukaisen kuuden viikon vähimmäisajan ilman riittävästi kirjattua perustetta. Vaikka luonnos koski vain muutamaa säännöstä, hanke oli yhteiskunnallisesti ja periaatteellisesti merkittävä. Puolustusministeriön esiin tuomia kansallisen turvallisuuden syitä ei ollut kirjattu lyhyemmän lausuntoajan perusteeksi.","teksti_sv":"Justitiekanslern ansåg att remisstiden på fyra veckor för utkastet till regeringens proposition om upphävande av kärnvapenförbudet understeg den minimitid på sex veckor som anges i anvisningarna utan tillräckligt dokumenterad grund. Även om utkastet gällde endast några få bestämmelser var projektet samhälleligt och principiellt betydelsefullt. De skäl som hänförde sig till den nationella säkerheten och som försvarsministeriet lyfte fram hade inte dokumenterats som grund för den kortare remisstiden.","teksti_en":"The Chancellor of Justice held that the four-week consultation period for the draft government bill on repealing the nuclear weapons ban fell short of the six-week minimum set in the guidelines without an adequately recorded reason. Although the draft concerned only a few provisions, the project was socially and fundamentally significant. The national security reasons raised by the Ministry of Defence had not been recorded as the basis for the shorter consultation period.","tekstityyppi":"tiivistelmä","lahde":"https://oikeuskansleri.fi/-/lausuntoajan-pituus-ydinasekiellon-kumoamista-koskevasta-hallituksen-esitysluonnoksesta","elin":"Oikeuskansleri","k":"laillisuus"},{"id":"KHO:2026:68","tunnus":"KHO:2026:68","otsikko":"TUTKINTAVANKEUS JA RANGAISTUSAIKA","otsikko_sv":"HÄKTNING OCH STRAFFTID","pvm":"2026-09-09","pvm_selite":"annettu","julkaistu":"2026-09-09T09:00","paino":2,"aiheet":["rikos"],"teksti":"A oli ollut tutkintavankina rikosasioissa, jotka oli käsitelty kahdessa eri oikeudenkäynnissä. Hovioikeus oli ensin käsitellyssä asiassa tuominnut A:n 1 vuoden 2 kuukauden vankeuteen ja katsonut osan vapaudenmenetysajasta rangaistuksen täydeksi suoritukseksi. Toisessa asiassa A tuomittiin 3 vuoden 11 kuukauden vankeuteen, ja rangaistusaikapäätöksessä ehdonalaisen vapauden ajankohdaksi merkittiin 4.12.2024. Kysymys oli vapaudenmenetysajan vähentämisestä rangaistusaikaa laskettaessa. KHO kumosi hallinto-oikeuden ja Rikosseuraamuslaitoksen päätökset.","teksti_sv":"A hade suttit häktad i brottmål som behandlats i två olika rättegångar. I det mål som behandlades först hade hovrätten dömt A till fängelse i 1 år 2 månader och ansett att en del av tiden för frihetsberövande utgjorde fullt verkställt straff. I det andra målet dömdes A till fängelse i 3 år 11 månader, och i beslutet om strafftid antecknades 4.12.2024 som tidpunkt för villkorlig frigivning. Frågan gällde avdrag för tiden för frihetsberövande vid beräkningen av strafftiden. HFD upphävde förvaltningsdomstolens och Brottspåföljdsmyndighetens beslut.","tekstityyppi":"tiivistelmä","lahde":"https://www.kho.fi/paatokset/kho202668/","k":"kho","otsikko_en":"REMAND AND SENTENCE CALCULATION","teksti_en":"A had been remanded in custody in criminal cases dealt with in two separate trials. In the case tried first, the Court of Appeal sentenced A to 1 year 2 months' imprisonment and deemed part of the time deprived of liberty as full service of the sentence. In the second case A was sentenced to 3 years 11 months' imprisonment, and the sentence calculation decision set the date of conditional release as 4.12.2024. The question concerned the deduction of time deprived of liberty when calculating the sentence. The Supreme Administrative Court overturned the decisions of the Administrative Court and the Criminal Sanctions Agency."},{"id":"KHO:2026:69","tunnus":"KHO:2026:69","otsikko":"PERUTTU HUOSTAANOTTO: EI KULUJA","otsikko_sv":"OMHÄNDERTAGANDE: INGA KOSTNADER","otsikko_en":"WITHDRAWN CARE ORDER: NO COSTS","pvm":"2026-09-09","pvm_selite":"annettu","julkaistu":"2026-09-09T09:00","paino":3,"aiheet":["perhe","sote"],"teksti":"Viranhaltija oli peruuttanut hallinto-oikeudelle tehdyn huostaanottohakemuksen, koska lapsen ja perheen tilanteessa oli tapahtunut merkittäviä muutoksia ja tarve huostaanotolle oli lakannut. KHO totesi, että oikeudenkäyntikulujen korvausvelvollisuus ratkaistaan myös asian käsittelyn rauetessa (oikeudenkäynnistä hallintoasioissa annetun lain 95 §). Olosuhteet poikkesivat ennakkopäätöksestä KHO 2024:79 erityisesti vanhemman toiminnan osalta. KHO kumosi hallinto-oikeuden päätöksen siltä osin kuin Pirkanmaan hyvinvointialue oli velvoitettu korvaamaan A:n oikeudenkäyntikuluja, ja hylkäsi A:n kuluvaatimuksen.","teksti_sv":"En tjänsteinnehavare hade återkallat en ansökan om omhändertagande hos förvaltningsdomstolen, eftersom betydande förändringar hade skett i barnets och familjens situation och behovet av omhändertagande hade upphört. HFD konstaterade att skyldigheten att ersätta rättegångskostnader avgörs också när behandlingen förfaller (95 § i lagen om rättegång i förvaltningsärenden). Omständigheterna skilde sig från prejudikatet HFD 2024:79 särskilt i fråga om förälderns agerande. HFD upphävde förvaltningsdomstolens beslut till den del Birkalands välfärdsområde hade ålagts att ersätta A:s rättegångskostnader och avslog A:s kostnadsyrkande.","teksti_en":"An official had withdrawn an application to the Administrative Court for taking a child into care because significant changes had occurred in the situation of the child and family and the need for care had ceased. The Supreme Administrative Court stated that liability for legal costs is decided also when the proceedings lapse (section 95 of the Administrative Judicial Procedure Act). The circumstances differed from precedent KHO 2024:79, particularly as regards the parent's conduct. The Court overturned the Administrative Court's decision in so far as the Pirkanmaa wellbeing services county had been ordered to pay A's legal costs, and dismissed A's claim for costs.","tekstityyppi":"tiivistelmä","lahde":"https://www.kho.fi/paatokset/kho202669/","k":"kho"},{"id":"lausunto-tem-datakeskusrekisteri-2026","tunnus":"Työ- ja elinkeinoministeriö","otsikko":"DATAKESKUSREKISTERILAKI","otsikko_sv":"LAG OM DATACENTERREGISTER","otsikko_en":"DATA CENTRE REGISTER ACT","pvm":"2026-09-04","pvm_selite":"julkaistu","julkaistu":"2026-09-04","paino":3,"aiheet":["digi","turvallisuus"],"teksti":"Työ- ja elinkeinoministeriö pyytää lausuntoja luonnoksesta hallituksen esitykseksi datakeskusrekisteristä. Esityksessä säädettäisiin datakeskusrekisteristä, datakeskusten ilmoitusvelvollisuudesta ja datakeskuksia koskevan tilannekuvan ylläpitämisestä. Huoltovarmuuskeskus toimisi rekisterin ylläpitäjänä, ilmoituksia vastaanottavana viranomaisena, valvontaviranomaisena ja tilannekuvan ylläpitäjänä. Ilmoitusvelvollisuus koskisi datakeskusta, jonka asennetun tietotekniikan tehontarve on vähintään 0,5 megawattia. Ehdotettu laki on tarkoitettu tulemaan voimaan 1.1.2027. Lausuntoja voi antaa 2.10.2026 asti.","teksti_sv":"Arbets- och näringsministeriet begär utlåtanden om ett utkast till regeringens proposition om ett datacenterregister. I propositionen föreslås bestämmelser om ett datacenterregister, om datacentrens anmälningsskyldighet och om upprätthållandet av en lägesbild över datacenter. Försörjningsberedskapscentralen skulle föra registret, ta emot anmälningarna, vara tillsynsmyndighet och upprätthålla lägesbilden. Anmälningsskyldigheten skulle gälla datacenter vars installerade it-effektbehov är minst 0,5 megawatt. Den föreslagna lagen avses träda i kraft 1.1.2027. Utlåtanden kan lämnas till och med 2.10.2026.","teksti_en":"The Ministry of Economic Affairs and Employment requests comments on a draft government bill on a data centre register. The bill would provide for a data centre register, a notification obligation for data centres and the maintenance of a situational picture of data centres. The National Emergency Supply Agency would maintain the register, receive notifications, act as supervisory authority and maintain the situational picture. The notification obligation would apply to data centres whose installed IT power demand is at least 0.5 megawatts. The proposed act is intended to enter into force on 1.1.2027. Comments may be submitted until 2.10.2026.","tekstityyppi":"tiivistelmä","lahde":"https://tem.fi/-/luonnos-datakeskusrekisterilaista-lausuntokierrokselle","elin":"Työ- ja elinkeinoministeriö","maaraaika":"2026-10-02","k" const fiOnly = (o, f) => LANG !== "fi" && !!o && !!o[f] && !o[f + "_" + LANG];
/* Tunnukset ruotsiksi: KKO:2026:72 → HD:2026:72, KHO → HFD, HE 1/2026 vp → RP 1/2026 rd. Englanniksi tunnukset pysyvät suomenkielisinä (KKO:2026:72, HE 190/2026 vp). */
function showTun(t) {
  t = String(t ?? "");
  if (LANG !== "sv") return t;

}

/* Kokoaa meta-rivin osista niin, että se mahtuu leveyteen: osa voi olla [pitkä, lyhyt, …]; mahtumaton jätetään pois. */
function fitMeta(parts, width) {
  let out = "";
  for (const p of parts) {
    const alts = (Array.isArray(p) ? p : [p]).filter(Boolean);
    for (const a of alts) {
      const cand = out ? `${out} · ${a}` : String(a);
      if (chars(cand).length <= width) { out = cand; break; }
    }
  }
  return out;
}

let searchIndex = null;      // hakuindeksi rakennetaan vasta, kun hakua käytetään
const itemPage = new Map();   // kohteen id -> sivunumero
const itemIndex = new Map();  // sivunumero -> {ch, it}
let NUMS = [];

function compose(topFn, body, bottom, ft, label, extra) {
  const topLen = topFn(1, 1).length;
  const avail = 23 - topLen - bottom.length;
  const chunks = [];
  let cur = [];
  for (const r of body) {
    if (r.pageBreak) { if (cur.length) { chunks.push(cur); cur = []; } continue; }
    if (cur.length === 0 && r.blankLine) continue;
    cur.push(r);
    if (cur.length === avail) {
      const carry = [];
      while (cur.length > 1 && cur[cur.length - 1].keepNext) carry.unshift(cur.pop());
      while (cur.length > 1 && cur[cur.length - 1].blankLine) cur.pop();
      chunks.push(cur); cur = carry;
    }
  }
  while (cur.length && cur[cur.length - 1].blankLine) cur.pop();
  if (cur.length || !chunks.length) chunks.push(cur);
  const n = chunks.length;
  const subs = chunks.map((ch, i) => {
    const rows = [...topFn(i + 1, n), ...ch];
    while (rows.length < 23 - bottom.length) rows.push(blank());
    return [...rows, ...bottom];
  });
  return Object.assign({subs, ft, label}, extra || {});
}
function indicator(row, i, n, f, b) { if (n > 1) putR(row, 39, `${i}/${n}`, f, b); }
function bandTop(title, subtitle, bg, tf, sf, spacer = true) {
  return (i, n) => {
    const t = blank(bg); put(t, 1, title, tf, bg);
    const s = blank(bg); put(s, 1, trunc(subtitle, 34), sf, bg); indicator(s, i, n, sf, bg);
    return spacer ? [...dh(t), s, blank()] : [...dh(t), s];
  };
}
function filterNote() {
  const r = blank(); put(r, 1, trunc(S("◆ Aiheet: ", "◆ Ämnen: ") + filterNames(), 30), "m"); putR(r, 38, "110", "y"); linkRow(r, 110); return r;
}
/* Linkki sivulle, arkistojuttuun (ai) tai kalenterin päivään (day) */
function linkTo(row, t) { for (const c of row.c) { c.p = t.p; if (t.ai) c.ai = t.ai; if (t.day) c.day = t.day; } return row; }
const target = x => x.ai ? {p:105, ai:x.ai} : {p:x.page};

/* Meta-rivin osat: päivä ensin, sitten tunnus tai lyhenne. */
function metaParts(ch, it) {
  const d = fmtDate(it.pvm, true);
  if (ch.key === "hao") { const c = (it.elin || "").replace(/ HaO$/i, ""); return [d, haoAihe(it.aihe), [cityName(HAO_CITY[c] || c)]]; }
  if (ch.key === "lausunnot") return [`DL ${fmtDate(it.maaraaika, true)}`, [orgShort(it), tx(it, "elin")]];
  if ((ch.key === "eit" || ch.key === "icj") && it.vaihe) { const v = tx(it, "vaihe"); return [d, [v, v.split(",")[0]]]; }
  return [d, [showTun(it.tunnus), orgShort(it)]];
}
function metaFor(ch, it, width = 34) { return fitMeta(metaParts(ch, it), width); }
function listRows(entries) {
  const out = [];
  for (const e of entries) {
    const t = e.ai ? {p:105, ai:e.ai} : {p:e.page};
    const a = blank(); put(a, 1, e.ai ? "ARK" : String(e.page), e.ai ? "g" : "y"); put(a, 5, trunc(e.title, 35), "w"); linkTo(a, t); a.keepNext = true;
    const b = blank(); put(b, 5, trunc(e.meta, e.uusi ? 30 : 34), "c");
    if (e.uusi) put(b, 36, S("UUSI", "NY"), "r", null, {fl:true});
    linkTo(b, t);
    out.push(a, b);
  }
  return out;
}
function channelItems(ch) { return (DATA.kanavat?.[ch.key] || []).slice(0, MAX_ITEMS); }

function emptyArt(msg, artIndex) {
  const out = [...textRows(msg, "w"), gap(), ...artRows(artIndex), gap()];
  const [term, def] = termOfDay(artIndex);
  const r = blank(); put(r, 1, S("PÄIVÄN TERMI", "DAGENS TERM"), "g");
  if (chars(term).length <= 24) { put(r, 14, term, "y"); out.push(r); } else { out.push(r, line(trunc(term, 38), "y")); }
  const dl = wrap(def, 38); if (dl.length > 4) dl[3] = trunc(dl[3] + " …", 38);
  out.push(...dl.slice(0, 4).map(l => line(l, "c")));
  return out;
}

function buildChannel(ch, ci) {
  const items = channelItems(ch);
  const top = bandTop(ch.name, ch.sub, ch.bg, ch.tf, ch.fg);
  const vis = items.map((it, i) => ({it, page: ch.page + i + 1})).filter(x => matches(x.it));
  let body;
  if (vis.length) {
    body = listRows(vis.map(x => ({page:x.page, title:tx(x.it, "otsikko"), meta:metaFor(ch, x.it, isFresh(x.it) ? 30 : 34), uusi:isFresh(x.it)})));
    if (filterOn() && vis.length < items.length) body.push(gap(), line(S(`Suodatin piilottaa ${items.length - vis.length} juttua.`, `Filtret döljer ${items.length - vis.length} nyheter.`, `The filter hides ${items.length - vis.length} items.`), "m"));
  } else if (items.length) {
    body = emptyArt(S(`Ei juttuja valituissa aiheissa (${filterNames()}). Poista suodatin AIHEET-näppäimestä tai katso sivu 110.`,
      `Inga nyheter i de valda ämnena (${filterNames()}). Ta bort filtret med ÄMNEN-knappen eller se sidan 110.`,
      `No items in the selected topics (${filterNames()}). Remove the filter with the TOPICS key or see page 110.`), ci);
  } else {
    body = emptyArt(S("Kanavalla ei ole juuri nyt uusia juttuja. LAKI-TV päivittyy aamulla ja iltapäivällä.",
      "Kanalen har inga nya nyheter just nu. LAKI-TV uppdateras på morgonen och eftermiddagen."), ci);
  }
  const bot = blank();
  if (filterOn()) { put(bot, 1, trunc("◆ " + filterNames(), 30), "m"); putR(bot, 38, "110", "y", null, {p:110}); }
  else put(bot, 1, trunc(ch.note, 38), "g");
  const prev = CHANNELS[(ci + CHANNELS.length - 1) % CHANNELS.length];
  const next = CHANNELS[(ci + 1) % CHANNELS.length];
  const ft = [
    {t:`${prev.short} ${prev.page}`, p:prev.page},
    {t:`${next.short} ${next.page}`, p:next.page},
    vis.length ? {t:`${S("Uusin", "Nyast")} ${vis[0].page}`, p:vis[0].page} : {t:S("Lista 190", "Lista 190"), p:190},
    {t:S("Etusivu", "Start"), p:100}
  ];
  pages.set(ch.page, compose(top, body, [bot], ft, `${ch.short} ${ch.name.toLowerCase()}`));
  items.forEach((it, i) => {
    const num = ch.page + i + 1;
    itemPage.set(it.id, num);
    itemIndex.set(num, {ch, it});
  });
}

/* Eduskunnan vaihemuutokset (he-update kirjaa ne): sinceDay = ensimmäinen mukaan otettava havaintopäivä */

function heStatusFor(tunnus) { return (DATA.he_tila || []).find(h => h.he === tunnus); }
function topicRows(tags) {

/* ---------------- Seuraa asiaa ----------------
   Seurattavat jutut tallentuvat vain selaimeen (lakitv:seuranta),
   jolloin aamukooste kertoo muutokset. Tilannekuva (tila) on suomenkielinen raakatieto, jotta vertailu ei riipu kielestä. */
const FOLLOW_MAX = 100;
const str = (v, max) => typeof v === "string" ? v.slice(0, max) : "";
/* Hyväksyy vain odotetun muotoiset seurantarivit, enintään FOLLOW_MAX kpl. */
function cleanFollows(l) {
  if (!Array.isArray(l)) return [];
  const seen = new Set(), out = [];
  for (const x of l) {
    if (!x || typeof x !== "object" || !str(x.id, 200) || seen.has(x.id)) continue;
    seen.add(x.id);
    out.push({id:str(x.id, 200).replace(/[\r\n\t]/g, ""), tunnus:str(x.tunnus, 60) || str(x.id, 60), otsikko:str(x.otsikko, 80), k:typeof x.k === "string" && Object.hasOwn(CH, x.k) ? x.k : "", tila:str(x.tila, 120), pvm:str(x.pvm, 10)});
    if (out.length >= FOLLOW_MAX) break;
  }
  return out;
}
let followCache = null;
window.addEventListener("storage", e => { if (!e.key || e.key === "lakitv:seuranta") followCache = null; });
function followList() { return followCache || (followCache = cleanFollows(store.arr("seuranta"))); }
function followSave(list) { followCache = cleanFollows(list); store.set("seuranta", followCache); }
function isFollowed(id) { return followList().some(x => x.id === id); }
function findKnown(id) { return allKnown().find(x => x.it.id === id) || null; }
/* Tilannekuva: HE = käsittelyvaihe, EIT/ICJ = vaihe, lausunto = määräaika, muut = julkaisuaika */
function snapshotOf(x) {
  const it = x.it;
  if (x.ch.key === "he") { const st = heStatusFor(it.tunnus || it.id); return `he:${st ? st.vaihe : 0}`; }
  if (it.vaihe) return `vaihe:${it.vaihe}`;
  if (it.maaraaika) return `dl:${it.maaraaika}`;
  return `pvm:${it.julkaistu || it.pvm || ""}${x.ai ? "|ark" : ""}`;
}
function snapshotLabel(s) {
  const [k, v] = String(s || "").split(/:(.*)/s);
  if (k === "he") return +v ? stageShort(+v) : S("Annettu", "Avlämnad", "Submitted");
  if (k === "vaihe") return v;
  if (k === "dl") return `DL ${fmtDate(v)}`;
  return v ? fmtDate(v.slice(0, 10)) + (v.endsWith("|ark") ? ` · ${S("arkisto", "arkiv", "archive")}` : "") : "";
}
function followStatus(f) {
  const x = findKnown(f.id);
  if (!x) return {gone:true, label:S("Poistunut LAKI-TV:stä (yli 35 pv)", "Borttagen från LAKI-TV (över 35 d)", "Removed from LAKI-TV (over 35 d)"), changed:false};
  const now = snapshotOf(x), changed = !!f.tila && f.tila !== now;
  let label;
  if (x.ch.key === "he") { const st = heStatusFor(x.it.tunnus || x.it.id); label = st ? `${stageName(st)}${st.valiokunta ? " · " + vkName(st.valiokunta) : ""}` : S("Annettu", "Avlämnad", "Submitted"); }
  else if (x.it.vaihe) label = tx(x.it, "vaihe");
  else if (x.it.maaraaika) { const d = daysBetween(todayISO(), x.it.maaraaika); label = `DL ${fmtDate(x.it.maaraaika)}` + (d >= 0 ? ` · ${d} ${S("pv", "d")}` : ` · ${S("päättynyt", "gått ut", "closed")}`); }
  else label = x.ai ? S("Arkistossa", "I arkivet", "In the archive") : S("Kanavalla", "På kanalen", "On the channel");
  return {x, now, changed, label, old:changed ? snapshotLabel(f.tila) : ""};
}
function toggleFollow(id) {
  const list = followList();
  if (list.some(f => f.id === id)) followSave(list.filter(f => f.id !== id));
  else {
    const x = findKnown(id); if (!x) return;
    if (list.length >= FOLLOW_MAX) { if (liveEl) liveEl.textContent = S(`Seurannassa voi olla enintään ${FOLLOW_MAX} asiaa.`, `Högst ${FOLLOW_MAX} ärenden kan bevakas.`, `You can follow at most ${FOLLOW_MAX} items.`); return; }
    list.push({id, tunnus:x.it.tunnus || id, otsikko:x.it.otsikko, k:x.ch.key, tila:snapshotOf(x), pvm:todayISO()});
    followSave(list);
  }
  rebuild();
}
function ackFollows() {   // kuittaus: tilannekuva päivitetään, ja LAKI-TV:stä kokonaan poistuneet pudotetaan listalta
  const list = followList().map(f => { const x = findKnown(f.id); return x ? {...f, tila:snapshotOf(x)} : null; }).filter(Boolean);
  followSave(list); rebuild();
}
/* 108 SEURANNASSA */
function buildFollow() {
  const list = followList();
  const top = bandTop(S("SEURANNASSA", "BEVAKNING", "FOLLOWING"), S("Seuraamasi asiat ja niiden tila", "Ärenden du följer och deras status", "Items you follow and their status"), "y", "b", "k");
  const body = [];
  if (!list.length) {
    body.push(...textRows(S("Et seuraa vielä mitään. Avaa juttu ja valitse SEURAA ASIAA. Tälle sivulle kootaan hallituksen esitysten käsittelyvaiheet, EIT:n ja ICJ:n juttujen vaiheet, lausuntoaikojen määräajat ja tieto, kun juttu siirtyy arkistoon.",
      "Du följer inget ännu. Öppna en nyhet och välj BEVAKA ÄRENDET. Här samlas propositionernas behandlingsskeden, EMD:s och ICJ:s mål, remisstider och uppgift om när en nyhet flyttas till arkivet.",
      "You are not following anything yet. Open an item and choose FOLLOW THIS ITEM. This page collects the stages of government bills, ECHR and ICJ cases, consultation deadlines and a note when an item moves to the archive."), "w"), gap());
    body.push(...textRows(S("Seurannat tallentuvat vain tähän selaimeen. Muutokset näkyvät myös aamukoosteessa (107).",
      "Bevakningarna sparas bara i den här webbläsaren. Ändringarna syns också i morgonsammandraget (107).",
      "Follows are stored only in this browser. Changes also appear in the morning digest (107)."), "g"));
  } else {
    const sts = list.map(f => ({f, s:followStatus(f)}));
    const changed = sts.filter(z => z.s.changed || z.s.gone);
    if (changed.length) body.push(head(S("MUUTTUNUT", "ÄNDRAT", "CHANGED"), "r"));
    else body.push(head(S("EI MUUTOKSIA", "INGA ÄNDRINGAR", "NO CHANGES"), "g"));
    const rowsFor = z => {
      const {f, s} = z, t = s.x ? target(s.x) : null;
      const a = blank(); put(a, 1, s.x ? (s.x.ai ? "ARK" : String(s.x.page)) : "–", s.x ? (s.x.ai ? "g" : "y") : "r"); put(a, 5, trunc(s.x ? tx(s.x.it, "otsikko") : f.otsikko, 35), "w");
      const b = blank(); put(b, 5, trunc(s.old ? `${s.old} ▶ ${s.label}` : s.label, s.gone ? 25 : 34), s.gone ? "r" : s.changed ? "y" : "c");
      if (s.gone) putR(b, 38, S("LOPETA", "AVSLUTA", "STOP"), "y", null, {act:"seuraa", arg:f.id});
      if (t) { linkTo(a, t); linkTo(b, t); }
      return [a, b];
    };
    changed.forEach(z => body.push(...rowsFor(z)));
    const rest = sts.filter(z => !z.s.changed && !z.s.gone);
    if (changed.length && rest.length) body.push(gap(), head(S("ENNALLAAN", "OFÖRÄNDRAT", "UNCHANGED"), "g"));
    rest.forEach(z => body.push(...rowsFor(z)));
    const hm = (DATA.he_muutokset || []).filter(m => list.some(f => f.tunnus === m.he)).slice(0, 6);
    if (hm.length) body.push(gap(), head(S("EDUSKUNNASSA · 14 PV", "I RIKSDAGEN · 14 D", "IN PARLIAMENT · 14 D")), ...heChangeRows(hm));
    body.push(gap());
    if (changed.length) { const r = blank(); put(r, 1, S("▶ MERKITSE NÄHDYIKSI", "▶ MARKERA SOM SEDDA", "▶ MARK AS SEEN"), "y", null, {act:"seuraa-ok"}); body.push(r); }
    body.push(...textRows(S("Lopeta seuranta juttusivulta. Muutokset näkyvät myös aamukoosteessa (107).", "Avsluta bevakningen på nyhetens sida. Ändringarna syns också i morgonsammandraget (107).", "Stop following on the item page. Changes also appear in the morning digest (107)."), "g"));
  }
  const bot = blank(); put(bot, 1, `${list.length} ${S("seurannassa", "bevakade", "followed")}`, "g"); putR(bot, 38, S("kooste 107", "sammandrag 107", "digest 107"), "c", null, {p:107});
  return compose(top, body, [bot], [{t:S("Tänään", "I dag"), p:101}, {t:S("Viikko", "Vecka"), p:102}, {t:S("Jak. 109", "Dist. 109", "Feeds 109"), p:109}, {t:S("Etusivu", "Start"), p:100}], S("seurannassa", "bevakning", "following"));
}

/* ---------------- Kalenteri (manuaalinen lisäys) ----------------
   Tapahtumat kootaan sivuja rakennettaessa (KAL); KALENTERIIN-linkki avaa paneelin, josta lukija itse lisää tapahtuman
   Google-kalenteriin, Outlookiin tai lataa .ics-tiedoston. Mitään ei lisätä automaattisesti. */
const KAL = new Map();
function kalAdd(id, ev) { KAL.set(id, ev); return ev; }
const icsEsc = s => String(s || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
function icsText(evs) {
  const stamp = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
  const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//LAKI-TV//FI", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "X-WR-CALNAME:LAKI-TV"];
  for (const e of evs) {
    const d = e.pvm.replace(/-/g, ""), d2 = addDays(e.pvm, 1).replace(/-/g, "");
    L.push("BEGIN:VEVENT", `UID:${String(e.id).replace(/[\s,;:\\]/g, "")}@laki-tv`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${d2}`,
      `SUMMARY:${icsEsc(e.otsikko)}`, `DESCRIPTION:${icsEsc(e.kuvaus)}`, ...(e.url ? [`URL:${e.url}`] : []), "END:VEVENT");
  }
  L.push("END:VCALENDAR");
  return L.map(icsFold).join("\r\n") + "\r\n";
}
/* RFC 5545: rivi enintään 75 oktettia; jatko alkaa välilyönnillä. Katkaisu merkkirajalla. */
function icsFold(l) {
  const enc = new TextEncoder(), out = []; let cur = "", n = 0;
  for (const ch of chars(l)) { const b = enc.encode(ch).length; const lim = out.length ? 74 : 75; if (n + b > lim) { out.push(cur); cur = ch; n = b; } else { cur += ch; n += b; } }
  out.push(cur);
  return out.map((x, i) => (i ? " " : "") + x).join("\r\n");
}
function kalLinks(e) {
  const d = e.pvm.replace(/-/g, ""), d2 = addDays(e.pvm, 1).replace(/-/g, "");
  const desc = e.kuvaus + (e.url ? "\n" + e.url : "");
  const g = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(e.otsikko)}&dates=${d}/${d2}&details=${encodeURIComponent(desc)}`;
  const o = `https://outlook.office.com/calendar/0/deeplink/compose?subject=${encodeURIComponent(e.otsikko)}&startdt=${e.pvm}&enddt=${addDays(e.pvm, 1)}&allday=true&body=${encodeURIComponent(desc)}&path=%2Fcalendar%2Faction%2Fcompose&rru=addevent`;
  return {google:g, outlook:o};
}
/* Julkaistun tiedoston osoite sivun rinnalla (feed.xml, kalenteri.txt …) */
function fileUrl(path) {
  try {
    const u = new URL(location.href);
    if (/\/artifact\/[^/]+$/.test(u.pathname)) return `${u.origin}${u.pathname}/${path}`;
    return new URL(path, u.href).href;
  } catch (e) { return path; }

/* Tallennus: downloads-kyky ei salli .ics-päätettä, joten tiedosto tarjotaan .ics.txt-nimellä (lukija nimeää sen .ics:ksi).

/* Etusivun otsikot: 24 tunnin tärkein ensin, sitten tuoreus ja paino; voimaantulot pysyvät mukana.
   o.items: ehdokkaat (oletus kanavien jutut), o.boost: toimituksen nostot, o.vt: voimaantulorivit.
   Kalenterin päiväsivu kutsuu tätä withRef-ajalla (päivän loppu). */
function frontHeads(o = {}) {
  const boost = new Map(o.boost === false ? [] : (DATA.etusivu || []).filter(h => h.ref).map(h => [h.ref, h]));
  const c = (o.items || allItems()).filter(x => matches(x.it)).map(x => {
    const b = boost.get(x.it.id), f = freshness(x.it), score = Math.min(5, (x.it.paino || 2) + (b ? 1 : 0));
    return {x, f, score, fe: f + (score <= 2 ? 1 : 0), t: pubEpoch(x.it), title: (b && tx(b, "otsikko")) || tx(x.it, "otsikko")};
  }).filter(q => q.f <= 3);
  c.sort((a, b) => a.fe - b.fe || b.score - a.score || b.t - a.t);
  const lead = c.filter(q => q.f === 0).sort((a, b) => b.score - a.score || b.t - a.t)[0] || c[0];
  const rest = c.filter(q => q !== lead);
  const heads = lead ? [{otsikko:lead.title, ...target(lead.x)}] : [];
  const today = todayISO(), end = addDays(today, 14);
  const when = dte => dte === today ? S("TÄNÄÄN", "I DAG") : dte === addDays(today, 1) ? S("HUOMENNA", "I MORGON") : `${wdOf(dte).toUpperCase()} ${fmtDate(dte, true)}`;
  const vt = (o.vt || DATA.voimaantulot || []).filter(v => v.pvm >= today && v.pvm <= end && matches(v)).sort((a, b) => a.pvm.localeCompare(b.pvm));
  if (vt.length) {
    const dte = vt[0].pvm, s = (DATA.vt_paivat || {})[dte], same = vt.filter(v => v.pvm === dte);
    const n = s ? s.lakeja : (same.find(v => v.paiva_lakeja) || {}).paiva_lakeja || same.reduce((a, v) => a + (v.lakeja || 1), 0);
    heads.push({otsikko:S(`${when(dte)} VOIMAAN ${n} ${n === 1 ? "LAKI" : "LAKIA"}`, `${when(dte)} ${n} ${n === 1 ? "LAG" : "LAGAR"} I KRAFT`, `${when(dte)} ${n} ${n === 1 ? "ACT ENTERS" : "ACTS ENTER"} INTO FORCE`), p:800});
  }
  const eu = (DATA.eu_voimaantulot || []).filter(v => v.pvm >= today && v.pvm <= end && matches(v)).sort((a, b) => a.pvm.localeCompare(b.pvm));
  rest.slice(0, Math.max(0, 8 - heads.length - (eu.length ? 1 : 0))).forEach(q => heads.push({otsikko:q.title, ...target(q.x)}));
  if (eu.length) {
    const same = eu.filter(v => v.pvm === eu[0].pvm), d = when(eu[0].pvm);
    heads.push({otsikko: same.length > 1 ? S(`${d} EU: ${same.length} SÄÄDÖSTÄ ALKAA`, `${d} EU: ${same.length} RÄTTSAKTER BÖRJAR`, `${d} EU: ${same.length} ACTS START TO APPLY`) : `${d} EU: ${tx(same[0], "nimi").toUpperCase()}`, p:801});
  }
  return heads.slice(0, 8);
}
function headRows(heads) {
  return heads.map((hd, i) => {
    const r = blank();
    put(r, 1, trunc(hd.otsikko, 35), i === 0 ? "y" : (i % 2 ? "w" : "c"));
    putR(r, 39, hd.ai ? "ARK" : String(hd.p), i === 0 ? "w" : hd.ai ? "g" : "y");
    linkTo(r, hd);
    return r;
  });
}

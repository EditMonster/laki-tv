# LAKI-TV vahti: tarkistaa joka aamu klo 10.10 (Helsinki), että päivitysajo on työntänyt tuoreen sisällön.
# Jos data.json on yli 20 tuntia vanha, työnkulku epäonnistuu ja GitHub lähettää siitä sähköpostin varaston omistajalle.
name: vahti
on:
  schedule:
    - cron: "10 7 * * *"   # 07:10 UTC = 10:10 Helsinki (kesäaika 09:10 UTC olisi 10:10; talvella tämä on 09:10 Helsinki – riittää)
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tuoreus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Onko sisältö tuoretta?
        run: |
          python3 - <<'PY'
          import json, datetime, sys
          d = json.load(open("data.json", encoding="utf-8"))
          t = datetime.datetime.fromisoformat(d["paivitetty"])
          age = (datetime.datetime.now(datetime.timezone.utc) - t).total_seconds() / 3600
          print(f"paivitetty {d['paivitetty']}, ikä {age:.1f} h")
          if age > 20:
              sys.exit(f"LAKI-TV: sisältö on {age:.0f} tuntia vanhaa – tarkista ajastettu päivitysajo ja GitHub-peilaus.")
          PY

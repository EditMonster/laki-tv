function applyStatic() {
  document.querySelectorAll("[data-sv]").forEach(el => { if (el.dataset.fi == null) el.dataset.fi = el.textContent; el.textContent = el.dataset[LANG] ?? el.dataset.fi; });
  for (const [attr, K] of [["title", "Title"], ["aria-label", "Aria"], ["placeholder", "Ph"]]) {
    document.querySelectorAll(`[data-sv-${K.toLowerCase()}]`).forEach(el => {
      if (el.dataset["fi" + K] == null) el.dataset["fi" + K] = el.getAttribute(attr) || "";
      el.setAttribute(attr, el.dataset[LANG + K] ?? el.dataset["fi" + K]);
    });
  }
  document.documentElement.lang = LANG;
  for (const [id, l] of [["kFi", "fi"], ["kSv", "sv"], ["kEn", "en"]]) { const b = document.getElementById(id); b.classList.toggle("on", LANG === l); b.setAttribute("aria-pressed", String(LANG === l)); }
}
function setLang(l) {
  const nl = LANGS.includes(l) ? l : "fi";
  if (nl === LANG) return;
  LANG = nl; store.set("lang", LANG);
  applyLangData(); applyStatic();
  rebuild();
  if (panel.open) {
    renderPanelList(); renderPanelTopics();
    if (!paneSearch.hidden) runSearch();
    if (!paneKal.hidden) renderKal();
  }
}

/* ---------------- Tapahtumat ---------------- */
rowsEl.addEventListener("click", e => {
  const a = e.target.closest("a[data-p],a[data-act]");
  if (!a) return;
  e.preventDefault(); blink();
  if (a.dataset.act === "seuraa") { toggleFollow(a.dataset.arg); return; }
  if (a.dataset.act === "seuraa-ok") { ackFollows(); return; }
  if (a.dataset.act === "kal") { openKal(a.dataset.arg); return; }
  if (a.dataset.act === "jakelu") { kalCurrent = null; openPanel("kal"); return; }
  go(+a.dataset.p, false, {day:a.dataset.day, ai:a.dataset.ai});
  if (document.activeElement === a || document.activeElement === document.body) { screenEl.tabIndex = -1; screenEl.focus({preventScroll:true}); }
});
document.querySelectorAll("[data-d]").forEach(b => b.addEventListener("click", () => typeDigit(b.dataset.d)));
document.querySelectorAll("[data-ft]").forEach(b => b.addEventListener("click", () => fast(+b.dataset.ft)));
document.getElementById("kIndex").addEventListener("click", () => { blink(); go(100); });
document.getElementById("kHelp").addEventListener("click", () => { blink(); go(199); });
document.getElementById("k888").addEventListener("click", () => { blink(); go(888); });
document.getElementById("kList").addEventListener("click", () => { blink(); openPanel("list"); });
document.getElementById("kTopics").addEventListener("click", () => { blink(); openPanel("topics"); });
document.getElementById("kSearch").addEventListener("click", () => { blink(); openPanel("search"); });
document.getElementById("kSub").addEventListener("click", () => { blink(); kalCurrent = null; openPanel("kal"); });
document.getElementById("kFollow").addEventListener("click", () => { blink(); go(108); });
document.getElementById("kFi").addEventListener("click", () => { blink(); setLang("fi"); });
document.getElementById("kSv").addEventListener("click", () => { blink(); setLang("sv"); });
document.getElementById("kEn").addEventListener("click", () => { blink(); setLang("en"); });
document.getElementById("kBack").addEventListener("click", back);
document.getElementById("kCase").addEventListener("click", () => { blink(); setCaps(!state.caps); });
document.getElementById("kReveal").addEventListener("click", () => { blink(); setReveal(!state.reveal); });
document.getElementById("kSize").addEventListener("click", cycleSize);
document.getElementById("kPp").addEventListener("click", () => step(1));
document.getElementById("kPm").addEventListener("click", () => step(-1));
document.getElementById("kSubNext").addEventListener("click", () => subStep(1));
document.getElementById("kSubPrev").addEventListener("click", () => subStep(-1));
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (panel.open) return;
  const tg = e.target;
  if (tg && (tg.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName))) return;
  const k = e.key;
  let handled = true;
  if (/^[0-9]$/.test(k)) typeDigit(k);
  else if (k === "ArrowUp" || k === "PageUp" || k === "+") step(1);
  else if (k === "ArrowDown" || k === "PageDown" || k === "-") step(-1);
  else if (k === "ArrowRight") subStep(1);
  else if (k === "ArrowLeft") subStep(-1);
  else if (k === "Backspace") back();
  else if (k === "r" || k === "R" || k === "F1") fast(0);
  else if (k === "g" || k === "G" || k === "F2") fast(1);
  else if (k === "y" || k === "Y" || k === "F3") fast(2);
  else if (k === "b" || k === "B" || k === "F4") fast(3);
  else if (k === "s" || k === "S") cycleSize();
  else if (k === "c" || k === "C") setCaps(!state.caps);
  else if (k === "l" || k === "L") openPanel("list");
  else if (k === "a" || k === "A") openPanel("topics");
  else if (k === "/" || k === "f" || k === "F") openPanel("search");
  else if (k === "?") { blink(); setReveal(!state.reveal); }
  else if (k === "i" || k === "I" || k === "Home") { blink(); go(100); }
  else if (k === "o" || k === "O") { blink(); go(199); }
  else handled = false;
  if (handled) e.preventDefault();
});
/* #p201 = sivunumero; #j=KKO%3A2026%3A72 = juttu tunnuksella (myös arkistossa); #d=2026-09-29 = kalenterin päivä */
function pageFromHash(hs) {
  let m = /^#p?(\d{3})$/.exec(hs || "");
  if (m) return +m[1] >= 100 && +m[1] <= 899 ? {n:+m[1]} : null;
  m = /^#d=(\d{4}-\d{2}-\d{2})$/.exec(hs || "");
  if (m) return validDay(m[1]) ? {n:104, day:m[1]} : {n:104};   // olematon päivä: kalenteri tälle päivälle
  m = /^#j=(.+)$/.exec(hs || "");
  if (m) {
    let id; try { id = decodeURIComponent(m[1]); } catch (e) { return null; }
    const p = itemPage.get(id);
    if (p) return {n:p};
    if ((DATA.arkisto || []).some(a => a.id === id)) return {n:105, ai:id};
  }
  return null;
}
window.addEventListener("hashchange", () => {
  const p = pageFromHash(location.hash);
  if (p && !(p.n === state.current && (!p.day || p.day === state.day) && (!p.ai || p.ai === state.arch))) go(p.n, false, p);
});

/* Kosketus: vaakapyyhkäisy = alasivu (tai sivu) */
let touch = null;
screenEl.addEventListener("touchstart", e => {
  const t = e.changedTouches[0]; touch = {x:t.clientX, y:t.clientY, at:Date.now()};
}, {passive:true});
screenEl.addEventListener("touchend", e => {
  if (!touch) return;
  const t = e.changedTouches[0], dx = t.clientX - touch.x, dy = t.clientY - touch.y;
  const quick = Date.now() - touch.at < 700; touch = null;
  if (quick && Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.4) {
    const dir = dx < 0 ? 1 : -1;
    if (!subStep(dir)) step(dir);
  }
}, {passive:true});
/* Kello ja vuorokauden vaihtuminen. Alasivut eivät vaihdu itsestään: lukija selaa niitä ◀ ▶ -näppäimillä. */
let builtDay = todayISO(), builtHour = Math.floor(Date.now() / 36e5);
function tick() {
  const d = todayISO(), hr = Math.floor(Date.now() / 36e5);
  if (d !== builtDay || hr !== builtHour) { builtDay = d; builtHour = hr; buildAll(); page = getPage(state.current) || fillerPage(state.current); state.sub = Math.min(state.sub, page.subs.length - 1); paintPage(); }
  paintHeader();
}
setInterval(() => { if (!document.hidden) tick(); }, 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });

/* ---------------- Mitoitus ---------------- */
const tv = document.getElementById("tv");
function fit() {
  const vw = document.documentElement.clientWidth, vh = window.innerHeight;
  const wide = vw >= 960, narrow = vw < 600;
  const sx = narrow ? 1 : 1.2;
  const padX = narrow ? .55 : 1.1, padY = narrow ? .6 : .9;
  document.documentElement.style.setProperty("--sx", sx);
  tv.style.padding = `${padY}em ${padX}em`;
  const availW = wide ? vw - 32 - 232 - 44 - 24 : vw - 32 - 22;
  const availH = wide ? vh - 64 : Math.max(vh * 0.9, 320);
  const fs = Math.floor(Math.max(8, Math.min(availW / (24 * sx + 2 * padX), availH / (25 + 2 * padY), 28)));
  tv.style.fontSize = fs + "px";
  /* Mitataan todellinen rivinleveys, jotta 40 merkkiä täyttää ruudun tarkasti */
  const w = rowsEl.offsetWidth;
  document.documentElement.style.setProperty("--kx", w ? (24 * sx * fs / w).toFixed(5) : String(sx));
}
let fitRaf = 0;
window.addEventListener("resize", () => { cancelAnimationFrame(fitRaf); fitRaf = requestAnimationFrame(fit); });

/* Kaukosäätimen fontti ladataan vasta ruudun piirron jälkeen */
/* Sivu ei lataa mitään ulkopuolisista palveluista: kaukosäätimen ja paneelin kirjasin on laitteen oma. */
/* Käynnistys */
applyStatic();
setCaps(state.caps, false);
renderFilterBadge();
{ const h0 = pageFromHash(location.hash); if (h0) { if (h0.day) state.day = h0.day; if (h0.ai) state.arch = h0.ai; } show(h0 ? h0.n : 100, 0); }
fit();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
try { sessionStorage.removeItem("lakitv:recover"); } catch (e) {}
window.LAKITV = {state, getPage, go, show, buildAll, NUMS:() => NUMS, TOPICS, CHANNELS, fillerPage, setLang, weekTop, allKnown, followList, toggleFollow, icsText, kalEventsUpcoming, KAL, fileUrl, itemIndexGet:n => itemIndex.get(n), cleanFollows, copyText};
})();

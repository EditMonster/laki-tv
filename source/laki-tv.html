o-oikeudelta-paatos-yliopiston-apteekille-maaratysta-seuraamusmaksusta-lakiuudistus-julkisen-sektorin-seuraamusmaksuista-lisaisi-yhdenmukaisuutta","selko":"Yliopiston Apteekille määrättiin 1,1 miljoonan euron maksu verkkokaupan seurantatyökaluista. Hallinto-oikeus kumosi maksun, koska ei ollut selvää, voiko yliopiston omistamalle apteekille määrätä maksua. Huomautus jäi pääosin voimaan.","aiheet":["tietosuoja","digi"],"julkaistu":"2026-06-01","paino":3,"otsikko_sv":"AVGIFT PÅ 1,1 MN EURO UPPHÄVDES","teksti_sv":"Helsingfors förvaltningsdomstol upphävde den påföljdsavgift på 1,1 miljoner euro som Universitetets Apotek hade ålagts för brott mot den allmänna dataskyddsförordningen. Avgiften hade påförts i juni 2025 för användningen av Googles och Metas spårningsteknik på nätapoteket. Förvaltningsdomstolen lät anmärkningen i huvudsak stå fast, men ansåg att det var oklart om en påföljdsavgift överhuvudtaget kan påföras ett apotek som ägs av Helsingfors universitet. Enligt gällande lag kan avgift inte påföras en aktör inom den offentliga sektorn.","selko_sv":"Universitetets Apotek ålades en avgift på 1,1 miljoner euro för spårningsverktyg i nätbutiken. Förvaltningsdomstolen upphävde avgiften, eftersom det var oklart om ett apotek som ägs av universitetet kan åläggas avgift. Anmärkningen står i huvudsak fast.","asiasanat_sv":"Dataskydd – Påföljdsavgift – Aktör inom den offentliga sektorn – Spårningsteknik","elin_sv":"Helsingfors förvaltningsdomstol","otsikko_en":"PHARMACY'S 1.1 MEUR FINE OVERTURNED","teksti_en":"The Helsinki Administrative Court overturned the administrative fine of 1.1 million euros imposed on Yliopiston Apteekki for breaching the General Data Protection Regulation. The fine had been imposed in June 2025 for the use of Google and Meta tracking technologies in the online pharmacy. The court largely upheld the reprimand but found it unclear whether an administrative fine can be imposed at all on a pharmacy owned by the University of Helsinki. Under current law, a fine cannot be imposed on a public sector operator.","selko_en":"Yliopiston Apteekki was fined 1.1 million euros over tracking tools in its online shop. The Administrative Court overturned the fine because it was unclear whether a fine can be imposed on a pharmacy owned by the university. The reprimand largely stands.","asiasanat_en":"Data protection – Administrative fine – Public sector operator – Tracking technologies","elin_en":"Helsinki Administrative Court"},{"id":"hao-turku-440-2026","tunnus":"Turun HaO 440/2026","elin":"Turun HaO","aihe":"SOTE","otsikko":"KULJETUSPALVELU JA LÄHIKUNTA","pvm":"2026-03-09","pvm_selite":"annettu","asiasanat":"Vammaispalvelulaki – Liikkumisen tuen laajuus – Kuljetuspalvelu – Toiminnallinen lähikunta – Yhdistystoiminta","teksti":"Vammaispalvelulaki – Liikkumisen tuen laajuus – Kuljetuspalvelu – Toiminnallinen lähikunta – Yhdistystoiminta.","tekstityyppi":"asiasanat","lahde":"https://www.tuomioistuimet.fi/ratkaisut/turun-hao-9-3-2026-440-2026/","selko":"Asia koskee vammaisen henkilön kuljetuspalvelua: kuinka laajasti matkoja myönnetään esimerkiksi naapurikuntaan ja järjestötoimintaan. Saatavilla ovat vain asiasanat.","aiheet":["sote"],"julkaistu":"2026-03-09","paino":2,"otsikko_sv":"FÄRDTJÄNST OCH NÄRKOMMUN","teksti_sv":"Lagen om funktionshinderservice – Omfattningen av stödet för rörlighet – Färdtjänst – Funktionell närkommun – Föreningsverksamhet.","selko_sv":"Ärendet gäller färdtjänst för en person med funktionsnedsättning: i vilken omfattning resor beviljas till exempel till en grannkommun och till föreningsverksamhet. Endast sökorden finns tillgängliga.","asiasanat_sv":"Lagen om funktionshinderservice – Omfattningen av stödet för rörlighet – Färdtjänst – Funktionell närkommun – Föreningsverksamhet","elin_sv":"Åbo förvaltningsdomstol","otsikko_en":"TRANSPORT SERVICE AND NEARBY AREA","teksti_en":"Disability Services Act – Scope of mobility support – Transport service – Functional nearby municipality – Association activities.","selko_en":"The case concerns transport services for a person with a disability: how widely trips are granted, for example to a neighbouring municipality and to association activities. Only keywords are available.","asiasanat_en":"Disability Services Act – Scope of mobility support – Transport service – Functional nearby municipality – Association activities","elin_en":"Turku Administrative Court"},{"id":"hao-turku-397-2026","tunnus":"Turun HaO 397/2026","elin":"Turun HaO","aihe":"ULKOMAALAISASIAT","otsikko":"TUTKINTAVANKEUS JA PYSYVÄ OLESKELU","pvm":"2026-03-03","pvm_selite":"annettu","asiasanat":"Unionin kansalainen – Pysyvä oleskeluoikeus – Oleskelun yhtäjaksoisuus – Tutkintavankeus","teksti":"Unionin kansalainen – Pysyvä oleskeluoikeus – Oleskelun yhtäjaksoisuus – Tutkintavankeus.","tekstityyppi":"asiasanat","lahde":"https://www.tuomioistuimet.fi/ratkaisut/turun-hao-3-3-2026-397-2026/","selko":"Asia koskee EU-kansalaisen pysyvää oleskeluoikeutta Suomessa ja sitä, katkaiseeko tutkintavankeus yhtäjaksoisen oleskelun. Saatavilla ovat vain asiasanat.","aiheet":["maahanmuutto","eu"],"julkaistu":"2026-03-03","paino":2,"otsikko_sv":"HÄKTNING OCH PERMANENT UPPEHÅLL","teksti_sv":"Unionsmedborgare – Permanent uppehållsrätt – Oavbruten vistelse – Häktning.","selko_sv":"Ärendet gäller en EU-medborgares permanenta uppehållsrätt i Finland och om häktning bryter en oavbruten vistelse. Endast sökorden finns tillgängliga.","asiasanat_sv":"Unionsmedborgare – Permanent uppehållsrätt – Oavbruten vistelse – Häktning","elin_sv":"Åbo förvaltningsdomstol","otsikko_en":"REMAND AND PERMANENT RESIDENCE","teksti_en":"Union citizen – Right of permanent residence – Continuity of residence – Remand in custody.","selko_en":"The case concerns an EU citizen's right of permanent residence in Finland and whether remand in custody interrupts continuous residence. Only keywords are available.","asiasanat_en":"Union citizen – Right of permanent residence – Continuity of residence – Remand in custody","elin_en":"Turku Administrative Court"}],"kilpailu":[{"id":"kkv-2026-10-01-cpc-videopelit","tunnus":"KKV tiedote 1.10.2026","otsikko":"EU-VALVONTA PELIEN VALUUTOISTA","pvm":"2026-10-01","pvm_selite":"tiedote","julkaistu":"2026-10-01T09:01","paino":2,"lainvoimainen":false,"elin":"Kilpailu- ja kuluttajavirasto","elin_sv":"Konkurrens- och konsumentverket (KKV)","elin_en":"Finnish Competition and Consumer Authority (FCCA)","asiasanat":"Kuluttajansuoja – CPC-verkosto – Videopelit – Pelien sisäiset valuutat – Yhteiset valvontatoimet","asiasanat_sv":"Konsumentskydd – CPC-nätverket – Videospel – Virtuella valutor i spel – Gemensamma tillsynsåtgärder","asiasanat_en":"Consumer protection – CPC network – Video games – In-game virtual currencies – Coordinated enforcement","teksti":"EU:n kuluttajansuojaviranomaisten verkosto (CPC) epäilee puutteita kuluttajansuojasääntelyn noudattamisessa videopelialalla ja on käynnistänyt yhteisiä valvontatoimia. Uudet tutkinnat koskevat yhdeksää peliä: Candy Crush Saga, Clash of Clans, Forge of Empires, For Honor, Gardenscapes, Hunt: Showdown 1896, Mech Arena, Minecraft ja Valorant. Verkosto julkaisi keväällä 2025 ohjeistuksen pelien sisäisistä valuutoista, muun muassa hintojen ilmoittamisesta ja ennen sopimusta annettavista tiedoista. Euroopan komissio koordinoi valvontaa, ja Suomessa mukana on kuluttaja-asiamies.","tekstityyppi":"tiivistelmä","selko":"EU-maiden kuluttajaviranomaiset tutkivat, noudattavatko yhdeksän suosittua videopeliä kuluttajansuojasääntöjä esimerkiksi pelien sisäisten valuuttojen hinnoista kertomisessa. Suomesta mukana on kuluttaja-asiamies. Tutkinnat ovat kesken.","lahde":"https://www.kkv.fi/ajankohtaista/tiedotteet/eun-kuluttajansuojaviranomaiset-kaynnistivat-yhteiset-valvontatoimet-pelialalla/","aiheet":["kuluttaja","eu","digi"],"otsikko_sv":"EU-TILLSYN AV SPELVALUTOR","teksti_sv":"Nätverket för EU:s konsumentskyddsmyndigheter (CPC) misstänker brister i hur konsumentskyddsreglerna följs i videospelsbranschen och har inlett gemensamma tillsynsåtgärder. De nya utredningarna gäller nio spel: Candy Crush Saga, Clash of Clans, Forge of Empires, For Honor, Gardenscapes, Hunt: Showdown 1896, Mech Arena, Minecraft och Valorant. Nätverket publicerade våren 2025 riktlinjer om virtuella valutor i spel, bland annat om prisangivelse och den information som ska ges före avtalet. Europeiska kommissionen samordnar tillsynen, och i Finland deltar konsumentombudsmannen.","selko_sv":"Konsumentmyndigheterna i EU-länderna utreder om nio populära videospel följer konsumentskyddsreglerna, till exempel när det gäller att informera om priserna på spelens egna valutor. Från Finland deltar konsumentombudsmannen. Utredningarna pågår.","otsikko_en":"EU ACTION ON IN-GAME CURRENCIES","teksti_en":"The network of EU consumer protection authorities (CPC) suspects shortcomings in compliance with consumer protection rules in the video game sector and has launched coordinated enforcement action. The new investigations concern nine games: Candy Crush Saga, Clash of Clans, Forge of Empires, For Honor, Gardenscapes, Hunt: Showdown 1896, Mech Arena, Minecraft and Valorant. In spring 2025 the network published guidance on in-game virtual currencies, including price indication and the information to be given before a contract is concluded. The European Commission coordinates the action, and in Finland the Consumer Ombudsman takes part.","selko_en":"Consumer authorities in EU countries are investigating whether nine popular video games follow consumer protection rules, for example in how they show prices of in-game currencies. Finland's Consumer Ombudsman is taking part. The investigations are ongoing.","lisatty":"2026-10-01T14:51"},{"id":"kkv-2026-09-30-fitness24seven","tunnus":"KKV tiedote 30.9.2026","otsikko":"KUNTOSALIN IRTISANOMISAIKA MAO:HON","pvm":"2026-09-30","pvm_selite":"tiedote","julkaistu":"2026-09-30T09:33","paino":3,"elin":"Kuluttaja-asiamies","lainvoimainen":false,"asiasanat":"Kuluttajansuoja – Sopimusehdot – Irtisanomisaika – Kieltovaatimus – Uhkasakko","teksti":"Kuluttaja-asiamies vaatii markkinaoikeutta kieltämään Fitness24Seven Oy:tä käyttämästä toistaiseksi voimassa olevissa kuntokeskussopimuksissa ehtoa, jonka mukaan kuluttaja voi irtisanoa sopimuksen kahden kuukauden irtisanomisajalla. Kiellon tehosteeksi vaaditaan 100 000 euron uhkasakkoa. Kuluttaja-asiamiehen mukaan pitkä irtisanomisaika aiheuttaa kuluttajalle lisäkustannuksia ja vaikeuttaa palveluntarjoajan vaihtamista, eikä kuntokeskusalalla ole erityispiirteitä, jotka perustelisivat sitä. Yhtiö voi lisäksi muuttaa hintaa tai muita ehtoja yhden kuukauden varoitusajalla. Markkinaoikeus ratkaisee asian.","tekstityyppi":"tiivistelmä","selko":"Kuluttaja-asiamiehen mukaan kuntosaliketju Fitness24Seven sitoo asiakkaat liian pitkäksi aikaa, kun jäsenyyden irtisanomisaika on kaksi kuukautta. Hän vaatii markkinaoikeutta kieltämään ehdon. Asia on kesken, ja markkinaoikeus päättää siitä.","lahde":"https://www.kkv.fi/ajankohtaista/tiedotteet/kuluttaja-asiamies-vie-fitness24sevenin-kahden-kuukauden-irtisanomisehdon-markkinaoikeuteen/","aiheet":["kuluttaja"],"otsikko_sv":"GYMMETS UPPSÄGNINGSTID TILL MD","teksti_sv":"Konsumentombudsmannen yrkar att marknadsdomstolen förbjuder Fitness24Seven Oy att i sina tills vidare gällande avtal om gymmedlemskap använda ett villkor enligt vilket konsumenten kan säga upp avtalet med två månaders uppsägningstid. Förbudet ska förenas med ett vite på 100 000 euro. Enligt konsumentombudsmannen orsakar den långa uppsägningstiden extra kostnader för konsumenten och försvårar byte av tjänsteleverantör, och det finns inga särdrag i gymbranschen som motiverar den. Bolaget kan dessutom ändra priset eller andra villkor med en månads varsel. Marknadsdomstolen avgör saken.","selko_sv":"Enligt konsumentombudsmannen binder gymkedjan Fitness24Seven sina kunder för länge, eftersom uppsägningstiden för medlemskapet är två månader. Ombudsmannen kräver att marknadsdomstolen förbjuder villkoret. Saken pågår, och marknadsdomstolen beslutar om den.","asiasanat_sv":"Konsumentskydd – Avtalsvillkor – Uppsägningstid – Yrkande på förbud – Vite","elin_sv":"Konsumentombudsmannen","lisatty":"2026-09-30T17:16","otsikko_en":"GYM NOTICE PERIOD TO MARKET COURT","teksti_en":"The Consumer Ombudsman asks the Market Court to prohibit Fitness24Seven Oy from using, in open-ended gym contracts, a term under which the consumer may terminate the contract with two months' notice. A conditional fine of 100 000 euros is demanded to enforce the prohibition. According to the Consumer Ombudsman, the long notice period causes consumers extra costs and makes switching providers harder, and the gym sector has no special features justifying it. The company can moreover change its prices or other terms with one month's notice. The Market Court will decide the case.","selko_en":"According to the Consumer Ombudsman, the gym chain Fitness24Seven ties customers for too long, as the notice period for membership is two months. The Ombudsman asks the Market Court to prohibit the term. The case is pending, and the Market Court will decide it.","asiasanat_en":"Consumer protection – Contract terms – Notice period – Prohibition claim – Conditional fine","elin_en":"Consumer Ombudsman"},{"id":"kkv-2026-09-29-kilpailun-tila","tunnus":"KKV tiedote 29.9.2026","elin":"KKV","otsikko":"KKV: SUOMEN MARKKINAT KESKITTYNEET","pvm":"2026-09-29","pvm_selite":"tiedote","julkaistu":"2026-09-29T09:10","asiasanat":"kilpailun tila – markkinoiden keskittyneisyys – tuottavuus – yrityskauppavalvonta – otto-oikeus – seuraamusmaksu","tekstityyppi":"tiivistelmä","teksti":"KKV:n raportin Kilpailun tila ja kehitys Suomessa (Tutkimusraportteja 5/2026) mukaan Suomen tuotemarkkinat ja toimialat ovat kansainvälisesti verrattuna erittäin keskittyneet ja tuottavuuskasvu on hitaampaa kuin useimmissa muissa Euroopan maissa ja erityisesti Yhdysvalloissa. Yritysten tulo markkinoille ja poistuminen niiltä ovat vähentyneet. Viraston mukaan kilpailu ei riittävästi kannusta yrityksiä uudistumaan. KKV esittää lainsäädäntöön rajattua otto-oikeutta liikevaihtorajojen ulkopuolelle jäävien yrityskauppojen tutkimiseksi sekä oikeutta määrätä ensimmäisenä asteena seuraamusmaksu kilpailunrajoituksista ja kieltää kilpailua rajoittavat yrityskaupat.","selko":"Kilpailu- ja kuluttajaviraston raportin mukaan monilla aloilla Suomessa on vähän kilpailijoita, ja uusia yrityksiä tulee markkinoille aiempaa harvemmin. Tämä voi hidastaa tuottavuuden kasvua. Virasto haluaa lisää valtaa puuttua yrityskauppoihin ja määrätä itse seuraamusmaksuja.","lahde":"https://www.kkv.fi/ajankohtaista/tiedotteet/kkv-suomen-markkinoille-tarvitaan-lisaa-kilpailua-edistamaan-tuottavuuden-kasvua/","aiheet":["kilpailu"],"paino":3,"otsikko_sv":"KKV: KONCENTRERADE MARKNADER","teksti_sv":"Enligt KKV:s rapport Kilpailun tila ja kehitys Suomessa (Tutkimusraportteja 5/2026) är produktmarknaderna och branscherna i Finland mycket koncentrerade i en internationell jämförelse, och produktivitetstillväxten är långsammare än i de flesta andra europeiska länder och särskilt i USA. Företagens inträde på och utträde från marknaderna har minskat. Enligt verket sporrar konkurrensen inte i tillräcklig grad företagen att förnya sig. KKV föreslår en avgränsad rätt i lagstiftningen att pröva företagsförvärv som inte når omsättningsgränserna samt en rätt att som första instans påföra påföljdsavgift för konkurrensbegränsningar och förbjuda företagsförvärv som begränsar konkurrensen.","selko_sv":"Enligt en rapport från Konkurrens- och konsumentverket finns det i många branscher i Finland få konkurrenter, och nya företag kommer mer sällan in på marknaden än tidigare. Det kan bromsa produktivitetstillväxten. Verket vill ha större befogenheter att ingripa i företagsförvärv och att själv påföra påföljdsavgifter.","asiasanat_sv":"konkurrensläget – marknadskoncentration – produktivitet – företagskontroll – rätt att pröva förvärv under tröskelvärdena – påföljdsavgift","elin_sv":"KKV","otsikko_en":"FCCA: FINNISH MARKETS CONCENTRATED","teksti_en":"According to the FCCA report The state and development of competition in Finland (Research Reports 5/2026), Finnish product markets and industries are very concentrated by international comparison, and productivity growth is slower than in most other European countries and especially the United States. Market entry and exit by firms have decreased. According to the authority, competition does not sufficiently encourage firms to renew themselves. The FCCA proposes a limited call-in power in legislation to examine mergers below the turnover thresholds, as well as the right to impose administrative fines for restrictions of competition and to prohibit anti-competitive mergers at first instance.","selko_en":"According to a report by the Finnish Competition and Consumer Authority, many sectors in Finland have few competitors, and new firms enter the market less often than before. This may slow productivity growth. The authority wants more power to intervene in mergers and to impose fines itself.","asiasanat_en":"state of competition – market concentration – productivity – merger control – call-in power – administrative fine","elin_en":"FCCA"},{"id":"kkv-985-2026-ambea-humana","tunnus":"KKV/985/14.00.10/2026","elin":"KKV","otsikko":"AMBEAN JA HUMANAN KAUPPA HYVÄKSYTTY","pvm":"2026-09-25","pvm_selite":"päätös","julkaistu":"2026-09-25T15:13","asiasanat":"yrityskauppavalvonta – hyväksyminen sellaisenaan – lastensuojelun laitoshoito – vammaisten palveluasuminen","tekstityyppi":"virallinen tiivistelmä","teksti":"Kilpailu- ja kuluttajavirastolle ilmoitettiin 25.8.2026 järjestely, jossa Ambea AB hankkii yksinomaisen määräysvallan Humana AB:ssä. Molemmat yrityskaupan osapuolet toimivat muun muassa lastensuojelun laitoshoidossa ja vammaisten palveluasumisessa. Virasto hyväksyi yrityskaupan 25.9.2026.","selko":"Kilpailu- ja kuluttajavirasto hyväksyi ilman ehtoja yrityskaupan, jossa Ambea saa määräysvallan Humanassa. Molemmat yhtiöt tarjoavat muun muassa lastensuojelun laitoshoitoa ja vammaisten asumispalveluja.","lahde":"https://www.kkv.fi/paatokset/kilpailuasiat/yrityskauppavalvonta/kkv-985-14-00-10-2026/","aiheet":["kilpailu","yhtio","sote"],"paino":3,"lainvoimainen":false,"otsikko_sv":"AMBEAS OCH HUMANAS AFFÄR GODKÄND","teksti_sv":"Till Konkurrens- och konsumentverket anmäldes 25.8.2026 ett arrangemang där Ambea AB förvärvar ensamt bestämmande inflytande över Humana AB. Båda parterna i företagsförvärvet är verksamma bland annat inom institutionsvård inom barnskyddet och serviceboende för personer med funktionsnedsättning. Verket godkände företagsförvärvet 25.9.2026.","selko_sv":"Konkurrens- och konsumentverket godkände utan villkor ett företagsförvärv där Ambea får bestämmande inflytande över Humana. Båda bolagen erbjuder bland annat institutionsvård inom barnskyddet och boendetjänster för personer med funktionsnedsättning.","asiasanat_sv":"företagskontroll – godkännande utan villkor – institutionsvård inom barnskyddet – serviceboende för personer med funktionsnedsättning","elin_sv":"KKV","otsikko_en":"AMBEA–HUMANA DEAL APPROVED","teksti_en":"On 25.8.2026 the Finnish Competition and Consumer Authority was notified of a transaction in which Ambea AB acquires sole control of Humana AB. Both parties to the merger operate, among other things, in institutional child welfare care and housing services for people with disabilities. The authority approved the merger on 25.9.2026.","selko_en":"The Finnish Competition and Consumer Authority approved without conditions a merger in which Ambea gains control of Humana. Both companies provide, among other things, institutional child welfare care and housing services for people with disabilities.","asiasanat_en":"merger control – approval as such – institutional child welfare care – housing services for people with disabilities","elin_en":"FCCA"},{"id":"kkv-2026-09-23-lt-kempele","tunnus":"KKV/743/14.00.10/2026","elin":"KKV","otsikko":"JÄTEHUOLTOKAUPPA JATKOSELVITYKSEEN","pvm":"2026-09-23","pvm_selite":"tiedote","asiasanat":"Yrityskauppavalvonta – Jatkokäsittely – Jätehuolto – Pohjois-Pohjanmaa","teksti":"KKV siirsi jatkokäsittelyyn yrityskaupan, jossa L&T Ympäristöpalvelut Oy hankkii Kempeleen Siirtokuljetus Oy:n. Alustavan tarkastelun perusteella kauppa saattaa aiheuttaa haitallisia kilpailuvaikutuksia erityisesti Pohjois-Pohjanmaan vaarattoman jätteen jätehuollon markkinoilla, koska siinä yhdistyy kaksi alueen suurimpiin kuuluvaa yksityistä jätehuollon toimijaa. Jatkokäsittely voi kestää enintään 69 työpäivää, ja sitä voidaan pidentää enintään 46 työpäivällä. KKV voi hyväksyä kaupan sellaisenaan tai ehdoin tai esittää markkinaoikeudelle sen kieltämistä.","tekstityyppi":"tiivistelmä","lainvoimainen":false,"lahde":"https://www.kkv.fi/ajankohtaista/tiedotteet/kkv-selvittaa-tarkemmin-lt-ymparistopalveluiden-ja-kempeleen-siirtokuljetuksen-valista-yrityskauppaa/","selko":"Kilpailuvirasto tutkii tarkemmin, saako L&T ostaa pohjoispohjalaisen jäteyhtiön. Kauppa voi heikentää kilpailua alueen jätehuollossa. Selvitys voi kestää kuukausia, ja asia on kesken.","aiheet":["kilpailu","ymparisto"],"julkaistu":"2026-09-23T15:40","paino":2,"otsikko_sv":"AVFALLSAFFÄR UTREDS VIDARE","teksti_sv":"KKV överförde till fortsatt behandling ett företagsförvärv där L&T Ympäristöpalvelut Oy förvärvar Kempeleen Siirtokuljetus Oy. Enligt den preliminära granskningen kan affären ha skadliga konkurrenseffekter särskilt på marknaden för hantering av ofarligt avfall i Norra Österbotten, eftersom den förenar två av de största privata aktörerna inom avfallshantering i regionen. Den fortsatta behandlingen kan pågå i högst 69 arbetsdagar och kan förlängas med högst 46 arbetsdagar. KKV kan godkänna affären som sådan eller på villkor eller föreslå för marknadsdomstolen att den förbjuds.","selko_sv":"Konkurrensverket utreder närmare om L&T får köpa ett avfallsbolag i Norra Österbotten. Affären kan försvaga konkurrensen inom avfallshanteringen i regionen. Utredningen kan ta månader, och saken pågår.","asiasanat_sv":"Företagskontroll – Fortsatt behandling – Avfallshantering – Norra Österbotten","elin_sv":"KKV","otsikko_en":"WASTE DEAL TO PHASE II REVIEW","teksti_en":"The FCCA referred to a second-phase investigation the merger in which L&T Ympäristöpalvelut Oy acquires Kempeleen Siirtokuljetus Oy. Based on a preliminary review, the transaction may harm competition especially in the market for non-hazardous waste management in North Ostrobothnia, as it combines two of the region's largest private waste management operators. The second phase may last at most 69 working days and may be extended by at most 46 working days. The FCCA may approve the deal as such or with conditions, or propose to the Market Court that it be prohibited.","selko_en":"The competition authority is examining more closely whether L&T may buy a waste company in North Ostrobothnia. The deal could weaken competition in the region's waste management. The investigation may take months, and the case is pending.","asiasanat_en":"Merger control – Second-phase investigation – Waste management – North Ostrobothnia","elin_en":"FCCA"},{"id":"kkv-2026-09-03-terveystalo-hohde","tunnus":"KKV – yrityskauppavalvonta","elin":"KKV","otsikko":"TERVEYSTALO–HOHDE HYVÄKSYTTY EHDOIN","pvm":"2026-09-03","pvm_selite":"päätös","asiasanat":"Yrityskauppavalvonta – Ehdollinen hyväksyminen – Suun terveydenhuolto – Fix-it-first","teksti":"KKV hyväksyi yrityskaupan, jossa Terveystalo Healthcare Oy hankkii Hohde Group Oy:n. Kauppa olisi heikentänyt kilpailua yksityisen suun terveydenhuollon markkinoilla, joten hyväksynnän ehtona on, että Terveystalo myy liiketoimintansa Savonlinnassa, Mikkelissä ja Seinäjoella Emal Hammaslääkärit Oy:lle. Ratkaisu tehtiin niin sanottuna fix-it-first-järjestelynä. KKV hyväksyi kaupan ehdollisena jo ensimmäisessä käsittelyvaiheessa ensimmäistä kertaa vuonna 2011 voimaan tulleen kilpailulain aikana; aiemmat ehdolliset yrityskauppapäätökset on annettu toisessa vaiheessa.","tekstityyppi":"tiivistelmä","lahde":"https://www.kkv.fi/en/current/press-releases/fcca-approved-subject-to-conditions-terveystalos-acquisition-of-hohde-in-phase-i/","selko":"Terveystalo sai ostaa Hohteen hammashoitoketjun ehdolla, että se myy hammashoitotoimintansa Savonlinnassa, Mikkelissä ja Seinäjoella. Näin kilpailu säilyy. KKV antoi ehdollisen luvan ensimmäistä kertaa jo selvityksen alkuvaiheessa.","aiheet":["kilpailu","sote"],"julkaistu":"2026-09-03","paino":3,"otsikko_sv":"HOHDE-AFFÄR GODKÄND MED VILLKOR","teksti_sv":"KKV godkände ett företagsförvärv där Terveystalo Healthcare Oy förvärvar Hohde Group Oy. Affären skulle ha försvagat konkurrensen på marknaden för privat munhälsovård, och därför är det ett villkor för godkännandet att Terveystalo säljer sin verksamhet i Nyslott, S:t Michel och Seinäjoki till Emal Hammaslääkärit Oy. Avgörandet fattades som ett så kallat fix-it-first-arrangemang. KKV godkände förvärvet på villkor redan i det första behandlingsskedet för första gången under den konkurrenslag som trädde i kraft 2011; tidigare villkorade beslut om företagsförvärv har fattats i det andra skedet.","selko_sv":"Terveystalo fick köpa tandvårdskedjan Hohde på villkor att bolaget säljer sin tandvård i Nyslott, S:t Michel och Seinäjoki. På så sätt bevaras konkurrensen. KKV gav för första gången ett villkorat godkännande redan i utredningens första skede.","asiasanat_sv":"Företagskontroll – Villkorligt godkännande – Munhälsovård – Fix-it-first","elin_sv":"KKV","otsikko_en":"TERVEYSTALO–HOHDE CLEARED ON TERMS","teksti_en":"The FCCA approved the merger in which Terveystalo Healthcare Oy acquires Hohde Group Oy. The deal would have weakened competition in the market for private oral health care, so the approval is conditional on Terveystalo selling its operations in Savonlinna, Mikkeli and Seinäjoki to Emal Hammaslääkärit Oy. The decision was made as a so-called fix-it-first arrangement. For the first time under the Competition Act in force since 2011, the FCCA approved a merger conditionally already in the first phase; earlier conditional merger decisions have been issued in the second phase.","selko_en":"Terveystalo was allowed to buy the Hohde dental chain on condition that it sells its dental operations in Savonlinna, Mikkeli and Seinäjoki. This preserves competition. For the first time, the FCCA gave conditional clearance already at the initial stage of the review.","asiasanat_en":"Merger control – Conditional approval – Oral health care – Fix-it-first","elin_en":"FCCA"},{"id":"kkv-2026-05-27-loihde-blc","tunnus":"KKV – yrityskauppavalvonta","elin":"KKV","otsikko":"LOIHDE–BLC TURVA: LUKITUS MYYTÄVÄ","pvm":"2026-05-27","pvm_selite":"päätös","asiasanat":"Yrityskauppavalvonta – Ehdollinen hyväksyminen – Lukitusjärjestelmät","teksti":"KKV hyväksyi kaupan, jossa Loihde Oyj hankkii BLC Turva Oy:n. Ehtona on, että päällekkäinen lukitusliiketoiminta Lappeenrannassa, Mikkelissä ja Jyväskylässä myydään. Kauppa olisi viraston mukaan haitannut kilpailua lukitusjärjestelmien markkinoilla Etelä-Karjalassa, Etelä-Savossa ja Keski-Suomessa. Kauppaa ei saa panna täytäntöön ennen kuin luovutuksista on sovittu sitovasti ja KKV on hyväksynyt ostajat.","tekstityyppi":"tiivistelmä","lahde":"https://www.kkv.fi/ajankohtaista/tiedotteet/kkv-hyvaksyi-ehdollisena-loihteen-ja-blc-turvan-valisen-yrityskaupan/","selko":"Loihde saa ostaa BLC Turvan, jos se myy päällekkäisen lukkoliiketoiminnan Lappeenrannassa, Mikkelissä ja Jyväskylässä. Kauppaa ei saa toteuttaa, ennen kuin myynneistä on sovittu ja KKV on hyväksynyt ostajat.","aiheet":["kilpailu"],"julkaistu":"2026-05-27","paino":2,"otsikko_sv":"LOIHDE–BLC TURVA: LÅSAFFÄR SÄLJS","teksti_sv":"KKV godkände ett förvärv där Loihde Oyj förvärvar BLC Turva Oy. Villkoret är att den överlappande låsverksamheten i Villmanstrand, S:t Michel och Jyväskylä säljs. Enligt verket skulle förvärvet ha skadat konkurrensen på marknaderna för låssystem i Södra Karelen, Södra Savolax och Mellersta Finland. Förvärvet får inte genomföras förrän bindande avtal om överlåtelserna har ingåtts och KKV har godkänt köparna.","selko_sv":"Loihde får köpa BLC Turva om bolaget säljer den överlappande låsverksamheten i Villmanstrand, S:t Michel och Jyväskylä. Förvärvet får inte genomföras förrän försäljningarna har avtalats och KKV har godkänt köparna.","asiasanat_sv":"Företagskontroll – Villkorligt godkännande – Låssystem","elin_sv":"KKV","otsikko_en":"LOIHDE–BLC TURVA: LOCKS TO BE SOLD","teksti_en":"The FCCA approved the deal in which Loihde Oyj acquires BLC Turva Oy. The condition is that the overlapping locking business in Lappeenranta, Mikkeli and Jyväskylä is sold. According to the authority, the deal would have harmed competition in the market for locking systems in South Karelia, South Savo and Central Finland. The deal may not be implemented until the divestments have been agreed bindingly and the FCCA has approved the buyers.","selko_en":"Loihde may buy BLC Turva if it sells the overlapping locks business in Lappeenranta, Mikkeli and Jyväskylä. The deal may not be completed until the sales have been agreed and the FCCA has approved the buyers.","asiasanat_en":"Merger control – Conditional approval – Locking systems","elin_en":"FCCA"},{"id":"kkv-2026-05-27-marjakartelli","tunnus":"KKV/1098/14.00.00/2022","elin":"KKV","otsikko":"MARJAKARTELLI: 9,4 MEUR:N ESITYS","pvm":"2026-05-27","pvm_selite":"esitys","asiasanat":"Kilpailunrajoitus – Kartelli – Seuraamusmaksuesitys – Luonnonmarja-ala","teksti":"KKV esittää markkinaoikeudelle yhteensä noin 9,4 miljoonan euron seuraamusmaksuja neljälle luonnonmarja-alan yhtiölle osto- ja tietojenvaihtokartellista vuosilta 2013–2023. Esitetyt maksut: Polarica 5 914 901 €, Marja Bothnia Berries 1 758 080 €, Arctic International 970 479 € ja Kaskein Marja 785 699 €. KKV:n mukaan yhtiöt sovittivat yhteen poimijoille maksettuja hintoja. Kiantama vapautettiin maksusta yhteistyön vuoksi. Markkinaoikeus päättää maksuista.","tekstityyppi":"tiivistelmä","lainvoimainen":false,"lahde":"https://www.kkv.fi/uploads/sites/2/r-2022-00-1098.pdf","selko":"KKV:n mukaan neljä marjayhtiötä sopi yhdessä marjanpoimijoille maksettavista hinnoista vuosina 2013–2023. Virasto esittää niille yhteensä noin 9,4 miljoonan euron maksuja. Markkinaoikeus päättää asiasta, joten se on kesken.","aiheet":["kilpailu"],"julkaistu":"2026-05-27","paino":4,"otsikko_sv":"BÄRKARTELL: FÖRSLAG PÅ 9,4 MN EURO","teksti_sv":"KKV föreslår för marknadsdomstolen påföljdsavgifter på sammanlagt cirka 9,4 miljoner euro för fyra bolag i vildbärsbranschen för en inköps- och informationsutbyteskartell 2013–2023. De föreslagna avgifterna: Polarica 5 914 901 €, Marja Bothnia Berries 1 758 080 €, Arctic International 970 479 € och Kaskein Marja 785 699 €. Enligt KKV samordnade bolagen de priser som betalades till plockarna. Kiantama befriades från avgift på grund av samarbete. Marknadsdomstolen beslutar om avgifterna.","selko_sv":"Enligt KKV kom fyra bärbolag överens om vilka priser bärplockarna skulle få 2013–2023. Verket föreslår avgifter på sammanlagt cirka 9,4 miljoner euro för dem. Marknadsdomstolen beslutar i saken, så den pågår.","asiasanat_sv":"Konkurrensbegränsning – Kartell – Förslag till påföljdsavgift – Vildbärsbranschen","elin_sv":"KKV","otsikko_en":"BERRY CARTEL: 9.4 MEUR PROPOSED","teksti_en":"The FCCA proposes to the Market Court administrative fines totalling about 9.4 million euros for four wild-berry companies for a purchasing and information-exchange cartel in 2013–2023. The proposed fines: Polarica 5 914 901 €, Marja Bothnia Berries 1 758 080 €, Arctic International 970 479 € and Kaskein Marja 785 699 €. According to the FCCA, the companies coordinated the prices paid to pickers. Kiantama was exempted from the fine for cooperating. The Market Court decides on the fines.","selko_en":"According to the FCCA, four berry companies jointly agreed the prices paid to berry pickers in 2013–2023. The authority proposes fines totalling about 9.4 million euros. The Market Court decides the case, so it is pending.","asiasanat_en":"Restriction of competition – Cartel – Fine proposal – Wild berry sector","elin_en":"FCCA"},{"id":"MAO:256/2026","tunnus":"MAO:256/2026","elin":"Markkinaoikeus","otsikko":"MAAKAASU: ERIYTTÄMISRIKKOMUS, MAO","pvm":null,"pvm_selite":"annettu","asiasanat":"Maakaasumarkkina-asia – Seuraamusmaksuesitys – Toimintojen eriyttäminen – Ristiinsubventio","teksti":"Maakaasumarkkina-asia – Seuraamusmaksuesitys – Toimintojen eriyttäminen – Ristiinsubventio.","tekstityyppi":"asiasanat","lahde":"https://www.tuomioistuimet.fi/tuomioistuinten-ratkaisut/markkinaoikeuden-ratkaisut/","selko":"Asia koskee maakaasuyhtiön velvollisuutta pitää eri liiketoimintansa kirjanpidossa erillään, ettei yhdellä toiminnalla rahoiteta toista. Saatavilla ovat vain asiasanat.","aiheet":["kilpailu"],"julkaistu":"2026-05-13","paino":2,"otsikko_sv":"NATURGAS: SÄRREDOVISNING, MD","teksti_sv":"Ärende som gäller naturgasmarknaden – Förslag till påföljdsavgift – Särredovisning av verksamheter – Korssubventionering.","selko_sv":"Ärendet gäller ett naturgasbolags skyldighet att hålla sina olika verksamheter åtskilda i bokföringen, så att en verksamhet inte finansierar en annan. Endast sökorden finns tillgängliga.","asiasanat_sv":"Ärende som gäller naturgasmarknaden – Förslag till påföljdsavgift – Särredovisning av verksamheter – Korssubventionering","elin_sv":"Marknadsdomstolen","otsikko_en":"NATURAL GAS: UNBUNDLING BREACH, MAO","teksti_en":"Natural gas market case – Fine proposal – Unbundling of activities – Cross-subsidisation.","selko_en":"The case concerns a natural gas company's duty to keep its different businesses separate in its accounts, so that one activity does not fund another. Only keywords are available.","asiasanat_en":"Natural gas market case – Fine proposal – Unbundling of activities – Cross-subsidisation","elin_en":"Market Court"}],"tsv":[{"id":"tsv-2026-09-04-espoo-google","tunnus":"TSV/40/2018","elin":"Tietosuojavaltuutettu","otsikko":"KOULUJEN GOOGLE-ALUSTA: UUSI PÄÄTÖS","pvm":"2026-09-04","pvm_selite":"päätös","asiasanat":"Perusopetus – Sähköinen opetusalusta – Lakisääteinen velvoite – Käsittelyn tarpeellisuus","teksti":"Tietosuojavaltuutettu Anu Talus antoi uuden päätöksen, koska KHO oli huhtikuussa 2025 palauttanut asian. Espoon kaupunki voi käsitellä perusopetuksen oppilaiden tietoja Google Workspace for Education -alustalla lakisääteisen velvoitteen perusteella vain siltä osin kuin se on opetuksen antamiseksi tarpeen. Palveluntarjoaja tai muut eivät saa käyttää oppilaiden tietoja omiin tarkoituksiinsa, kuten palvelujen kehittämiseen tai profilointiin. Päätöksestä voi valittaa hallinto-oikeuteen.","tekstityyppi":"tiivistelmä","lainvoimainen":false,"lahde":"https://www.finlex.fi/fi/viranomaiset/tietosuojavaltuutettu/2026/27","selko":"Koulu saa käyttää Googlen opetusalustaa oppilaiden tiedoilla vain siinä määrin kuin opetus vaatii. Google tai muut eivät saa käyttää oppilaiden tietoja omiin tarkoituksiinsa, kuten palvelujen kehittämiseen. Päätöksestä voi valittaa.","aiheet":["tietosuoja","koulutus","digi"],"julkaistu":"2026-09-22","paino":4,"otsikko_sv":"GOOGLE I SKOLAN: NYTT BESLUT","teksti_sv":"Dataombudsmannen Anu Talus fattade ett nytt beslut, eftersom HFD i april 2025 hade återförvisat ärendet. Esbo stad kan behandla uppgifter om elever i den grundläggande utbildningen på plattformen Google Workspace for Education med stöd av en lagstadgad förpliktelse endast till den del det är nödvändigt för att ge undervisning. Tjänsteleverantören eller andra får inte använda elevernas uppgifter för egna ändamål, såsom utveckling av tjänster eller profilering. Beslutet kan överklagas hos förvaltningsdomstolen.","selko_sv":"Skolan får använda Googles undervisningsplattform med elevernas uppgifter bara i den mån undervisningen kräver det. Google eller andra får inte använda elevernas uppgifter för egna ändamål, till exempel för att utveckla tjänster. Beslutet kan överklagas.","asiasanat_sv":"Grundläggande utbildning – Elektronisk undervisningsplattform – Lagstadgad förpliktelse – Behandlingens nödvändighet","elin_sv":"Dataombudsmannen","otsikko_en":"SCHOOL GOOGLE PLATFORM: NEW RULING","teksti_en":"Data Protection Ombudsman Anu Talus issued a new decision after the Supreme Administrative Court returned the case in April 2025. The City of Espoo may process basic education pupils' data on the Google Workspace for Education platform on the basis of a statutory obligation only in so far as necessary for providing education. The service provider or others may not use pupils' data for their own purposes, such as service development or profiling. The decision may be appealed to the Administrative Court.","selko_en":"A school may use Google's education platform with pupils' data only to the extent that teaching requires. Google or others may not use pupils' data for their own purposes, such as developing services. The decision may be appealed.","asiasanat_en":"Basic education – Electronic learning platform – Statutory obligation – Necessity of processing","elin_en":"Data Protection Ombudsman"},{"id":"tsv-2026-08-07-asuntohakemukset","tunnus":"TSV/1319/2025","elin":"Apulaistietosuojavaltuutettu","otsikko":"VUOKRAHAKEMUKSET 12 V: HUOMAUTUS","pvm":"2026-08-07","pvm_selite":"päätös","asiasanat":"Säilytysaika – Tietojen minimointi – Sisäänrakennettu tietosuoja – Välitysliikelaki – Asuntohakemukset","teksti":"Vuokranvälitysliike säilytti asuntohakemusten henkilötietoja järjestelmällisesti 12 vuotta vahingonkorvausvaatimusten vanhentumisaikaan vedoten. Apulaistietosuojavaltuutetun mukaan käytäntö oli tietojen minimoinnin ja säilytyksen rajoittamisen periaatteiden sekä sisäänrakennetun tietosuojan vaatimuksen vastainen. Välitysliikelain mukaan hakemukset on säilytettävä viisi vuotta, minkä jälkeen tiedot on pääsääntöisesti poistettava, ellei pidemmälle säilytykselle voida osoittaa todellista tarvetta. Välitysliike sai huomautuksen ja määräyksen saattaa säilytyskäytäntönsä tietosuoja-asetuksen mukaisiksi.","tekstityyppi":"tiivistelmä","lainvoimainen":false,"lahde":"https://www.finlex.fi/fi/viranomaiset/tietosuojavaltuutettu/2026/26","selko":"Vuokra-asuntoja välittävä yritys säilytti hakijoiden tietoja 12 vuotta. Tietosuojaviranomaisen mukaan se on liian kauan. Tiedot on yleensä poistettava viiden vuoden jälkeen. Yritys sai huomautuksen, ja sen on muutettava käytäntöään.","aiheet":["tietosuoja","asuminen"],"julkaistu":"2026-09-15","paino":3,"otsikko_sv":"HYRESANSÖKAN 12 ÅR: ANMÄRKNING","teksti_sv":"En hyresförmedlingsrörelse sparade personuppgifter i bostadsansökningar systematiskt i 12 år med hänvisning till preskriptionstiden för skadeståndsanspråk. Enligt biträdande dataombudsmannen stred förfarandet mot principerna om uppgiftsminimering och lagringsminimering samt mot kravet på inbyggt dataskydd. Enligt förmedlingsrörelselagen ska ansökningarna sparas i fem år, varefter uppgifterna i regel ska raderas, om inte ett verkligt behov av längre lagring kan påvisas. Förmedlingsrörelsen fick en anmärkning och ett föreläggande att bringa sin lagringspraxis i överensstämmelse med dataskyddsförordningen.","selko_sv":"Ett företag som förmedlar hyresbostäder sparade de sökandes uppgifter i 12 år. Enligt dataskyddsmyndigheten är det för länge. Uppgifterna ska i regel raderas efter fem år. Företaget fick en anmärkning och måste ändra sin praxis.","asiasanat_sv":"Lagringstid – Uppgiftsminimering – Inbyggt dataskydd – Förmedlingsrörelselagen – Bostadsansökningar","elin_sv":"Biträdande dataombudsmannen","otsikko_en":"RENTAL APPLICATIONS KEPT 12 YEARS","teksti_en":"A rental agency systematically retained the personal data in housing applications for 12 years, citing the limitation period for damages claims. According to the Deputy Data Protection Ombudsman, the practice was contrary to the principles of data minimisation and storage limitation and the requirement of data protection by design. Under the Real Estate Agencies Act, applications must be kept for five years, after which the data must as a rule be deleted unless a real need for longer retention can be shown. The agency received a reprimand and an order to bring its retention practices into line with the GDPR.","selko_en":"A rental housing agency kept applicants' data for 12 years. According to the data protection authority that is too long. The data must usually be deleted after five years. The company received a reprimand and must change its practice.","asiasanat_en":"Retention period – Data minimisation – Data protection by design – Real Estate Agencies Act – Housing applications","elin_en":"Deputy Data Protection Ombudsman"},{"id":"tsv-2026-08-suek","tunnus":"TSV/179/2021","elin":"Apulaistietosuojavaltuutettu","otsikko":"PÄÄTTYNYT DOPINGKIELTO EI JULKINEN","pvm":"2026-08-17","pvm_selite":"tiedote","asiasanat":"Henkilötietojen julkaiseminen – Toimintakielto – Keskeneräinen tutkinta – Käsittelyperuste","teksti":"Apulaistietosuojavaltuutettu Heljä-Tuulia Pihamaa katsoi, ettei Suomen urheilun eettisen keskuksen (SUEK) olisi pitänyt julkaista tietoa urheilijan lievästä dopingrikkomuksesta sen jälkeen, kun toimintakielto oli jo päättynyt. SUEKilla ei ollut myöskään tietosuoja-asetuksen mukaista perustetta julkaista keskeneräiseen tutkintaan liittyviä henkilötietoja. SUEK ry sai huomautuksen ja määräyksen saattaa käsittelytoimensa tietosuojalainsäädännön mukaisiksi.","tekstityyppi":"tiivistelmä","lainvoimainen":false,"lahde":"https://tietosuoja.fi/-/apulaistietosuojavaltuutettu-tietoa-urheilijan-lievasta-dopingrikkomuksesta-ei-olisi-pitanyt-julkaista-kun-toimintakielto-oli-jo-paattynyt","selko":"Urheilun eettinen keskus julkaisi tiedon urheilijan lievästä dopingrikkomuksesta, vaikka toimintakielto oli jo päättynyt. Julkaisemiselle ei ollut perustetta. SUEK sai huomautuksen ja määräyksen korjata toimintansa.","aiheet":["tietosuoja"],"julkaistu":"2026-08-17","paino":2,"otsikko_sv":"UPPHÖRT FÖRBUD FÅR INTE PUBLICERAS","teksti_sv":"Biträdande dataombudsmannen Heljä-Tuulia Pihamaa ansåg att Finlands centrum för etik inom idrotten (SUEK) inte borde ha publicerat uppgiften om en idrottares lindriga dopningsförseelse efter att verksamhetsförbudet redan hade upphört. SUEK hade inte heller någon grund enligt dataskyddsförordningen att publicera personuppgifter som hänförde sig till en pågående utredning. SUEK rf fick en anmärkning och ett föreläggande att bringa sin behandling i överensstämmelse med dataskyddslagstiftningen.","selko_sv":"Centrumet för etik inom idrotten publicerade uppgiften om en idrottares lindriga dopningsförseelse, fast verksamhetsförbudet redan hade upphört. Det fanns ingen grund för publiceringen. SUEK fick en anmärkning och ett föreläggande att rätta sin verksamhet.","asiasanat_sv":"Publicering av personuppgifter – Verksamhetsförbud – Pågående utredning – Grund för behandling","elin_sv":"Biträdande dataombudsmannen","otsikko_en":"ENDED DOPING BAN NOT PUBLIC","teksti_en":"Deputy Data Protection Ombudsman Heljä-Tuulia Pihamaa held that the Finnish Center for Integrity in Sports (SUEK) should not have published information on an athlete's minor doping violation after the period of ineligibility had already ended. SUEK also had no legal basis under the GDPR to publish personal data relating to an ongoing investigation. SUEK ry received a reprimand and an order to bring its processing into line with data protection law.","selko_en":"The sports integrity centre published information on an athlete's minor doping violation even though the ban had already ended. There was no basis for publishing it. SUEK received a reprimand and an order to correct its practices.","asiasanat_en":"Publication of personal data – Period of ineligibility – Ongoing investigation – Legal basis","elin_en":"Deputy Data Protection Ombudsman"},{"id":"tsv-2026-06-oikeuspalveluvirasto","tunnus":"TSV/13090/2025","elin":"Tietosuojavaltuutettu","otsikko":"LUOTTOTIEDOT TARKISTETTIIN LUVATTA","pvm":"2026-06-25","pvm_selite":"tiedote","asiasanat":"Työelämän tietosuoja – Luottotiedot – Virkamiehet – Huomautus","teksti":"Oikeuspalveluvirasto tarkisti vuosina 2024–2025 ensin 70:n ja sitten 600 virkamiehensä luottotiedot ilman lakiin perustuvaa oikeutta. Virasto havaitsi virheen itse marraskuussa 2025. Virastolle annettiin huomautus. Seuraamusmaksua ei voitu määrätä, koska voimassa oleva laki ei salli sitä julkiselle sektorille.","tekstityyppi":"tiivistelmä","lainvoimainen":false,"lahde":"https://tietosuoja.fi/-/oikeuspalveluvirastolle-huomautus-tyontekijoiden-luottotietojen-perusteettomasta-tarkastamisesta","selko":"Virasto tarkisti satojen työntekijöidensä luottotiedot ilman lain antamaa oikeutta. Se sai huomautuksen. Rahamaksua ei voitu määrätä, koska laki ei salli sitä viranomaisille.","aiheet":["tietosuoja","tyo"],"julkaistu":"2026-06-25","paino":2,"otsikko_sv":"KREDITUPPGIFTER KOLLADES UTAN RÄTT","teksti_sv":"Rättstjänstverket kontrollerade 2024–2025 först 70 och sedan 600 tjänstemäns kreditupplysningar utan lagstadgad rätt. Verket upptäckte själv felet i november 2025. Verket fick en anmärkning. Påföljdsavgift kunde inte påföras, eftersom gällande lag inte tillåter det för den offentliga sektorn.","selko_sv":"Verket kontrollerade hundratals anställdas kreditupplysningar utan rätt enligt lag. Det fick en anmärkning. Ingen avgift kunde påföras, eftersom lagen inte tillåter det för myndigheter.","asiasanat_sv":"Dataskydd i arbetslivet – Kreditupplysningar – Tjänstemän – Anmärkning","elin_sv":"Dataombudsmannen","otsikko_en":"CREDIT DATA CHECKED WITHOUT RIGHT","teksti_en":"In 2024–2025 the Legal Services Agency checked the credit data of first 70 and then 600 of its civil servants without a right based on law. The agency discovered the error itself in November 2025. The agency received a reprimand. An administrative fine could not be imposed because current law does not allow it for the public sector.","selko_en":"An agency checked the credit data of hundreds of its employees without a legal right to do so. It received a reprimand. A fine could not be imposed because the law does not allow fines for public authorities.","asiasanat_en":"Data protection in working life – Credit data – Civil servants – Reprimand","elin_en":"Data Protection Ombudsman"},{"id":"tsv-2026-04-lepus","tunnus":"TSV/206/2021","elin":"Apulaistietosuojavaltuutettu","otsikko":"ROBOTTIPUHELUMARKKINOINTI LAITONTA","pvm":"2026-04-14","pvm_selite":"tiedote","asiasanat":"Sähköinen suoramarkkinointi – Robottipuhelut – Suostumus – Sähköisen viestinnän palveluista annettu laki","teksti":"Apulaistietosuojavaltuutetun mukaan sähköhammasharjojen markkinointi robottipuheluilla oli sähköistä suoramarkkinointia, joka olisi edellyttänyt ennalta annettua suostumusta. Lepus Asset Management Oy rikkoi sähköisen viestinnän palveluista annettua lakia. Yhtiölle annettiin huomautus ja määräys korjata puhelinmarkkinointinsa viipymättä. Päätöksestä voi valittaa.","tekstityyppi":"tiivistelmä","lainvoimainen":false,"lahde":"https://tietosuoja.fi/-/apulaistietosuojavaltuutettu-sahkohammasharjojen-markkinointi-robottipuheluilla-ilman-suostumusta-oli-lainvastaista","selko":"Yritys markkinoi sähköhammasharjoja automaattisilla robottipuheluilla kysymättä ihmisiltä lupaa. Se oli laitonta. Yritys sai huomautuksen ja käskyn korjata puhelinmarkkinointinsa heti.","aiheet":["tietosuoja","kuluttaja","digi"],"julkaistu":"2026-04-14","paino":2,"otsikko_sv":"ROBOTSAMTAL UTAN SAMTYCKE OLAGLIGA","teksti_sv":"Enligt biträdande dataombudsmannen var marknadsföringen av eltandborstar med robotsamtal elektronisk direktmarknadsföring som skulle ha förutsatt förhandssamtycke. Lepus Asset Management Oy bröt mot lagen om tjänster inom elektronisk kommunikation. Bolaget fick en anmärkning och ett föreläggande att utan dröjsmål rätta sin telefonmarknadsföring. Beslutet kan överklagas.","selko_sv":"Ett företag marknadsförde eltandborstar med automatiska robotsamtal utan att be om lov. Det var olagligt. Företaget fick en anmärkning och en order att genast rätta sin telefonmarknadsföring.","asiasanat_sv":"Elektronisk direktmarknadsföring – Robotsamtal – Samtycke – Lagen om tjänster inom elektronisk kommunikation","elin_sv":"Biträdande dataombudsmannen","otsikko_en":"ROBOCALL MARKETING UNLAWFUL","teksti_en":"According to the Deputy Data Protection Ombudsman, marketing electric toothbrushes by robocalls was electronic direct marketing that would have required prior consent. Lepus Asset Management Oy breached the Act on Electronic Communications Services. The company received a reprimand and an order to correct its telephone marketing without delay. The decision may be appealed.","selko_en":"A company marketed electric toothbrushes with automated robocalls without asking people's permission. That was unlawful. The company received a reprimand and an order to fix its telephone marketing immediately.","asiasanat_en":"Electronic direct marketing – Robocalls – Consent – Act on Electronic Communications Services","elin_en":"Deputy Data Protection Ombudsman"},{"id":"tsv-2026-03-dnb","tunnus":"Dun & Bradstreet Finland","elin":"Apulaistietosuojavaltuutettu","otsikko":"OMAT LUOTTOTIEDOT NÄHTÄVÄ MAKSUTTA","pvm":"2026-03-30","pvm_selite":"tiedote","asiasanat":"Tarkastusoikeus – Luottotiedot – Maksuttomuus – Rekisteröidyn oikeudet","teksti":"Apulaistietosuojavaltuutettu Heljä-Tuulia Pihamaa katsoi, että käytäntö, jossa omat luottotiedot sai tarkastaa maksutta vain kerran vuodessa, oli tietosuoja-asetuksen vastainen. Omat luottotiedot on voitava tarkastaa lähtökohtaisesti maksutta. Yhtiön vastauksissa tarkastuspyyntöihin oli myös puutteita.","tekstityyppi":"tiivistelmä","lainvoimainen":false,"lahde":"https://tietosuoja.fi/-/apulaistietosuojavaltuutettu-omat-luottotiedot-on-voitava-tarkastaa-lahtokohtaisesti-maksutta","selko":"Luottotietoyhtiö antoi ihmisten tarkistaa omat luottotietonsa ilmaiseksi vain kerran vuodessa. Tietosuojaviranomaisen mukaan omat tiedot on voitava tarkistaa lähtökohtaisesti maksutta.","aiheet":["tietosuoja","kuluttaja","finanssi"],"julkaistu":"2026-03-30","paino":3,"otsikko_sv":"EGNA KREDITUPPGIFTER GRATIS","teksti_sv":"Biträdande dataombudsmannen Heljä-Tuulia Pihamaa ansåg att en praxis där man kunde kontrollera sina egna kreditupplysningar avgiftsfritt endast en gång per år stred mot dataskyddsförordningen. Man ska i regel kunna kontrollera sina egna kreditupplysningar avgiftsfritt. Det fanns också brister i bolagets svar på begäranden om tillgång.","selko_sv":"Ett kreditupplysningsbolag lät folk kontrollera sina egna kreditupplysningar gratis bara en gång per år. Enligt dataskyddsmyndigheten ska man i regel kunna kontrollera sina egna uppgifter utan avgift.","asiasanat_sv":"Rätt till tillgång – Kreditupplysningar – Avgiftsfrihet – Den registrerades rättigheter","elin_sv":"Biträdande dataombudsmannen","otsikko_en":"OWN CREDIT DATA FREE OF CHARGE","teksti_en":"Deputy Data Protection Ombudsman Heljä-Tuulia Pihamaa held that a practice under which a person could check their own credit data free of charge only once a year was contrary to the GDPR. As a rule, people must be able to access their own credit data free of charge. The company's responses to access requests were also deficient.","selko_en":"A credit information company let people check their own credit data for free only once a year. According to the data protection authority, people must as a rule be able to check their own data free of charge.","asiasanat_en":"Right of access – Credit data – Free of charge – Data subject rights","elin_en":"Deputy Data Protection Ombudsman"},{"id":"tsv-2026-03-numerokeskus","tunnus":"Seuraamuskollegio","elin":"Tietosuojavaltuutetun toimisto","otsikko":"NUMEROKESKUKSELLE 5 000 EURON MAKSU","pvm":"2026-03-25","pvm_selite":"tiedote","asiasanat":"Seuraamusmaksu – Tarkastusoikeus – Puhelutallenteet – Tietojen poistaminen","teksti":"Seuraamuskollegio määräsi Suomen Numerokeskus Oy:lle 5 000 euron seuraamusmaksun, koska yhtiö oli säännönmukaisesti jättänyt toimittamatta asiakkaille heitä koskevat puhelutallenteet ja poistanut tallenteita, vaikka asiakkaat olivat pyytäneet niitä. Pelkkä kuuntelumahdollisuus ei riitä, vaan jäljennös on annettava. Yhtiölle annettiin myös huomautus ja määräys korjata toimintatapansa.","tekstityyppi":"tiivistelmä","lainvoimainen":false,"lahde":"https://tietosuoja.fi/-/suomen-numerokeskukselle-seuraamusmaksu-puutteista-puhelutallenteiden-antamisessa","selko":"Yhtiö ei antanut asiakkaille heidän puhelutallenteitaan ja poisti tallenteita, vaikka niitä oli pyydetty. Pelkkä mahdollisuus kuunnella tallenne ei riitä, vaan kopio on annettava. Yhtiö sai 5 000 euron maksun.","aiheet":["tietosuoja"],"julkaistu":"2026-03-25","paino":2,"otsikko_sv":"NUMEROKESKUS: AVGIFT PÅ 5 000 EURO","teksti_sv":"Sanktionskollegiet påförde Suomen Numerokeskus Oy en påföljdsavgift på 5 000 euro, eftersom bolaget regelmässigt hade underlåtit att lämna ut samtalsinspelningar till kunderna och raderat inspelningar trots att kunderna hade begärt dem. Det räcker inte med en möjlighet att lyssna, utan en kopia ska lämnas ut. Bolaget fick också en anmärkning och ett föreläggande att rätta sin praxis.","selko_sv":"Bolaget gav inte kunderna deras samtalsinspelningar och raderade inspelningar trots att de hade begärts. Det räcker inte att kunden får lyssna på inspelningen, utan en kopia ska ges. Bolaget fick en avgift på 5 000 euro.","asiasanat_sv":"Påföljdsavgift – Rätt till tillgång – Samtalsinspelningar – Radering av uppgifter","elin_sv":"Dataombudsmannens byrå","otsikko_en":"NUMEROKESKUS FINED 5 000 EUROS","teksti_en":"The sanctions board imposed an administrative fine of 5 000 euros on Suomen Numerokeskus Oy because the company had systematically failed to provide customers with recordings of their calls and had deleted recordings even though customers had requested them. A mere opportunity to listen is not enough; a copy must be provided. The company also received a reprimand and an order to correct its practices.","selko_en":"The company did not give customers their call recordings and deleted recordings even though they had been requested. Merely being allowed to listen to a recording is not enough; a copy must be provided. The company was fined 5 000 euros.","asiasanat_en":"Administrative fine – Right of access – Call recordings – Deletion of data","elin_en":"Office of the Data Protection Ombudsman"},{"id":"tsv-2026-03-ppshva","tunnus":"Pohjois-Pohjanmaan HVA","elin":"Apulaistietosuojavaltuutettu","otsikko":"POTILASTIETOJEN VALVONNASSA PUUTE","pvm":"2026-03-04","pvm_selite":"tiedote","asiasanat":"Potilastiedot – Käyttölokien valvonta – Huomautus – Määräys","teksti":"Henkilökunnan epäiltiin katsoneen kollegoidensa potilastietoja ilman perustetta. Apulaistietosuojavaltuutettu totesi puutteita potilastietojen käytön valvonnassa ja antoi Pohjois-Pohjanmaan hyvinvointialueelle huomautuksen sekä määräyksen korjata puutteet.","tekstityyppi":"tiivistelmä","lainvoimainen":false,"lahde":"https://tietosuoja.fi/-/apulaistietosuojavaltuutettu-hyvinvointialueella-puutteita-potilastietojen-kayton-valvonnassa","selko":"Hoitohenkilökunnan epäiltiin katsoneen työkavereidensa potilastietoja ilman syytä. Hyvinvointialue ei valvonut tietojen käyttöä riittävästi. Se sai huomautuksen ja määräyksen korjata puutteet.","aiheet":["tietosuoja","sote"],"julkaistu":"2026-03-04","paino":2,"otsikko_sv":"BRISTANDE TILLSYN AV PATIENTDATA","teksti_sv":"Personalen misstänktes ha tittat på kollegers patientuppgifter utan grund. Biträdande dataombudsmannen konstaterade brister i övervakningen av användningen av patientuppgifter och gav Norra Österbottens välfärdsområde en anmärkning och ett föreläggande att rätta bristerna.","selko_sv":"Vårdpersonal misstänktes ha tittat på arbetskamraters patientuppgifter utan orsak. Välfärdsområdet övervakade inte användningen av uppgifterna tillräckligt. Det fick en anmärkning och ett föreläggande att rätta bristerna.","asiasanat_sv":"Patientuppgifter – Övervakning av användningsloggar – Anmärkning – Föreläggande","elin_sv":"Biträdande dataombudsmannen","otsikko_en":"PATIENT DATA MONITORING LACKING","teksti_en":"Staff were suspected of having viewed colleagues' patient records without justification. The Deputy Data Protection Ombudsman found deficiencies in the monitoring of patient data use and issued the North Ostrobothnia wellbeing services county a reprimand and an order to correct the deficiencies.","selko_en":"Care staff were suspected of looking at their co-workers' patient records without reason. The wellbeing services county did not monitor data use sufficiently. It received a reprimand and an order to fix the shortcomings.","asiasanat_en":"Patient data – Monitoring of access logs – Reprimand – Order","elin_en":"Deputy Data Protection Ombudsman"}],"he":[{"id":"HE 216/2026 vp","tunnus":"HE 216/2026 vp","otsikko":"KASVUYRITTÄJIEN OLESKELULUVAT","otsikko_sv":"UPPEHÅLLSTILLSTÅND FÖR START-UPS","otsikko_en":"START-UP ENTREPRENEUR PERMITS","pvm":"2026-10-01","pvm_selite":"annettu","julkaistu":"2026-10-01T16:26","paino":3,"voimaantulo_pvm":"2028-01-12","elin":"Työ- ja elinkeinoministeriö","elin_sv":"Arbets- och näringsministeriet","elin_en":"Ministry of Economic Affairs and Employment","teksti":"Hallitus antoi 1.10.2026 eduskunnalle esityksen ulkomaalaislain ja eräiden muiden lakien muuttamisesta. Kasvuyrittäjän oleskelulupaa varten ei enää haettaisi erillistä maksutonta Business Finlandin lausuntoa, vaan Business Finlandin arvio sisältyisi maksulliseen oleskelulupahakemukseen. Kasvuyrittäjän oleskeluluvan edellytykset selkeytettäisiin lain tasolle. Ensimmäistä oleskelulupaa hakeva ulkomaalainen, joka haluaa ryhtyä yrittäjäksi, voisi jatkossa hakea Y-tunnuksen vasta yrittäjän oleskeluluvan saatuaan. Tavoitteena on ehkäistä väärinkäytöksiä ja kohdentaa viranomaisten resursseja. Muutosten on tarkoitus tulla voimaan 12.1.2028.","teksti_sv":"Regeringen överlämnade 1.10.2026 en proposition till riksdagen om ändring av utlänningslagen och vissa andra lagar. För uppehållstillstånd för uppstartsföretagare skulle man inte längre ansöka om ett separat avgiftsfritt utlåtande av Business Finland, utan Business Finlands bedömning skulle ingå i den avgiftsbelagda ansökan om uppehållstillstånd. Förutsättningarna för uppehållstillstånd för uppstartsföretagare skulle förtydligas på lagnivå. En utlänning som ansöker om sitt första uppehållstillstånd och vill bli företagare skulle i fortsättningen kunna ansöka om FO-nummer först efter att ha fått uppehållstillstånd för företagare. Syftet är att förebygga missbruk och rikta myndigheternas resurser. Ändringarna avses träda i kraft 12.1.2028.","teksti_en":"On 1 October 2026 the Government submitted a bill to Parliament amending the Aliens Act and certain other acts. A separate free statement from Business Finland would no longer be required for a start-up entrepreneur's residence permit; instead, Business Finland's assessment would be part of the fee-based residence permit application. The conditions for a start-up entrepreneur's residence permit would be clarified at the level of law. A foreign national applying for a first residence permit who wishes to become an entrepreneur could in future apply for a business ID only after receiving the entrepreneur's residence permit. The aim is to prevent abuse and target the authorities' resources. The amendments are intended to enter into force on 12 January 2028.","tekstityyppi":"tiivistelmä","selko":"Hallitus ehdottaa, että kasvuyrittäjä ei enää hakisi Business Finlandilta erillistä maksutonta lausuntoa. Arvio tehtäisiin maksullisen oleskelulupahakemuksen yhteydessä. Yrittäjäksi aikova voisi hakea Y-tunnuksen vasta saatuaan oleskeluluvan. Kyse on ehdotuksesta, jonka on tarkoitus tulla voimaan 12.1.2028.","selko_sv":"Regeringen föreslår att en uppstartsföretagare inte längre ska ansöka om ett separat avgiftsfritt utlåtande av Business Finland. Bedömningen skulle göras i samband med den avgiftsbelagda ansökan om uppehållstillstånd. Den som vill bli företagare skulle kunna ansöka om FO-nummer först efter att ha fått uppehållstillstånd. Det är ett förslag som avses träda i kraft 12.1.2028.","selko_en":"The Government proposes that start-up entrepreneurs should no longer apply for a separate free statement from Business Finland. The assessment would be made as part of the fee-based residence permit application. A person planning to become an entrepreneur could apply for a business ID only after receiving a residence permit. This is a proposal intended to take effect on 12 January 2028.","lahde":"https://valtioneuvosto.fi/-/1410877/hallitus-esittaa-sujuvampaa-kasittelya-kasvuyrittajien-oleskelulupiin-tavoitteena-ehkaista-vaarinkaytoksia","aiheet":["maahanmuutto","yhtio"],"lisatty":"2026-10-02T06:51"},{"id":"he-2026-10-01-oppivelvollisuus","tunnus":"HE 213/2026 vp","otsikko":"OPPIVELVOLLISUUSLAKIIN MUUTOKSIA","julkaistu":"2026-10-01T14:32","paino":3,"voimaantulo_pvm":"2027-01-01","elin":"Opetus- ja kulttuuriministeriö","elin_sv":"Undervisnings- och kulturministeriet","elin_en":"Ministry of Education and Culture","asiasanat":"Oppivelvollisuus – Yhteishaku – Majoituskorvaus – Tutkintokoulutukseen valmentava koulutus – Nuorten työpajatoiminta","asiasanat_sv":"Läroplikt – Gemensam ansökan – Inkvarteringsersättning – Utbildning som handleder för examensutbildning – Verkstadsverksamhet för unga","asiasanat_en":"Compulsory education – Joint application – Accommodation allowance – Preparatory education for an upper secondary qualification – Youth workshops","teksti":"Oppivelvollisuuden suorittaminen tulisi eräissä tilanteissa mahdolliseksi myös nuorten työpajatoiminnassa, ja asuinkunnan ohjaus- ja valvontavastuuta täsmennettäisiin. Ammatilliseen koulutukseen, lukioon ja tutkintokoulutukseen valmentavaan koulutukseen olisi yhteishaussa otettava ensisijaisesti oppivelvolliset hakijat. Oikeus majoituskorvaukseen määräytyisi lähimmän sellaisen ammatillisen oppilaitoksen etäisyyden mukaan, jossa järjestetään koulutusta oppivelvollisen suorittamaan tutkintoon. Myös keskeyttämistä, maksuttomuutta ja tutkintokoulutukseen valmentavaa koulutusta koskevia säännöksiä täsmennettäisiin. Muutokset on tarkoitettu tulemaan voimaan vuoden 2027 alusta.","selko":"Oppivelvollinen nuori voisi joissain tilanteissa suorittaa oppivelvollisuutta myös nuorten työpajassa. Toisen asteen yhteishaussa oppivelvolliset hakijat otettaisiin opiskelijoiksi ensin. Kyse on ehdotuksesta, joka tulisi voimaan vuoden 2027 alusta.","lahde":"https://valtioneuvosto.fi/-/1410845/oppivelvollisuuslakiin-tasmennyksia","aiheet":["koulutus"],"otsikko_sv":"ÄNDRINGAR I LÄROPLIKTSLAGEN","teksti_sv":"Det skulle i vissa situationer bli möjligt att fullgöra läroplikten även inom verkstadsverksamhet för unga, och boendekommunens ansvar för handledning och tillsyn skulle preciseras. Till yrkesutbildning, gymnasium och utbildning som handleder för examensutbildning skulle läropliktiga sökande i första hand antas i den gemensamma ansökan. Rätten till inkvarteringsersättning skulle bestämmas enligt avståndet till den närmaste yrkesläroanstalt som ordnar utbildning för den examen den läropliktiga avlägger. Även bestämmelserna om avbrott, avgiftsfrihet och utbildning som handleder för examensutbildning skulle preciseras. Ändringarna avses träda i kraft vid ingången av 2027.","selko_sv":"En läropliktig ung person skulle i vissa situationer kunna fullgöra läroplikten även i en verkstad för unga. I den gemensamma ansökan till andra stadiet skulle läropliktiga sökande antas först. Det är ett förslag som skulle träda i kraft vid ingången av 2027.","otsikko_en":"COMPULSORY EDUCATION ACT CHANGES","teksti_en":"In certain situations it would become possible to complete compulsory education also in youth workshop activities, and the municipality of residence's responsibility for guidance and supervision would be clarified. In joint application, vocational education, general upper secondary schools and preparatory education for an upper secondary qualification would have to admit applicants of compulsory school age first. The right to an accommodation allowance would depend on the distance to the nearest vocational institution providing education for the qualification the student is completing. Provisions on suspension, free education and preparatory education would also be clarified. The amendments are intended to enter into force at the start of 2027.","selko_en":"In some situations a young person could complete compulsory education in a youth workshop. In the joint application for upper secondary education, applicants of compulsory school age would be admitted first. This is a proposal that would take effect at the start of 2027.","pvm":"2026-10-01","pvm_selite":"annettu","tekstityyppi":"tiivistelmä","lisatty":"2026-10-01T14:51"},{"id":"he-2026-10-01-yritysjarjestelyt","tunnus":"HE 211/2026 vp","otsikko":"YRITYSJÄRJESTELYJEN VEROSÄÄNNÖT","julkaistu":"2026-10-01T14:18","paino":3,"voimaantulo_pvm":"2027-01-01","elin":"Valtiovarainministeriö","elin_sv":"Finansministeriet","elin_en":"Ministry of Finance","asiasanat":"Elinkeinoverolaki – Yritysjärjestelyt – Sulautuminen – Jakautuminen – Tappioiden vähentäminen","asiasanat_sv":"Näringsskattelagen – Företagsomstruktureringar – Fusion – Delning – Avdrag för förluster","asiasanat_en":"Business Income Tax Act – Business restructuring – Merger – Division – Deduction of losses","teksti":"Elinkeinoverolakiin ehdotetaan muutoksia, jotka laajentaisivat veroneutraalien yritysjärjestelyjen mahdollisuuksia. Ne koskisivat muun muassa vastikkeetonta sisaryhtiösulautumista, yhtiöittämällä toteutettavaa jakautumista ja osakevastikkeen allokaatiota asunto-osakeyhtiön ja keskinäisen kiinteistöosakeyhtiön jakautumisessa, ja rahavastikkeen enimmäismäärää nostettaisiin. Tuloverolain mukaan vastaanottava yhteisö voisi vähentää sulautuneen tai jakautuneen yhteisön tappiot myös, kun yhteisöt ovat kuuluneet samaan konserniin tappiovuoden alusta. Myös listaamattoman yhtiön osingon verotusta ja arvostamislakia täsmennettäisiin. Lait on tarkoitettu tulemaan voimaan 1.1.2027.","selko":"Yritysten sulautumisia, jakautumisia ja muita rakennejärjestelyjä olisi helpompi tehdä ilman välittömiä veroseuraamuksia. Myös tappioiden vähentämistä järjestelyissä laajennettaisiin. Kyse on ehdotuksesta; muutokset tulisivat voimaan 1.1.2027.","lahde":"https://valtioneuvosto.fi/-/10623/verolainsaadannon-yritysjarjestelysaannoksia-paivitetaan","aiheet":["vero","yhtio"],"otsikko_sv":"SKATTEREGLER OM OMSTRUKTURERINGAR","teksti_sv":"Ändringar föreslås i näringsskattelagen som skulle utvidga möjligheterna till skatteneutrala företagsomstruktureringar. De skulle gälla bland annat vederlagsfri systerbolagsfusion, delning genom bolagisering och allokering av aktievederlag vid delning av bostadsaktiebolag och ömsesidiga fastighetsaktiebolag, och det högsta penningvederlaget skulle höjas. Enligt inkomstskattelagen skulle det mottagande samfundet få dra av det fusionerade eller delade samfundets förluster även när samfunden har hört till samma koncern från början av förluståret. Även beskattningen av dividend från ett onoterat bolag och värderingslagen skulle preciseras. Lagarna avses träda i kraft den 1 januari 2027.","selko_sv":"Det skulle bli lättare att genomföra fusioner, delningar och andra omstruktureringar av företag utan omedelbara skattekonsekvenser. Även rätten att dra av förluster vid omstruktureringar skulle utvidgas. Det är ett förslag; ändringarna skulle träda i kraft den 1 januari 2027.","otsikko_en":"TAX RULES ON RESTRUCTURING","teksti_en":"Amendments to the Business Income Tax Act are proposed that would broaden the scope for tax-neutral business restructuring. They would concern, among other things, mergers of sister companies without consideration, divisions carried out by incorporation and the allocation of share consideration in divisions of housing companies and mutual real estate companies, and the maximum cash consideration would be raised. Under the Income Tax Act, the receiving entity could deduct the losses of the merged or divided entity also where the entities have belonged to the same group since the start of the loss year. Taxation of dividends from unlisted companies and the Valuation Act would also be clarified. The acts are intended to enter into force on 1 January 2027.","selko_en":"Mergers, divisions and other business restructuring would be easier to carry out without immediate tax consequences. The right to deduct losses in such arrangements would also be extended. This is a proposal; the changes would take effect on 1 January 2027.","pvm":"2026-10-01","pvm_selite":"annettu","tekstityyppi":"tiivistelmä","lisatty":"2026-10-01T14:51"},{"id":"he-2026-10-01-sijoitusrahastot","tunnus":"VM/2026/177","otsikko":"ELTIF-RAHASTOJEN VEROVAPAUS","julkaistu":"2026-10-01T14:08","paino":3,"voimaantulo_pvm":"2027-01-01","elin":"Valtiovarainministeriö","elin_sv":"Finansministeriet","elin_en":"Ministry of Finance","asiasanat":"Tuloverolaki – Sijoitusrahastot – ELTIF – Verovapaus – Ulkomaiset rahastot – EU-oikeus","asiasanat_sv":"Inkomstskattelagen – Placeringsfonder – ELTIF – Skattefrihet – Utländska fonder – EU-rätt","asiasanat_en":"Income Tax Act – Investment funds – ELTIF – Tax exemption – Foreign funds – EU law","teksti":"Hallitus esittää muutoksia tuloverolain 10 ja 20 a §:ään. ELTIF-rahastona markkinoitavan erikoissijoitusrahaston verovapauden edellytyksenä ei enää olisi, että kaikki osuudenomistajat ovat ammattisijoittajia. Ulkomaisen sijoitusrahaston ja erikoissijoitusrahaston verovapaus ei enää edellyttäisi sopimusperusteisuutta, mikä vastaisi EU-tuomioistuimen oikeuskäytäntöä; rahaston olisi kuitenkin oltava rekisteröintivaltiossaan verovapaa, käytännössä verovapaa tai läpivirtaava. Muutos on tarkoitettu tulemaan voimaan vuoden 2027 alusta.","selko":"Suomeen olisi helpompi perustaa pitkäaikaisiin sijoituksiin tarkoitettuja ELTIF-rahastoja, koska kaikkien sijoittajien ei tarvitsisi olla ammattisijoittajia. Ulkomaisten rahastojen verovapauden ehtoja muutettaisiin EU-tuomioistuimen ratkaisujen mukaisiksi. Kyse on ehdotuksesta, joka tulisi voimaan vuoden 2027 alusta.","lahde":"https://valtioneuvosto.fi/-/10623/sijoitusrahastojen-verosaantelya-muutetaan","aiheet":["vero","finanssi","eu"],"otsikko_sv":"SKATTEFRIHET FÖR ELTIF-FONDER","teksti_sv":"Regeringen föreslår ändringar i 10 och 20 a § i inkomstskattelagen. Det skulle inte längre vara ett villkor för skattefrihet för en specialplaceringsfond som marknadsförs som ELTIF-fond att alla andelsägare är professionella investerare. Skattefriheten för utländska placeringsfonder och specialplaceringsfonder skulle inte längre förutsätta att fonden är avtalsbaserad, vilket skulle motsvara EU-domstolens rättspraxis; fonden skulle dock vara skattefri, i praktiken skattefri eller transparent i registreringsstaten. Ändringen avses träda i kraft vid ingången av 2027.","selko_sv":"Det skulle bli lättare att grunda ELTIF-fonder för långsiktiga investeringar i Finland, eftersom alla investerare inte längre måste vara professionella. Villkoren för skattefrihet för utländska fonder skulle ändras i enlighet med EU-domstolens avgöranden. Det är ett förslag som skulle träda i kraft vid ingången av 2027.","otsikko_en":"TAX EXEMPTION FOR ELTIF FUNDS","teksti_en":"The Government proposes amendments to sections 10 and 20 a of the Income Tax Act. Tax exemption for a special investment fund marketed as an ELTIF would no longer require all unitholders to be professional investors. Tax exemption for foreign investment funds and special investment funds would no longer require the fund to be contractual, in line with the case law of the Court of Justice of the EU; the fund would, however, have to be tax-exempt, effectively tax-exempt or transparent in its state of registration. The amendment is intended to enter into force at the start of 2027.","selko_en":"It would be easier to set up ELTIF funds for long-term investment in Finland, as not all investors would need to be professional investors. The conditions for tax exemption of foreign funds would be changed to match rulings of the Court of Justice of the EU. This is a proposal that would take effect at the start of 2027.","pvm":"2026-10-01","pvm_selite":"annettu","tekstityyppi":"tiivistelmä","lisatty":"2026-10-01T14:51"},{"id":"he-2026-10-01-ehds","tunnus":"EHDS-esitykset 1.10.2026","otsikko":"EHDS-ASETUKSEN TOIMEENPANO","julkaistu":"2026-10-01T13:49","paino":4,"elin":"Sosiaali- ja terveysministeriö","elin_sv":"Social- och hälsovårdsministeriet","elin_en":"Ministry of Social Affairs and Health","asiasanat":"Eurooppalainen terveystietoalue – EHDS-asetus – Asiakastiedot – Toisiokäyttö – Seuraamukset","asiasanat_sv":"Europeiska hälsodataområdet – EHDS-förordningen – Klientuppgifter – Sekundär användning – Påföljder","asiasanat_en":"European Health Data Space – EHDS Regulation – Client data – Secondary use – Penalties","teksti":"Hallitus antoi eduskunnalle kaksi esitystä EU:n eurooppalaista terveystietoaluetta koskevan EHDS-asetuksen kansallisesta toimeenpanosta. Ensisijaista käyttöä koskeva esitys täydentäisi asiakastietolakia, lakia sähköisestä lääkemääräyksestä ja eräiden tuotteiden markkinavalvonnasta annettua lakia: digitaalisesta terveydenhuollosta vastaavat viranomaiset nimettäisiin, potilaskertomusjärjestelmät tulisivat markkinavalvonnan piiriin ja viranomaiset voisivat määrätä seuraamuksia. Kanta-palvelujen omatietovaranto ja Kelain-palvelu lakkautettaisiin. Toisiokäyttöä koskevalla esityksellä säädettäisiin asetusta täydentävä uusi laki ja seuraamukset asetuksen rikkomisesta.","selko":"EU:n uudet terveystietosäännöt tuodaan Suomen lakiin. Ihmiset voisivat hallita omia terveystietojaan paremmin, ja tietoja voitaisiin käyttää helpommin esimerkiksi tutkimuksessa. Kanta-palvelujen omatietovaranto lakkautettaisiin. Kyse on ehdotuksista, joita eduskunta käsittelee.","lahde":"https://valtioneuvosto.fi/-/1271139/terveystietojen-jakamista-ja-hallintaa-helpottava-eu-asetus-tuo-muutoksia-lainsaadantoon","aiheet":["sote","tietosuoja","eu"],"otsikko_sv":"GENOMFÖRANDE AV EHDS","teksti_sv":"Regeringen överlämnade två propositioner till riksdagen om det nationella genomförandet av EU:s EHDS-förordning om ett europeiskt hälsodataområde. Propositionen om primär användning skulle komplettera klientuppgiftslagen, lagen om elektroniska recept och lagen om marknadskontroll av vissa produkter: myndigheter med ansvar för digital hälsa skulle utses, patientjournalsystem skulle omfattas av marknadskontrollen och myndigheterna skulle kunna påföra påföljder. Kanta-tjänsternas egna data och tjänsten Kelain skulle läggas ned. Genom propositionen om sekundär användning skulle en ny lag som kompletterar förordningen och påföljder för överträdelser av förordningen föreskrivas.","selko_sv":"EU:s nya regler om hälsodata förs in i finsk lag. Människor skulle bättre kunna hantera sina egna hälsouppgifter, och uppgifterna skulle lättare kunna användas till exempel i forskning. Kanta-tjänsternas egna data skulle läggas ned. Det är förslag som riksdagen behandlar.","otsikko_en":"EHDS IMPLEMENTATION BILLS","teksti_en":"The Government submitted two bills to Parliament on national implementation of the EU EHDS Regulation on the European Health Data Space. The bill on primary use would supplement the Client Data Act, the Act on Electronic Prescriptions and the Act on Market Surveillance of Certain Products: digital health authorities would be designated, electronic health record systems would come under market surveillance and authorities could impose penalties. Kanta Services' personal health data repository and the Kelain service would be discontinued. The bill on secondary use would enact a new act supplementing the Regulation and penalties for infringing it.","selko_en":"New EU rules on health data are being brought into Finnish law. People could manage their own health data better, and the data could be used more easily, for example in research. Kanta Services' personal health data repository would be closed. These are proposals that Parliament will consider.","pvm":"2026-10-01","pvm_selite":"annettu","tekstityyppi":"tiivistelmä","lisatty":"2026-10-01T14:51"},{"id":"he-2026-10-01-tyokoneet","tunnus":"HE 220/2026 vp","otsikko":"TYÖKONEIDEN MARKKINAVALVONTA","julkaistu":"2026-10-01T13:45","paino":3,"elin":"Sosiaali- ja terveysministeriö","elin_sv":"Social- och hälsovårdsministeriet","elin_en":"Ministry of Social Affairs and Health","asiasanat":"Tekniset laitteet – Vaatimustenmukaisuus – Markkinavalvonta – EU:n koneasetus – Seuraamusmaksu","asiasanat_sv":"Tekniska anordningar – Överensstämmelse – Marknadskontroll – EU:s maskinförordning – Påföljdsavgift","asiasanat_en":"Technical equipment – Conformity – Market surveillance – EU Machinery Regulation – Administrative fine","teksti":"Hallitus esittää uutta lakia työssä käytettäväksi tarkoitettujen teknisten laitteiden vaatimustenmukaisuudesta. Markkinavalvonta keskitettäisiin Lupa- ja valvontaviraston työsuojeluosastolle, eikä ministeriö enää käsittelisi uusia markkinavalvontatapauksia. Valvonnassa sovellettaisiin horisontaalista markkinavalvontalakia. Lisäksi annettaisiin EU:n koneasetuksen edellyttämä täydentävä sääntely ohjeiden ja tietojen kielestä sekä seuraamuksista: asetuksen rikkomisesta voisi seurata hallinnollinen seuraamusmaksu tai rikosoikeudellinen rangaistus. Koneasetusta sovelletaan 20.1.2027 alkaen, ja samalla konedirektiivi kumoutuu.","selko":"Työssä käytettävien koneiden ja laitteiden markkinavalvonta siirtyisi kokonaan yhdelle viranomaiselle, Lupa- ja valvontaviraston työsuojeluosastolle. EU:n koneasetusta sovelletaan 20.1.2027 alkaen, ja sen rikkomisesta voisi seurata seuraamusmaksu tai rangaistus. Kyse on ehdotuksesta.","lahde":"https://valtioneuvosto.fi/-/1271139/tyokayttoisten-teknisten-laitteiden-saantelya-ja-markkinavalvontaa-uudistetaan","aiheet":["tyo","eu"],"otsikko_sv":"MARKNADSKONTROLL AV ARBETSMASKINER","teksti_sv":"Regeringen föreslår en ny lag om överensstämmelse hos tekniska anordningar avsedda att användas i arbete. Marknadskontrollen skulle koncentreras till Tillstånds- och tillsynsverkets arbetarskyddsavdelning, och ministeriet skulle inte längre behandla nya marknadskontrollärenden. I tillsynen skulle den horisontella marknadskontrollagen tillämpas. Dessutom skulle den kompletterande reglering som EU:s maskinförordning kräver utfärdas om språket i anvisningar och uppgifter samt om påföljder: överträdelser av förordningen skulle kunna leda till administrativ påföljdsavgift eller straffrättsligt straff. Maskinförordningen tillämpas från den 20 januari 2027, och samtidigt upphävs maskindirektivet.","selko_sv":"Marknadskontrollen av maskiner och anordningar som används i arbete skulle helt flyttas till en enda myndighet, Tillstånds- och tillsynsverkets arbetarskyddsavdelning. EU:s maskinförordning tillämpas från den 20 januari 2027, och överträdelser kan leda till påföljdsavgift eller straff. Det är ett förslag.","otsikko_en":"MARKET SURVEILLANCE OF MACHINERY","teksti_en":"The Government proposes a new act on the conformity of technical equipment intended for use at work. Market surveillance would be centralised in the occupational safety and health division of the Licensing and Supervisory Authority, and the ministry would no longer handle new market surveillance cases. The horizontal Market Surveillance Act would apply. The act would also lay down the supplementary rules required by the EU Machinery Regulation on the language of instructions and information and on penalties: infringements could lead to an administrative fine or a criminal penalty. The Machinery Regulation applies from 20 January 2027, when the Machinery Directive is repealed.","selko_en":"Market surveillance of machinery and equipment used at work would move entirely to one authority, the occupational safety and health division of the Licensing and Supervisory Authority. The EU Machinery Regulation applies from 20 Ja

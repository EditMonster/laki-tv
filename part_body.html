<!--
  LAKI-TV DATA
  Päivittäinen päivitys korvaa vain alla olevan JSON-lohkon sisällön.
  kanavat.{kko,eu,eit,icj,kho,laillisuus,hao,muut,kilpailu,fiva,tsv,he,lausunnot}: enintään 9 kohdetta, uusin ensin.
  Kohde: id, tunnus, otsikko (≤35 merkkiä), pvm (YYYY-MM-DD|null), pvm_selite,
         julkaistu (YYYY-MM-DDTHH:MM Helsingin aikaa, milloin lähde julkaisi), paino (1–5, juridinen merkittävyys), asiasanat,
         teksti (alle 100 sanaa sellaisenaan, muuten tiivistelmä ≤100 sanaa), tekstityyppi, lahde (URL, ensisijainen lähde),
         selko (yleiskielinen ≤60 sanaa, sivu 888), uusi (bool),
         aiheet (lista: sote digi eu tyo vero tietosuoja kilpailu rikos maahanmuutto ymparisto asuminen hallinto
                 finanssi kuluttaja yhtio perhe ihmisoikeudet turvallisuus koulutus);
         valinnaiset: elin, aihe, vaihe (≤30, EIT/ICJ: "Vireillä…"/"Ratkaistu"), lopputulos, huom,
         voimaantulo_pvm (HE), maaraaika (lausunnot), lainvoimainen (bool).
  Etusivu ja sivu 101 lasketaan katsomishetken mukaan (julkaistu + paino); etusivu: 0–3 toimituksen nostoa {ref, otsikko? ≤35}.
  tiedote: ≤38 merkkiä.
  voimaantulot: [{pvm, nimi ≤33, saados, he, lahde, aiheet, lakeja?, muutos? ≤76}] vain vahvistetut lait.
  vt_paivat: {"YYYY-MM-DD": {lakeja, asetuksia}} seuraavan 14 päivän voimaantulopäiville.
  eu_voimaantulot: [{pvm, nimi ≤30, saados ≤38, laji sovelletaan|osittain|voimaan|täytäntöönpano, kuvaus ≤76, lahde, aiheet}].
  he_tila: [{he, nimi ≤18, vaihe 1–6, vaihe_nimi, valiokunta, pvm}] eduskunnan avoimesta datasta.
  visa: 3–5 {kysymys, vaihtoehdot[3], oikea A|B|C, selitys, ref}. tilastot: {he_viimeisin, syysistunto_he, he_maarapaiva}.
  Ruotsi: kohteissa otsikko_sv, teksti_sv, selko_sv (+ asiasanat_sv, lopputulos_sv, huom_sv, vaihe_sv, elin_sv); voimaantulot nimi_sv, muutos_sv;
         eu_voimaantulot nimi_sv, kuvaus_sv; he_tila nimi_sv; visa kysymys_sv, vaihtoehdot_sv, selitys_sv; tiedote_sv. Puuttuva näytetään suomeksi.
  Englanti: samat kentät päätteellä _en (otsikko_en, teksti_en, selko_en, …). Puuttuva näytetään suomeksi.
  lisatty: milloin juttu tuli LAKI-TV:hen (viikon tärkeimmät 102 ja kalenteri 104 käyttävät sitä).
  Seuranta: lukijan seuraamat jutut ovat vain lukijan selaimessa ([{id, tunnus, otsikko, k, tila, pvm}]), eivät tässä.
  Jakelu: päivitys julkaisee sivun rinnalle feed.xml, feed-sv.xml, feed-en.xml, feed.json, lakitv.md, kalenteri.txt (iCalendar) ja maanantaisin viikkokatsaus.pdf/.html.
  arkisto: kanavilta poistuneet jutut 35 pv {k=kanava, id, tunnus, otsikko(_sv), pvm, julkaistu, lisatty, paino, aiheet, teksti(_sv), lahde, …}.
  vt_arkisto: voimaan tulleet lait 35 pv (kalenteri). Sivun tietokannassa on vain ylläpitäjän jakeluasetus (asetukset/jakelu: Slack- ja Teams-webhookit sekä GitHub-varaston nimi sivuston peilausta varten).
  Sivu ei kerää lukijoista mitään: ei evästeitä, ei tunnisteita, ei yhteyksiä kolmansiin palveluihin.
-->

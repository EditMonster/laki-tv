# LAKI-TV: rakentaa ja julkaisee sivuston GitHub Pagesiin.
# Turvamalli: päivitysajo ei koske tähän varastoon lainkaan. Se työntää vain data.json-tiedoston erilliseen datavarastoon –
# gistiin (LAKITV_DATA_REPO = gist:TUNNUS) tai varastoon (omistaja/nimi) – avaimella, joka on rajattu vain sinne.
# Tämä työnkulku hakee datan sieltä (tai muuttujan LAKITV_DATA_URL osoitteesta), tarkistaa sen (validate) ja rakentaa
# sivuston tämän varaston koodista. Ajetaan kaksi kertaa tunnissa; jos datan paivitetty on jo sivustolla, julkaisu ohitetaan.
# Sivu saa lisäksi datavaraston osoitteen (meta lakitv-data) ja hakee itse uusimman datan, joten lukija näkee uudet jutut,
# vaikka ajastettu rakennusajo olisi myöhässä.
# Pages-asetuksissa lähteeksi valitaan "GitHub Actions".
name: pages
on:
  push:
    branches: [main]
    paths: ["data.json", "part_*.html", "build.py", "fonts/**", "assets/**", "tools/**", ".github/workflows/pages.yml"]
  schedule:
    - cron: "7,37 * * * *"   # kaksi kertaa tunnissa: GitHub viivästää tai jättää ajastettuja ajoja väliin, joten yrityksiä on useita
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.data.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - id: pages
        uses: actions/configure-pages@v6
      - name: Hae uusin data datavarastosta ja tarkista, onko se jo sivustolla
        id: data
        env:
          DATA_REPO: ${{ vars.LAKITV_DATA_REPO || 'gist:8cdf55f747883ff5fda0e6957e6835bf' }}
          DATA_URL: ${{ vars.LAKITV_DATA_URL }}
          OWNER: ${{ github.repository_owner }}
          SITE: ${{ steps.pages.outputs.base_url }}/
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$DATA_URL" ]; then
            case "$DATA_REPO" in
              gist:*) DATA_URL="https://gist.githubusercontent.com/$OWNER/${DATA_REPO#gist:}/raw/data.json" ;;
              *)      DATA_URL="https://raw.githubusercontent.com/$DATA_REPO/main/data.json" ;;
            esac
          fi
          if curl -fsSL --max-time 30 -H "Cache-Control: no-cache" "$DATA_URL" -o data.uusi.json \
             && python3 -c "import json, sys; d = json.load(open('data.uusi.json', encoding='utf-8')); sys.exit(0 if d.get('paivitetty') and d.get('kanavat') else 1)"; then
            mv data.uusi.json data.json; echo "data: $DATA_REPO"
          else
            echo "data: tämän varaston data.json (datavarastoa ei saatu luettua tai se on vielä tyhjä)"
          fi
          NEW=$(python3 -c "import json; print(json.load(open('data.json', encoding='utf-8')).get('paivitetty', ''))")
          LIVE=$(curl -fsSL --max-time 30 "$SITE" | grep -o '"paivitetty":"[^"]*"' | head -1 | cut -d'"' -f4 || true)
          echo "data: $NEW · sivustolla: ${LIVE:-?}"
          echo "url=$DATA_URL" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "schedule" ] && [ -n "$LIVE" ] && [ "$NEW" = "$LIVE" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Ei uutta dataa – ei julkaista."
          fi
      - name: Asenna riippuvuudet
        if: steps.data.outputs.skip != 'true'
        run: pip install -q lxml playwright==1.47.0
      - name: Tarkista data (virheellinen data ei päädy sivustolle)
        if: steps.data.outputs.skip != 'true'
        run: python3 tools/lakitv.py validate data.json
      - name: Rakenna sivu varaston koodista
        if: steps.data.outputs.skip != 'true'
        run: python3 build.py
      - name: Syötteet, kalenteri ja viikkokatsaus
        if: steps.data.outputs.skip != 'true'
        env:
          LAKITV_BASE: ${{ steps.pages.outputs.base_url }}/
        run: |
          python3 tools/lakitv.py feed data.json --out jakelu
          playwright install --with-deps chromium >/dev/null || true
          python3 tools/lakitv.py viikkokatsaus data.json --out jakelu/viikkokatsaus || true
      - name: Kokoa sivusto
        if: steps.data.outputs.skip != 'true'
        env:
          LAKITV_DOMAIN: ${{ vars.LAKITV_DOMAIN }}
        run: python3 tools/website.py --page laki-tv.html --feeds jakelu --out site --base "${{ steps.pages.outputs.base_url }}/" --data-url "${{ steps.data.outputs.url }}"
      - name: Jakokuva (sivu 100 tänään)
        if: steps.data.outputs.skip != 'true'
        continue-on-error: true
        run: python3 tools/assets.py --page site/index.html --out site --og-only
      - uses: actions/upload-pages-artifact@v5
        if: steps.data.outputs.skip != 'true'
        with: {path: site}
  deploy:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
